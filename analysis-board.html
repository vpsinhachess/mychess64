<script>
const $=id=>document.getElementById(id),FL='abcdefgh';
const START='rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
const WM={wK:'4/42/Chess_klt45',wQ:'1/15/Chess_qlt45',wR:'7/72/Chess_rlt45',wB:'b/b1/Chess_blt45',wN:'7/70/Chess_nlt45',wP:'4/45/Chess_plt45',bK:'f/f0/Chess_kdt45',bQ:'4/47/Chess_qdt45',bR:'f/ff/Chess_rdt45',bB:'9/98/Chess_bdt45',bN:'e/ef/Chess_ndt45',bP:'c/c7/Chess_pdt45'};
const SRC=k=>[`https://cdn.jsdelivr.net/gh/lichess-org/lila@master/public/piece/cburnett/${k}.svg`,`https://lichess1.org/assets/piece/cburnett/${k}.svg`,`https://upload.wikimedia.org/wikipedia/commons/${WM[k]}.svg`];
const PIECES={p:'<circle cx="50" cy="27" r="12" @P/><path d="M40 42 Q50 49 60 42 L58 47 Q64 60 66 78 L34 78 Q36 60 42 47 Z" @P/><path d="M28 90 L72 90 L72 84 Q72 78 66 78 L34 78 Q28 78 28 84 Z" @P/>',r:'<path d="M29 90 L71 90 L71 83 Q71 78 66 78 L34 78 Q29 78 29 83 Z" @P/><path d="M35 78 L38 40 L62 40 L65 78 Z" @P/><path d="M30 40 L30 16 L40 16 L40 23 L45 23 L45 16 L55 16 L55 23 L60 23 L60 16 L70 16 L70 40 Z" @P/><path d="M34 46 H66 M31 33 H69" @D/>',b:'<path d="M28 90 L72 90 L72 84 Q72 78 66 78 L34 78 Q28 78 28 84 Z" @P/><path d="M38 78 Q41 62 44 54 L56 54 Q59 62 62 78 Z" @P/><path d="M50 17 Q66 30 64 44 Q63 50 50 50 Q37 50 36 44 Q34 30 50 17 Z" @P/><circle cx="50" cy="13" r="4.5" @P/><path d="M50 26 V40 M44 33 H56" @D/>',n:'<path d="M28 90 L72 90 L72 84 Q72 78 66 78 L34 78 Q28 78 28 84 Z" @P/><path d="M32 78 C32 62 34 54 42 46 C34 46 27 44 24 38 L36 22 L38 13 L46 21 C64 21 76 40 72 62 C71 70 70 74 70 78 Z" @P/><circle cx="46" cy="32" r="2.2" fill="D"/>',q:'<path d="M28 90 L72 90 L72 84 Q72 78 66 78 L34 78 Q28 78 28 84 Z" @P/><path d="M35 78 L39 46 L61 46 L65 78 Z" @P/><path d="M31 48 L24 24 L37 36 L41 18 L50 34 L59 18 L63 36 L76 24 L69 48 Z" @P/><circle cx="24" cy="21" r="3.5" @P/><circle cx="41" cy="15" r="3.5" @P/><circle cx="59" cy="15" r="3.5" @P/><circle cx="76" cy="21" r="3.5" @P/>',k:'<path d="M28 90 L72 90 L72 84 Q72 78 66 78 L34 78 Q28 78 28 84 Z" @P/><path d="M35 78 L38 47 Q38 35 50 35 Q62 35 62 47 L65 78 Z" @P/><path d="M47 6 h6 v7 h7 v6 h-7 v10 h-6 v-10 h-7 v-6 h7 z" @P/>'};
const CK={w:{F:'#f7f0dd',S:'#2a2016',D:'#2a2016'},b:{F:'#2d2824',S:'#0b0908',D:'#eadfc6'}};const FB={};for(const c of 'wb')for(const t of 'pnbrqk'){const k=CK[c],b=PIECES[t].split('@P').join(`fill="${k.F}" stroke="${k.S}" stroke-width="2.6" stroke-linejoin="round"`).split('@D').join(`fill="none" stroke="${k.D}" stroke-width="2" stroke-linecap="round"`).split('fill="D"').join(`fill="${k.D}"`);FB[c+t.toUpperCase()]='data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">${b}</svg>`)}
const IMG={},pu=k=>IMG[k]||FB[k];
let flip=false,selected='wP',turn='w',rights='KQkq',ep='-',halfmove=0,fullmove=1,pos=[];let dragKey=null,dragPointerId=null,boardDragSource=null,boardDragPointerId=null,playDragSource=null,playDragPointerId=null,playDragMoved=false;
let annotations=[],circles=[],arrowColor='#e53935',arrowStart=null,arrowCurrent=null,arrowPointerId=null,arrowMoved=false,rightStartX=0,rightStartY=0;let touchAnnTimer=null,touchAnnPending=null,touchAnnActive=false;let playMode=false,playFrom=null,legalTargets=[];let playDragStartX=0,playDragStartY=0,playTapSquare=null;let finalized=false;let startFen=START;
const loadAsset=k=>{const src=SRC(k);let i=0;const next=()=>{if(i>=src.length)return;const im=new Image();im.onload=()=>{IMG[k]=src[i];render();refreshPaletteImages()};im.onerror=()=>{i++;next()};im.src=src[i]};next()};Object.keys(WM).forEach(loadAsset);
function idx(s){return(8-(+s[1]))*8+FL.indexOf(s[0])}
function sqAt(e){const R=$('board').getBoundingClientRect();const c=Math.floor((e.clientX-R.left)/R.width*8),w=Math.floor((e.clientY-R.top)/R.height*8);if(c<0||c>7||w<0||w>7)return null;const f=flip?7-c:c,r=flip?w:7-w;return FL[f]+(r+1)}
function C(s){const f=FL.indexOf(s[0]),r=+s[1]-1;return[flip?7-f:f,flip?r:7-r]}
function squareCenter(s){const [c,r]=C(s);return[c*100+50,r*100+50]}
function decodeFen(f){const q=f.trim().replace(/\s+/g,' ').split(' ');if(q.length!==6)throw Error('FEN must contain exactly 6 fields.');const rows=q[0].split('/');if(rows.length!==8)throw Error('FEN must contain 8 ranks.');const a=[];for(const row of rows){let n=0;for(const c of row){if(/[1-8]/.test(c)){n+=+c;for(let i=0;i<+c;i++)a.push(null)}else if(/[prnbqkPRNBQK]/.test(c)){n++;a.push(c)}else throw Error('Invalid FEN piece.')}if(n!==8)throw Error('Each rank must contain exactly 8 squares.')}if(!/^[wb]$/.test(q[1]))throw Error('Invalid side to move.');if(q[2]!=='-'&&!/^[KQkq]+$/.test(q[2])||/[KQkq]/.test(q[2])&&new Set(q[2]).size!==q[2].length)throw Error('Invalid castling rights.');if(q[3]!=='-'&&!/^[a-h][36]$/.test(q[3]))throw Error('Invalid en-passant target square.');if(!/^[0-9]+$/.test(q[4]))throw Error('Halfmove clock must be a non-negative integer.');if(!/^[1-9][0-9]*$/.test(q[5]))throw Error('Fullmove number must be a positive integer.');return{a,turn:q[1],rights:q[2],ep:q[3],halfmove:Math.min(9999,+q[4]),fullmove:Math.min(999999,+q[5])}}
function makeFenFrom(a,t,r,e='-',hm=0,fm=1){let rows=[];for(let rr=0;rr<8;rr++){let x='',empty=0;for(let f=0;f<8;f++){const p=a[rr*8+f];if(!p)empty++;else{if(empty){x+=empty;empty=0}x+=p}}if(empty)x+=empty;rows.push(x)}return rows.join('/')+' '+t+' '+(r||'-')+' '+(e||'-')+' '+hm+' '+fm}
function makeFen(){return makeFenFrom(pos,turn,rights,ep,halfmove,fullmove)}
function epError(a,t,e){if(e==='-')return '';const f=FL.indexOf(e[0]),r=+e[1];if((t==='w'&&r!==6)||(t==='b'&&r!==3))return 'En-passant target rank is incompatible with the side to move.';const target=idx(e);if(a[target])return 'En-passant target square must be empty.';if(t==='w'){if(a[idx(e[0]+'5')]!=='p')return 'White to move requires a Black pawn on the fifth rank behind the target.';let ok=false;for(const df of [-1,1]){const nf=f+df;if(nf>=0&&nf<8&&a[(8-5)*8+nf]==='P')ok=true}if(!ok)return 'No White pawn can capture on the en-passant target square.'}else{if(a[idx(e[0]+'4')]!=='P')return 'Black to move requires a White pawn on the fourth rank behind the target.';let ok=false;for(const df of [-1,1]){const nf=f+df;if(nf>=0&&nf<8&&a[(8-4)*8+nf]==='p')ok=true}if(!ok)return 'No Black pawn can capture on the en-passant target square.'}return ''}
function legalPosition(a,t,r,e='-',hm=0,fm=1){let wk=0,bk=0,wp=0,bp=0,wPieces=0,bPieces=0;for(let i=0;i<64;i++){const p=a[i];if(!p)continue;if(p==='K')wk++;if(p==='k')bk++;if(p==='P')wp++;if(p==='p')bp++;if(p===p.toUpperCase())wPieces++;else bPieces++;if((p==='P'||p==='p')&&(Math.floor(i/8)===0||Math.floor(i/8)===7))return 'Pawns cannot be on the first or eighth rank.'}if(wk!==1||bk!==1)return 'A legal chess position must contain exactly one White king and one Black king.';if(wp>8||bp>8)return 'Each side may have at most eight pawns.';if(wPieces>16||bPieces>16)return 'A side cannot have more than sixteen pieces in a legal chess position.';if(!Number.isInteger(hm)||hm<0||hm>9999)return 'Halfmove clock must be between 0 and 9999.';if(!Number.isInteger(fm)||fm<1||fm>999999)return 'Fullmove number must be between 1 and 999999.';const wi=a.findIndex(x=>x==='K'),bi=a.findIndex(x=>x==='k');if(Math.max(Math.abs(wi%8-bi%8),Math.abs(Math.floor(wi/8)-Math.floor(bi/8)))<=1)return 'The two kings may not be adjacent.';if((r.includes('K')&&(a[idx('e1')]!=='K'||a[idx('h1')]!=='R'))||(r.includes('Q')&&(a[idx('e1')]!=='K'||a[idx('a1')]!=='R'))||(r.includes('k')&&(a[idx('e8')]!=='k'||a[idx('h8')]!=='r'))||(r.includes('q')&&(a[idx('e8')]!=='k'||a[idx('a8')]!=='r')))return 'Castling rights require the corresponding king and rook to be on their original squares.';const ee=epError(a,t,e);if(ee)return ee;try{const g=new Chess(makeFenFrom(a,t,r,e,hm,fm));const other=t==='w'?'b':'w';const g2=new Chess(makeFenFrom(a,other,r,'-',hm,fm));if(g2.in_check())return 'The side that is not to move may not already be in check.'}catch(err){return err.message||'Chess rules engine rejected this position.'}return ''}
function syncViewportLayout(){if(window.innerWidth<=899){const bw=$('bw');if(bw)document.documentElement.style.setProperty('--board-total-height',bw.getBoundingClientRect().height+'px')}else document.documentElement.style.removeProperty('--board-total-height')}
window.addEventListener('resize',syncViewportLayout,{passive:true});window.addEventListener('orientationchange',()=>setTimeout(syncViewportLayout,120));
function loadFen(f){try{if(finalized)throw Error('Position is finalized. Choose Edit Position first.');const x=decodeFen(f);const err=legalPosition(x.a,x.turn,x.rights,x.ep,x.halfmove,x.fullmove);if(err)throw Error(err);pos=x.a;turn=x.turn;rights=x.rights;ep=x.ep;halfmove=x.halfmove;fullmove=x.fullmove;render();setStatus('FEN loaded — legal position accepted.',true)}catch(e){setStatus('Invalid position: '+e.message,false)}}
function setStatus(s,ok){$('status').textContent=s;$('status').className='status '+(ok?'ok':'err')}

function syncControls(){ $('whiteTurn').classList.toggle('active',turn==='w');$('blackTurn').classList.toggle('active',turn==='b');for(const id of ['wK','wQ','bK','bQ'])$(id).checked=rights.includes(id);document.body.classList.toggle('mode-playing',playMode);document.body.classList.toggle('finalized',finalized);$('editUnlock').style.display=finalized?'block':'none';}
function render(){let h='';for(let r=0;r<8;r++)for(let f=0;f<8;f++){const sq=FL[f]+(r+1),[c,w]=C(sq),light=(f+r)%2===1;let marks='';if(playMode&&legalTargets.includes(sq)){const has=pos[idx(sq)];marks+=has?'<span class="legal-capture"></span>':'<span class="legal-dot"></span>'}h+=`<div class="sq ${light?'l':'d'}" data-square="${sq}" style="left:${c*12.5}%;top:${w*12.5}%">${c===7?`<i class="co r">${r+1}</i>`:''}${w===7?`<i class="co f">${FL[f]}</i>`:''}${marks}</div>`;const p=pos[idx(sq)];if(p){const k=(p===p.toUpperCase()?'w':'b')+p.toUpperCase();h+=`<div class="pc ${playMode&&playFrom===sq?'piece-play-source':''}" data-piece="${k}" style="transform:translate(${c*100}%,${w*100}%);background-image:url('${pu(k)}')"></div>`}}[...$('board').children].forEach(el=>el.remove());$('board').insertAdjacentHTML('afterbegin',h);const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.id='annSvg';svg.setAttribute('viewBox','0 0 800 800');for(const a of annotations)appendArrow(svg,a.from,a.to,a.color,false);for(const c of circles)appendCircle(svg,c.square,c.color,false);$('board').appendChild(svg);$('fen').value=makeFen();$('halfmove').value=halfmove;$('fullmove').value=fullmove;syncControls();let wc=0,bc=0;pos.forEach(p=>p&&(p===p.toUpperCase()?wc++:bc++));$('count').textContent=`White: ${wc} · Black: ${bc}`}
function appendArrow(svg,from,to,color,preview){const [x1,y1]=squareCenter(from),[x2,y2]=squareCenter(to);if(x1===x2&&y1===y2)return;const ang=Math.atan2(y2-y1,x2-x1),len=22,hx=x2-Math.cos(ang)*len,hy=y2-Math.sin(ang)*len;const line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',x1);line.setAttribute('y1',y1);line.setAttribute('x2',hx);line.setAttribute('y2',hy);line.setAttribute('stroke',color);line.setAttribute('class','arrow-line'+(preview?' arrow-preview':''));svg.appendChild(line);const side=12,px1=x2-Math.cos(ang)*side-Math.sin(ang)*10,py1=y2-Math.sin(ang)*side+Math.cos(ang)*10,px2=x2-Math.cos(ang)*side+Math.sin(ang)*10,py2=y2-Math.sin(ang)*side-Math.cos(ang)*10;const poly=document.createElementNS('http://www.w3.org/2000/svg','polygon');poly.setAttribute('points',`${x2},${y2} ${px1},${py1} ${px2},${py2}`);poly.setAttribute('fill',color);poly.setAttribute('class','arrow-head'+(preview?' arrow-preview':''));svg.appendChild(poly)}
function appendCircle(svg,square,color,preview){const [x,y]=squareCenter(square);const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',36);c.setAttribute('stroke',color);c.setAttribute('class','ann-circle'+(preview?' arrow-preview':''));svg.appendChild(c)}
function drawArrowPreview(from,to){const svg=$('annSvg');if(!svg)return;svg.querySelectorAll('.arrow-preview,.circle-preview').forEach(x=>x.remove());if(from===to){appendCircle(svg,from,arrowColor,true);return}appendArrow(svg,from,to,arrowColor,true)}
function clearArrowPreview(){const svg=$('annSvg');if(svg)svg.querySelectorAll('.arrow-preview').forEach(x=>x.remove())}
function finishRightGesture(e){if(!arrowStart)return;const to=sqAt(e)||arrowCurrent;const from=arrowStart;const moved=arrowMoved;arrowStart=null;arrowCurrent=null;arrowPointerId=null;clearArrowPreview();if(to&&from){if(moved&&to!==from){annotations.push({from,to,color:arrowColor});setStatus('Arrow added.',true)}else{const i=circles.findIndex(c=>c.square===from);if(i>=0)circles.splice(i,1);else circles.push({square:from,color:arrowColor});setStatus(i>=0?'Circle removed.':'Circle added.',true)}render()}}
function boardContext(e){e.preventDefault()}
function legalFor(square){try{const g=new Chess(makeFen());const p=g.get(square);if(!p||p.color!==turn)return [];return g.moves({square,verbose:true}).map(m=>m.to)}catch(err){setStatus('This position cannot be played until it is a legal chess position.',false);return []}}
function playClick(sq){if(!playMode)return false;const i=idx(sq);if(playFrom&&legalTargets.includes(sq)){try{const g=new Chess(makeFen());const piece=g.get(playFrom);let promotion; if(piece&&piece.type==='p'&&((piece.color==='w'&&sq[1]==='8')||(piece.color==='b'&&sq[1]==='1'))){promotion='q'}g.move({from:playFrom,to:sq,promotion});const nf=g.fen().split(' ');const x=decodeFen(g.fen());pos=x.a;turn=x.turn;rights=x.rights;ep=x.ep;halfmove=x.halfmove;fullmove=x.fullmove;playFrom=null;legalTargets=[];render();setStatus('Legal move played.',true);return true}catch(err){setStatus('Illegal move.',false);return true}}const p=pos[i];if(p&&p.toUpperCase()===(turn==='w'?'W':'B')){playFrom=sq;legalTargets=legalFor(sq);render();if(!legalTargets.length)setStatus('No legal moves for this piece.',false);else setStatus('Legal moves shown.',true);return true}playFrom=null;legalTargets=[];render();return true}
$('board').addEventListener('contextmenu',boardContext);
$('board').addEventListener('pointerdown',e=>{
  const sq=sqAt(e); if(!sq)return;
  if(e.button===2){e.preventDefault();e.stopPropagation();arrowStart=sq;arrowCurrent=sq;arrowMoved=false;arrowPointerId=e.pointerId;rightStartX=e.clientX;rightStartY=e.clientY;try{$('board').setPointerCapture(e.pointerId)}catch(_){}drawArrowPreview(sq,sq);return}
  if(e.button!==0)return;
  if(playMode){beginPlayDrag(sq,e);return}
  if(finalized)return;
  if(e.pointerType==='touch' && !pos[idx(sq)]){
    e.preventDefault();
    touchAnnPending={pointerId:e.pointerId,square:sq,x:e.clientX,y:e.clientY};
    clearTimeout(touchAnnTimer);
    touchAnnTimer=setTimeout(()=>{
      if(!touchAnnPending||touchAnnPending.pointerId!==e.pointerId)return;
      touchAnnPending=null; touchAnnTimer=null; touchAnnActive=true;
      arrowStart=sq; arrowCurrent=sq; arrowMoved=false; arrowPointerId=e.pointerId;
      try{$('board').setPointerCapture(e.pointerId)}catch(_){}
      drawArrowPreview(sq,sq);
    },280);
    return;
  }
  if(selected===null){
    const a=pos.slice(); if(a[idx(sq)]){a[idx(sq)]=null;applyEditPosition(a);setStatus('Piece erased.',true)}else{annotations=[];circles=[];render();setStatus('Annotations cleared.',true)}
    return;
  }
  const existing=pos[idx(sq)];
  if(existing){
    boardDragSource=sq;boardDragPointerId=e.pointerId;createBoardGhost(existing,e.clientX,e.clientY);
    const pc=[...$('board').querySelectorAll('.pc')].find(x=>x.style.transform.includes(`${C(sq)[0]*100}%`)&&x.style.transform.includes(`${C(sq)[1]*100}%`));
    if(pc)pc.classList.add('board-source');
    try{$('board').setPointerCapture(e.pointerId)}catch(_){}
    e.preventDefault();return;
  }
  annotations=[];circles=[];attemptPlace(sq,selected);
});
$('board').addEventListener('pointermove',e=>{
  if(arrowStart&&e.pointerId===arrowPointerId){e.preventDefault();const sq=sqAt(e);if(sq){if(sq!==arrowCurrent)arrowMoved=true;arrowCurrent=sq;drawArrowPreview(arrowStart,sq)}return}
  if(touchAnnPending&&e.pointerId===touchAnnPending.pointerId){const dx=e.clientX-touchAnnPending.x,dy=e.clientY-touchAnnPending.y;if(Math.hypot(dx,dy)>8&&!touchAnnActive){clearTimeout(touchAnnTimer);touchAnnTimer=null;touchAnnPending=null;return}}
  if(boardDragSource&&e.pointerId===boardDragPointerId){e.preventDefault();moveBoardGhost(e.clientX,e.clientY);const sq=sqAt(e);$('board').querySelectorAll('.dropok,.dropbad').forEach(x=>x.classList.remove('dropok','dropbad'));if(sq){const target=[...$('board').querySelectorAll('.sq')].find(x=>x.dataset.square===sq);if(target)target.classList.add('dropok')}}
  if(playDragSource&&e.pointerId===playDragPointerId){e.preventDefault();if(Math.hypot(e.clientX-playDragStartX,e.clientY-playDragStartY)>8){if(!playDragMoved){playDragMoved=true;const piece=pos[idx(playDragSource)];if(piece)createBoardGhost(piece,e.clientX,e.clientY)}movePlayDrag(e.clientX,e.clientY)}return}
},{passive:false});
$('board').addEventListener('pointerup',e=>{
  if(e.button===2&&arrowStart&&e.pointerId===arrowPointerId){e.preventDefault();finishRightGesture(e);return}
  if(touchAnnActive&&e.pointerId===arrowPointerId){e.preventDefault();finishRightGesture(e);touchAnnActive=false;return}
  if(touchAnnPending&&e.pointerId===touchAnnPending.pointerId){
    clearTimeout(touchAnnTimer);touchAnnTimer=null;const sq0=touchAnnPending.square;touchAnnPending=null;
    if(!playMode&&!finalized&&selected!==null)attemptPlace(sq0,selected);
    return;
  }
  if(e.button!==0)return;
  if(playDragSource&&e.pointerId===playDragPointerId){e.preventDefault();finishPlayDrag(sqAt(e));return}
  if(!boardDragSource||e.pointerId!==boardDragPointerId)return;
  e.preventDefault();const from=boardDragSource,to=sqAt(e);finishBoardDrag(from,to);
});
$('board').addEventListener('pointercancel',e=>{if(touchAnnPending&&e.pointerId===touchAnnPending.pointerId){clearTimeout(touchAnnTimer);touchAnnTimer=null;touchAnnPending=null}if(touchAnnActive&&e.pointerId===arrowPointerId)touchAnnActive=false;if(arrowStart&&e.pointerId===arrowPointerId){arrowStart=null;arrowCurrent=null;arrowPointerId=null;clearArrowPreview();render()}if(boardDragSource&&e.pointerId===boardDragPointerId)cancelBoardDrag();if(playDragSource&&e.pointerId===playDragPointerId){cancelBoardDrag();playDragSource=null;playDragPointerId=null;playDragMoved=false;playFrom=null;legalTargets=[];render()}});
function beginPlayDrag(square,e){if(!playMode)return false;const piece=pos[idx(square)];if(!piece||piece.toUpperCase()!==(turn==='w'?'W':'B')){playTapSquare=square;return false;}playTapSquare=square;playDragSource=square;playDragPointerId=e.pointerId;playDragMoved=false;playDragStartX=e.clientX;playDragStartY=e.clientY;legalTargets=legalFor(square);if(!legalTargets.length){playDragSource=null;playDragPointerId=null;render();setStatus('No legal moves for this piece.',false);return true}return true}
function movePlayDrag(x,y){if(!playDragSource)return;moveBoardGhost(x,y);const sq=sqAt({clientX:x,clientY:y});$('board').querySelectorAll('.dropok,.dropbad').forEach(x=>x.classList.remove('dropok','dropbad'));if(sq){const target=[...$('board').querySelectorAll('.sq')].find(x=>x.dataset.square===sq);if(target)target.classList.add(legalTargets.includes(sq)?'dropok':'dropbad')}}
function finishPlayDrag(to){const from=playDragSource||playTapSquare,moved=playDragMoved;const target=to||from;playDragSource=null;playDragPointerId=null;playDragMoved=false;playTapSquare=null;if(moved&&target&&legalTargets.includes(target)){playClick(target);return}if(from){playClick(from);return}render()}
function tryPosition(a,t=turn,r=rights,e=ep,hm=halfmove,fm=fullmove){const err=legalPosition(a,t,r,e,hm,fm);if(err){setStatus(err,false);return false}pos=a;turn=t;rights=r;ep=e;halfmove=hm;fullmove=fm;render();setStatus('Position accepted — FIDE legality checks passed.',true);return true}
function applyEditPosition(a){pos=a;playFrom=null;legalTargets=[];render();const err=legalPosition(pos,turn,rights,ep,halfmove,fullmove);setStatus(err?('Editing position — '+err):'Position accepted — FIDE legality checks passed.',!err)}
function select(k){document.body.classList.remove('erase-active');selected=k;document.querySelectorAll('.piece-btn').forEach(b=>b.classList.toggle('active',b.dataset.key===k));syncControls()}function eraseMode(){selected=null;document.querySelectorAll('.piece-btn').forEach(b=>b.classList.remove('active'));syncControls()}
function refreshPaletteImages(){document.querySelectorAll('.piece-btn img').forEach(im=>{const k=im.parentElement.dataset.key;im.src=pu(k);im.onerror=()=>{im.src=FB[k]}})}
function createGhost(k,x,y){let g=$('dragGhost');if(g)g.remove();g=document.createElement('div');g.className='drag-ghost';g.id='dragGhost';const im=document.createElement('img');im.src=pu(k);im.onerror=()=>im.src=FB[k];g.appendChild(im);document.body.appendChild(g);g.style.left=x+'px';g.style.top=y+'px'}
function beginPaletteDrag(k,e){e.preventDefault();e.stopPropagation();dragKey=k;dragPointerId=e.pointerId;createGhost(k,e.clientX,e.clientY);window.addEventListener('pointermove',paletteDragMove,{passive:false});window.addEventListener('pointerup',paletteDragEnd,{once:true});window.addEventListener('pointercancel',paletteDragEnd,{once:true})}
function paletteDragMove(e){if(e.pointerId!==dragPointerId)return;e.preventDefault();const g=$('dragGhost');if(g){g.style.left=e.clientX+'px';g.style.top=e.clientY+'px'}}
function paletteDragEnd(e){if(e.pointerId!==dragPointerId)return;const R=$('board').getBoundingClientRect();let sq=null;if(e.clientX>=R.left&&e.clientX<=R.right&&e.clientY>=R.top&&e.clientY<=R.bottom)sq=sqAt(e);const k=dragKey;dragKey=null;dragPointerId=null;window.removeEventListener('pointermove',paletteDragMove);const g=$('dragGhost');if(g)g.remove();if(sq&&k)placePiece(sq,k)}
function createBoardGhost(piece,x,y){const old=$('board-drag-ghost');if(old)old.remove();const g=document.createElement('div');g.className='board-drag-ghost';g.id='board-drag-ghost';const im=document.createElement('img');const k=(piece===piece.toUpperCase()?'w':'b')+piece.toUpperCase();im.src=pu(k);im.onerror=()=>im.src=FB[k];g.appendChild(im);document.body.appendChild(g);moveBoardGhost(x,y)}
function moveBoardGhost(x,y){const g=$('board-drag-ghost');if(g){g.style.left=x+'px';g.style.top=y+'px'}}
function cancelBoardDrag(){const g=$('board-drag-ghost');if(g)g.remove();$('board').querySelectorAll('.board-source,.dropok,.dropbad').forEach(x=>x.classList.remove('board-source','dropok','dropbad'));boardDragSource=null;boardDragPointerId=null;}
function finishBoardDrag(from,to){const piece=pos[idx(from)];cancelBoardDrag();if(!piece||!to)return;if(from===to){render();return}const a=pos.slice();a[idx(from)]=null;a[idx(to)]=piece;if(piece==='K'||piece==='k'){const own=piece==='K'?'K':'k';for(let i=0;i<64;i++)if(i!==idx(to)&&a[i]===own)a[i]=null}applyEditPosition(a);setStatus('Piece repositioned.',true)}
function placePiece(square,k){if(finalized){setStatus('Position is finalized. Choose Edit Position to modify the board.',false);return}const a=pos.slice(),target=idx(square),piece=k[0]==='w'?k[1]:k[1].toLowerCase();if(piece==='K'||piece==='k'){const own=piece==='K'?'K':'k';for(let i=0;i<64;i++)if(a[i]===own)a[i]=null}a[target]=piece;applyEditPosition(a)}
function attemptPlace(square,k){if(finalized){setStatus('Position is finalized. Choose Edit Position first.',false);return}const a=pos.slice();if(!k){a[idx(square)]=null;return applyEditPosition(a)}placePiece(square,k)}
function buildPalette(){const p=[['wK','K'],['wQ','Q'],['wR','R'],['wB','B'],['wN','N'],['wP','P'],['bK','K'],['bQ','Q'],['bR','R'],['bN','N'],['bB','B'],['bP','P']];$('palette').innerHTML=p.map(([k])=>`<button class="piece-btn" data-key="${k}" title="${k}" type="button"><img draggable="false" alt="${k}"></button>`).join('');document.querySelectorAll('.piece-btn').forEach(b=>{const k=b.dataset.key,bimg=b.querySelector('img');bimg.src=pu(k);bimg.onerror=()=>{bimg.src=FB[k]};b.onclick=()=>select(k);b.onpointerdown=e=>{select(k);beginPaletteDrag(k,e)}});select('wP');refreshPaletteImages()}
$('erase').onclick=e=>{e.preventDefault();eraseMode();document.body.classList.add('erase-active');setStatus('Erase mode: click any piece on the board to remove it.',true)};$('clear').onclick=e=>{e.preventDefault();if(finalized)return setStatus('Position is finalized. Choose Edit Position first.',false);const a=Array(64).fill(null);applyEditPosition(a);setStatus('Board cleared — all pieces removed.',true)};$('start').onclick=()=>{if(finalized)return setStatus('Position is finalized. Choose Edit Position first.',false);loadFen(START)};$('kings').onclick=()=>{if(finalized)return setStatus('Position is finalized. Choose Edit Position first.',false);const a=Array(64).fill(null);a[idx('e1')]='K';a[idx('e8')]='k';applyEditPosition(a);setStatus('Kings-only position created.',true)};$('whiteTurn').onclick=()=>tryPosition(pos.slice(),'w',rights,ep,halfmove,fullmove);$('blackTurn').onclick=()=>tryPosition(pos.slice(),'b',rights,ep,halfmove,fullmove);$('flip').onclick=()=>{flip=!flip;render()};$('toggle').onclick=()=>document.body.classList.toggle('panel-hidden');$('showPanel').onclick=()=>document.body.classList.remove('panel-hidden');
for(const id of ['wK','wQ','bK','bQ'])$(id).onchange=()=>{const nr=['wK','wQ','bK','bQ'].filter(x=>$(x).checked).join('');if(legalPosition(pos,turn,nr,ep,halfmove,fullmove)){rights=nr;render();setStatus('Castling rights updated.',true)}else{$(id).checked=!$(id).checked;setStatus('These castling rights are not compatible with the current position.',false)}};
$('load').onclick=e=>{e.preventDefault();loadFen($('fen').value)};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(makeFen());setStatus('FEN copied to clipboard.',true)}catch(e){$('fen').select();document.execCommand('copy');setStatus('FEN copied.',true)}};$('halfmove').onchange=()=>{const v=Math.max(0,Math.min(9999,parseInt($('halfmove').value||'0',10)));if(legalPosition(pos,turn,rights,ep,v,fullmove)){halfmove=v;render()}else{$('halfmove').value=halfmove}};$('fullmove').onchange=()=>{const v=Math.max(1,Math.min(999999,parseInt($('fullmove').value||'1',10)));if(legalPosition(pos,turn,rights,ep,halfmove,v)){fullmove=v;render()}else{$('fullmove').value=fullmove}};$('clearArrows').onclick=()=>{annotations=[];circles=[];render();setStatus('All arrows and circles cleared.',true)};
function enterHandMode(){playMode=false;playFrom=null;legalTargets=[];playTapSquare=null;finalized=false;$('finalize').style.display='block';$('playFromPosition').style.display='none';select(selected||'wP');render();setStatus('Hand/Edit mode enabled — board can be freely modified.',true)}
function enterPlayMode(){if(!finalized){setStatus('Finalize the position first, then Play from this Position.',false);return}const err=legalPosition(pos,turn,rights,ep,halfmove,fullmove);if(err){setStatus('Play mode requires a legal position: '+err,false);return}playMode=true;eraseMode();playFrom=null;legalTargets=[];playTapSquare=null;render();setStatus('Play mode enabled — click/touch a piece, then click/touch a legal square.',true)}
$('finalize').onclick=()=>{if(finalized){return}let nr=rights;if(pos[idx('e1')]!=='K'||pos[idx('h1')]!=='R')nr=nr.replace('K','');if(pos[idx('e1')]!=='K'||pos[idx('a1')]!=='R')nr=nr.replace('Q','');if(pos[idx('e8')]!=='k'||pos[idx('h8')]!=='r')nr=nr.replace('k','');if(pos[idx('e8')]!=='k'||pos[idx('a8')]!=='r')nr=nr.replace('q','');rights=nr||'-';ep='-';const err=legalPosition(pos,turn,rights,ep,halfmove,fullmove);if(err){setStatus('Cannot finalize: '+err,false);render();return}finalized=true;startFen=makeFen();playMode=false;playFrom=null;legalTargets=[];playTapSquare=null;eraseMode();render();$('playFromPosition').style.display='block';$('finalize').style.display='none';setStatus('Position finalized — ready to play from this position.',true)};$('editUnlock').onclick=enterHandMode;$('playFromPosition').onclick=enterPlayMode;
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.ctrlKey||e.metaKey)return;if(e.key==='f'||e.key==='F'){flip=!flip;render()}if(e.key==='Escape'){eraseMode();playFrom=null;legalTargets=[];arrowStart=null;arrowCurrent=null;clearArrowPreview();render()}});
buildPalette();loadFen(START);finalized=false;playMode=false;syncControls();syncViewportLayout();setTimeout(syncViewportLayout,120);
</script></body></html>
