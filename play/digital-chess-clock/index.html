<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#161616">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MyChess64 — Chess Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/clock.css">
<link rel="stylesheet" href="css/sheet.css">
</head>

<body>
<main id="app" aria-label="MyChess64 chess clock">

  <section id="whiteClock" class="panel white turn" data-player="white" aria-label="White clock" role="button" tabindex="0">
    <div class="panel-inner">
      <div class="top">
        <span class="who"><img class="sym" src="assets/wK.svg" alt="" draggable="false"><span class="name">White</span></span>
        <span class="status" id="whiteStatus"></span>
      </div>
      <div class="time" id="whiteTime">3:00</div>
      <div class="moves">Moves <b id="whiteMoves">0</b></div>
    </div>
  </section>

  <nav id="deck" aria-label="Clock controls">
    <div class="fmt" id="fmtLabel">3+2</div>
    <button class="ctl primary go" id="startBtn" type="button" aria-label="Start"></button>
    <button class="ctl" id="resetBtn" type="button" aria-label="Reset" title="Reset (R)"></button>
    <button class="ctl" id="modeBtn" type="button" aria-label="Time control and settings" title="Settings (M)"></button>
    <button class="ctl" id="soundBtn" type="button" aria-label="Sound"></button>
  </nav>

  <section id="blackClock" class="panel black idle" data-player="black" aria-label="Black clock" role="button" tabindex="0">
    <div class="panel-inner">
      <div class="top">
        <span class="who"><img class="sym" src="assets/bK.svg" alt="" draggable="false"><span class="name">Black</span></span>
        <span class="status" id="blackStatus"></span>
      </div>
      <div class="time" id="blackTime">3:00</div>
      <div class="moves">Moves <b id="blackMoves">0</b></div>
    </div>
  </section>

</main>

<div id="modeSheet" aria-hidden="true">
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <span class="sheet-title" id="sheetTitle">Time control</span>
      <button class="close" id="closeSheet" type="button" aria-label="Close">✕</button>
    </div>
    <div id="sheetContent"></div>
  </section>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<!-- Classic scripts, loaded in dependency order (works when opened straight from disk) -->
<script src="js/state.js"></script>
<script src="js/ui.js"></script>
<script src="js/device.js"></script>
<script src="js/engine.js"></script>
<script src="js/sheet.js"></script>
<script src="js/main.js"></script>
</body>
</html>
