<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chess Basics — Learn Chess Step by Step</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
:root{--bg:#e4f4ff;--s:#fff;--s2:#f3efe7;--bd:#e3d6bd;--tx:#2b2118;--mu:#78695a;--ac:#b58863;--ac2:#f0d9b5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17202b;--s:#232d3a;--s2:#2d3949;--bd:#3d4b5f;--tx:#f6f0e6;--mu:#b9c3cf;--ac:#e0b080}}
:root[data-theme="dark"]{--bg:#17202b;--s:#232d3a;--s2:#2d3949;--bd:#3d4b5f;--tx:#f6f0e6;--mu:#b9c3cf;--ac:#e0b080}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg) conic-gradient(rgba(181,136,99,.10) 25%,transparent 0 50%,rgba(181,136,99,.10) 0 75%,transparent 0) 0 0/84px 84px;color:var(--tx);font:700 16px/1.45 Nunito,'Trebuchet MS',system-ui,sans-serif}
h1,h2,h3,.brand,.b,.big,.lv b,.num{font-family:Fredoka,'Trebuchet MS',system-ui,sans-serif}
.app{position:relative;z-index:1;max-width:1300px;margin:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--s);border:3px solid var(--bd);border-radius:20px;box-shadow:0 6px 0 rgba(90,60,30,.14)}
.top{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;gap:8px;flex-wrap:wrap}
.brand{font-weight:700;font-size:26px;color:var(--tx);text-decoration:none;display:flex;align-items:center;gap:8px}.brand .ps{width:38px;height:38px}
.acts{display:flex;gap:8px;align-items:center}#vol{width:80px;accent-color:#2ecc71}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px}nav .b{flex:none;white-space:nowrap}
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;border:3px solid var(--bd);border-bottom-width:6px;background:var(--s);color:var(--tx);border-radius:16px;padding:8px 12px;cursor:pointer;font-size:15px;font-weight:600;min-height:46px;transition:transform .12s,filter .12s;-webkit-tap-highlight-color:transparent}
.b:hover{transform:translateY(-3px);filter:brightness(1.07)}.b:active{transform:translateY(3px);border-bottom-width:3px}
.b.on{background:#ffd34d;border-color:#d99e00;color:#2b2118}.b.p{background:#2ecc71;border-color:#1c9a50;color:#fff}.b:disabled{opacity:.45;pointer-events:none}.w{width:100%}
.hero{text-align:center;padding:14px 8px 4px}.hero h1{margin:4px 0;font-size:clamp(36px,7vw,68px);background:linear-gradient(90deg,#ff5e62,#ff9f43,#e1b800,#1dd1a1,#2e86de,#8e7cf0);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.hero p{margin:0 0 10px;color:var(--mu);font-size:19px}.mascot .ps{width:120px;height:120px;animation:bob 2.2s ease-in-out infinite;filter:drop-shadow(0 8px 0 rgba(0,0,0,.16))}
.pill{display:inline-block;background:#ffd34d;color:#2b2118;border:3px solid #d99e00;border-radius:99px;padding:4px 16px;font-family:Fredoka,sans-serif;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;padding:16px 0 28px}
.tc{background:var(--s);position:relative;display:flex;flex-direction:column;gap:6px;padding:18px 16px 16px;text-decoration:none;color:var(--tx);border-radius:24px;border:3px solid var(--c);border-bottom-width:9px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 14%,var(--s)),var(--s) 60%);transition:transform .15s}
.tc:hover{transform:translateY(-7px) rotate(-1.2deg)}.tc:hover .ic{animation:wig .5s}.tc:active{transform:translateY(2px)}
.tc .ic{width:78px;height:78px;border-radius:22px;background:var(--c);padding:8px;display:block;box-shadow:0 5px 0 rgba(0,0,0,.18)}.tc .ic .ps{width:100%;height:100%}
.tc .num{position:absolute;top:10px;right:16px;font-size:34px;font-weight:700;color:var(--c)}.tc .star{position:absolute;top:50px;right:16px;font-size:24px}
.tc h3{margin:6px 0 0;font-size:23px}.tc p{margin:0;color:var(--mu);font-size:14px;flex:1}
.tc .go{align-self:flex-start;background:var(--c);color:#fff;border-radius:99px;padding:5px 16px;font-family:Fredoka,sans-serif;font-weight:600;margin-top:6px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.livec{padding:10px 14px;margin-bottom:12px}.lvs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lv{text-align:center;border-radius:14px;padding:4px 2px;background:var(--s2);color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.lv b{display:block;font-size:34px;line-height:1.1;color:#2e86de}.lv.c b{color:#17b062}.lv.i b{color:#ee4d4d}.lv.s b{color:#ff8a00}
.bump{animation:bump .55s}
.mrow{display:flex;align-items:center;gap:10px;margin-top:8px}.meter{flex:1;height:14px;background:var(--s2);border-radius:99px;overflow:hidden;border:2px solid var(--bd)}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff6b6b,#ffd34d,#2ecc71);transition:width .6s}#pct{font-family:Fredoka,sans-serif;min-width:46px;text-align:right}
.lay{display:flex;gap:12px;align-items:flex-start}
.ba{flex:1;min-width:0;display:flex;justify-content:center;padding:14px}
.bw{position:relative;width:min(100%,calc(100vh - 300px),720px);min-width:260px;aspect-ratio:1;border-radius:10px}
.bw.shake{animation:shake .45s}.bw.glow{animation:glow .7s}
.bd{display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr);width:100%;height:100%;border-radius:8px;overflow:hidden;container-type:inline-size;user-select:none;box-shadow:0 10px 26px rgba(0,0,0,.3)}
.sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer}
.l{background:#f0d9b5}.d{background:#b58863}.l .co{color:#b58863}.d .co{color:#f0d9b5}
.co{position:absolute;font:800 11px/1 Nunito,system-ui;font:800 clamp(9px,1.7cqw,15px)/1 Nunito,system-ui;font-style:normal;pointer-events:none;z-index:2}
.pc{position:relative;z-index:1;width:100%;height:100%;pointer-events:none;display:block}.pc.pin{animation:pin .4s}
.ps{display:inline-block;width:34px;height:34px;vertical-align:middle}.ps .pc{width:100%;height:100%}
.sel::before,.ok::before,.bad::before{content:"";position:absolute;inset:0}
.sel::before{background:rgba(20,85,30,.5)}.ok::before{background:rgba(20,160,40,.55)}.bad::before{background:rgba(225,45,45,.5)}
.tgt{box-shadow:inset 0 0 0 5px #fff,inset 0 0 0 8px rgba(0,0,0,.3)}
.dot::after{content:"";width:30%;height:30%;border-radius:50%;background:rgba(20,85,30,.55);position:absolute;z-index:2}
.cap{background-image:radial-gradient(transparent 0,transparent 79%,rgba(20,85,30,.45) 80%)}
.fb{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:Fredoka,sans-serif;font-size:clamp(54px,12vw,100px);font-weight:700;pointer-events:none;text-shadow:0 4px 14px rgba(0,0,0,.6);animation:pop .4s;border-radius:8px}
.fb small{font-size:.32em;text-align:center;padding:0 10px}.fb.g{background:rgba(30,160,70,.38)}.fb.r{background:rgba(210,40,40,.38)}
.pn{width:350px;flex:none;padding:16px;display:flex;flex-direction:column;gap:12px}
.pn h2{margin:0;font-size:26px}.mu{color:var(--mu);font-size:14px}.c{text-align:center}
.g2,.g3,.g6,.g8{display:grid;gap:6px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g6{grid-template-columns:repeat(6,1fr)}.g8{grid-template-columns:repeat(8,1fr)}
.g6 .b,.g8 .b{padding:2px}.g3 .b{flex-direction:column;font-size:13px}
.big{min-height:80px;display:flex;align-items:center;justify-content:center;border-radius:18px;background:var(--s2);border:3px dashed var(--ac);font-size:50px;font-weight:700;letter-spacing:2px;color:var(--ac)}
.msg{background:var(--s2);border-radius:14px;padding:10px;font-size:14px;text-align:center;border:2px solid var(--bd)}
ul.t{margin:0;padding-left:18px;font-size:13px;color:var(--mu)}
table{width:100%;border-collapse:collapse}td{padding:4px;border-bottom:2px solid var(--bd)}td:last-child{text-align:right;font-family:Fredoka,sans-serif;color:var(--ac);font-size:22px}
.bgp{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}.bgp div{position:absolute;width:70px;opacity:.14;animation:bob 4s ease-in-out infinite}
.burst{position:fixed;inset:0;z-index:50;pointer-events:none;overflow:hidden}
.fp{position:absolute;bottom:-70px;width:64px;animation:fly 1.9s ease-out forwards;filter:drop-shadow(0 4px 4px rgba(0,0,0,.3))}
.cf{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall 2.3s linear forwards}
.sp{position:absolute;font-size:30px;animation:star 1.1s ease-out forwards;margin:-15px 0 0 -15px}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
@keyframes fall{to{transform:translate(var(--x),110vh) rotate(720deg)}}
@keyframes star{to{transform:translate(var(--x),var(--y)) scale(1.6) rotate(200deg);opacity:0}}
@keyframes bob{50%{transform:translateY(-12px) rotate(4deg)}}
@keyframes wig{25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes pop{from{transform:scale(.5);opacity:0}}
@keyframes pin{0%{transform:scale(.3) translateY(-35%);opacity:0}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes bump{40%{transform:scale(1.35)}}
@keyframes shake{20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(46,204,113,.9)}100%{box-shadow:0 0 0 28px rgba(46,204,113,0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Full-screen game layout ===== */
.b,.sq,.tc{touch-action:manipulation;-webkit-touch-callout:none}
html.in,html.in body{height:100%;overflow:hidden;overscroll-behavior:none}
html.in .app{height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));padding:8px;gap:8px}
html.in #topic{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.top{padding:6px 12px}.top .b{min-height:40px;padding:4px 12px;border-bottom-width:5px}.brand{font-size:24px}
nav{padding:6px;flex:none}nav .b{min-height:38px;padding:2px 12px}.nm{display:none}
.lay{flex:1;min-height:0;display:flex;flex-direction:row;gap:8px;align-items:stretch}
.ba{flex:1;min-width:0;min-height:0;padding:8px;container-type:size;display:flex;align-items:center;justify-content:center}
@supports (width:1cqw){.bw{width:min(100cqw,100cqh);height:min(100cqw,100cqh);min-width:0;aspect-ratio:auto}}
.pn{width:clamp(280px,34vw,400px);flex:none;overflow-y:auto;overscroll-behavior:contain;padding:14px}
.livec{flex:none;padding:6px 12px 8px;margin:0}.lvs{gap:6px}.lv{padding:2px}.lv b{font-size:28px}.mrow{margin-top:4px}.meter{height:10px}
@media(min-width:1100px){.nm{display:inline}}
@media(orientation:portrait){.lay{flex-direction:column}.ba{flex:none;width:100%;height:min(100vw - 16px,50vh);height:min(100vw - 16px,50dvh)}.pn{width:100%;flex:1;min-height:0}}
@media(max-width:600px){.hs{display:none}.brand>span:last-child{display:none}#vol{display:none}.lv b{font-size:24px}.pn h2{font-size:21px}.top .b{padding:4px 10px}
.grid{grid-template-columns:1fr 1fr;gap:12px;padding-top:10px}.tc{padding:12px 10px 12px;border-bottom-width:7px}.tc p{font-size:12px}.tc .go{display:none}.tc .ic{width:56px;height:56px}.tc h3{font-size:17px}.tc .num{font-size:24px;right:10px}.tc .star{top:38px;right:10px}.hero .ps{width:90px;height:90px}}
@media(max-height:520px){nav{display:none}.top{padding:3px 10px}.top .b{min-height:34px}.brand>span:last-child{display:none}.lv{font-size:9px}.lv b{font-size:20px;display:inline;margin-right:4px}.mrow{display:none}html.in .app{padding:4px;gap:4px}html.in #topic{gap:4px}.pn{padding:8px;gap:8px}.msg{padding:6px}.pn h2{font-size:18px}}

.lvs{grid-template-columns:repeat(5,1fr)}.lv.p b{color:#8e7cf0}.lv #pct{min-width:0;text-align:center}.lv{font-size:11px;line-height:1.1}.lv b{font-size:24px;line-height:1.15}
.livec{padding:6px 10px 8px}.meter{height:7px;margin-top:5px}
@media(orientation:portrait){.ba{height:min(100vw - 16px,47vh);height:min(100vw - 16px,47dvh)}}
@media(max-height:520px){.ba{padding:3px}.lvs{gap:2px}.lv b{font-size:18px}.meter{display:none}.livec{padding:3px 8px}}
@media(max-width:600px){.lv b{font-size:21px}.lv{font-size:9px}}
@media(orientation:portrait) and (min-height:800px){.ba{height:min(100vw - 16px,55vh);height:min(100vw - 16px,55dvh)}}

.logo{display:flex;align-items:center;flex:none;background:#fff;border-radius:12px;padding:2px 8px;border:2px solid var(--bd)}.logo img{height:40px;width:auto;display:block}
html:not(.in) .logo img{height:50px}.top{flex-wrap:nowrap}
@media(max-width:600px){.logo img{height:30px}html:not(.in) .logo img{height:40px}html.in #theme{display:none}.top{gap:6px;padding:5px 8px}.acts{gap:5px}.top .b{min-width:42px;padding:4px 8px}}
@media(orientation:portrait){.lay{overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}.ba{position:sticky;top:0;z-index:5;height:min(100vw - 16px,44vh);height:min(100vw - 16px,44dvh)}.pn{flex:none;overflow:visible;min-height:auto}}
@media(orientation:portrait) and (min-height:800px){.ba{height:min(100vw - 16px,50vh);height:min(100vw - 16px,50dvh)}}
.g2 .b{font-size:14px;padding:4px 6px}
@media(max-width:600px){.top .b{min-width:38px}.logo{padding:2px 5px}.logo img{height:26px}}
.fb{overflow:hidden;isolation:isolate}.fb::before{content:"";position:absolute;inset:-60%;z-index:-1;background:repeating-conic-gradient(rgba(255,255,255,.22) 0 9deg,transparent 0 18deg);animation:spin 7s linear infinite}
.bi{display:inline-block;animation:bounce .7s cubic-bezier(.3,1.6,.5,1)}
.cf2,.fw{position:absolute}.fw{width:8px;height:8px;border-radius:50%;margin:-4px 0 0 -4px}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes bounce{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
.bd{border-radius:4px}
.sel::before,.ok::before,.bad::before,.lm::before{content:"";position:absolute;inset:0}.lm::before{background:rgba(155,199,0,.41)}
#ar{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
.sel.lm::before{background:rgba(20,85,30,.5)}
.chk{background-image:radial-gradient(ellipse at center,rgba(255,0,0,1) 0%,rgba(231,0,0,1) 25%,rgba(169,0,0,0) 89%,rgba(158,0,0,0) 100%)}
.opt{font:700 22px/1 ui-monospace,Menlo,Consolas,monospace}
.msg{position:sticky;top:0;z-index:4;box-shadow:0 3px 0 rgba(0,0,0,.08)}
@media(orientation:portrait){:root{--bh:min(100vw - 16px,44dvh)}.msg{top:calc(var(--bh) + 6px)}}
@media(orientation:portrait) and (min-height:800px){:root{--bh:min(100vw - 16px,50dvh)}}
</style></head><body>

function ac(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();const c=AC.createDynamicsCompressor();MG=AC.createGain();MG.connect(c);c.connect(AC.destination)}if(AC.state==='suspended')AC.resume();MG.gain.value=vol*1.4}

const TIPR=['<b>Rook + King vs King:</b> cut the king off with the rook, march your king forward, then take the <b>opposition</b> (kings two squares apart, one between).','When the kings face each other, check with the rook on the edge rank or file for mate.','Keep the rook at a safe distance (not next to the enemy king) unless it is protected.','It can take up to 16 moves — be patient and avoid stalemate.'];
