<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
:root{--bg:#e4f4ff;--s:#fff;--s2:#f3efe7;--bd:#e3d6bd;--tx:#2b2118;--mu:#78695a;--ac:#b58863;--ac2:#f0d9b5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

h1,h2,h3,.brand,.b,.big,.lv b,.num{font-family:Fredoka,'Trebuchet MS',system-ui,sans-serif}
.app{position:relative;z-index:1;max-width:1300px;margin:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--s);border:3px solid var(--bd);border-radius:20px;box-shadow:0 6px 0 rgba(90,60,30,.14)}
.top{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;gap:8px;flex-wrap:wrap}

.acts{display:flex;gap:8px;align-items:center}#vol{width:80px;accent-color:#2ecc71}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px}nav .b{flex:none;white-space:nowrap}
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;border:3px solid var(--bd);border-bottom-width:6px;background:var(--s);color:var(--tx);border-radius:16px;padding:8px 12px;cursor:pointer;font-size:15px;font-weight:600;min-height:46px;transition:transform .12s,filter .12s;-webkit-tap-highlight-color:transparent}
.b:hover{transform:translateY(-3px);filter:brightness(1.07)}.b:active{transform:translateY(3px);border-bottom-width:3px}
.b.on{background:#ffd34d;border-color:#d99e00;color:#2b2118}.b.p{background:#2ecc71;border-color:#1c9a50;color:#fff}.b:disabled{opacity:.45;pointer-events:none}.w{width:100%}
.hero{text-align:center;padding:14px 8px 4px}.hero h1{margin:4px 0;font-size:clamp(36px,7vw,68px);background:linear-gradient(90deg,#ff5e62,#ff9f43,#e1b800,#1dd1a1,#2e86de,#8e7cf0);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.hero p{margin:0 0 10px;color:var(--mu);font-size:19px}.mascot .ps{width:120px;height:120px;animation:bob 2.2s ease-in-out infinite;filter:drop-shadow(0 8px 0 rgba(0,0,0,.16))}
.pill{display:inline-block;background:#ffd34d;color:#2b2118;border:3px solid #d99e00;border-radius:99px;padding:4px 16px;font-family:Fredoka,sans-serif;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;padding:16px 0 28px}
.tc{background:var(--s);position:relative;display:flex;flex-direction:column;gap:6px;padding:18px 16px 16px;text-decoration:none;color:var(--tx);border-radius:24px;border:3px solid var(--c);border-bottom-width:9px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 14%,var(--s)),var(--s) 60%);transition:transform .15s}
.tc:hover{transform:translateY(-7px) rotate(-1.2deg)}.tc:hover .ic{animation:wig .5s}.tc:active{transform:translateY(2px)}
.tc .ic{width:78px;height:78px;border-radius:22px;background:var(--c);padding:8px;display:block;box-shadow:0 5px 0 rgba(0,0,0,.18)}.tc .ic .ps{width:100%;height:100%}
.tc .num{position:absolute;top:10px;right:16px;font-size:34px;font-weight:700;color:var(--c)}.tc .star{position:absolute;top:50px;right:16px;font-size:24px}
.tc h3{margin:6px 0 0;font-size:23px}.tc p{margin:0;color:var(--mu);font-size:14px;flex:1}
.tc .go{align-self:flex-start;background:var(--c);color:#fff;border-radius:99px;padding:5px 16px;font-family:Fredoka,sans-serif;font-weight:600;margin-top:6px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.livec{padding:10px 14px;margin-bottom:12px}.lvs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lv{text-align:center;border-radius:14px;padding:4px 2px;background:var(--s2);color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.lv b{display:block;font-size:34px;line-height:1.1;color:#2e86de}.lv.c b{color:#17b062}.lv.i b{color:#ee4d4d}.lv.s b{color:#ff8a00}
.bump{animation:bump .55s}
.mrow{display:flex;align-items:center;gap:10px;margin-top:8px}.meter{flex:1;height:14px;background:var(--s2);border-radius:99px;overflow:hidden;border:2px solid var(--bd)}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff6b6b,#ffd34d,#2ecc71);transition:width .6s}#pct{font-family:Fredoka,sans-serif;min-width:46px;text-align:right}
.lay{display:flex;gap:12px;align-items:flex-start}
.ba{flex:1;min-width:0;display:flex;justify-content:center;padding:14px}

.bd{display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr);width:100%;height:100%;border-radius:8px;overflow:hidden;container-type:inline-size;user-select:none;box-shadow:0 10px 26px rgba(0,0,0,.3)}
.sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer}
.l{background:#f0d9b5}.d{background:#b58863}.l .co{color:#b58863}.d .co{color:#f0d9b5}
.co{position:absolute;font:800 11px/1 Nunito,system-ui;font:800 clamp(9px,1.7cqw,15px)/1 Nunito,system-ui;font-style:normal;pointer-events:none;z-index:2}
.pc{position:relative;z-index:1;width:100%;height:100%;pointer-events:none;display:block}.pc.pin{animation:pin .4s}
.ps{display:inline-block;width:34px;height:34px;vertical-align:middle}.ps .pc{width:100%;height:100%}
.sel::before,.ok::before,.bad::before{content:"";position:absolute;inset:0}
.sel::before{background:rgba(20,85,30,.5)}.ok::before{background:rgba(20,160,40,.55)}.bad::before{background:rgba(225,45,45,.5)}
.tgt{box-shadow:inset 0 0 0 5px #fff,inset 0 0 0 8px rgba(0,0,0,.3)}
.dot::after{content:"";width:30%;height:30%;border-radius:50%;background:rgba(20,85,30,.55);position:absolute;z-index:2}
.cap{background-image:radial-gradient(transparent 0,transparent 79%,rgba(20,85,30,.45) 80%)}
.fb{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:Fredoka,sans-serif;font-size:clamp(54px,12vw,100px);font-weight:700;pointer-events:none;text-shadow:0 4px 14px rgba(0,0,0,.6);animation:pop .4s;border-radius:8px}
.fb small{font-size:.32em;text-align:center;padding:0 10px}.fb.g{background:rgba(30,160,70,.38)}.fb.r{background:rgba(210,40,40,.38)}
.pn{width:350px;flex:none;padding:16px;display:flex;flex-direction:column;gap:12px}
.pn h2{margin:0;font-size:26px}.mu{color:var(--mu);font-size:14px}.c{text-align:center}
.g2,.g3,.g6,.g8{display:grid;gap:6px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g6{grid-template-columns:repeat(6,1fr)}.g8{grid-template-columns:repeat(8,1fr)}
.g6 .b,.g8 .b{padding:2px}.g3 .b{flex-direction:column;font-size:13px}
.big{min-height:80px;display:flex;align-items:center;justify-content:center;border-radius:18px;background:var(--s2);border:3px dashed var(--ac);font-size:50px;font-weight:700;letter-spacing:2px;color:var(--ac)}
.msg{background:var(--s2);border-radius:14px;padding:10px;font-size:14px;text-align:center;border:2px solid var(--bd)}
ul.t{margin:0;padding-left:18px;font-size:13px;color:var(--mu)}
table{width:100%;border-collapse:collapse}td{padding:4px;border-bottom:2px solid var(--bd)}td:last-child{text-align:right;font-family:Fredoka,sans-serif;color:var(--ac);font-size:22px}
.bgp{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}.bgp div{position:absolute;width:70px;opacity:.14;animation:bob 4s ease-in-out infinite}
.burst{position:fixed;inset:0;z-index:50;pointer-events:none;overflow:hidden}
.fp{position:absolute;bottom:-70px;width:64px;animation:fly 1.9s ease-out forwards;filter:drop-shadow(0 4px 4px rgba(0,0,0,.3))}
.cf{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall 2.3s linear forwards}
.sp{position:absolute;font-size:30px;animation:star 1.1s ease-out forwards;margin:-15px 0 0 -15px}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
@keyframes fall{to{transform:translate(var(--x),110vh) rotate(720deg)}}
@keyframes star{to{transform:translate(var(--x),var(--y)) scale(1.6) rotate(200deg);opacity:0}}
@keyframes bob{50%{transform:translateY(-12px) rotate(4deg)}}
@keyframes wig{25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes pop{from{transform:scale(.5);opacity:0}}
@keyframes pin{0%{transform:scale(.3) translateY(-35%);opacity:0}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes bump{40%{transform:scale(1.35)}}
@keyframes shake{20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(46,204,113,.9)}100%{box-shadow:0 0 0 28px rgba(46,204,113,0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.hp{position:fixed;z-index:70;left:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);display:flex;align-items:flex-start;pointer-events:none;animation:hpin .6s cubic-bezier(.3,1.5,.5,1)}.hp.out{animation:hpout .26s ease-in forwards}

.hpb{position:relative;margin:30px 0 0 -4px;max-width:min(62vw,250px);background:#fff;color:#2b2118;border:3px solid #ffd34d;border-radius:20px;padding:10px 28px 10px 14px;box-shadow:0 5px 0 rgba(0,0,0,.14)}
.hpb::before{content:"";position:absolute;left:-10px;top:20px;width:16px;height:16px;background:#fff;border-left:3px solid #ffd34d;border-bottom:3px solid #ffd34d;transform:rotate(45deg)}
.hpb .x{top:-14px;right:-12px;width:30px;height:30px;font-size:13px;pointer-events:auto}.hpt{font:700 19px/1.2 Fredoka,system-ui,sans-serif}.hps{font:700 14px Nunito,system-ui,sans-serif;color:#78695a;margin-top:3px}
@keyframes hpin{from{transform:translateY(60%) scale(.7);opacity:0}}@keyframes hpout{to{transform:translateY(60%) scale(.8);opacity:0}}
@media(max-height:700px){.hpi{width:92px}.hpb{margin-top:22px}.hpt{font-size:17px}}
@media(orientation:landscape){.hp{left:auto;right:14px;bottom:70px;flex-direction:row-reverse}.hpb{margin:30px -4px 0 0}.hpb::before{left:auto;right:-10px;border-left:0;border-bottom:0;border-right:3px solid #ffd34d;border-top:3px solid #ffd34d}}
@media(orientation:landscape) and (max-height:460px){.hpi{width:64px}.hp{bottom:48px}.hpb{margin-top:12px;padding:6px 10px}.hpt{font-size:14px}.hps{font-size:12px}}

/* Sound engine: compressor + master volume */
function ac(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();const c=AC.createDynamicsCompressor();MG=AC.createGain();MG.connect(c);c.connect(AC.destination)}if(AC.state==='suspended')AC.resume();MG.gain.value=vol*1.4}

function noise(t0,d,v,fr){const n=AC.sampleRate*d|0,bf=AC.createBuffer(1,n,AC.sampleRate),a=bf.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=bf;fl.type='bandpass';fl.frequency.value=fr;g.gain.value=v;s.connect(fl);fl.connect(g);g.connect(MG);s.start(AC.currentTime+t0)}

const P={click:()=>tone(900,0,.08,'triangle',.5,500),

check:()=>{tone(880,0,.12,'square',.45);tone(660,.12,.18,'square',.45)},
bad:()=>{tone(320,0,.3,'sawtooth',.4,130);tone(210,.18,.4,'sawtooth',.4,80)},
win:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,i*.13,.25,'triangle',.8));[1047,1319,1568].forEach(f=>tone(f,.52,.9,'triangle',.5));noise(.52,.6,.4,6000)}};P[k]()}catch(e){}}

const cls3=n=>n>0?'g':n<0?'b':'e',CLN={g:'Good',b:'Bad',e:'Equal'};
function genTradeP(a,pred,heavy){const d=a==='w'?'b':'w';
for(let n=0;n<5000;n++){const P={},u=new Set(),put=(q,c)=>{P[q]=c;u.add(q)};
const ak=rsq();put(ak,a+'K');const dk=freeSq(u,q=>cdist(q,ak)>2);if(!dk)continue;put(dk,d+'K');
let bad=false;for(let i=0,no=2+(Math.random()*3|0);i<no;i++){const t=rnd(heavy?'QRRQRN':'QRRBBNNPP'),q=freeSq(u,q=>t!=='P'||pawnOk(P,q,a));if(!q){bad=true;break}put(q,a+t)}
if(bad)continue;
const att=new Set();for(const q in P)if(P[q][0]===a&&P[q][1]!=='K')reach(P[q][1],q,P,a,1).forEach(x=>att.add(x));
const tg=shuf([...att].filter(q=>!u.has(q))),tl=[];let ne=0;const want=2+(Math.random()*3|0);
for(const q of tg){if(ne>=want)break;const t=rnd(heavy?'PPNB':'QRRBBNNPPP');if(t==='P'&&!pawnOk(P,q,d))continue;put(q,d+t);tl.push(q);ne++}
if(heavy)for(const q of tl){if(Math.random()<.95){const D=rnd('PPNB'),cand=D==='P'?behind(q,d):reach(D,q,P,d,1),fr=cand.filter(x=>!u.has(x)&&(D!=='P'||pawnOk(P,x,d)));if(fr.length)put(rnd(fr),d+D)}}
for(let i=0,m=(heavy?0:1)+(Math.random()*3|0);i<m;i++){const t=rnd('RBNPPQ'),q=freeSq(u,q=>t!=='P'||pawnOk(P,q,d));if(q)put(q,d+t)}
for(let i=0,m=Math.random()*2|0;i<m;i++){const t=rnd('RBNP'),q=freeSq(u,q=>t!=='P'||pawnOk(P,q,a));if(q)put(q,a+t)}
if(inChk(P,a)||inChk(P,d))continue;
const nets=capNets(P,a),r=pred(nets,P,a);if(!r)continue;return{P,nets,info:r}}return null}

const TIPT1=['A <b>trade</b> (exchange) means you capture a piece and your opponent captures one of yours back.','In this lesson the <b>value of the pieces does not matter</b>: Queen takes pawn, pawn takes Queen, Knight takes pawn — each one is just a trade.','Before you capture, ask: <b>is that piece protected?</b> If yes, expect a recapture.','If nothing protects it, the capture is <b>free</b> — no trade happens.','<b>Recapture:</b> when your opponent takes your piece, take back on the same square.'];
const TIPT2=['<b>Take free pieces:</b> an unprotected piece gives you points and costs you nothing.','<b>Take high-value pieces</b> when you can.','⚠️ Do not capture a low-value piece with a high-value piece if it is protected — you may lose more points than you win!','Count it: <b>points you win − points you lose = net</b>. A positive net is a Right Trade.','Values: Pawn 1 · Knight 3 · Bishop 3 · Rook 5 · Queen 9. The King cannot be traded.'];const TIPG=['<b>Good trade</b> = you win more points than you lose in the whole exchange.','Best of all: a <b>free piece</b> — nothing can recapture.','A small piece taking a bigger protected piece is good (pawn takes Queen!).','Trading a Knight or Bishop (3) for a Rook (5) is “winning the exchange”.','Always count the <b>whole sequence</b>: capture, recapture, capture again…','Values: Pawn 1 · Knight 3 · Bishop 3 · Rook 5 · Queen 9.'];
const TIPB=['<b>Bad trade</b> = you lose more points than you win in the whole exchange.','Never take a protected low-value piece with a high-value piece (Queen takes protected pawn = −8).','If every capture loses points, the best move is <b>not to capture</b> at all.','Before capturing ask: <b>Is it protected? What do I lose if they recapture?</b>','Losing a Rook (5) for a Bishop (3) loses 2 points.','Values: Pawn 1 · Knight 3 · Bishop 3 · Rook 5 · Queen 9.'];

{n:'8 · Castling',d:'Move king and rook together — but only when FIDE rules allow it.',sc:1,

{n:'9 · Learn Notation',d:'Every move has a short written name. Read the move on the board and choose its notation.',sc:1,

{n:'10 · En Passant',d:'A special pawn capture — allowed only right after a two-square pawn advance! White and Black positions.',sc:1,
i(){rs();this.mode='prac';this.nr()},

for(let i=0,n=1+(Math.random()*3|0);i<n;i++){const fl=Math.random()*8|0,c=rnd([s,e]),q=F[fl]+(2+(Math.random()*6|0));if(!used.has(fl)&&!u.has(q)&&q[1]!=String(rO)&&pawnOk(P,q,c))put(q,c+'P')}
const ok=freeSq(u,q=>(s==='w'?+q[1]<rO:+q[1]>rO)&&!atk(P,e).has(q));if(!ok)return 0;put(ok,s+'K');
const ek=freeSq(u,q=>(s==='w'?+q[1]>rO:+q[1]<rO)&&cdist(q,ok)>1&&!atk(P,s).has(q));if(!ek)return 0;put(ek,e+'K');

if(type==='simple'||type==='decoy'){const Q={...P};delete Q[F[f]+pr];delete Q[F[bf]+rO];Q[tg]=s+'P';if(atk(Q,e).has(ok))return 0}
Object.assign(this,{s,e,dir,rO,rp,f,bf,bf2,type,pq:F[f]+pr,fw,tg,valid:type==='simple'||type==='decoy',sel:0,lm});
S.pc=P;S.flip=false;S.ar=[[lm[0],lm[1],'#e08a00']];S.co='edge';S.an={};
const En=e==='b'?'Black':'White',Ow=s==='w'?'White':'Black',x=F[bf],dbl=`${x}${rO+2*dir}–${x}${rO}`,ic=s==='w'?'⚪':'⚫',R5=s==='w'?'5th':'4th';

p(){const s=this.step;return `<div class="g2">${B('md','prac','🎯 Practice',this.mode==='prac')}${B('md','quiz','❓ Quiz',this.mode==='quiz')}</div>${MSG(this.msg)}${s===1?`<div class="g2">${B('yn','y','✅ Yes')}${B('yn','n','❌ No')}</div>`:''}${s===2?'<div class="mu c">Tap your pawn to see its moves.</div>':''}${s===3?'<div class="mu c">⏭ Next position loads automatically…</div>'+B('s',0,'Next ▶',0,'p w'):B('s',0,'🎲 New position',0,'w')}<ul class="t"><li>Your pawn must stand on its <b>5th rank</b> (4th rank for Black).</li><li>The enemy pawn must have just moved <b>two squares</b> and landed right beside yours.</li><li>You must capture <b>immediately</b> — on the very next move, or the chance is gone.</li><li>Your pawn lands on the square <b>behind</b> the enemy pawn, which is removed. Notation: exd6 e.p.</li></ul>`},
a(a,v){if(a==='md'){this.mode=v;return this.nr()}if(a==='s')return this.nr();
if(a==='yn'&&this.step===1){const y=v==='y';if(y===this.valid){hit(1);if(this.valid){this.step=2;this.msg='✅ Yes! '+this.yes+' Now play it: tap your pawn, then the square it lands on.'}else{this.step=3;this.msg='✅ '+this.why}}

{n:'11 · Pawn Promotion',d:'Reach the last rank and your pawn becomes a stronger piece! White and Black positions.',sc:1,
i(){rs();this.mode='prac';this.nr()},
nr(){clearTimeout(nt);for(let n=0;n<400&&!this.build(n>300);n++);this.mv()},
auto(ms){later(()=>{if(M===this)this.nr()},ms)},
build(easy){const quiz=this.mode==='quiz',s=rnd('wb'),e=s==='w'?'b':'w',rp=s==='w'?7:2,lr=s==='w'?8:1;
const type=quiz&&!easy?rnd(['goal','goal','capture','check']):'goal',f=Math.random()*8|0,pq=F[f]+rp,fw=F[f]+lr,dg=[-1,1].map(x=>sqa(f+x,lr)).filter(Boolean);
const P={[pq]:s+'P'},u=new Set([pq,...dg]),put=(q,c)=>{P[q]=c;u.add(q)};let tg=[];

else{const blocked=type==='capture'?false:Math.random()<.25;let caps=dg.filter(()=>Math.random()<.6);
if((blocked||type==='capture')&&!caps.length)caps=[rnd(dg)];
if(blocked)put(fw,e+rnd(['R','N','B','Q']));else{tg.push(fw);u.add(fw)}

for(let i=0,n=Math.random()*3|0;i<n;i++){const c=rnd([s,e]),t=rnd(c===s?['R','B','N']:['R','B','N','P']),q=freeSq(u,q=>t!=='P'||pawnOk(P,q,c));if(q)put(q,c+t)}
const ok=freeSq(u,q=>(s==='w'?+q[1]<=5:+q[1]>=4)&&!atk(P,e).has(q));if(!ok)return 0;put(ok,s+'K');
const ek=freeSq(u,q=>(s==='w'?+q[1]>=6:+q[1]<=3)&&cdist(q,ok)>1&&!atk(P,s).has(q));if(!ek)return 0;put(ek,e+'K');
if(atk(P,e).has(ok))return 0;
for(const q of tg){const Q={...P};delete Q[pq];Q[q]=s+'P';if(atk(Q,e).has(ok))return 0}
const gives=(t,d)=>{const Q={...P};delete Q[pq];Q[d]=s+t;return atk(Q,s).has(ek)};
let good=null;if(type==='check'){const g=[...'QRBN'].filter(t=>gives(t,fw));if(g.length<1||g.length>3)return 0;good=g}
const goal=rnd([...'QRBN']),Ow=s==='w'?'White':'Black',ic=s==='w'?'⚪':'⚫';
Object.assign(this,{s,e,pq,tg,ek,type,goal,good,f,step:1,sel:0,lm:null,dest:null});S.pc=P;S.flip=false;S.ar=[];S.co='edge';S.an={};
this.msg=`${ic} ${Ow} to move${s==='b'?' (Black pawns move down)':''}. `+(!quiz?'Push the pawn or capture diagonally to reach the last rank, then choose any piece.':type==='goal'?`Task: promote to a ${NM[goal]}.`:type==='capture'?`Task: capture an enemy piece and promote to a ${NM[goal]}.`:'Task: promote so the new piece gives CHECK to the enemy king!');
return 1},
mv(){S.mk={};const add=(x,c)=>S.mk[x]=(S.mk[x]||'')+' '+c;(this.lm||[]).forEach(x=>add(x,'lm'));
if(this.step===1&&this.sel){add(this.pq,'sel');this.tg.forEach(x=>add(x,S.pc[x]?'cap':'dot'))}go()},
