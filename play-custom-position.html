function boardFlipForColor(){ if(customAnalysisMode) return analysisFlip; return myColor === 'b'; }
function drawBoard(){
  const board = document.getElementById('board');
  board.innerHTML = '';
  const flip = boardFlipForColor();
  const hist=getDisplayHistory();
  const boardGame=getDisplayChess(hist);
  const interactive = (viewPly===null || viewPly===undefined);
  const legalMoves = interactive && selected ? chess.moves({square:selected, verbose:true}) : [];
  const targets = {}; legalMoves.forEach(m => targets[m.to] = m);

  const SVGNS = 'http://www.w3.org/2000/svg';
  for(let r=0;r<8;r++){
    for(let f=0;f<8;f++){
      const rankIdx = flip ? r : 7-r;
      const fileIdx = flip ? 7-f : f;
      const sq = squareName(fileIdx, rankIdx);
      const piece = boardGame.get(sq);
      const div = document.createElement('div');
      div.className = 'sq ' + (((rankIdx+fileIdx)%2===0) ? 'dark' : 'light');
      if(lastMoveSquares.from === sq) div.className += ' last-from';
      if(lastMoveSquares.to === sq) div.className += ' last-to';
      if(selected === sq) div.className += ' sel';
      if(targets[sq]) div.className += targets[sq].captured ? ' move capture' : ' move';
      if(piece){
        const img = document.createElement('img');
        img.className = 'piece ' + (piece.color === 'w' ? 'piece-w' : 'piece-b');
        img.alt = '';
        img.draggable = false;
        img.src = 'https://lichess1.org/assets/piece/cburnett/' + piece.color + piece.type.toUpperCase() + '.svg';
        div.appendChild(img);
      }
      if(r === 7){ const fc = document.createElement('span'); fc.className='coord file'; fc.textContent='abcdefgh'[fileIdx]; div.appendChild(fc); }
      if(f === 7){ const rc = document.createElement('span'); rc.className='coord rank'; rc.textContent=rankIdx+1; div.appendChild(rc); }
      div.onclick = () => { if(board.__suppressNextClick){ board.__suppressNextClick=false; return; } clearBoardAnnotations(); if(viewPly!==null && viewPly!==undefined){ return; } onSquareClick(sq); }
      board.appendChild(div);
    }
  }
  renderArrowLayer(board, flip);
  bindArrowDrawing(board, flip);
}

function squareCenterForDisplay(sq, flip){
  const file = 'abcdefgh'.indexOf(sq[0]);
  const rank = Number(sq[1]) - 1;
  const col = flip ? 7 - file : file;
  const row = flip ? rank : 7 - rank;
  return {x: col + 0.5, y: row + 0.5};
}

function arrowColor(key){
  return ({g:'#15781b',r:'#882020',b:'#003088',y:'#e68f00'}[key]||'#15781b');
}
function arrowShape(from,to,colorKey,preview=false){
  if(!from||!to) return '';
  const p1=squareCenterForDisplay(from,currentArrowFlip), p2=squareCenterForDisplay(to,currentArrowFlip);
  const dx=p2.x-p1.x,dy=p2.y-p1.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
  const col=arrowColor(colorKey),head=.30,hw=.145;
  if(from===to){
    return `<circle class="arrow-circle${preview?' arrow-preview':''}" cx="${p1.x}" cy="${p1.y}" r=".39" stroke="${col}"/>`;
  }
  const endX=p2.x-ux*.20,endY=p2.y-uy*.20;
  const bx=p2.x-ux*head,by=p2.y-uy*head;
  const px=-uy,py=ux;
  const pts=`${p2.x},${p2.y} ${bx+px*hw},${by+py*hw} ${bx-px*hw},${by-py*hw}`;
  return `<g class="${preview?'arrow-preview':''}"><line class="arrow-line" x1="${p1.x+ux*.10}" y1="${p1.y+uy*.10}" x2="${endX}" y2="${endY}" stroke="${col}"/><polygon class="arrow-head" fill="${col}" points="${pts}"/></g>`;
}
let currentArrowFlip=false;
function renderArrowLayer(board, flip){
  const old=board.querySelector('.arrow-layer');
  if(old) old.remove();
  currentArrowFlip=flip;
  if(!boardArrows.length && !boardCircles.length && !arrowDrag) return;
  const ns='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(ns,'svg');
  svg.setAttribute('class','arrow-layer');svg.setAttribute('viewBox','0 0 8 8');svg.setAttribute('preserveAspectRatio','none');
  boardArrows.forEach(a=>{
    const from=a.from||a.f,to=a.to||a.t,c=a.color||a.c||'g';
    if(from&&to) svg.insertAdjacentHTML('beforeend',arrowShape(from,to,c));
  });
  boardCircles.forEach(sq=>svg.insertAdjacentHTML('beforeend',arrowShape(sq,sq,'g')));
  if(arrowDrag && arrowDrag.from && arrowDrag.to){
    svg.insertAdjacentHTML('beforeend',arrowShape(arrowDrag.from,arrowDrag.to,arrowDrag.color||'g',true));
  }
  board.appendChild(svg);
}
function squareFromPointer(board,ev,flip){
  const r=board.getBoundingClientRect();
  const col=Math.max(0,Math.min(7,Math.floor((ev.clientX-r.left)/r.width*8)));
  const row=Math.max(0,Math.min(7,Math.floor((ev.clientY-r.top)/r.height*8)));
  return squareName(flip?7-col:col,flip?row:7-row);
}
function toggleBoardArrow(from,to,color){
  if(!from||!to||from===to)return;
  const c=color||'g';
  const idx=boardArrows.findIndex(a=>(a.from===from&&a.to===to)||(a.from===to&&a.to===from));
  if(idx>=0) boardArrows.splice(idx,1);
  else boardArrows.push({from,to,color:c});
}
function toggleBoardCircle(square){
  if(!square)return;
  const i=boardCircles.indexOf(square);
  if(i>=0) boardCircles.splice(i,1); else boardCircles.push(square);
}
function bindArrowDrawing(board,flip){
  if(board.__arrowBound) return;
  board.__arrowBound=true;
  board.addEventListener('contextmenu',e=>e.preventDefault());
  const finish=(e,cancel=false)=>{
    clearTimeout(arrowLongPressTimer);
    if(!arrowDrag || arrowDrag.pointerId!==e.pointerId)return;
    e.preventDefault();
    const d=arrowDrag;arrowDrag=null;board.classList.remove('arrow-drawing');board.classList.remove('arrow-mode');
    if(!cancel){
      const q=squareFromPointer(board,e,boardFlipForColor()); if(q)d.to=q;
      if(d.to===d.from) toggleBoardCircle(d.from);
      else if(d.to) toggleBoardArrow(d.from,d.to,d.color);
      if(d.touch) board.__suppressNextClick=true;
    }
    renderArrowLayer(board,boardFlipForColor());
  };
  board.addEventListener('pointerdown',e=>{
    const right=e.pointerType==='mouse'&&e.button===2;
    if(right){
      e.preventDefault();
      const q=squareFromPointer(board,e,boardFlipForColor()); if(!q)return;
      arrowDrag={pointerId:e.pointerId,from:q,to:q,color:e.shiftKey?'r':(e.altKey||e.ctrlKey||e.metaKey?'b':'g'),touch:false};
      board.classList.add('arrow-drawing');
      try{board.setPointerCapture(e.pointerId);}catch(x){}
      renderArrowLayer(board,boardFlipForColor()); return;
    }
    if(e.pointerType==='touch'){
      clearTimeout(arrowLongPressTimer);
      const q=squareFromPointer(board,e,boardFlipForColor()); if(!q)return;
      arrowLongPressTimer=setTimeout(()=>{
        arrowDrag={pointerId:e.pointerId,from:q,to:q,color:'g',touch:true};
        board.classList.add('arrow-mode','arrow-drawing');
        try{board.setPointerCapture(e.pointerId);}catch(x){}
        renderArrowLayer(board,boardFlipForColor());
      },320);
    }
  },{passive:false});
  board.addEventListener('pointermove',e=>{
    if(!arrowDrag||arrowDrag.pointerId!==e.pointerId)return;
    e.preventDefault();
    const q=squareFromPointer(board,e,boardFlipForColor());if(q&&q!==arrowDrag.to){arrowDrag.to=q;if(!board.__raf){ board.__raf=requestAnimationFrame(()=>{ board.__raf=0; renderArrowLayer(board,boardFlipForColor()); }); }}
  },{passive:false});
  board.addEventListener('pointerup',e=>finish(e,false),{passive:false});
  board.addEventListener('pointercancel',e=>finish(e,true),{passive:false});
  board.addEventListener('pointerleave',e=>{
    if(arrowDrag&&arrowDrag.pointerId===e.pointerId&&e.pointerType==='mouse'){
      // Keep the gesture alive under pointer capture; do not cancel while dragging.
    }
  });
}
function startCustomAnalysis(fen){
  cleanup();
  customAnalysisMode=true;
  customPositionFen=fen;
  analysisRedo=[]; analysisFlip=false;
  chess=makeChess();
  myColor=null; viewPly=null; selected=null; resetGameState();
  renderCustomAnalysis();
}
function copyText(txt, btn){
  const done=()=>{ if(btn){ const o=btn.textContent; btn.textContent='Copied ✓'; setTimeout(()=>btn.textContent=o,1200); } };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done).catch(()=>fallback()); } else fallback();
  function fallback(){ const t=document.createElement('textarea'); t.value=txt; document.body.appendChild(t); t.select(); try{ document.execCommand('copy'); done(); }catch(e){} t.remove(); }
}
function leaveAnalysis(){ customAnalysisMode=false; renderLobby(); }
function analysisUndo(){
  const m=chess.undo(); if(!m) return;
  analysisRedo.push({from:m.from,to:m.to,promotion:m.promotion});
  const h=chess.history({verbose:true}), l=h[h.length-1];
  lastMoveSquares=l?{from:l.from,to:l.to}:{from:null,to:null};
  selected=null; renderCustomAnalysis();
}
function analysisForward(){
  const n=analysisRedo.pop(); if(!n) return;
  const m=chess.move(n); if(!m) return;
  lastMoveSquares={from:m.from,to:m.to}; selected=null; renderCustomAnalysis();
}

function anGoto(p){
  let h=chess.history().length;
  while(h>p){ const m=chess.undo(); if(!m) break; analysisRedo.push({from:m.from,to:m.to,promotion:m.promotion}); h--; }
  while(h<p&&analysisRedo.length){ const m=chess.move(analysisRedo.pop()); if(!m) break; h++; }
  const hh=chess.history({verbose:true}), l=hh[hh.length-1];
  lastMoveSquares=l?{from:l.from,to:l.to}:{from:null,to:null};
  selected=null; renderCustomAnalysis();
}
function renderCustomAnalysis(){
  const hist=chess.history({verbose:true});
  const result=getGameResult();
  const turn=chess.turn();
  const ni=notationInfo(), off=ni.blackFirst?1:0;
  const rows=[]; const sans=hist.map(h=>h.san);
  if(analysisRedo.length){ const tmp=new Chess(chess.fen()); for(let k=analysisRedo.length-1;k>=0;k--){ const mv=tmp.move(analysisRedo[k]); if(!mv) break; sans.push(mv.san); } }
  const cell=k=>k<0?'<span class="move-cell">…</span>':k<sans.length?`<span class="move-cell${k>=hist.length?' fut':''}${k===hist.length-1?' cur':''}" data-ply="${k+1}">${esc(sans[k])}</span>`:'<span class="move-cell"></span>';
  for(let i=-off;i<sans.length;i+=2){ rows.push(`<div class="move-row"><span class="move-no">${ni.startNo+Math.floor((i+off)/2)}.</span>${cell(i)}${cell(i+1)}</div>`); }
  const statusText = chess.in_checkmate() ? 'Checkmate — '+(turn==='w'?'Black':'White')+' wins.'
    : result ? drawReason(chess)+'.'
    : (turn==='w'?'White':'Black')+' to move'+(chess.in_check()?' — check!':'.');
  content.innerHTML=`
  <div class="game-app">
    <div class="game-topbar">
      <div class="brand"><img class="brand-logo" src="${MYCHESS64_ICON}" alt="MyChess64"><span class="brand-name">MyChess64</span></div>
      <div class="top-actions"><span class="status-chip"><span class="connection-dot connected"></span>Analysis Board</span><button class="icon-btn" id="analysisThemeBtn" title="Light / Dark">◐</button><button class="secondary" id="analysisLeaveBtn">← Home</button></div>
    </div>
    <div class="game-layout">
      <div class="board-zone"><div id="board"></div></div>
      <aside class="side-panel">
        <div class="players-panel">
          <div class="player-row ${turn==='w'?'active':''}"><div><div class="player-name">White</div><div class="player-meta">WHITE</div></div><div class="clock">—</div></div>
          <div class="player-row ${turn==='b'?'active':''}"><div><div class="player-name">Black</div><div class="player-meta">BLACK</div></div><div class="clock">—</div></div>
        </div>
        <div class="an-status">${esc(statusText)}</div>
        ${result?`<div class="result-card"><div class="result-kicker">Position Result</div><div class="result-main">${result==='1-0'?'White Wins':result==='0-1'?'Black Wins':'Draw'} · ${result}</div><div class="result-reason">${esc(chess.in_checkmate()?'Checkmate':drawReason(chess))}</div></div>`:''}
        <div class="notation-wrap"><div class="notation-columns"><span></span><span>White</span><span>Black</span></div><div class="notation" id="notation">${rows.length?rows.join(''):'<div class="hint" style="padding:10px">No moves yet. Tap a piece, then a highlighted square.</div>'}</div></div>
        <div class="controls">
          <input class="an-fen" id="anFen" readonly value="${esc(chess.fen())}" aria-label="Current FEN">
          <div class="an-actions">
            <button class="ghost" id="anUndo" ${hist.length?'':'disabled'}>◀ Back</button>
            <button class="ghost" id="anRedo" ${analysisRedo.length?'':'disabled'}>Forward ▶</button>
            <button class="ghost" id="anFirst" ${hist.length?'':'disabled'} title="Start (↑)">⏮ Start</button>
            <button class="ghost" id="anLast" ${analysisRedo.length?'':'disabled'} title="End (↓)">End ⏭</button>
            <button class="ghost" id="anFlip">⇅ Flip Board</button>
            <button class="ghost" id="anCopy">Copy FEN</button>
            <button class="ghost" id="anPaste" style="grid-column:1/-1">Paste FEN…</button>
            <button class="ghost" id="analysisResetBtn">Reset Position</button>
            <button class="secondary" id="analysisExitBtn">Edit Position</button>
          </div>
          <div class="hint cp2-keys" style="margin-top:8px"><b>← →</b> step through moves · <b>↑ ↓</b> start / end · <b>F</b> flip<br>Right-click &amp; drag: arrows · Right-click a square: circle · Click anywhere: clear<br>Play a different move from any point to replace the line.</div>
        </div>
      </aside>
    </div>
  </div>`;
  document.getElementById('analysisThemeBtn').onclick=toggleTheme;
  document.getElementById('analysisLeaveBtn').onclick=leaveAnalysis;
  document.getElementById('analysisExitBtn').onclick=()=>{ lastCustomFenText=chess.fen(); leaveAnalysis(); };
  document.getElementById('anUndo').onclick=analysisUndo;
  document.getElementById('anRedo').onclick=analysisForward;
  document.getElementById('anFirst').onclick=()=>anGoto(0);
  document.getElementById('anLast').onclick=()=>anGoto(1e9);
  document.querySelectorAll('#notation [data-ply]').forEach(c=>c.onclick=()=>anGoto(+c.dataset.ply));
  document.getElementById('anFen').onclick=e=>e.target.select();
  document.getElementById('anFlip').onclick=()=>{ analysisFlip=!analysisFlip; selected=null; drawBoard(); };
  document.getElementById('anCopy').onclick=(e)=>copyText(chess.fen(), e.currentTarget);
  document.getElementById('anPaste').onclick=()=>askFen(f=>{ lastCustomFenText=f; startCustomAnalysis(f); },{title:'Paste FEN',note:'Loads this position on the analysis board and clears the current moves.'});
  document.getElementById('analysisResetBtn').onclick=()=>{chess=makeChess();analysisRedo=[];selected=null;lastMoveSquares={from:null,to:null};resetGameState();renderCustomAnalysis();};
  const nt=document.getElementById('notation'); if(nt) nt.scrollTop=nt.scrollHeight;
  drawBoard();
}

function onSquareClick(sq){
  clearBoardAnnotations();
  const legalFor=(from,to)=>chess.moves({square:from,verbose:true}).find(m=>m.to===to);
  const unselect=()=>{ selected=null; drawBoard(); };
  if(customAnalysisMode){
    if(getGameResult()) return;
    const piece=chess.get(sq);
    if(selected){
      if(sq===selected){ unselect(); return; }
      const found=legalFor(selected,sq);
      if(found){
        const from=selected;
        const go=(promo)=>{
          const mv=chess.move({from,to:sq,promotion:promo});
          if(!mv){ unselect(); return; }
          analysisRedo=[]; lastMoveSquares={from,to:sq}; selected=null; renderCustomAnalysis();
        };
        if(found.flags.indexOf('p')>=0) showPromotionPicker(chess.turn(), go, unselect); else go(undefined);
        return;
      }
      if(piece && piece.color===chess.turn()){ selected=sq; drawBoard(); return; }
      unselect(); return;
    }
    if(piece && piece.color===chess.turn()){ selected=sq; drawBoard(); }
    return;
  }
  if(!myColor || clockWinner || getGameResult() || chess.turn() !== myColor) return;
  if(clockPreset!=='off' && clockState.running && clockState.active===myColor && clockMs(myColor)<=0) return;
  const piece = chess.get(sq);
  if(selected){
    if(sq === selected){ unselect(); return; }
    const found = legalFor(selected, sq);
    if(found){
      const fromSq = selected, toSq = sq;
      const go=(promo)=>{
        // Re-validate: the position may have changed while the picker was open.
        if(chess.turn()!==myColor || getGameResult() || !legalFor(fromSq,toSq)){ unselect(); return; }
        const mover=chess.turn();
        if(isHost){
          saveMoveSnapshot();
          chess.move({from:fromSq,to:toSq,promotion:promo});
          drawOfferBy=null; takebackOfferBy=null;
          selected=null; startClockAfterMove(mover); hostSync();
        } else {
          const moveResult=chess.move({from:fromSq,to:toSq,promotion:promo});
          pendingGuestMove=moveResult;
          drawOfferBy=null; takebackOfferBy=null;
          viewPly=null; selected=null; renderGame();
          sendGuestCommand({type:'move',from:fromSq,to:toSq,promotion:promo});
        }
      };
      if(found.flags.indexOf('p')>=0) showPromotionPicker(chess.turn(), go, unselect); else go(undefined);
      return;
    }
    if(piece && piece.color===myColor){ selected=sq; drawBoard(); return; }
    unselect(); return;
  } else {
    if(piece && piece.color===myColor){ selected=sq; drawBoard(); }
  }
}

// Mobile browser lifecycle recovery. Android may suspend Chrome and leave a
// PeerJS DataConnection object looking open even though the WebRTC channel is
// no longer carrying packets.  Recovery therefore uses a real ping/pong
// liveness probe and forcibly replaces a stale connection when the probe times out.
let guestHeartbeatTimer = null;
let guestPongTimer = null;
let guestPendingPingId = null;
let guestPingSequence = 0;
let guestReconnectInProgress = false;

function clearGuestLivenessTimer(){
  if(guestPongTimer){ clearTimeout(guestPongTimer); guestPongTimer=null; }
  guestPendingPingId=null;
}

function forceGuestReconnect(reason){
  if(isHost || !peer || !roomCode || getGameResult()) return;
  if(guestReconnectInProgress) return;
  guestReconnectInProgress=true;
  clearGuestLivenessTimer();
  if(guestReconnectTimer){ clearTimeout(guestReconnectTimer); guestReconnectTimer=null; }
  markConnectionRecovering();

  const stale=hostConn;
  hostConn=null;
  guestConnectInProgress=false;
  if(stale){ try{ stale.close(); }catch(e){} }

  const connectNow=()=>{
    guestReconnectInProgress=false;
    if(!peer || !roomCode || getGameResult()) return;
    connectGuestToHost();
  };

  if(peer && peer.disconnected){
    try{ peer.reconnect(); }catch(e){}
    setTimeout(connectNow,1200);
  }else{
    setTimeout(connectNow,150);
  }
}

function probeGuestConnection(){
  if(isHost || !peer || !roomCode || getGameResult()) return;
  if(document.visibilityState !== 'visible') return;

  if(!hostConn || !hostConn.open){
    forceGuestReconnect('no-open-connection');
    return;
  }

  clearGuestLivenessTimer();
  const pingId='p'+Date.now().toString(36)+'-'+(++guestPingSequence);
  guestPendingPingId=pingId;
  try{
    hostConn.send({type:'ping',at:Date.now(),pingId});
  }catch(e){
    forceGuestReconnect('ping-send-failed');
    return;
  }

  // Android/Chrome can leave .open=true on a stale channel. If no matching
  // pong arrives, replace that channel instead of waiting indefinitely.
  guestPongTimer=setTimeout(()=>{
    guestPongTimer=null;
    if(guestPendingPingId!==pingId) return;
    guestPendingPingId=null;
    if(document.visibilityState==='visible') forceGuestReconnect('pong-timeout');
  },3000);
}

function ensureGuestConnection(){
  if(isHost || !peer || !roomCode) return;
  if(document.visibilityState !== 'visible') return;
  probeGuestConnection();
}

function startGuestHeartbeat(){
  if(guestHeartbeatTimer || isHost) return;
  guestHeartbeatTimer=setInterval(()=>{
    if(document.visibilityState==='hidden') return;
    probeGuestConnection();
  },8000);
}

window.addEventListener('offline',()=>{ if(!getGameResult()){ clearGuestLivenessTimer(); markConnectionRecovering(); } });
window.addEventListener('online',()=>{
  if(isHost){
    try{ if(peer && peer.disconnected) peer.reconnect(); }catch(e){}
  }else{
    forceGuestReconnect('network-online');
  }
});
window.addEventListener('pageshow',()=>{
  clearReconnectGrace();
  if(isHost){
    if(peer && peer.disconnected){ try{ peer.reconnect(); }catch(e){} }
    renderGame();
  }else{
    // pageshow is a strong wake/resume signal on mobile browsers. Never trust
    // a pre-suspension .open flag here; perform a real liveness probe.
    ensureGuestConnection();
  }
});
window.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){
    clearReconnectGrace();
    if(isHost){
      try{ if(peer && peer.disconnected) peer.reconnect(); }catch(e){}
      renderGame();
    }else{
      // Force a fresh connection after a background/foreground cycle. This
      // avoids the stale-WebRTC-channel state that previously blocked moves.
      forceGuestReconnect('browser-resume');
    }
  }
});
window.addEventListener('beforeunload',()=>{
  if(guestHeartbeatTimer) clearInterval(guestHeartbeatTimer);
  clearGuestLivenessTimer();
});

loadTheme();
document.addEventListener('keydown',ev=>{
  if(ev.ctrlKey||ev.metaKey||ev.altKey) return;
  if(ev.target&&ev.target.closest&&ev.target.closest('input,textarea,select,[contenteditable],.cp2-modal')) return;
  const k=ev.key;
  if(customAnalysisMode){
    if(k==='ArrowLeft') analysisUndo();
    else if(k==='ArrowRight') analysisForward();
    else if(k==='ArrowUp'||k==='Home') anGoto(0);
    else if(k==='ArrowDown'||k==='End') anGoto(1e9);
    else if(k==='f'||k==='F'){ analysisFlip=!analysisFlip; selected=null; drawBoard(); }
    else return;
    ev.preventDefault(); return;
  }
  const id={ArrowLeft:'navPrev',ArrowRight:'navNext',ArrowUp:'navStart',Home:'navStart',ArrowDown:'navLast',End:'navLast'}[k];
  const btn=id&&document.getElementById(id); if(btn){ ev.preventDefault(); btn.click(); }
});
if(!restoreActiveSession()) renderLobby();
