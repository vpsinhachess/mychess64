<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1d33">
<meta name="description" content="MyChess64 — a simple browser-based online chess platform for playing live chess with a friend.">
<meta name="application-name" content="MyChess64">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:type" content="website">
<meta property="og:title" content="MyChess64 — Play Chess Online">
<meta property="og:description" content="Play live chess with a friend using MyChess64.">
<title>MyChess64 — Play Chess Online</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%230b1d33%27/%3E%3Cpath d=%27M20 50h24M24 46l2-16h12l2 16M28 30V22h8v8M26 22h12M32 14v8%27 fill=%27none%27 stroke=%27white%27 stroke-width=%275%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#f4f7fb; --panel:#ffffff; --panel2:#f7f9fc; --text:#10253e; --muted:#66758a;
  --accent:#0969e8; --accent2:#0b7a75; --border:#d9e2ec;
  --sq-light:#f0d9b5; --sq-dark:#b58863; --sq-sel:#f6d365; --sq-move:#5b9f55;
  --danger:#c44343; --clock:#0b1d33;
}
body.dark-theme{
  --bg:#0b1220; --panel:#111b2d; --panel2:#162238; --text:#edf4ff; --muted:#9fb0c5;
  --accent:#2f82ff; --accent2:#2fb6a7; --border:#263850;
  --sq-light:#e8cda0; --sq-dark:#9c6b45; --sq-sel:#e0b74a; --sq-move:#5fae63;
  --clock:#07101d;
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
html,body{width:100%;height:100%;margin:0;overflow:hidden;}
body{background:radial-gradient(circle at top,#eef5ff 0,#f4f7fb 45%,#edf2f8 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:background .2s,color .2s;}
button,input,select{font:inherit;}
button{cursor:pointer;}
.wrap{width:100%;height:100%;padding:0;margin:0;max-width:none;}
body:not(:has(.game-app)) .wrap{display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto;min-height:100dvh;}
body:not(:has(.game-app)) .wrap>.card,body:not(:has(.game-app)) #content>.card{max-width:720px;width:100%;}
body:not(:has(.game-app)) #content>.card{padding:30px 30px 24px;box-shadow:0 18px 55px rgba(14,40,70,.12);border-color:#dbe5f0;}
body:not(:has(.game-app)) .lobby-card{max-width:560px;padding:30px 32px 22px;}
.lobby-card .tabs{margin-bottom:18px;}
.lobby-intro{text-align:center;margin:-4px 0 20px;}
.lobby-title{font-size:clamp(1.35rem,3vw,1.7rem);font-weight:900;letter-spacing:-.03em;color:#09223d;margin:0 0 5px;}
.lobby-subtitle{font-size:.9rem;color:var(--muted);line-height:1.5;margin:0 auto;max-width:430px;}
.lobby-section{background:linear-gradient(180deg,#fbfdff,#f5f8fc);border:1px solid #e0e8f1;border-radius:14px;padding:16px;}
.lobby-section label{font-weight:800;color:#344a61;margin-bottom:6px;}
.lobby-section input{min-height:46px;margin-bottom:14px;font-size:.96rem;}
.lobby-actions{display:grid;grid-template-columns:1fr;gap:8px;margin-top:2px;}
.lobby-actions button{width:100%;margin:0;min-height:46px;font-size:.95rem;}
.lobby-hint{display:flex;gap:7px;align-items:flex-start;font-size:.76rem;color:var(--muted);line-height:1.45;margin-top:10px;}
.lobby-hint::before{content:'ⓘ';font-size:.8rem;flex:0 0 auto;}
.color-row{margin-bottom:12px;}
.color-btn{min-height:42px;}
.waiting-card{text-align:center;}
.waiting-card .code-badge{font-size:1.25rem;letter-spacing:4px;padding:9px 15px;margin:5px 0 4px;}
.waiting-title{font-size:1.25rem;font-weight:900;margin:0 0 5px;color:#09223d;}
.waiting-subtitle{margin:0 0 16px;color:var(--muted);font-size:.86rem;line-height:1.45;}
.share-row{display:grid;grid-template-columns:1fr auto;gap:7px;margin:10px 0 8px;}
.share-row input{margin:0;min-width:0;font-size:.8rem;}
.share-row button{margin:0;min-height:42px;white-space:nowrap;}
.connection-card{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px;border-radius:9px;background:#f4f8fd;border:1px solid #dbe6f1;color:#41566d;font-size:.8rem;margin:10px 0;}
.connection-dot{width:8px;height:8px;border-radius:50%;background:#d99a18;box-shadow:0 0 0 4px rgba(217,154,24,.12);}
.connection-dot.connected{background:#2b9a58;box-shadow:0 0 0 4px rgba(43,154,88,.12);}
.connection-dot.error{background:#c44343;box-shadow:0 0 0 4px rgba(196,67,67,.12);}
.status-chip{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;color:var(--muted);padding:5px 8px;border:1px solid var(--border);border-radius:999px;background:var(--panel2);white-space:nowrap;}
.status-chip .connection-dot{width:7px;height:7px;box-shadow:none;}
.result-card{margin:6px 10px 0;padding:9px 10px;border:1px solid #d7e2ec;border-radius:10px;background:linear-gradient(180deg,#fbfdff,#f3f7fb);text-align:center;}
.result-kicker{font-size:.67rem;letter-spacing:.12em;text-transform:uppercase;font-weight:900;color:var(--muted);}
.result-main{font-size:1.08rem;font-weight:900;color:#09223d;margin-top:3px;}
.result-reason{font-size:.72rem;color:var(--muted);margin-top:3px;}
body.dark-theme .lobby-section{background:linear-gradient(180deg,#142238,#111b2d);border-color:#2a3b54;}
body.dark-theme .lobby-title,body.dark-theme .waiting-title,body.dark-theme .result-main{color:var(--text);}
body.dark-theme .lobby-section label{color:#d6e2f0;}
body.dark-theme .connection-card{background:#132137;border-color:#2a3b54;color:#b7c7d9;}
body.dark-theme .result-card{background:linear-gradient(180deg,#142238,#101a2b);border-color:#2a3b54;}

body:has(.game-app) #content{height:100%;}
body:has(.game-app) .wrap{height:100%;}
h1,.sub{display:none;}
.card{background:rgba(255,255,255,.97);border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,.08);}
.lobby-brand{text-align:center;margin-bottom:20px;}
.lobby-brand-logo{width:190px;height:126px;object-fit:contain;display:block;margin:0 auto 2px;}
.lobby-brand-name,.lobby-tagline{display:none;}
.brand-note{margin-top:18px;padding-top:14px;border-top:1px solid var(--border);text-align:center;font-size:.92rem;line-height:1.5;color:#5e6f83;}
.brand-note strong{color:#09223d;font-weight:900;}
.brand-note strong:first-child{font-size:1.08rem;letter-spacing:.01em;}
.brand-note strong:last-child{font-size:1rem;}

label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px;}
input,select{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--border);background:var(--panel2);color:var(--text);margin-bottom:12px;}
button{font-size:.9rem;padding:10px 14px;border-radius:9px;border:0;background:linear-gradient(135deg,#0869e8,#0757c9);color:#fff;margin-right:6px;margin-bottom:6px;box-shadow:0 4px 10px rgba(9,105,232,.16);font-weight:700;}
button.secondary{background:#eef5ff;color:#075fcf;border:1px solid #a9c9f3;box-shadow:none;}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--border);box-shadow:none;}
button.icon-btn{width:38px;height:38px;padding:0;margin:0;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--panel);color:var(--text);box-shadow:none;}
button:disabled{opacity:.45;cursor:default;}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(9,105,232,.11);}
button:focus-visible,.tab:focus-visible{outline:3px solid rgba(9,105,232,.25);outline-offset:2px;}

.tabs{display:flex;gap:8px;margin-bottom:20px;background:#f2f6fb;padding:5px;border-radius:12px;width:100%;}
.tab{flex:1;min-width:0;text-align:center;padding:12px 10px;border-radius:9px;border:0;cursor:pointer;color:var(--muted);font-weight:800;white-space:nowrap;line-height:1.1;}
.tab.active{background:#0a68e8;color:#fff;border-color:#0a68e8;box-shadow:0 3px 9px rgba(10,104,232,.18);}
#hostBtn,#joinBtn{min-height:44px;padding:11px 18px;}
#hostBtn{background:linear-gradient(135deg,#123b67,#0a68e8);}
.color-row{display:flex;gap:8px;margin-bottom:14px;}
.color-btn{flex:1;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-weight:600;margin:0;}
.color-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.status{font-size:.92rem;margin:8px 0;min-height:1.3em;}
.hint{font-size:.78rem;color:var(--muted);}
.code-badge{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:1.05rem;letter-spacing:3px;background:var(--panel2);border:1px dashed var(--accent);padding:6px 11px;border-radius:8px;display:inline-block;}

/* Full-screen game layout */
.game-app{height:100dvh;width:100vw;display:grid;grid-template-rows:52px minmax(0,1fr);background:var(--bg);}
.game-topbar{display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--border);background:var(--panel);z-index:20;}
.brand{font-weight:900;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;color:#09223d;}
.brand-logo{width:40px;height:27px;object-fit:contain;display:block;}
.brand-mark{display:none;}
.brand-name{font-size:1.05rem;}
.top-actions{display:flex;align-items:center;gap:7px;}
.room-chip{font-size:.78rem;color:var(--muted);padding:6px 9px;border:1px solid var(--border);border-radius:7px;}
.game-layout{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:12px;padding:8px;}
.board-zone{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;}
#board{width:min(100%,calc(100dvh - 70px));height:auto;max-width:100%;max-height:calc(100dvh - 70px);aspect-ratio:1/1;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border-radius:2px;overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,.28);touch-action:manipulation;flex:0 0 auto;}
#board{position:relative;}
#board .arrow-layer{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none;overflow:visible;}
#board .arrow-line{fill:none;stroke-width:.16;stroke-linecap:round;stroke-linejoin:round;}
#board .arrow-head{stroke:none;}
#board .arrow-preview{opacity:.58;}
#board .arrow-preview .arrow-line{stroke-dasharray:.18 .12;}
#board .arrow-circle{fill:none;stroke-width:.085;opacity:.88;}
#board.arrow-mode{cursor:crosshair;}
#board.arrow-drawing{cursor:crosshair;}
#board .sq{z-index:1;}

.sq{display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;-webkit-user-select:none;position:relative;overflow:hidden;}
.sq.light{background:var(--sq-light)} .sq.dark{background:var(--sq-dark)}
.sq.sel{box-shadow:inset 0 0 0 4px rgba(246,211,101,.98);}
.sq.move::after{content:'';position:absolute;width:24%;height:24%;border-radius:50%;background:rgba(54,100,48,.72);z-index:1;}
.sq.move.capture::after{width:78%;height:78%;background:transparent;border:5px solid rgba(54,100,48,.72);border-radius:50%;}
.piece{width:100%;height:100%;object-fit:contain;position:relative;z-index:2;pointer-events:none;padding:3%;}
.piece-w,.piece-b{fill:initial;stroke:initial;}
.coord{position:absolute;font-size:clamp(9px,1.15vw,14px);line-height:1;font-weight:700;z-index:4;opacity:.9;text-shadow:0 1px 1px rgba(255,255,255,.12);pointer-events:none;}
.coord.rank{top:3px;right:4px}.coord.file{bottom:3px;left:4px}.light .coord{color:#a87851}.dark .coord{color:#f0d9b5}

.side-panel{min-width:0;min-height:0;height:100%;max-height:100%;background:var(--panel);border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 3px 18px rgba(0,0,0,.08);}
.players-panel{padding:10px;border-bottom:1px solid var(--border);display:grid;gap:7px;}
.player-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:8px 9px;border-radius:8px;background:var(--panel2);border:1px solid transparent;}
.player-row.active{border-color:var(--accent2);box-shadow:inset 3px 0 0 var(--accent2);}
.player-name{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.player-meta{font-size:.7rem;color:var(--muted);margin-top:2px;}
.clock{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:1.45rem;font-weight:800;letter-spacing:.02em;background:var(--clock);color:#fff;padding:5px 9px;border-radius:6px;min-width:92px;text-align:center;}
.clock.low{background:var(--danger);}
.game-info{padding:9px 10px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px;}
.turn-label{font-size:.78rem;color:var(--muted)}
.role-pill{font-size:.72rem;padding:4px 7px;border-radius:999px;background:var(--panel2);border:1px solid var(--border);}
.result-line{padding:8px 10px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:.78rem;}
.result-line strong{font-size:1.05rem;font-weight:900;letter-spacing:.02em;}
.notation-wrap{min-height:0;min-width:0;flex:1 1 auto;display:flex;flex-direction:column;overflow:hidden;}

.notation-columns{display:grid;grid-template-columns:38px 1fr 1fr;gap:4px;padding:5px 8px;border-bottom:1px solid var(--border);font-size:.68rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
.notation{min-height:0;min-width:0;overflow-y:auto;overflow-x:hidden;padding:6px 8px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem;scrollbar-width:thin;scroll-behavior:smooth;}
.notation::-webkit-scrollbar{width:8px;}
.notation::-webkit-scrollbar-thumb{background:#b7c4d2;border-radius:8px;}
.notation::-webkit-scrollbar-track{background:transparent;}
.move-row{display:grid;grid-template-columns:38px 1fr 1fr;gap:4px;padding:5px 4px;border-radius:5px;}
.move-row{cursor:pointer;user-select:none;}
.move-row:hover{background:rgba(47,126,234,.08);}
.move-row.review-current{background:rgba(47,126,234,.13);box-shadow:inset 3px 0 0 var(--accent2);}
.move-cell.current{background:rgba(111,75,47,.13);border-radius:4px;padding:2px 4px;}
.move-nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:7px;}
.move-nav button{width:100%;margin:0;padding:7px 5px;font-size:.74rem;}
.move-nav button:disabled{opacity:.45;cursor:not-allowed;}
.move-row:nth-child(odd){background:var(--panel2);}.move-no{color:var(--muted);cursor:pointer}.move-cell{font-weight:650;text-align:left;cursor:pointer;border-radius:4px;padding:2px 4px}.move-cell:hover{background:rgba(47,126,234,.10)}.move-cell.current{background:rgba(111,75,47,.13);border-radius:4px;padding:2px 4px;}
.controls{padding:9px 10px;border-top:1px solid var(--border);background:var(--panel);flex:0 0 auto;}
.control-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.control-grid button{width:100%;margin:0;padding:8px 7px;}
.clock-tools{display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center;margin-bottom:7px;}
.clock-tools select{margin:0;padding:8px;font-size:.78rem;}
.mini-status{font-size:.7rem;color:var(--muted);margin-top:6px;}
.game-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px;}
.game-actions button{width:100%;margin:0;padding:8px 7px;}
.draw-offer{padding:7px 9px;border:1px solid var(--accent2);background:var(--panel2);border-radius:7px;font-size:.74rem;display:flex;justify-content:space-between;align-items:center;gap:7px;margin-top:7px;}
.draw-offer .offer-buttons{display:flex;gap:5px;}
.draw-offer button{margin:0;padding:5px 8px;font-size:.72rem;}
.custom-clock{display:none;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px;}
.custom-clock.show{display:grid;}
.custom-clock input{margin:0;padding:7px 8px;font-size:.78rem;}


.custom-position-section{padding:18px;}
.custom-position-title{font-size:1.08rem;font-weight:900;color:var(--text);margin-bottom:5px;}
.custom-position-help{font-size:.78rem;color:var(--muted);line-height:1.45;margin-bottom:14px;}
#customFenInput{width:100%;min-height:94px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.8rem;line-height:1.45;padding:11px 12px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:var(--text);margin-bottom:6px;}
.custom-fen-error{min-height:18px;font-size:.75rem;color:#b33a3a;margin-bottom:8px;}
.custom-action-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px;}
.custom-action-grid button{width:100%;margin:0;min-height:45px;}
@media(max-width:560px){.custom-action-grid{grid-template-columns:1fr;}}

.sq.last-from{box-shadow:inset 0 0 0 999px rgba(246,196,66,.22);}.sq.last-to{box-shadow:inset 0 0 0 999px rgba(246,196,66,.38);}
.player-row.active .clock{box-shadow:0 0 0 2px rgba(47,126,234,.28);transform:scale(1.015);}.clock.low{animation:clockPulse 1s infinite;}.clock.urgent{animation:clockPulse .55s infinite;}
@keyframes clockPulse{50%{filter:brightness(1.15);}}
.connection-dot.reconnecting{background:#d17b19;box-shadow:0 0 0 4px rgba(209,123,25,.12);}
.offer-card{padding:8px 9px;border:1px solid var(--accent2);background:var(--panel2);border-radius:8px;font-size:.74rem;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:7px}.offer-card .offer-buttons{display:flex;gap:5px}.offer-card button{margin:0;padding:5px 8px;font-size:.72rem}.mobile-offer-slot{display:none}.mobile-offer-card{padding:10px 10px;border:1px solid var(--accent2);background:var(--panel);border-radius:9px;font-size:.78rem;display:flex;justify-content:space-between;align-items:center;gap:9px;margin-top:5px;box-shadow:0 2px 8px rgba(12,39,66,.06)}.mobile-offer-card .offer-buttons{display:flex;gap:6px;flex:0 0 auto}.mobile-offer-card button{margin:0;padding:7px 10px;font-size:.76rem;white-space:nowrap}
@media(max-width:900px){
  html,body{overflow:auto;}
  .game-app{height:auto;min-height:100dvh;grid-template-rows:52px auto;}
  .game-layout{grid-template-columns:1fr;gap:8px;padding:5px;}
  .board-zone{min-height:auto;overflow:visible;}
  #board{width:min(calc(100vw - 10px),calc(100dvh - 130px));height:auto;max-width:calc(100vw - 10px);max-height:calc(100dvh - 130px);aspect-ratio:1/1;}
  .side-panel{min-height:0;height:auto;max-height:none;}
}
@media(max-width:900px) and (orientation:portrait){
  .mobile-offer-slot{display:block;width:100%;}
  .desktop-offers .draw-offer,.desktop-offers .takeback-offer{display:none;}
  .mobile-offer-card{width:100%;box-sizing:border-box;}
}
@media(max-width:900px) and (orientation:landscape){
  .mobile-offer-slot{display:none;}
}
@media(max-width:520px){
  .game-topbar{padding:0 8px}.brand-name{font-size:.9rem}.brand-logo{width:34px;height:23px}.room-chip{display:none}.top-actions button{width:34px;height:34px;}
  .game-layout{padding:3px}.side-panel{border-radius:8px;min-height:0;height:auto;max-height:none;}.clock{font-size:1.2rem;min-width:78px}.player-row{padding:6px 7px;}
  body:not(:has(.game-app)) .wrap{padding:12px}
  body:not(:has(.game-app)) #content>.card{padding:24px 18px 20px;}
  .lobby-brand-logo{width:175px;height:116px;}
  .tabs{gap:5px;padding:4px;}
  .tab{font-size:.86rem;padding:12px 6px;}
  .brand-note{font-size:.78rem;}
  .brand-note strong:first-child{font-size:.92rem;}
  body:not(:has(.game-app)) .lobby-card{padding:22px 16px 18px;}
  .lobby-brand-logo{width:155px;height:104px;}
  .lobby-intro{margin-bottom:15px;}
  .lobby-subtitle{font-size:.82rem;}
  .lobby-section{padding:13px;}
  .share-row{grid-template-columns:1fr;}
  .share-row button{width:100%;}
  .status-chip{font-size:.67rem;padding:4px 7px;}
  .side-panel{display:flex;flex-direction:column;overflow:hidden;height:clamp(390px,60vh,560px);max-height:clamp(390px,60vh,560px);}
  .notation-wrap{min-height:110px;overflow:hidden;}
  .notation{min-height:0;overflow-y:auto;}
  .controls{padding:7px 8px;}
  .control-grid,.game-actions{gap:6px;}
  .control-grid button,.game-actions button{padding:7px 6px;font-size:.82rem;}
}

}
// Notation numbering for games that start from a custom FEN.
function notationInfo(){
  let blackFirst=false, startNo=1;
  if(customPositionFen){
    const p=customPositionFen.split(' ');
    blackFirst = p[1]==='b';
    startNo = Math.max(1, parseInt(p[5],10)||1);
  }
  return {blackFirst, startNo};
}
function drawReason(c){
  if(c.in_stalemate()) return 'Stalemate';
  if(c.insufficient_material()) return 'Draw — insufficient material';
  if(c.in_threefold_repetition()) return 'Draw — threefold repetition';
  return 'Draw — fifty-move rule';
}

function randomCode(){

  for(let i=0;i<4;i++) c += letters[Math.floor(Math.random()*letters.length)];

function randomHostColor(previous){
  // In Random mode, every New Game must switch the Host's colour.
  // The initial room may be either colour; subsequent games always use the opposite colour.
  if(previous === 'w') return 'b';

  return Math.random() < 0.5 ? 'w' : 'b';
}
function clearReconnectGrace(){
  if(reconnectGraceTimer){ clearTimeout(reconnectGraceTimer); reconnectGraceTimer=null; }
}
function markConnectionConnected(){
  clearReconnectGrace();

  connectionState='connected';
}
function markConnectionRecovering(){
  if(getGameResult()) return;
  clearReconnectGrace();
  // Keep the normal Connected indicator during a short browser/OS wake-up window.
  // Only show Reconnecting if recovery actually takes longer than the grace period.
  reconnectGraceTimer=setTimeout(()=>{
    reconnectGraceTimer=null;
    if(!getGameResult() && connectionState!=='connected') return;
    if(!getGameResult()) { connectionState='reconnecting'; renderGame(); }
  }, 4500);
  if(!lastConnectionWasUsable){ connectionState='reconnecting'; renderGame(); }
}

function restoreChessSnapshot(data){
  customPositionFen=data.customPositionFen||null;
  chess=makeChess();
  const hist=Array.isArray(data.history)?data.history:[];
  hist.forEach(m=>{ try{ chess.move({from:m.from,to:m.to,promotion:m.promotion||'q'}); }catch(e){} });
  if(data.fen && chess.fen()!==data.fen){ try{ chess.load(data.fen); }catch(e){} }
  remoteHistory=Array.isArray(data.remoteHistory)?data.remoteHistory:hist;
  moveSnapshots=Array.isArray(data.moveSnapshots)?data.moveSnapshots:[];

}
function restoreActiveSession(){

  roomCode=data.roomCode; myName=data.myName||''; hostColor=data.hostColor==='b'?'b':'w'; hostColorMode=data.hostColorMode||hostColor; guestName=data.guestName||''; guestSessionId=data.guestSessionId||null;

function clockPresetInfo(key){
  const presets={
    off:{label:'Clock Off',minutes:0,increment:0},
    '1+0':{label:'1 + 0',minutes:1,increment:0},
    '2+1':{label:'2 + 1',minutes:2,increment:1},
    '3+0':{label:'3 + 0',minutes:3,increment:0},
    '3+2':{label:'3 + 2',minutes:3,increment:2},
    '5+0':{label:'5 + 0',minutes:5,increment:0},
    '5+3':{label:'5 + 3',minutes:5,increment:3},
    '10+0':{label:'10 + 0',minutes:10,increment:0},
    '10+5':{label:'10 + 5',minutes:10,increment:5},
    '15+10':{label:'15 + 10',minutes:15,increment:10},
    '30+0':{label:'30 + 0',minutes:30,increment:0},
    '30+20':{label:'30 + 20',minutes:30,increment:20},
    '60+0':{label:'60 + 0',minutes:60,increment:0},
    '90+30':{label:'90 + 30',minutes:90,increment:30},
    custom:{label:customClockMinutes+' + '+customClockIncrement,minutes:customClockMinutes,increment:customClockIncrement}
  }; return presets[key]||presets.off;
}
function resetClock(preset){
  clockPreset=preset||'off';
  const p=clockPresetInfo(clockPreset), ms=p.minutes*60*1000;
  clockState={w:ms,b:ms,running:false,active:null,lastTick:0};
  clockWinner=null;
  stopClockTicker();
}
function stopClockTicker(){ if(clockTimer){clearInterval(clockTimer);clockTimer=null;} }
function startClockTicker(){
  stopClockTicker();
  if(!clockState.running || clockPreset==='off') return;
  clockTimer=setInterval(()=>{ tickClock(); updateClockDisplay(); },250);
}
function tickClock(){
  if(!clockState.running || !clockState.active || !clockState.lastTick) return;
  const now=Date.now(), delta=now-clockState.lastTick;
  clockState[clockState.active]=Math.max(0,clockState[clockState.active]-delta);
  clockState.lastTick=now;
  if(clockState[clockState.active]===0){
    const timedOut = clockState.active;
    const winner = timedOut==='w'?'b':'w';
    clockWinner=winner;
    clockState.running=false;
    clockState.lastTick=0;
    stopClockTicker();
    setGameResult(winner==='w'?'1-0':'0-1',(winner==='w'?'White':'Black')+' wins on time');
    if(isHost){ hostSync(); }
    else { sendGuestCommand({type:'timeout',color:timedOut}); renderGame(); }
  }
}
function clockMs(color){
  tickClock(); return Math.max(0,clockState[color]||0);
}
function formatClock(ms){
  ms=Math.max(0,Math.floor(ms));
  const total=Math.floor(ms/1000), s=total%60, m=Math.floor(total/60), h=Math.floor(m/60);
  if(h>0) return h+':'+String(m%60).padStart(2,'0')+':'+String(s).padStart(2,'0');
  return m+':'+String(s).padStart(2,'0');
}
function clockPayload(){ tickClock(); return {preset:clockPreset,w:clockState.w,b:clockState.b,running:clockState.running,active:clockState.active,lastTick:clockState.lastTick,winner:clockWinner,customMinutes:customClockMinutes,customIncrement:customClockIncrement}; }
function applyRemoteClock(c){
  if(!c || !c.preset) return;
  clockPreset=c.preset;
  if(c.customMinutes!=null) customClockMinutes=Number(c.customMinutes)||10;
  if(c.customIncrement!=null) customClockIncrement=Number(c.customIncrement)||0;
  clockState={w:c.w||0,b:c.b||0,running:!!c.running,active:c.active||null,lastTick:c.lastTick||0};
  clockWinner=c.winner||null;
  if(clockState.running) startClockTicker(); else stopClockTicker();
}
function updateClockDisplay(){
  const w=document.getElementById('clock-w'), b=document.getElementById('clock-b');

const PIECE_URL='https://lichess1.org/assets/piece/cburnett/';
// Full FIDE-based legality check of a FEN. Returns {ok, fen, terminal} or {ok:false, error}.
function validateCustomFEN(fenText){
  const fail=(error)=>({ok:false,error});
  const fen=String(fenText||'').trim().replace(/\s+/g,' ');
  if(!fen) return fail('Please enter a FEN position.');
  const parts=fen.split(' ');
  if(parts.length===4) parts.push('0','1');
  else if(parts.length===5) parts.push('1');
  if(parts.length!==6) return fail('FEN must contain 6 fields: pieces, side to move, castling, en passant, halfmove clock, move number.');
  const [placement,side,castle,ep,half,full]=parts;
  if(!/^[wb]$/.test(side)) return fail('Side to move must be "w" or "b".');
  if(!/^(-|K?Q?k?q?)$/.test(castle)) return fail('Castling field must be "-" or letters from KQkq in that order.');
  if(!/^(-|[a-h][36])$/.test(ep)) return fail('En passant square must be "-" or a square on rank 3 or 6.');
  if(!/^\d+$/.test(half)) return fail('Halfmove clock must be a number (0 or more).');
  if(!/^[1-9]\d*$/.test(full)) return fail('Move number must be 1 or more.');
  const ranks=placement.split('/');
  if(ranks.length!==8) return fail('Piece placement must contain exactly 8 ranks separated by "/".');
  const board=[]; // board[0] = rank 8 ... board[7] = rank 1
  const cnt={w:{p:0,n:0,b:0,r:0,q:0,k:0},b:{p:0,n:0,b:0,r:0,q:0,k:0}};
  for(let r=0;r<8;r++){
    if(/\d\d/.test(ranks[r])) return fail('Rank '+(8-r)+': two digits in a row are not allowed in FEN.');
    const row=[];
    for(const ch of ranks[r]){
      if(/[1-8]/.test(ch)){ for(let k=0;k<Number(ch);k++) row.push(null); }
      else if(/[prnbqkPRNBQK]/.test(ch)){
        row.push(ch);
        const col=ch===ch.toUpperCase()?'w':'b'; cnt[col][ch.toLowerCase()]++;
        if((ch==='P'||ch==='p') && (r===0||r===7)) return fail((col==='w'?'White':'Black')+' pawns cannot stand on the first or eighth rank.');
      } else return fail('Invalid character "'+ch+'" in piece placement.');
    }
    if(row.length!==8) return fail('Rank '+(8-r)+' must describe exactly 8 squares.');
    board.push(row);
  }
  for(const col of ['w','b']){
    const nm=col==='w'?'White':'Black', c=cnt[col];
    if(c.k!==1) return fail(nm+' must have exactly one king.');
    if(c.p>8) return fail(nm+' cannot have more than 8 pawns.');
    const total=c.p+c.n+c.b+c.r+c.q+c.k;
    if(total>16) return fail(nm+' cannot have more than 16 pieces.');
    const promoted=Math.max(0,c.q-1)+Math.max(0,c.r-2)+Math.max(0,c.b-2)+Math.max(0,c.n-2);
    if(c.p+promoted>8) return fail(nm+' has too many pieces: pawns plus promoted pieces would exceed 8.');
  }
  // Kings not adjacent
  let wk=null,bk=null;
  for(let r=0;r<8;r++)for(let f=0;f<8;f++){ if(board[r][f]==='K') wk=[r,f]; if(board[r][f]==='k') bk=[r,f]; }
  if(Math.max(Math.abs(wk[0]-bk[0]),Math.abs(wk[1]-bk[1]))<=1) return fail('The two kings cannot stand next to each other.');
  // Castling rights must match the pieces
  const rightsOk=[['K',board[7][4]==='K'&&board[7][7]==='R','White king-side castling needs a king on e1 and a rook on h1.'],
    ['Q',board[7][4]==='K'&&board[7][0]==='R','White queen-side castling needs a king on e1 and a rook on a1.'],
    ['k',board[0][4]==='k'&&board[0][7]==='r','Black king-side castling needs a king on e8 and a rook on h8.'],
    ['q',board[0][4]==='k'&&board[0][0]==='r','Black queen-side castling needs a king on e8 and a rook on a8.']];
  for(const [k,ok,msg] of rightsOk){ if(castle.indexOf(k)>=0 && !ok) return fail(msg); }
  // En passant must be consistent with a pawn that has just made a double step
  if(ep!=='-'){
    const f=ep.charCodeAt(0)-97;
    if(side==='w'){
      if(ep[1]!=='6') return fail('With White to move, the en passant square must be on rank 6.');
      if(board[3][f]!=='p'||board[2][f]!==null||board[1][f]!==null) return fail('En passant square '+ep+' is impossible: no black pawn just advanced two squares there.');
    }else{
      if(ep[1]!=='3') return fail('With Black to move, the en passant square must be on rank 3.');
      if(board[4][f]!=='P'||board[5][f]!==null||board[6][f]!==null) return fail('En passant square '+ep+' is impossible: no white pawn just advanced two squares there.');
    }
  }
  // Engine-level parse
  const c=new Chess();
  const norm=[placement,side,castle,ep,half,full].join(' ');
  let loaded=false; try{ loaded=c.load(norm); }catch(e){}
  if(!loaded) return fail('This FEN was rejected by the chess engine. Please check it.');
  // The side that is NOT to move can never be in check.
  const flipped=[placement,side==='w'?'b':'w','-','-',half,full].join(' ');
  const t=new Chess(); let tl=false; try{ tl=t.load(flipped); }catch(e){}
  if(tl && t.in_check()) return fail((side==='w'?'Black':'White')+"'s king is in check but it is "+(side==='w'?'White':'Black')+" to move — that position is illegal.");
  let terminal=null;
  if(c.in_checkmate()) terminal='Checkmate — '+(side==='w'?'Black':'White')+' has already won.';
  else if(c.in_stalemate()) terminal='Stalemate — the side to move has no legal move.';
  else if(c.insufficient_material()) terminal='Insufficient material — the game is a draw.';
  else if(Number(half)>=100) terminal='Fifty-move rule — the game is already drawn.';
  return {ok:true,fen:c.fen(),terminal};
}

const GLY={K:'♔',Q:'♕',R:'♖',B:'♗',N:'♘',P:'♙',k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};
function pcImg(ch){
  return `<img class="pc" draggable="false" alt="" src="${PIECE_URL}${ch===ch.toUpperCase()?'w':'b'}${ch.toUpperCase()}.svg" onerror="this.outerHTML='<span class=&quot;pcg&quot;>${GLY[ch]}</span>'">`;
}
function fenToGrid(t){
  const rk=String(t||'').trim().split(/\s+/)[0].split('/'); if(rk.length!==8) return null;
  const g=[];
  for(const row of rk){ let n=0; for(const ch of row){ if(/[1-8]/.test(ch)){ for(let k=0;k<+ch;k++) g.push(null); n+=+ch; } else if(/[prnbqkPRNBQK]/.test(ch)){ g.push(ch); n++; } else return null; } if(n!==8) return null; }
  return g;
}
function edFEN(e){
  let p=''; for(let r=0;r<8;r++){ let n=0; for(let f=0;f<8;f++){ const c=e.g[r*8+f]; if(c){ if(n) p+=n; n=0; p+=c; } else n++; } if(n) p+=n; if(r<7) p+='/'; }
  return `${p} ${e.turn} ${['K','Q','k','q'].filter(x=>e.c[x]).join('')||'-'} ${e.ep} 0 1`;
}
/* Paste-FEN dialog used by the analysis board and live games. apply(fen) runs on success. */
function askFen(apply,o={}){
  const m=document.createElement('div'); m.className='cp2-modal';
  m.innerHTML=`<div class="cp2-dlg" role="dialog" aria-modal="true"><h3>${esc(o.title||'Paste FEN')}</h3><p>${esc(o.note||'The position is checked against the rules of chess before it is applied.')}</p><textarea spellcheck="false" autocapitalize="off" placeholder="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"></textarea><div class="cp2-msg" aria-live="polite"></div><div class="cp2-row"><button type="button" class="ghost" data-clip>Paste from clipboard</button><button type="button" class="ghost" data-x>Cancel</button><button type="button" data-ok disabled>Apply position</button></div></div>`;
  document.body.appendChild(m);
  const ta=m.querySelector('textarea'), msg=m.querySelector('.cp2-msg'), ok=m.querySelector('[data-ok]');
  const close=()=>{ document.removeEventListener('keydown',key); m.remove(); };
  const key=ev=>{ if(ev.key==='Escape') close(); };
  const check=()=>{
    const v=ta.value.trim(); let chk=v?validateCustomFEN(v):{ok:false,error:''};
    if(chk.ok&&chk.terminal&&o.live) chk={ok:false,error:chk.terminal+' — nothing to play from here.'};
    ok.disabled=!chk.ok; msg.className='cp2-msg '+(chk.ok?'custom-fen-ok':'custom-fen-error');
    msg.textContent=chk.ok?'✓ Valid — '+(chk.fen.split(' ')[1]==='w'?'White':'Black')+' to move.':chk.error; return chk;
  };
  ta.addEventListener('input',check);
  m.querySelector('[data-clip]').onclick=async()=>{ try{ ta.value=await navigator.clipboard.readText(); check(); }catch(err){ msg.className='cp2-msg custom-fen-error'; msg.textContent='Clipboard access was blocked — paste into the box with Ctrl+V.'; } ta.focus(); };
  m.querySelector('[data-x]').onclick=close;
  m.addEventListener('mousedown',ev=>{ if(ev.target===m) close(); });
  ok.onclick=()=>{ const chk=check(); if(!chk.ok) return; close(); apply(chk.fen); };
  document.addEventListener('keydown',key); ta.focus();
}

      <input id="nameInput" autocomplete="name" placeholder="Enter your name" value="${esc(savedName)}">
      <label>Room code</label>
      <input id="codeInput" autocomplete="off" autocapitalize="characters" spellcheck="false" style="text-transform:uppercase" placeholder="Enter room code" value="${esc(prefillCode)}">
      <div class="lobby-actions"><button id="joinBtn">Join Game</button></div>
      <div class="lobby-hint">Use the room code shared by your opponent, or open their game link directly.</div>
      <button type="button" class="cp-link" id="joinBackLink">← Back to Custom Position</button>
    </div>`;
  document.getElementById('joinBackLink').onclick = () => { history.replaceState(null,'',location.pathname); showCustomPositionForm(savedName); };

}

function showMessage(msg, isError){
  content.innerHTML = `<div class="card lobby-card waiting-card"><div class="waiting-title">${isError?'Connection notice':'Message'}</div><div class="connection-card"><span class="connection-dot ${isError?'error':''}"></span><span>${esc(msg)}</span></div><div class="row" style="justify-content:center;margin-top:12px;"><button class="secondary" id="backBtn">Back to Lobby</button></div></div>`;
  document.getElementById('backBtn').onclick = () => { cleanup(); renderLobby(); };
}

function cleanup(){
  customAnalysisMode=false;
  clearReconnectGrace();
  clearSessionSnapshot();
  try{ if(guestReconnectTimer) clearTimeout(guestReconnectTimer); }catch(e){} guestReconnectTimer=null; guestReconnectAttempts=0;
  try{ if(peer && peer.__hostRetryTimer) clearTimeout(peer.__hostRetryTimer); }catch(e){}
  window.__activeHostPeer=null;
  try{ if(peer) peer.destroy(); }catch(e){}
  peer=null; guestConn=null; otherConns=[]; hostConn=null; selected=null; guestCommandQueue=[]; guestConnectInProgress=false;
  if(typeof clearGuestLivenessTimer==='function') clearGuestLivenessTimer();
  guestReconnectInProgress=false;
  stateVersion=0; lastRemoteStateVersion=0; nextGuestCommandId=1; pendingGuestMoveCommand=null; lastAppliedMoveCommandId=null; processedMoveCommandIds=new Set();
  window.__names=null;
  chess = new Chess(); myColor=null;
  resetGameState();
  resetClock('off');
}

// ---------- HOST ----------
function promoteGuestConnection(conn, sessionId){
  const oldGuest=guestConn;
  guestConn=conn;
  conn.role=(hostColor==='w')?'b':'w';
  conn.playerColor=conn.role;
  if(sessionId) guestSessionId=sessionId;
  markConnectionConnected();
  if(oldGuest && oldGuest!==conn){ try{ oldGuest.close(); }catch(e){} }
  renderGame();
  sendTo(conn);
  saveSessionSnapshot();
}

function hostGame(initialFen=null){
  roomCode = randomCode();
  guestSessionId=null;
  chess=new Chess();
  if(initialFen){ chess.load(initialFen); customPositionFen=initialFen; } else { customPositionFen=null; }
  resetGameState(); resetClock(clockPreset);
  saveSessionSnapshot();
  createHostPeer();
}

function createHostPeer(retryCount){
  if(!roomCode) roomCode = randomCode();
  retryCount = Number.isFinite(retryCount) ? retryCount : 0;
  try{ if(peer) peer.destroy(); }catch(e){}
  peer = new Peer('chess-' + roomCode);
  peer.__hostOpened = false;
  peer.__hostRetryCount = retryCount;

  peer.on('open', () => {
    peer.__hostOpened = true;
    peer.__hostRetryCount = 0;
    if(peer.__hostRetryTimer){ clearTimeout(peer.__hostRetryTimer); peer.__hostRetryTimer=null; }
    isHost = true; myColor = hostColor;
    restoringActiveHostSession = false;
    saveSessionSnapshot();
    showWaitingHost();
  });

  peer.on('connection', conn => {
    conn.on('open', () => {
      // A reconnecting Guest can have a new PeerJS connection/peer id after refresh.
      // The stable browser session id lets the Host restore the same playing seat.
      const sameGuestPeer = guestConn && guestConn.peer && conn.peer === guestConn.peer;
      const guestConnectionUsable = guestConn && guestConn.open;
      if(!guestConn || !guestConnectionUsable || sameGuestPeer){
        promoteGuestConnection(conn);
      } else {
        conn.role = 'spectator';
        otherConns.push(conn);
        try{ conn.send({type:'sessionRequest'}); }catch(e){}
        sendTo(conn);
      }
    });
    conn.on('data', data => handleHostData(conn, data));
    conn.on('close', () => {
      if(conn === guestConn){ guestConn = null; lastConnectionWasUsable=true; markConnectionRecovering(); }
      otherConns = otherConns.filter(c => c !== conn);
      if(!getGameResult()) saveSessionSnapshot();
      renderGame();
    });
  });

  peer.on('disconnected', () => {
    if(peer.__hostOpened && peer === window.__activeHostPeer){
      markConnectionRecovering();
      try{ peer.reconnect(); }catch(e){}
      renderGame();
    }
  });

  peer.on('error', err => {
    // A temporary signaling-server/network failure during room creation should not
    // immediately destroy the user's room. Retry the same room ID automatically.
    // Once the room is already open, let PeerJS reconnect instead of showing an error.
    if(peer !== window.__activeHostPeer) return;
    const type = err && err.type ? err.type : 'network';
    if(peer.__hostOpened){
      if(type === 'network' || type === 'socket-error' || type === 'server-error'){
        connectionState='reconnecting';
        try{ peer.reconnect(); }catch(e){}
        return;
      }
      return;
    }

    if(type === 'unavailable-id'){
      // During an active-session refresh the old PeerJS id may take a moment to clear.
      // Keep the same room code so the Guest can reconnect to the original game.
      if(!restoringActiveHostSession) roomCode = randomCode();
    }

    if(type === 'network' || type === 'socket-error' || type === 'server-error' || type === 'unavailable-id'){
      const nextRetryCount = (peer.__hostRetryCount || 0) + 1;
      if(nextRetryCount > 6){
        showMessage('Could not create room due to a network connection problem. Please check your internet connection and try again.', true);
        return;
      }
      peer.__hostRetryCount = nextRetryCount;
      const delay = Math.min(6000, 1000 + nextRetryCount * 750);
      if(peer.__hostRetryTimer) clearTimeout(peer.__hostRetryTimer);
      peer.__hostRetryTimer = setTimeout(() => {
        if(peer && peer.__hostRetryTimer){ peer.__hostRetryTimer=null; }
        createHostPeer(nextRetryCount);
      }, delay);
      return;
    }

    showMessage('Could not create room (' + type + '). Try again.', true);
  });
  window.__activeHostPeer = peer;
}

function showWaitingHost(){
  const shareUrl = location.origin + location.pathname + '?code=' + roomCode;
  content.innerHTML = `
    <div class="card lobby-card waiting-card">
      <div class="waiting-title">Your game is ready</div>
      <p class="waiting-subtitle">Share the link below. Your opponent can open it on any browser to join.</p>
      <div class="code-badge">${roomCode}</div>
      <div class="share-row">
        <input id="shareLinkInput" readonly value="${esc(shareUrl)}" onclick="this.select()" aria-label="Game link">
        <button class="secondary" id="copyLinkBtn">Copy Game Link</button>
      </div>
      <div class="connection-card"><span class="connection-dot" id="waitingDot"></span><span id="waitingStatus">Waiting for opponent to join…</span></div>
      <div class="hint">You are playing <b>${hostColor==='w'?'White':'Black'}</b>. Room code: <b>${esc(roomCode)}</b></div>
      <div class="row" style="justify-content:center;margin-top:12px;"><button class="ghost" id="cancelBtn">Cancel</button></div>
    </div>`;
  document.getElementById('copyLinkBtn').onclick = async () => {
    const link = document.getElementById('shareLinkInput').value;
    try{ await navigator.clipboard.writeText(link); }
    catch(e){ const input=document.getElementById('shareLinkInput'); input.select(); document.execCommand('copy'); }
    const b=document.getElementById('copyLinkBtn');
    if(b){ b.textContent='Link Copied ✓'; setTimeout(()=>{ if(document.getElementById('copyLinkBtn')) document.getElementById('copyLinkBtn').textContent='Copy Game Link'; },1600); }
  };
  document.getElementById('cancelBtn').onclick = () => { cleanup(); renderLobby(); };
}

function allConns(){ return guestConn ? [guestConn, ...otherConns] : [...otherConns]; }

function sendTo(conn){
  if(!conn.open) return;
  const whiteName = hostColor === 'w' ? myName : guestName;
  const blackName = hostColor === 'w' ? guestName : myName;
  conn.send({
    type:'state', fen: chess.fen(), customPosition:!!customPositionFen, startFen:customPositionFen||null, whiteName, blackName,
    status: guestConn ? 'playing' : 'waiting', yourRole: conn.role, takebackOfferBy, rematchOfferBy,
    clock: clockPayload(), history: chess.history({verbose:true}), drawOfferBy, result: getGameResult(), resultReason: gameResultReason,
    stateVersion, lastAppliedMoveCommandId
  });
}

function broadcastState(){
  allConns().forEach(c => sendTo(c));
}

// The host's own page never listened to its own state changes — sending
// data to the guest doesn't redraw the host's own screen. hostSync() does
// both: refresh the host's own UI *and* push the update to everyone else.
function hostSync(){
  // Host remains authoritative: once the game reaches any terminal result,
  // freeze the clock and broadcast the stopped state to the other browser.
  if(isHost && (chess.in_checkmate() || chess.in_draw() || chess.in_stalemate() || clockWinner || gameResultCode)){
    clockState.running=false;
    clockState.lastTick=0;
    stopClockTicker();
  }
  viewPly=null; selected=null;
  stateVersion++;
  renderGame();
  broadcastState();
  saveSessionSnapshot();
}

function handleHostData(conn, data){
  if(data.type === 'sessionHello') {
    const sid=String(data.sessionId||'');
    if(!sid) return;
    if(!guestConn || conn===guestConn || !guestSessionId || sid===guestSessionId){
      promoteGuestConnection(conn,sid);
    }
    return;
  }
  if(data.type === 'sessionRequest'){
    try{ if(conn.open) conn.send({type:'sessionAck',sessionId:clientSessionId}); }catch(e){}
    return;
  }
  if(data.type === 'ping' && conn === guestConn){
    // Echo the probe id so a mobile Guest can verify that this exact
    // DataConnection is still responsive after the browser wakes up.
    try{ if(conn.open) conn.send({type:'pong',stateVersion,pingId:data.pingId||null}); }catch(e){}
    return;
  }
  if(data.type === 'syncRequest' && conn === guestConn){
    sendTo(conn);
    return;
  }
  if(data.type === 'name' && conn === guestConn){ guestName = data.name; hostSync(); }
  if(data.type === 'timeout' && conn === guestConn && !getGameResult()){
    const timedOut = (data.color==='w'||data.color==='b') ? data.color : conn.role;
    tickClock();
    // The host remains authoritative, but a guest timeout report must be
    // accepted immediately when it refers to the side whose clock is active.
    // This keeps both browsers on the same terminal result even if their
    // browser timers are a few milliseconds apart.
    if(clockState.active===timedOut){
      const winner = timedOut==='w'?'b':'w';
      clockWinner=winner;
      clockState.running=false;
      clockState.lastTick=0;
      stopClockTicker();
      setGameResult(winner==='w'?'1-0':'0-1',(winner==='w'?'White':'Black')+' wins on time');
      hostSync();
    }
  }
  if(data.type === 'move' && conn === guestConn){
    const commandId = data.commandId || null;
    // A mobile reconnect can resend a move that the Host already applied. Do
    // not apply it twice; simply confirm the already-authoritative position.
    if(commandId && processedMoveCommandIds.has(commandId)){
      try{ if(conn.open) conn.send({type:'moveAck',commandId,accepted:true,stateVersion,lastAppliedMoveCommandId}); }catch(e){}
      sendTo(conn);
      return;
    }
    if(getGameResult() || chess.turn() !== conn.role){
      try{ if(conn.open) conn.send({type:'moveAck',commandId,accepted:false,stateVersion,lastAppliedMoveCommandId}); }catch(e){}
      sendTo(conn);
      return;
    }
    if(clockPreset!=='off' && clockState.running && clockState.active===conn.role && clockMs(conn.role)<=0){
      try{ if(conn.open) conn.send({type:'moveAck',commandId,accepted:false,stateVersion,lastAppliedMoveCommandId}); }catch(e){}
      return;
    }
    const mover=chess.turn();
    const res=chess.move({from:data.from,to:data.to,promotion:(['q','r','b','n'].indexOf(data.promotion)>=0?data.promotion:'q')});
    if(res){
      if(commandId){
        processedMoveCommandIds.add(commandId);
        // Keep the dedupe cache bounded during a long game/session.
        if(processedMoveCommandIds.size>100){
          const first=processedMoveCommandIds.values().next().value;
          processedMoveCommandIds.delete(first);
        }
        lastAppliedMoveCommandId=commandId;
      }
      pendingGuestMove=null;
      drawOfferBy=null;
      takebackOfferBy=null;
      startClockAfterMove(mover);
      try{ if(conn.open) conn.send({type:'moveAck',commandId,accepted:true,stateVersion:stateVersion+1,lastAppliedMoveCommandId:commandId}); }catch(e){}
      hostSync();
    } else {
      try{ if(conn.open) conn.send({type:'moveAck',commandId,accepted:false,stateVersion,lastAppliedMoveCommandId}); }catch(e){}
      sendTo(conn);
    }
  }
  if(data.type === 'takebackOffer' && conn === guestConn && chess.history().length){
    const requester = (data.fromColor==='w'||data.fromColor==='b') ? data.fromColor : conn.playerColor || conn.role;
    if(requester && requester !== myColor && !getGameResult()){ takebackOfferBy=requester; hostSync(); }
  }
  if(data.type === 'takebackAccept' && conn === guestConn){
    const responder = (data.fromColor==='w'||data.fromColor==='b') ? data.fromColor : (conn.playerColor || conn.role);
    const guestColor = conn.playerColor || conn.role;
    if(takebackOfferBy && responder === guestColor && responder !== takebackOfferBy && !getGameResult()){
      if(restoreLastMove()){ takebackOfferBy=null; hostSync(); }
    }
  }
  if(data.type === 'takebackDecline' && conn === guestConn){
    const responder = (data.fromColor==='w'||data.fromColor==='b') ? data.fromColor : (conn.playerColor || conn.role);
    const guestColor = conn.playerColor || conn.role;
    if(takebackOfferBy && responder === guestColor && responder !== takebackOfferBy){ takebackOfferBy=null; hostSync(); }
  }
  if(data.type === 'rematchOffer' && conn === guestConn && getGameResult()){
    rematchOfferBy = conn.role || conn.playerColor;
    hostSync();
  }
  if(data.type === 'rematchAccept' && conn === guestConn && rematchOfferBy === (conn.role || conn.playerColor)){
    chess=makeChess(); resetGameState(); resetClock(clockPreset); connectionState='connected'; hostSync();
  }
  if(data.type === 'rematchDecline' && conn === guestConn && rematchOfferBy === (conn.role || conn.playerColor)){
    rematchOfferBy=null; hostSync();
  }
  if(data.type === 'drawOffer' && conn === guestConn && !getGameResult()){
    drawOfferBy = conn.role || conn.playerColor;
    hostSync();
  }
  if(data.type === 'drawAccept' && !getGameResult()){
    // The Host is authoritative. Accept only from the actual playing Guest
    // whose assigned colour is the opponent of the active Host offer.
    // Do not require conn === guestConn because a mobile reconnect can leave
    // a short-lived stale DataConnection object while the action is in flight.
    const responder = conn.playerColor || conn.role;
    if(responder && drawOfferBy && responder !== drawOfferBy && responder === ((drawOfferBy === 'w') ? 'b' : 'w')){
      drawOfferBy=null;
      setGameResult('0.5-0.5','Draw agreed');
      hostSync();
    }
  }
  if(data.type === 'drawDecline'){
    // Same authoritative validation for Decline: only the opponent of the
    // active offer may clear it. This prevents stale/duplicate messages from
    // changing the game state.
    const responder = conn.playerColor || conn.role;
    if(responder && drawOfferBy && responder !== drawOfferBy && responder === ((drawOfferBy === 'w') ? 'b' : 'w')){
      drawOfferBy=null;
      hostSync();
    }
  }
  if(data.type === 'resign' && conn === guestConn && !getGameResult()){
    setGameResult(conn.role==='w'?'0-1':'1-0',(conn.role==='w'?'White':'Black')+' resigned'); hostSync();
  }
  if(data.type === 'newgame' && conn === guestConn){
    if(hostColorMode==='r') hostColor=randomHostColor(hostColor);
    myColor=hostColor;
    conn.role=(hostColor==='w')?'b':'w';
    conn.playerColor=conn.role;
    chess = makeChess();
    resetGameState();
    resetClock(clockPreset);
    markConnectionConnected();
    hostSync();
  }
}

// ---------- GUEST ----------
function scheduleGuestReconnect(){
  if(guestReconnectTimer || !roomCode || !peer) return;
  markConnectionRecovering();
  guestReconnectTimer=setTimeout(()=>{ guestReconnectTimer=null; connectGuestToHost(); }, Math.min(8000,1500+guestReconnectAttempts*750));
}
function flushGuestCommands(){
  if(!hostConn || !hostConn.open) return;
  const queued = guestCommandQueue.splice(0);
  queued.forEach(msg=>{ try{ if(hostConn && hostConn.open) hostConn.send(msg); else guestCommandQueue.push(msg); }catch(e){ guestCommandQueue.push(msg); } });
}
function sendGuestCommand(msg){
  if(!msg) return false;
  if(msg.type==='move' && !msg.commandId){
    msg = Object.assign({},msg,{commandId:'m'+Date.now().toString(36)+'-'+(nextGuestCommandId++)});
    pendingGuestMoveCommand=msg;
  }
  if(hostConn && hostConn.open){
    try{ hostConn.send(msg); return true; }catch(e){}
  }
  // Do not silently discard Guest actions while a mobile connection is reconnecting.
  // A move is retained separately so it can be retried after reconnect.
  if(!(msg.type==='move' && pendingGuestMoveCommand===msg)) guestCommandQueue.push(msg);
  scheduleGuestReconnect();
  return false;
}
function connectGuestToHost(){
  if(!peer || !roomCode || guestConnectInProgress) return;
  guestConnectInProgress=true;
  guestReconnectAttempts++;
  const conn=peer.connect('chess-'+roomCode,{reliable:true}); hostConn=conn;
  conn.on('open',()=>{
    guestReconnectAttempts=0; guestConnectInProgress=false; markConnectionConnected(); renderGame();
    try{ conn.send({type:'sessionHello',sessionId:clientSessionId}); }catch(e){}
    try{ conn.send({type:'name',name:myName}); }catch(e){}
    // Always ask the Host for the latest authoritative position after a
    // reconnect. This also heals a mobile page that was briefly suspended.
    try{ conn.send({type:'syncRequest',knownVersion:lastRemoteStateVersion}); }catch(e){}
    if(pendingGuestMoveCommand){
      try{ conn.send(pendingGuestMoveCommand); }catch(e){}
    }
    flushGuestCommands();
  });
  conn.on('data',data=>handleGuestData(data));
  conn.on('close',()=>{ guestConnectInProgress=false; if(hostConn===conn){ hostConn=null; scheduleGuestReconnect(); } });
  conn.on('error',()=>{ guestConnectInProgress=false; if(hostConn===conn) scheduleGuestReconnect(); });
}

function joinGame(code, isResume=false){
  roomCode = code;
  if(!isResume) clearSessionSnapshot();
  saveSessionSnapshot();
  peer = new Peer();
  peer.on('open', () => {
    isHost = false; connectionState='reconnecting';
    content.innerHTML = '<div class="card lobby-card waiting-card"><div class="waiting-title">Connecting to game…</div><p class="waiting-subtitle">Room <b>' + esc(code) + '</b></p><div class="connection-card"><span class="connection-dot reconnecting"></span><span>Connecting to opponent…</span></div></div>';
    startGuestHeartbeat();
    connectGuestToHost();
  });
  peer.on('error', err => { connectionState='reconnecting'; if(err.type!=='peer-unavailable') scheduleGuestReconnect(); else showMessage('Could not reach room "' + code + '" (' + err.type + '). Check the code and make sure the host is online.', true); });
}

function handleGuestData(data){
  if(data.type === 'moveAck'){
    if(data.commandId && pendingGuestMoveCommand && data.commandId===pendingGuestMoveCommand.commandId){
      if(data.accepted){
        pendingGuestMoveCommand=null;
        pendingGuestMove=null;
      } else {
        // The Host rejected the optimistic move. The following authoritative
        // state (sent immediately below) restores the correct position.
        pendingGuestMoveCommand=null;
        pendingGuestMove=null;
      }
      renderGame();
    }
    return;
  }
  if(data.type === 'pong'){
    // A WebRTC DataConnection may still report .open after Android has
    // suspended Chrome even though packets are no longer flowing.  A
    // matching pong is the actual liveness proof.
    if(!guestPendingPingId || data.pingId === guestPendingPingId){
      if(guestPongTimer){ clearTimeout(guestPongTimer); guestPongTimer=null; }
      guestPendingPingId=null;
      markConnectionConnected();
      if(hostConn && hostConn.open){
        try{ hostConn.send({type:'syncRequest',knownVersion:lastRemoteStateVersion}); }catch(e){}
      }
    }
    return;
  }
  if(data.type === 'state'){
    const incomingVersion = Number(data.stateVersion||0);
    // Ignore an older state that arrives after a newer mobile state.
    if(incomingVersion < lastRemoteStateVersion) return;
    lastRemoteStateVersion=incomingVersion;
    customPositionFen = data.startFen || null;
    chess.load(data.fen);
    myColor = data.yourRole === 'b' ? 'b' : (data.yourRole === 'w' ? 'w' : null);
    window.__names = { white: data.whiteName, black: data.blackName, status: data.status };
    remoteHistory = data.history || [];
    if(pendingGuestMoveCommand && data.lastAppliedMoveCommandId===pendingGuestMoveCommand.commandId){
      pendingGuestMoveCommand=null;
      pendingGuestMove=null;
    } else if(data.lastAppliedMoveCommandId && pendingGuestMoveCommand && data.lastAppliedMoveCommandId!==pendingGuestMoveCommand.commandId){
      // Host has advanced past this Guest command; authoritative history wins.
      pendingGuestMoveCommand=null;
      pendingGuestMove=null;
    } else {
      pendingGuestMove=null;
    }
    viewPly = null;
    drawOfferBy = data.drawOfferBy || null;
    takebackOfferBy = data.takebackOfferBy || null;
    rematchOfferBy = data.rematchOfferBy || null;
    markConnectionConnected();
    gameResultCode = data.result || null;
    gameResultReason = data.resultReason || '';
    if(data.clock) applyRemoteClock(data.clock);
    renderGame();
    saveSessionSnapshot();
  }
}

// ---------- SHARED UI ----------
function getGameResult(){
  if(gameResultCode) return gameResultCode;
  if(clockWinner) return clockWinner==='w' ? '1-0' : '0-1';
  if(chess.in_checkmate()) return chess.turn()==='w' ? '0-1' : '1-0';
  if(chess.in_draw() || chess.in_stalemate()) return '0.5-0.5';
  return null;
}
function setGameResult(code, reason){
  gameResultCode=code; gameResultReason=reason||'';
  stopClockTicker(); clockState.running=false;
}
function resetGameState(){
  remoteHistory=[]; pendingGuestMove=null; drawOfferBy=null; gameResultCode=null; gameResultReason='';
  boardArrows=[]; boardCircles=[]; lastMoveSquares={from:null,to:null}; moveSnapshots=[]; viewPly=null; takebackOfferBy=null; rematchOfferBy=null;
}

function renderGame(){
  const oldNotation=document.getElementById('notation');
  const oldNotationHistory=lastRenderedHistory;
  const oldNotationScroll=oldNotation ? oldNotation.scrollTop : 0;
  const oldNotationMax=oldNotation ? Math.max(0,oldNotation.scrollHeight-oldNotation.clientHeight) : 0;
  const oldNotationNearBottom=oldNotation ? (oldNotationMax-oldNotationScroll<40) : true;
  const hostConnectionLive = !!(guestConn && guestConn.open);
  const displayConnectionState = isHost
    ? (hostConnectionLive ? 'connected' : connectionState)
    : connectionState;
  const names = isHost
    ? { white: hostColor==='w'?myName:guestName, black: hostColor==='w'?guestName:myName, status: displayConnectionState }
    : Object.assign({ white:'', black:'' }, (window.__names || {}), { status: displayConnectionState });
  const turn=chess.turn();
  const result=getGameResult();
  let statusText;
  if(names.status === 'waiting') statusText='Waiting for the other player to join room <b>'+esc(roomCode)+'</b>.';
  else if(names.status === 'reconnecting') statusText='Connection interrupted — reconnecting…';
  else if(gameResultReason) statusText=gameResultReason+'.';
  else if(clockWinner) statusText=(clockWinner==='w'?'White':'Black')+' wins on time.';
  else if(chess.in_checkmate()) statusText='Checkmate — '+(turn==='w'?'Black':'White')+' wins.';
  else if(chess.in_draw() || chess.in_stalemate()) statusText='Game drawn.';
  else statusText=(turn==='w'?'White':'Black')+' to move'+(chess.in_check()?' — check!':'.');

  const hist = getDisplayHistory();
  const totalPly=hist.length;
  const currentPly=viewPly===null || viewPly===undefined ? totalPly : Math.max(0,Math.min(totalPly,viewPly));

function offerTakeback(){
  const hasMoves = isHost ? chess.history().length > 0 : remoteHistory.length > 0;
  if(!hasMoves || getGameResult() || takebackOfferBy) return;
  if(isHost){
    takebackOfferBy=myColor;
    hostSync();
  } else if(hostConn && hostConn.open){
    sendGuestCommand({type:'takebackOffer', fromColor:myColor});
  }
}
function respondTakeback(accept){
  if(isHost){
    if(!takebackOfferBy || takebackOfferBy===myColor) return;
    if(accept){ if(restoreLastMove()){ takebackOfferBy=null; hostSync(); } } else { takebackOfferBy=null; hostSync(); }
  } else {
    takebackOfferBy=null;
    renderGame();
    sendGuestCommand({type:accept?'takebackAccept':'takebackDecline', fromColor:myColor});
  }
}
function offerRematch(){
  if(!getGameResult()) return;
  if(isHost){ rematchOfferBy=myColor; hostSync(); }
  else sendGuestCommand({type:'rematchOffer'});
}
function respondRematch(accept){
  if(isHost){
    if(rematchOfferBy!==((hostColor==='w')?'b':'w')) return;
    if(accept){
      if(hostColorMode==='r') hostColor=randomHostColor(hostColor);
      myColor=hostColor;
      if(guestConn){
        guestConn.role=(hostColor==='w')?'b':'w';
        guestConn.playerColor=guestConn.role;
      }
      chess=makeChess();
      resetGameState();
      resetClock(clockPreset);
      markConnectionConnected();
      hostSync();
    }
    else { rematchOfferBy=null; hostSync(); }
  } else sendGuestCommand({type:accept?'rematchAccept':'rematchDecline'});
}

function offerDraw(){
  if(getGameResult() || drawOfferBy) return;
  if(isHost){ drawOfferBy=myColor; hostSync(); }
  else sendGuestCommand({type:'drawOffer'});
}
function respondDraw(accept){
  if(isHost){
    if(drawOfferBy!==((hostColor==='w')?'b':'w')) return;
    if(accept){ drawOfferBy=null; setGameResult('0.5-0.5','Draw agreed'); }
    else drawOfferBy=null;
    hostSync();
  } else {
    // Keep the popup visible until the Host broadcasts the authoritative result.
    // This prevents the Guest UI from hiding a response that was not yet processed.
    sendGuestCommand({type:accept?'drawAccept':'drawDecline', fromColor:myColor});
  }
}
function resignGame(){
  if(getGameResult()) return;
  if(isHost){
    setGameResult(myColor==='w'?'0-1':'1-0',(myColor==='w'?'White':'Black')+' resigned');
    hostSync();
  } else {
    sendGuestCommand({type:'resign'});
  }
}

function currentNames(){

  return { white: (window.__names&&window.__names.white)||'White', black: (window.__names&&window.__names.black)||'Black' };
}

function downloadBlob(blob, filename){
  try{
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=filename; a.rel='noopener';
    a.style.display='none';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ try{ a.remove(); URL.revokeObjectURL(url); }catch(e){} },1500);
    return true;
  }catch(e){ return false; }
}

function exportPGN(){
  const n = currentNames();
  try{
    chess.header('White', n.white||'White', 'Black', n.black||'Black',
      'Date', new Date().toISOString().slice(0,10).replace(/-/g,'.'),
      'Event', 'MyChess64', 'Site', 'MyChess64 — Online Chess', 'Result', getGameResult() || '*');
  }catch(e){}
  const pgn = chess.pgn({ max_width: 8 });
  if(!downloadBlob(new Blob([pgn], {type:'application/x-chess-pgn;charset=utf-8'}), 'chess-' + (roomCode||'game') + '.pgn')){
    try{ navigator.clipboard.writeText(pgn); alert('PGN download was blocked by the browser. The PGN has been copied to the clipboard.'); }catch(e){ alert('PGN export could not be started on this browser.'); }
  }
}

  if(!window.jspdf){alert('PDF export library did not load. Check your internet connection and try again.');return;}
  const {jsPDF}=window.jspdf;

  const pageW=210, pageH=297, margin=14;

  // Header — styled to match the supplied official game-record PDF.
  doc.setFillColor(12,39,66);
  doc.rect(0,0,pageW,29,'F');
  try{
    doc.addImage(MYCHESS64_LOGO,'PNG',15,3,29,19.33);
  }catch(e){}
  doc.setTextColor(255,255,255);
  doc.setFont('helvetica','bold');
  doc.setFontSize(18);
  doc.text('MyChess64',50,13);
  doc.setFont('helvetica','normal');
  doc.setFontSize(7.5);
  doc.text('OFFICIAL DIGITAL GAME RECORD  •  PEER-TO-PEER CHESS',50,19);

  // Player bar
  doc.setFillColor(255,255,255);
  doc.setDrawColor(214,224,234);
  doc.roundedRect(margin,38,pageW-2*margin,16,3,3,'FD');
  doc.setTextColor(31,45,61);
  doc.setFont('helvetica','bold');
  doc.setFontSize(9.5);
  doc.text('White - '+(n.white||'White'),margin+5,48);
  doc.text('Black - '+(n.black||'Black'),pageW-margin-5,48,{align:'right'});

  // Metadata cards
  const metaY=60, metaH=14, gap=4, metaW=(pageW-2*margin-3*gap)/4;
  const meta=[
    ['DATE',new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'})],
    ['TIME OF PLAY','Online P2P Game'],
    ['TIME CONTROL',clockPresetInfo(clockPreset).label||'Clock Off'],
    ['RESULT',resultCode ? (resultCode==='1-0'?'WHITE WON — 1-0':resultCode==='0-1'?'BLACK WON — 0-1':'DRAW — ½-½') : 'IN PROGRESS']
  ];
  meta.forEach((m,i)=>{
    const x=margin+i*(metaW+gap);
    doc.setFillColor(246,248,251);
    doc.setDrawColor(238,242,246);
    doc.roundedRect(x,metaY,metaW,metaH,2,2,'FD');
    doc.setTextColor(99,114,131);
    doc.setFont('helvetica','bold');
    doc.setFontSize(5.7);
    doc.text(m[0],x+4,metaY+5);
    doc.setTextColor(35,48,63);
    doc.setFont('helvetica','normal');
    doc.setFontSize(7.3);
    const val=String(m[1]);
    doc.text(val.length>27?val.slice(0,27)+'…':val,x+4,metaY+10);
  });

  // Moves
  doc.setTextColor(31,45,61);
  doc.setFont('helvetica','bold');
  doc.setFontSize(11);
  doc.text('MOVES',margin,82);

  const tableY=87, tableH=180, colGap=5;
  const tableW=(pageW-2*margin-colGap)/2;
  const rowH=7.0, headH=9;
  const drawMoveTable=(x, startPly, endPly)=>{
    doc.setFillColor(247,249,251);
    doc.setDrawColor(215,224,234);
    doc.roundedRect(x,tableY,tableW,tableH,3,3,'FD');
    // column separators
    const c1=x+14, c2=x+55;
    doc.line(c1,tableY,c1,tableY+tableH);
    doc.line(c2,tableY,c2,tableY+tableH);
    doc.setFont('helvetica','bold');
    doc.setFontSize(6.8);
    doc.setTextColor(82,96,112);
    doc.text('No.',x+4,tableY+6);
    doc.text('White',c1+4,tableY+6);
    doc.text('Black',c2+4,tableY+6);
    doc.setDrawColor(224,230,236);
    doc.line(x,tableY+headH,x+tableW,tableY+headH);

    let y=tableY+headH;
    doc.setFont('helvetica','normal');
    doc.setFontSize(7.2);
    for(let moveNo=Math.floor(startPly/2)+pdfNi.startNo, i=startPly; i<endPly; i+=2,moveNo++){
      if(y+rowH>tableY+tableH-1) break;

      doc.setTextColor(49,61,75);

      doc.line(x,y+rowH,x+tableW,y+rowH);
      y+=rowH;

  const half=Math.ceil(hist.length/2);
  // Split by complete moves, keeping both tables balanced like the supplied PDF.
  let leftMoves=Math.ceil(Math.ceil(hist.length/2)/2)*2;
  if(hist.length<=50) leftMoves=Math.min(50,hist.length);

  doc.text(String(hist.length/2).replace('.5','½')+' moves',pageW-margin,291,{align:'right'});

  const pdfBlob=doc.output('blob');
  if(!downloadBlob(pdfBlob,'mychess64-'+(roomCode||'game')+'.pdf')){ try{ doc.save('mychess64-'+(roomCode||'game')+'.pdf'); }catch(e){ alert('PDF export could not be started on this browser.'); } }
}

function squareName(fileIdx, rankIdx){ return 'abcdefgh'[fileIdx] + (rankIdx+1); }

function getDisplayHistory(){
  return isHost ? chess.history({verbose:true}) : (pendingGuestMove ? remoteHistory.concat([pendingGuestMove]) : remoteHistory);
}
function buildChessAtPly(history, ply){
  const g=makeChess();
  const count=Math.max(0,Math.min(Number(ply)||0,history.length));
  for(let i=0;i<count;i++){
    const m=history[i];
    try{ g.move({from:m.from,to:m.to,promotion:m.promotion||'q'}); }catch(e){}
  }
  return g;
}
function getDisplayChess(history){
  if(viewPly===null || viewPly===undefined) return chess;
  return buildChessAtPly(history,viewPly);
}
function setViewPly(ply){
  const hist=getDisplayHistory();
  const max=hist.length;
  viewPly=Math.max(0,Math.min(max,Number(ply)||0));
  selected=null;
  clearBoardAnnotations();
  renderGame();
}
function exitMoveReview(){
  if(viewPly===null || viewPly===undefined) return;
  viewPly=null; selected=null;
}
function updateMoveNavigation(hist){
  const total=hist.length;
  const current=viewPly===null || viewPly===undefined ? total : Math.max(0,Math.min(total,viewPly));
  const start=document.getElementById('navStart'), prev=document.getElementById('navPrev'), next=document.getElementById('navNext'), last=document.getElementById('navLast');
  if(start) start.disabled=current<=0;
  if(prev) prev.disabled=current<=0;
  if(next) next.disabled=current>=total;
  if(last) last.disabled=current>=total;
  const live=document.getElementById('navLive');
  if(live) live.textContent=current===total?'Live':'Review '+current+'/'+total;
}

function clearBoardAnnotations(){
  boardArrows=[]; boardCircles=[]; arrowDrag=null; clearTimeout(arrowLongPressTimer);
  const board=document.getElementById('board');
