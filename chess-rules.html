<style>

.sel option{background:var(--bg2);color:var(--ink)}:root[data-theme="light"]{color-scheme:light}:root[data-theme="dark"]{color-scheme:dark}

<script type="application/json" id="data">{"FIDE Rules of Play": [{"title": "White Moves First", "desc": "White always makes the first move.", "detail": "Players move alternately, with White making the first move and Black making the next.", "apply": "White moves first; then alternate moves.", "ref": "Article 1.2 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 1.2", "grp": "The Game & the Board"}, {"title": "The Objective Is Checkmate", "desc": "The goal is to checkmate the opponent's king.", "detail": "A player wins by placing the opponent's king under attack when the opponent has no legal move to escape.", "apply": "Checkmate wins the game.", "ref": "Article 1.4 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 1.4", "grp": "The Game & the Board"}, {"title": "You May Not Capture the King", "desc": "The king is never actually captured.", "detail": "A king may be in check, but a legal move must always prevent the king from remaining in check. Capturing the opponent's king is not permitted.", "apply": "Check must be answered; the king is never captured.", "ref": "Article 1.4.1 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 1.4.1", "grp": "The Game & the Board"}, {"title": "A Game Can Be Drawn by Impossibility of Checkmate", "desc": "If neither side can possibly checkmate, the game is drawn.", "detail": "When the position is such that no legal series of moves can result in checkmate, the game ends as a draw.", "apply": "No possible checkmate = draw.", "ref": "Article 1.5 / 5.2.2 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 1.5", "grp": "The Game & the Board"}, {"title": "The Board Has 64 Squares", "desc": "A chessboard consists of 8 files × 8 ranks.", "detail": "The board contains 64 alternating light and dark squares.", "apply": "8 × 8 = 64 squares.", "ref": "Article 2.1 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 2.1", "grp": "The Game & the Board"}, {"title": "The Right-Hand Corner Must Be White", "desc": "The square nearest each player's right hand must be white.", "detail": "Correct board orientation is essential for setting up a legal chess game.", "apply": "“White on the right.”", "ref": "Article 2.1 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 2.1", "grp": "The Game & the Board"}, {"title": "Each Player Starts With 16 Pieces", "desc": "Each side begins with 16 chessmen.", "detail": "Each player has one king, one queen, two rooks, two bishops, two knights and eight pawns.", "apply": "16 pieces per player.", "ref": "Article 2.2 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 2.2", "grp": "The Game & the Board"}, {"title": "The Initial Position Must Be Correct", "desc": "The pieces must begin in the official starting arrangement.", "detail": "Kings, queens, rooks, bishops, knights and pawns must be placed according to the FIDE initial position.", "apply": "Set the board correctly before move one.", "ref": "Article 2.3 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 2.3", "grp": "The Game & the Board"}, {"title": "Files, Ranks and Diagonals", "desc": "The board is identified by files, ranks and diagonals.", "detail": "Files run vertically, ranks horizontally, and diagonals consist of connected squares of the same colour.", "apply": "Know files, ranks and diagonals.", "ref": "Article 2.4 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 2.4", "grp": "The Game & the Board"}, {"title": "A Piece Cannot Move Onto a Friendly Piece", "desc": "You cannot move a piece onto a square occupied by your own piece.", "detail": "A piece may move to an empty square or capture an opponent's piece, subject to its legal movement.", "apply": "Your own piece blocks the square.", "ref": "Article 3.1 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 3.1", "grp": "Movement of the Pieces"}, {"title": "Capturing Removes the Opponent's Piece", "desc": "A captured piece is removed from the board.", "detail": "When a legal move captures an opponent's piece, that piece is removed as part of the same move.", "apply": "Capture = remove the captured piece.", "ref": "Article 3.1.1 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 3.1.1", "grp": "Movement of the Pieces"}, {"title": "Bishops Move Diagonally", "desc": "A bishop moves any number of squares along a diagonal.", "detail": "The bishop cannot jump over another piece.", "apply": "Bishop = diagonal movement.", "ref": "Article 3.2 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 3.2", "grp": "Movement of the Pieces"}, {"title": "Rooks Move Along Files and Ranks", "desc": "A rook moves horizontally or vertically.", "detail": "A rook may move any number of unobstructed squares along its file or rank.", "apply": "Rook = straight lines.", "ref": "Article 3.3 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 3.3", "grp": "Movement of the Pieces"}, {"title": "Queens Move Like a Rook and Bishop", "desc": "The queen moves along ranks, files and diagonals.", "detail": "The queen combines the movement of the rook and bishop but cannot jump over pieces.", "apply": "Queen = rook + bishop movement.", "ref": "Article 3.4 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 3.4", "grp": "Movement of the Pieces"}, {"title": "Sliding Pieces Cannot Jump", "desc": "Bishops, rooks and queens cannot move through pieces.", "detail": "Every square between the starting and destination squares must be clear.", "apply": "Check the path before moving.", "ref": "Article 3.5 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 3.5", "grp": "Movement of the Pieces"}, {"title": "Knights Move in an L-Shape", "desc": "A knight moves to the nearest square that is not on the same rank, file or diagonal.", "detail": "The knight's movement is effectively two squares in one direction and one perpendicular square.", "apply": "Knight = L-shape and can jump.", "ref": "Article 3.6 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 3.6", "grp": "Movement of the Pieces"}, {"title": "Knights Can Jump Over Pieces", "desc": "A knight is not blocked by intervening pieces.", "detail": "Unlike sliding pieces, a knight moves directly to its destination square.", "apply": "The knight jumps.", "ref": "Article 3.6 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 3.6", "grp": "Movement of the Pieces"}, {"title": "Pawns Move Forward", "desc": "A pawn normally moves one square forward.", "detail": "The destination square must be empty.", "apply": "Pawn moves forward but captures diagonally.", "ref": "Article 3.7.1 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 3.7.1", "grp": "Movement of the Pieces"}, {"title": "A Pawn May Move Two Squares Initially", "desc": "On its first move, a pawn may advance two squares.", "detail": "Both the intermediate square and destination square must be unoccupied.", "apply": "Two-square pawn move is available only from its starting square.", "ref": "Article 3.7.2 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 3.7.2", "grp": "Movement of the Pieces"}, {"title": "Pawns Capture Diagonally", "desc": "Pawns capture one square diagonally forward.", "detail": "A pawn cannot normally capture a piece directly in front of it.", "apply": "Move straight; capture diagonally.", "ref": "Article 3.7.3 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 3.7.3", "grp": "Movement of the Pieces"}, {"title": "En Passant", "desc": "A special pawn capture is available immediately after an opposing pawn advances two squares.", "detail": "A pawn on an adjacent file may capture that pawn as though it had advanced only one square.", "apply": "En passant must be played immediately on the next move.", "ref": "Articles 3.7.3.1–3.7.3.2 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 3.7.3.1–3.7.3.2", "grp": "Special Moves"}, {"title": "En Passant Is Optional", "desc": "You are not required to capture en passant.", "detail": "It is a legal capture opportunity, not a compulsory move.", "apply": "En passant is a choice, not an obligation.", "ref": "Article 3.7.3.1 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 3.7.3.1", "grp": "Special Moves"}, {"title": "Promotion Is Mandatory", "desc": "A pawn reaching the final rank must be promoted.", "detail": "The pawn must immediately become a queen, rook, bishop or knight of the same colour.", "apply": "Reach the last rank → promote immediately.", "ref": "Article 3.7.3.3 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 3.7.3.3", "grp": "Special Moves"}, {"title": "Promotion Is Not Limited by Captured Pieces", "desc": "You may promote to a piece even if that piece was never captured.", "detail": "You can have two or more queens, rooks, bishops or knights as a result of promotion.", "apply": "Promotion is not limited by your original pieces.", "ref": "Article 3.7.3.4 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 3.7.3.4", "grp": "Special Moves"}, {"title": "Promotion Takes Effect Immediately", "desc": "The new piece becomes effective immediately on promotion.", "detail": "The promoted piece immediately has all the movement and attacking powers of that piece.", "apply": "Promotion instantly creates the new piece.", "ref": "Article 3.7.3.5 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 3.7.3.5", "grp": "Special Moves"}, {"title": "Castling Is One King Move", "desc": "Castling moves the king two squares toward the rook and places the rook beside it.", "detail": "The king and rook move as part of one move, but the king is considered the moving piece.", "apply": "King moves two squares; rook crosses over.", "ref": "Article 3.8.2 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 3.8.2", "grp": "Special Moves"}, {"title": "Castling Rights Are Lost After King Movement", "desc": "Once the king moves, that side can never castle again.", "detail": "Even if the king returns to its original square, castling rights have been permanently lost.", "apply": "King moved once = no future castling.", "ref": "Article 3.8.2.1 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 3.8.2.1", "grp": "Special Moves"}, {"title": "Castling Rights Are Lost After Rook Movement", "desc": "Moving a rook permanently removes castling rights with that rook.", "detail": "Returning the rook to its original square does not restore the lost castling right.", "apply": "Moved rook = lost castling on that side.", "ref": "Article 3.8.2.1 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 3.8.2.1", "grp": "Special Moves"}, {"title": "You Cannot Castle Through Check", "desc": "The king cannot castle across an attacked square.", "detail": "The king's starting square, crossing square and destination square must not be under attack.", "apply": "The king cannot castle through danger.", "ref": "Article 3.8.2.2 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 3.8.2.2", "grp": "Special Moves"}, {"title": "Pieces Cannot Stand Between King and Rook", "desc": "The squares between the king and castling rook must be empty.", "detail": "Castling is not possible if any piece stands between the king and the rook.", "apply": "Clear the path before castling.", "ref": "Article 3.8.2.2 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 3.8.2.2", "grp": "Special Moves"}, {"title": "A King Is in Check When Attacked", "desc": "A king is in check when an opponent's piece attacks its square.", "detail": "The player must respond so that their king is no longer under attack.", "apply": "Check must always be answered.", "ref": "Article 3.9.1 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 3.9.1", "grp": "Check & Legal Moves"}, {"title": "You Cannot Leave Your King in Check", "desc": "No legal move may leave your own king under attack.", "detail": "A move that exposes or leaves your king in check is illegal.", "apply": "Your king must be safe after every move.", "ref": "Article 3.9.2 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 3.9.2", "grp": "Check & Legal Moves"}, {"title": "A Legal Move Must Follow Articles 3.1–3.9", "desc": "A move is legal only when all relevant movement and king-safety rules are satisfied.", "detail": "Piece movement, captures, special moves and king safety must all comply with FIDE requirements.", "apply": "Legal movement + king safety = legal move.", "ref": "Article 3.10.1 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 3.10.1", "grp": "Check & Legal Moves"}, {"title": "An Illegal Position Cannot Result From Legal Play", "desc": "A position is illegal if no sequence of legal moves could have produced it.", "detail": "This distinction is important in tournament disputes, game reconstruction and chess software.", "apply": "A legal game can only produce a legally reachable position.", "ref": "Article 3.10.3 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 3.10.3", "grp": "Check & Legal Moves"}, {"title": "Use One Hand to Make a Move", "desc": "A chess move must be played with one hand.", "detail": "This includes normal moves, captures, castling and promotion.", "apply": "One move = one hand.", "ref": "Article 4.1 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 4.1", "grp": "Touch-Move & Moving Pieces"}, {"title": "Say “J'Adoube” Before Adjusting a Piece", "desc": "Announce your intention before adjusting a piece.", "detail": "Only the player whose turn it is may adjust pieces on their squares after clearly indicating the intention, such as saying “j'adoube” or “I adjust.”", "apply": "Adjust first by declaring your intention.", "ref": "Article 4.2.1 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 4.2.1", "grp": "Touch-Move & Moving Pieces"}, {"title": "Touch-Move Rule", "desc": "Intentionally touching your own piece normally obliges you to move it.", "detail": "If you touch your own piece with the intention of moving it, you must move the first touched piece that can legally move.", "apply": "Touch with intent → move it.", "ref": "Article 4.3.1 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 4.3.1", "grp": "Touch-Move & Moving Pieces"}, {"title": "Touching an Opponent's Piece", "desc": "Intentionally touching an opponent's piece normally obliges you to capture it.", "detail": "You must capture the first opponent's piece touched that can legally be captured.", "apply": "Touch opponent's piece → capture if legal.", "ref": "Article 4.3.2 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 4.3.2", "grp": "Touch-Move & Moving Pieces"}, {"title": "Touching King and Rook for Castling", "desc": "If you deliberately touch the king and rook for castling, you must castle if legal.", "detail": "The order and circumstances of touching the pieces matter under the touch-move rule.", "apply": "Touch carefully when intending to castle.", "ref": "Article 4.4 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 4.4", "grp": "Touch-Move & Moving Pieces"}, {"title": "A Released Piece Cannot Be Moved Again", "desc": "Once you release a piece on a legal destination square, the move is made.", "detail": "After releasing the piece, you cannot change the destination square during that move.", "apply": "Release = move completed.", "ref": "Article 4.7 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 4.7", "grp": "Touch-Move & Moving Pieces"}, {"title": "Checkmate Immediately Ends the Game", "desc": "Checkmate wins instantly.", "detail": "Once a legal move produces checkmate, the game ends immediately.", "apply": "Checkmate = game over.", "ref": "Article 5.1.1 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 5.1.1", "grp": "Ending the Game"}, {"title": "Resignation Ends the Game", "desc": "A player may resign and lose immediately.", "detail": "Resignation ends the game unless the position is such that the opponent cannot possibly checkmate by any legal series of moves, in which case the result is a draw.", "apply": "Resignation normally ends the game immediately.", "ref": "Article 5.1.2 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 5.1.2", "grp": "Ending the Game"}, {"title": "Stalemate Is a Draw", "desc": "No legal move + king not in check = stalemate.", "detail": "The game ends immediately when the player to move has no legal move and their king is not attacked.", "apply": "No move and no check = draw.", "ref": "Article 5.2.1 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 5.2.1", "grp": "Ending the Game"}, {"title": "Draw by Agreement", "desc": "Players may agree to a draw when tournament regulations permit it.", "detail": "A draw offer is normally made after making a move and before pressing the clock; event regulations may restrict draw agreements.", "apply": "Follow the event's draw-offer regulations.", "ref": "Article 9.1 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 9.1", "grp": "Ending the Game"}, {"title": "Threefold Repetition", "desc": "A player can claim a draw when the same position occurs for the third time.", "detail": "The same player must have the move, with the same pieces on the same squares and the same legal possibilities, subject to the FIDE conditions.", "apply": "Three identical legal positions can allow a draw claim.", "ref": "Article 9.2 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 9.2", "grp": "Ending the Game"}, {"title": "Fifty-Move Rule", "desc": "A draw can be claimed after 50 moves by each player without a pawn move or capture.", "detail": "The claim must meet the conditions of Article 9.3, including the appropriate claim procedure.", "apply": "50 moves each without pawn move or capture → claimable draw.", "ref": "Article 9.3 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 9.3", "grp": "Ending the Game"}, {"title": "Fivefold Repetition Is Automatic", "desc": "Five occurrences of the same position result in a draw.", "detail": "Unlike threefold repetition, which is claim-based, fivefold repetition ends the game automatically under the Laws.", "apply": "Fivefold repetition = automatic draw.", "ref": "Article 9.6.1 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 9.6.1", "grp": "Ending the Game"}, {"title": "Seventy-Five-Move Rule", "desc": "75 moves by each player without a pawn move or capture normally results in a draw.", "detail": "The draw occurs automatically, except that checkmate on the last move takes precedence.", "apply": "75 moves each without pawn move or capture = draw, unless that move checkmates.", "ref": "Article 9.6.2 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 9.6.2", "grp": "Ending the Game"}, {"title": "Standard Scoring", "desc": "A win scores 1, a draw ½, and a loss 0.", "detail": "Unless tournament regulations specify otherwise, FIDE uses the standard scoring system.", "apply": "Win = 1 | Draw = ½ | Loss = 0.", "ref": "Article 10.1 FIDE Handbook", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 10.1", "grp": "Competitive Play"}, {"title": "Players Must Follow the Laws and Maintain Fair Play", "desc": "Players must behave fairly and follow the Laws of Chess.", "detail": "Players may not use unauthorized information or electronic devices, distract opponents, interfere with games, or deliberately violate the Laws. The arbiter can impose penalties for violations.", "apply": "Play legally, fairly and respectfully.", "ref": "Articles 11.1–11.7 and 12.1–12.9", "lens": "FIDE Law", "refLabel": "Official reference", "badge": "Art. 11.1–11.7", "grp": "Competitive Play"}], "30 Opening Fundamental Theories": [{"title": "Control the Centre", "desc": "Control the central squares with pawns and pieces.", "detail": "The centre gives your pieces greater mobility and allows faster development. Central control can be achieved directly with pawns or indirectly with pieces.", "apply": "Always ask: “Who controls the centre?”", "lens": "Opening principle"}, {"title": "Develop Your Pieces", "desc": "Bring your knights and bishops into active positions quickly.", "detail": "Development prepares your army for attack and defence while improving coordination. Undeveloped pieces often become a long-term weakness.", "apply": "Develop before launching unnecessary attacks.", "lens": "Opening principle"}, {"title": "Develop with a Purpose", "desc": "Every developing move should improve your position.", "detail": "A piece should ideally move to a square where it controls important areas, supports the centre, or prepares future plans.", "apply": "Don't develop a piece just because you can.", "lens": "Opening principle"}, {"title": "Castle Early", "desc": "Protect your king and connect your rooks as soon as practical.", "detail": "Castling usually moves the king to safety and activates a rook. Delaying castling can leave the king exposed in the centre.", "apply": "King safety comes before attacking.", "lens": "Opening principle"}, {"title": "Don't Move the Same Piece Repeatedly", "desc": "Avoid wasting opening tempi by moving one piece again and again.", "detail": "Repeated moves allow your opponent to develop while you spend moves on the same piece. Exceptions exist when the repeated move gains something concrete.", "apply": "One move should ideally develop one new piece.", "lens": "Opening principle"}, {"title": "Don't Bring the Queen Out Too Early", "desc": "Avoid unnecessary early queen adventures.", "detail": "The queen is valuable and can become a target for developing pieces. Early queen moves are justified when they accomplish something concrete.", "apply": "Ask whether your queen move gains more than it loses.", "lens": "Opening principle"}, {"title": "Connect the Rooks", "desc": "Complete development so your rooks can support each other.", "detail": "Once the minor pieces are developed and the king has usually castled, the queen moves appropriately and the rooks become connected.", "apply": "Connected rooks usually mean your opening is nearly complete.", "lens": "Opening principle"}, {"title": "Don't Make Too Many Pawn Moves", "desc": "Use pawn moves purposefully during development.", "detail": "Pawns cannot move backwards, so unnecessary pawn moves can waste time and create permanent weaknesses.", "apply": "Every pawn move should have a reason.", "lens": "Opening principle"}, {"title": "Establish a Strong Pawn Centre", "desc": "Build a pawn structure that controls important central squares.", "detail": "A strong centre can restrict enemy pieces and provide space for your own army. However, occupying the centre is not always necessary if it can be challenged effectively.", "apply": "Claim the centre when it supports your position.", "lens": "Opening principle"}, {"title": "Attack the Opponent's Centre", "desc": "Challenge enemy central pawns rather than allowing them unlimited space.", "detail": "Striking at the centre with pawns or pieces can undermine the opponent's structure and gain counterplay.", "apply": "If your opponent builds a centre, look for a way to challenge it.", "lens": "Opening principle"}, {"title": "Maintain King Safety", "desc": "Keep your king protected from early tactical attacks.", "detail": "An exposed king can become the target of rapid attacks before your pieces are ready to defend it.", "apply": "Before every opening attack, check your king's safety.", "lens": "Opening principle"}, {"title": "Develop Knights Before Bishops When Appropriate", "desc": "Knights often have natural developing squares that help control the centre.", "detail": "Knights can usually develop without deciding the future of their bishops. However, this is a guideline rather than an absolute rule.", "apply": "Look for the best developing square, not a rigid sequence.", "lens": "Opening principle"}, {"title": "Don't Block Your Pieces", "desc": "Avoid placing pawns or pieces where they restrict your own army.", "detail": "Good opening moves create lines and squares for your pieces. Poorly placed pawns can trap bishops and restrict mobility.", "apply": "Before moving a pawn, see which pieces it blocks.", "lens": "Opening principle"}, {"title": "Develop Toward the Centre", "desc": "Place pieces where they influence central and active squares.", "detail": "Centralized pieces generally have more options and can quickly switch between attack and defence.", "apply": "Prefer active squares over passive ones.", "lens": "Opening principle"}, {"title": "Don't Grab Pawns Without Calculation", "desc": "Material should not be taken blindly in the opening.", "detail": "An apparently free pawn may be poisoned because capturing it can lose development, expose the king, or allow a tactical attack.", "apply": "Before taking a pawn, ask: “What happens next?”", "lens": "Opening principle"}, {"title": "Avoid Premature Attacks", "desc": "Don't attack before your pieces are ready.", "detail": "Early attacks with undeveloped pieces often fail because the attacker lacks sufficient support. Development and king safety usually come first.", "apply": "Build the army before starting the battle.", "lens": "Opening principle"}, {"title": "Gain Space Carefully", "desc": "Use pawns to gain useful territory without creating unnecessary weaknesses.", "detail": "More space can restrict the opponent, but advanced pawns can also become targets and leave weaknesses behind them.", "apply": "Space is useful only when you can support it.", "lens": "Opening principle"}, {"title": "Value Time — Understand the Tempo", "desc": "Every opening move should contribute to your development or position.", "detail": "A tempo is essentially a useful move. Losing tempi allows your opponent to gain development, space, or initiative.", "apply": "Don't spend a tempo without gaining something.", "lens": "Opening principle"}, {"title": "Complete Development Before Starting a Middlegame Attack", "desc": "Bring most of your pieces into the game before committing to major attacks.", "detail": "An attack is stronger when your pieces are coordinated and your king is safe. Underdevelopment can make an attack collapse.", "apply": "Count your developed pieces before attacking.", "lens": "Opening principle"}, {"title": "Don't Bring Your King Into Danger", "desc": "Keep the king safe and avoid unnecessary king moves in the opening.", "detail": "Moving the king before castling can lose castling rights and expose it to tactical threats. There are exceptions in specific positions.", "apply": "Don't move your king unless there is a clear reason.", "lens": "Opening principle"}, {"title": "Understand the Value of Open Lines", "desc": "Use open files, ranks and diagonals to activate your pieces.", "detail": "Open lines allow rooks, bishops and queens to attack targets from a distance. Opening a line should benefit your pieces more than your opponent's.", "apply": "Ask which pieces benefit when a line opens.", "lens": "Opening principle"}, {"title": "Develop the Bishop to a Useful Diagonal", "desc": "Bishops should ideally occupy diagonals where they influence important squares.", "detail": "A well-developed bishop can control the centre, pressure the opponent's king, or target weaknesses from a distance.", "apply": "Don't develop a bishop—develop it with a plan.", "lens": "Opening principle"}, {"title": "Avoid Creating Weak Squares", "desc": "Be careful when pawn moves permanently weaken important squares.", "detail": "A pawn move can remove control of a square that can later become an outpost for an enemy piece.", "apply": "Before a pawn move, check which squares you stop controlling.", "lens": "Opening principle"}, {"title": "Fight for the Initiative", "desc": "Try to make moves that create threats and force useful responses.", "detail": "The initiative means having the ability to make active threats and influence the opponent's choices. Development and central control often help create it.", "apply": "Look for moves that make your opponent respond.", "lens": "Opening principle"}, {"title": "Coordinate Your Pieces", "desc": "Your pieces should support each other and work toward common goals.", "detail": "Individual pieces may be strong, but coordinated pieces create tactical and strategic power. Good opening moves improve cooperation between them.", "apply": "Ask: “Are my pieces working together?”", "lens": "Opening principle"}, {"title": "Know When to Exchange Pieces", "desc": "Exchanges should serve a positional or tactical purpose.", "detail": "Trading a developed piece for an undeveloped piece may help the opponent, while favourable exchanges can remove defenders or improve your structure.", "apply": "Don't exchange automatically—know why you're exchanging.", "lens": "Opening principle"}, {"title": "Don't Develop Into a Tactical Trap", "desc": "A developing move must still be tactically safe.", "detail": "A piece can appear beautifully developed but actually become vulnerable to a pawn attack, pin, fork, or tactical combination.", "apply": "After every move, check your opponent's forcing moves.", "lens": "Opening principle"}, {"title": "Prepare Pawn Breaks", "desc": "Plan the right pawn break to challenge the opponent's position.", "detail": "Pawn breaks can open lines, challenge the centre, gain space, or create weaknesses. Timing is often more important than the break itself.", "apply": "Ask: “What pawn break improves my position?”", "lens": "Opening principle"}, {"title": "Don't Play the Opening on Autopilot", "desc": "Opening principles guide you, but every position must be calculated individually.", "detail": "Principles are not absolute rules. A tactical opportunity, concrete threat, or unusual position may require you to violate a general principle.", "apply": "Principles guide your moves; calculation decides them.", "lens": "Opening principle"}, {"title": "Finish the Opening With a Plan", "desc": "Development should lead naturally toward a clear middlegame plan.", "detail": "A good opening doesn't simply produce developed pieces—it creates a position where you know what to improve, attack, or prepare next.", "apply": "Don't ask only “What is my next move?”—ask “What is my plan?”", "lens": "Opening principle"}], "50 Middlegame Techniques & Tips": [{"title": "Improve Your Worst-Placed Piece", "desc": "Find your least active piece and improve it.", "detail": "A poorly placed piece often limits your whole position. Reposition it to a more active square where it can influence the game.", "apply": "Always ask: “Which of my pieces is doing the least?”", "lens": "Middlegame technique"}, {"title": "Create a Middlegame Plan", "desc": "Play with a clear positional or tactical objective.", "detail": "A plan connects your moves and prevents random play. Your plan may involve an attack, pawn break, exchange, or improvement of a piece.", "apply": "Don't just find a move—find a plan.", "lens": "Middlegame technique"}, {"title": "Look for Forcing Moves First", "desc": "Check checks, captures and threats before quiet moves.", "detail": "Forcing moves reduce the opponent's choices and often reveal tactical opportunities. They should be examined before slower positional ideas.", "apply": "Think: Checks → Captures → Threats.", "lens": "Middlegame technique"}, {"title": "Identify Your Opponent's Threat", "desc": "Understand what your opponent wants to do.", "detail": "Many mistakes occur because players focus only on their own plans. Recognizing an immediate threat allows you to respond accurately.", "apply": "Before your plan, ask: “What is my opponent threatening?”", "lens": "Middlegame technique"}, {"title": "Improve Piece Activity", "desc": "Place every piece on its most useful square.", "detail": "Active pieces control more squares and participate in tactical and positional operations. Passive pieces often become targets.", "apply": "Active pieces create opportunities.", "lens": "Middlegame technique"}, {"title": "Control the Centre", "desc": "Maintain influence over important central squares.", "detail": "Central control gives your pieces mobility and helps coordinate attacks on both wings.", "apply": "Central control means greater freedom.", "lens": "Middlegame technique"}, {"title": "Use Open Files", "desc": "Place rooks on open or semi-open files.", "detail": "Open files provide rooks with direct access to enemy pawns, pieces and sometimes the king.", "apply": "Put your rook where the file gives it a target.", "lens": "Middlegame technique"}, {"title": "Occupy the Seventh Rank", "desc": "Use an active rook on the opponent's seventh rank when possible.", "detail": "A rook on the seventh rank can attack pawns, restrict the king and create serious threats.", "apply": "A protected seventh-rank rook can be extremely powerful.", "lens": "Middlegame technique"}, {"title": "Create an Outpost", "desc": "Establish a strong square that an enemy pawn cannot easily attack.", "detail": "An outpost, especially for a knight, can become a permanent base for attacking important targets.", "apply": "Look for protected squares that enemy pawns cannot challenge.", "lens": "Middlegame technique"}, {"title": "Attack Weak Pawns", "desc": "Target pawns that cannot be easily defended or advanced.", "detail": "Weak pawns become long-term targets and can force the opponent into passive defence.", "apply": "Attack weaknesses, not just pieces.", "lens": "Middlegame technique"}, {"title": "Create a Pawn Break", "desc": "Use a pawn advance to open or challenge the position.", "detail": "A well-timed pawn break can open files, diagonals and create new weaknesses in the opponent's structure.", "apply": "Ask: “Which pawn break changes the position in my favour?”", "lens": "Middlegame technique"}, {"title": "Calculate Before Capturing", "desc": "Never assume a capture is automatically good.", "detail": "Capturing can open lines, expose your king, remove a defender or allow a tactical response.", "apply": "After every capture, calculate the opponent's reply.", "lens": "Middlegame technique"}, {"title": "Calculate Candidate Moves", "desc": "Compare several strong moves before choosing one.", "detail": "Instead of playing the first move you see, identify two or three candidates and calculate their consequences.", "apply": "Find candidates, calculate, then choose.", "lens": "Middlegame technique"}, {"title": "Calculate Variations", "desc": "Visualize the position several moves ahead.", "detail": "Accurate calculation requires seeing the resulting position rather than stopping after your own move.", "apply": "Calculate until the position becomes clear.", "lens": "Middlegame technique"}, {"title": "Use Tactical Motifs", "desc": "Look for forks, pins, skewers, discovered attacks and other combinations.", "detail": "Tactical patterns frequently arise when pieces are aligned, overloaded or insufficiently defended.", "apply": "Train your eyes to recognize tactical patterns.", "lens": "Middlegame technique"}, {"title": "Attack the King When Appropriate", "desc": "Exploit weaknesses around an exposed king.", "detail": "A king with limited defenders or weakened pawn cover can become a tactical target. Attack only when enough pieces can participate.", "apply": "Bring more attackers than defenders.", "lens": "Middlegame technique"}, {"title": "Don't Attack Without Enough Pieces", "desc": "Build sufficient attacking power before sacrificing or attacking.", "detail": "An attack with too few pieces often fails and leaves material or positional weaknesses behind.", "apply": "Count your attackers before attacking.", "lens": "Middlegame technique"}, {"title": "Open Lines Toward the King", "desc": "Open files, ranks or diagonals that lead toward the enemy king.", "detail": "Open lines allow queens, rooks and bishops to join an attack quickly.", "apply": "Open lines only when your pieces can use them.", "lens": "Middlegame technique"}, {"title": "Defend Actively", "desc": "Look for defensive moves that also create counterplay.", "detail": "Passive defence can leave you under pressure. Active defence may attack the opponent's pieces or create threats of its own.", "apply": "The best defence often contains a threat.", "lens": "Middlegame technique"}, {"title": "Exchange the Right Piece", "desc": "Exchange pieces according to the needs of the position.", "detail": "Remove an important attacker, exchange your bad piece, or enter a favourable endgame—but avoid exchanges that improve the opponent's position.", "apply": "Exchange with a purpose.", "lens": "Middlegame technique"}, {"title": "Preserve Your Good Bishop", "desc": "Protect a bishop that is performing an important role.", "detail": "A strong bishop can control key diagonals, support an attack and restrict enemy pieces.", "apply": "Don't trade your strongest piece without a reason.", "lens": "Middlegame technique"}, {"title": "Fight Against the Opponent's Best Piece", "desc": "Restrict or exchange the opponent's strongest piece.", "detail": "A dominant knight, bishop, rook or queen can control the game if left alone. Reducing its influence can dramatically improve your position.", "apply": "Ask: “Which enemy piece is strongest?”", "lens": "Middlegame technique"}, {"title": "Create Two Weaknesses", "desc": "Make the opponent defend weaknesses on more than one side.", "detail": "Defending one weakness may be easy, but two separated weaknesses can stretch the opponent's pieces and create tactical opportunities.", "apply": "One weakness is defendable; two can be decisive.", "lens": "Middlegame technique"}, {"title": "Use the Principle of Two Weaknesses", "desc": "Attack one weakness while creating another.", "detail": "A strong position often becomes winning when the opponent cannot defend multiple targets simultaneously.", "apply": "Make your opponent solve two problems at once.", "lens": "Middlegame technique"}, {"title": "Restrict Enemy Pieces", "desc": "Take away useful squares from your opponent's pieces.", "detail": "Restriction can make enemy pieces passive and prevent them from supporting important plans.", "apply": "Good moves reduce your opponent's options.", "lens": "Middlegame technique"}, {"title": "Create Space", "desc": "Gain useful territory when it can be supported.", "detail": "Space allows your pieces to maneuver and can restrict the opponent's army. However, excessive expansion can create targets.", "apply": "Gain space only when you can control it.", "lens": "Middlegame technique"}, {"title": "Don't Rush", "desc": "Improve your position before forcing unnecessary action.", "detail": "When there is no immediate tactic, improving your worst piece or strengthening your position may be stronger than forcing a premature attack.", "apply": "When there is no tactic, improve your position.", "lens": "Middlegame technique"}, {"title": "Maintain Pawn Structure", "desc": "Avoid unnecessary structural weaknesses.", "detail": "Doubled, isolated, backward or weak pawns can become long-term targets. Pawn structure should support your pieces and plans.", "apply": "Every pawn move leaves a permanent footprint.", "lens": "Middlegame technique"}, {"title": "Understand Pawn Chains", "desc": "Attack the base of a pawn chain.", "detail": "In a connected pawn chain, the front pawns are usually supported by pawns behind them. The base is often the logical target.", "apply": "Attack the foundation, not the tip.", "lens": "Middlegame technique"}, {"title": "Play on the Correct Wing", "desc": "Choose the side of the board where you have the best chances.", "detail": "You may attack on the kingside, queenside or centre depending on space, pawn structure and piece activity.", "apply": "Attack where your pieces are strongest.", "lens": "Middlegame technique"}, {"title": "Create a Passed Pawn", "desc": "Try to create a pawn with no enemy pawn blocking its path.", "detail": "A passed pawn can become a major long-term asset because the opponent must devote pieces to stopping it.", "apply": "A passed pawn is a potential promotion threat.", "lens": "Middlegame technique"}, {"title": "Stop the Opponent's Passed Pawn", "desc": "Blockade or attack dangerous passed pawns immediately.", "detail": "A passed pawn becomes stronger as it advances. A well-placed piece can blockade it and prevent further progress.", "apply": "Stop passed pawns before they become dangerous.", "lens": "Middlegame technique"}, {"title": "Use the Blockade", "desc": "Place a piece directly in front of an enemy passed pawn.", "detail": "Knights and other pieces can prevent a passed pawn from advancing while remaining active elsewhere.", "apply": "Blockade first; attack later.", "lens": "Middlegame technique"}, {"title": "Activate the King", "desc": "Bring the king toward the centre when it is safe.", "detail": "In simplified middlegames and transitions to the endgame, the king becomes an active fighting piece.", "apply": "A safe active king is a powerful piece.", "lens": "Middlegame technique"}, {"title": "Use Rooks Behind Passed Pawns", "desc": "Place rooks behind passed pawns whenever appropriate.", "detail": "A rook behind a passed pawn can support its advance or attack an enemy passed pawn from behind.", "apply": "Remember the power of the rook behind the pawn.", "lens": "Middlegame technique"}, {"title": "Improve Your Worst-Placed Rook", "desc": "Activate a passive rook by changing its file or rank.", "detail": "Rooks often need open files, targets or entry squares to become effective. Don't leave one rook inactive.", "apply": "Make both rooks participate.", "lens": "Middlegame technique"}, {"title": "Centralize the Queen Carefully", "desc": "Place the queen where it is active but cannot easily be attacked.", "detail": "A centralized queen can support attacks and defend important squares, but it must avoid unnecessary exposure to enemy pieces.", "apply": "Active queen, safe queen.", "lens": "Middlegame technique"}, {"title": "Look for Zwischenzug", "desc": "Consider an intermediate move before making the obvious capture.", "detail": "A check, threat or tactical attack between exchanges can change the calculation completely.", "apply": "Before recapturing, ask: “Do I have an in-between move?”", "lens": "Middlegame technique"}, {"title": "Watch for Overloaded Pieces", "desc": "Attack pieces that are defending too many important things.", "detail": "An overloaded defender may be unable to perform all its defensive duties when faced with a tactical threat.", "apply": "One defender with too many jobs is a tactical target.", "lens": "Middlegame technique"}, {"title": "Remove the Defender", "desc": "Eliminate a key defending piece before attacking its target.", "detail": "Many combinations work because the main defender is exchanged, captured or distracted.", "apply": "Find the defender before attacking the target.", "lens": "Middlegame technique"}, {"title": "Use Deflection", "desc": "Force an enemy piece away from an important defensive square.", "detail": "A tactical sacrifice or threat can make a defender abandon its duty, allowing the real combination to succeed.", "apply": "Move the defender away, then strike.", "lens": "Middlegame technique"}, {"title": "Use Zwischenattack", "desc": "Insert a forcing attack before completing your original plan.", "detail": "An intermediate check, capture or threat can gain material or improve the resulting position before the expected continuation.", "apply": "Look for forcing moves between exchanges.", "lens": "Middlegame technique"}, {"title": "Keep the Initiative", "desc": "Continue making useful threats when you have active play.", "detail": "Giving the opponent unnecessary time to reorganize can allow them to equalize. Maintain pressure when it is justified.", "apply": "When you have the initiative, make your opponent solve problems.", "lens": "Middlegame technique"}, {"title": "Know When to Simplify", "desc": "Exchange pieces when the resulting position is favourable.", "detail": "Simplification can convert an advantage, remove counterplay or enter a technically winning endgame.", "apply": "If simplification improves your position, don't fear exchanges.", "lens": "Middlegame technique"}, {"title": "Avoid Unnecessary Simplification", "desc": "Don't exchange pieces when you need attacking chances or complications.", "detail": "If you are behind, automatic exchanges may make the opponent's advantage easier to convert. Keep practical chances when appropriate.", "apply": "Don't simplify into a position you cannot save.", "lens": "Middlegame technique"}, {"title": "Calculate Your Opponent's Best Reply", "desc": "Always assume your opponent will find their strongest response.", "detail": "A move is only good if it survives the opponent's best defensive or tactical resource.", "apply": "After finding your move, find their strongest reply.", "lens": "Middlegame technique"}, {"title": "Think in Terms of Prophylaxis", "desc": "Prevent the opponent's plan before it becomes dangerous.", "detail": "Prophylactic moves restrict enemy pawn breaks, piece activity, tactical ideas or strategic plans.", "apply": "Ask: “What does my opponent want?”", "lens": "Middlegame technique"}, {"title": "Manage Your Time", "desc": "Spend more time on critical positions and less on obvious moves.", "detail": "Not every move deserves equal calculation time. Think deeply when the position changes or tactics are possible.", "apply": "Use your clock where the position demands it.", "lens": "Middlegame technique"}, {"title": "Recognize the Transition to the Endgame", "desc": "Know when the middlegame is turning into an endgame.", "detail": "Exchanges can change the value of king activity, pawn structure and piece activity. Your plan should change accordingly.", "apply": "When pieces disappear, change your thinking.", "lens": "Middlegame technique"}, {"title": "Always Look for the Best Move", "desc": "Combine tactics, strategy and calculation before deciding.", "detail": "Strong middlegame play comes from balancing immediate tactical opportunities with long-term positional improvements.", "apply": "Calculate the position, understand the plan, then play the best move.", "lens": "Middlegame technique"}], "101 Endgame Golden Theories": [{"title": "Activate Your King", "desc": "The king becomes a powerful fighting piece in the endgame.", "detail": "With fewer pieces on the board, the king can safely move toward the centre and support pawns and attacks.", "apply": "In the endgame, bring your king toward the action.", "lens": "Endgame theory"}, {"title": "Centralize the King", "desc": "Place your king as close to the centre as safely possible.", "detail": "A centralized king can reach both wings faster and control important squares.", "apply": "Central king = active king.", "lens": "Endgame theory"}, {"title": "Opposition", "desc": "Place your king directly opposite the enemy king with an odd number of squares between them.", "detail": "Opposition is a fundamental king-and-pawn technique used to gain key squares and force the enemy king backward.", "apply": "Learn opposition before studying pawn endings.", "lens": "Endgame theory"}, {"title": "Direct Opposition", "desc": "The kings face each other on the same rank or file.", "detail": "The player who does not have the move can often maintain the opposition and force the opponent's king to give way.", "apply": "Whoever moves may lose the opposition.", "lens": "Endgame theory"}, {"title": "Distant Opposition", "desc": "The kings are separated by several squares but remain on the same rank or file.", "detail": "The distance between the kings can still determine who obtains the opposition after both kings advance.", "apply": "Count the squares between the kings.", "lens": "Endgame theory"}, {"title": "Diagonal Opposition", "desc": "Kings use diagonal spacing to achieve a corresponding opposition effect.", "detail": "Diagonal king positions can control critical squares when direct opposition is unavailable.", "apply": "Opposition is about key squares, not just straight lines.", "lens": "Endgame theory"}, {"title": "Key Squares", "desc": "Identify the squares your king must reach to win the pawn.", "detail": "A pawn often wins only if its king reaches certain critical squares ahead of it.", "apply": "Find the key squares before pushing the pawn.", "lens": "Endgame theory"}, {"title": "Rule of the Square", "desc": "Use the pawn's square to determine whether the enemy king can catch it.", "detail": "Imagine a square extending from the pawn to its promotion rank; if the opposing king can enter that square, it may catch the pawn.", "apply": "Draw the square before calculating a pawn race.", "lens": "Endgame theory"}, {"title": "Passed Pawn", "desc": "A passed pawn has no enemy pawn blocking or controlling its path forward.", "detail": "Passed pawns become increasingly dangerous as they advance because the opponent must dedicate pieces to stopping them.", "apply": "Create and protect passed pawns.", "lens": "Endgame theory"}, {"title": "Protected Passed Pawn", "desc": "Support a passed pawn with another pawn or piece.", "detail": "A protected passer is harder to blockade or capture and can tie down enemy pieces.", "apply": "A protected passed pawn can decide the game.", "lens": "Endgame theory"}, {"title": "Outside Passed Pawn", "desc": "Create a passed pawn far away from the main battle.", "detail": "An outside passer can distract the enemy king while your king attacks pawns elsewhere.", "apply": "Make the enemy king choose between two fronts.", "lens": "Endgame theory"}, {"title": "Connected Passed Pawns", "desc": "Keep two passed pawns close enough to support each other.", "detail": "Connected passers can be extremely difficult to stop because one pawn may protect the other as they advance.", "apply": "Connected passers are stronger together.", "lens": "Endgame theory"}, {"title": "Blockade the Passed Pawn", "desc": "Stop a dangerous passed pawn by placing a piece directly in front of it.", "detail": "A well-placed king, knight or rook can prevent the pawn from advancing while maintaining defensive control.", "apply": "Stop the pawn before chasing it.", "lens": "Endgame theory"}, {"title": "Pawn Breakthrough", "desc": "Use a tactical pawn sacrifice to create a passed pawn.", "detail": "A breakthrough often involves advancing or sacrificing one pawn so another pawn can escape and promote.", "apply": "Calculate pawn breaks before pushing blindly.", "lens": "Endgame theory"}, {"title": "Opposition Before Pawn Push", "desc": "Gain the correct king position before advancing the pawn.", "detail": "An unnecessary pawn push can give the opponent the opposition and draw a winning position.", "apply": "King first, pawn second.", "lens": "Endgame theory"}, {"title": "Don't Push Pawns Automatically", "desc": "Every pawn move should have a concrete purpose.", "detail": "Pawn moves cannot be reversed and can change the outcome of an ending permanently.", "apply": "Think twice before every pawn push.", "lens": "Endgame theory"}, {"title": "Pawn Moves Lose Tempi", "desc": "A pawn move can change who has the move at a critical moment.", "detail": "In king-and-pawn endings, a single tempo can determine whether you obtain opposition or lose it.", "apply": "Count pawn tempi carefully.", "lens": "Endgame theory"}, {"title": "Reserve Pawn Tempi", "desc": "Keep useful pawn moves available when possible.", "detail": "A spare pawn move can force the opponent to move first and allow you to gain the opposition.", "apply": "A spare pawn move can be a winning weapon.", "lens": "Endgame theory"}, {"title": "Zugzwang", "desc": "Force the opponent to move when every move worsens their position.", "detail": "Zugzwang is especially powerful in king-and-pawn endings, where one unnecessary move can surrender a key square.", "apply": "Sometimes the best move is to make your opponent move.", "lens": "Endgame theory"}, {"title": "Triangulation", "desc": "Use three king moves to return to a similar position but change the move.", "detail": "Triangulation can transfer the move to the opponent and create zugzwang or opposition.", "apply": "Triangulation changes the move without changing the position much.", "lens": "Endgame theory"}, {"title": "Corresponding Squares", "desc": "Use matching squares to control the opponent's king.", "detail": "In complex pawn endings, each king square may correspond to a specific square the other king must occupy.", "apply": "Study the square relationship, not just the distance.", "lens": "Endgame theory"}, {"title": "King Behind the Pawn", "desc": "Position the king behind its pawn when appropriate.", "detail": "A king behind a pawn can support its advance while preventing the enemy king from approaching from behind.", "apply": "Use the king to escort the pawn.", "lens": "Endgame theory"}, {"title": "King in Front of the Pawn", "desc": "Get the king ahead of the pawn whenever possible.", "detail": "The king in front can control promotion squares and force the enemy king away.", "apply": "The king often leads while the pawn follows.", "lens": "Endgame theory"}, {"title": "Rook Behind the Passed Pawn", "desc": "Place the rook behind a passed pawn.", "detail": "A rook behind the pawn can support its advance or attack an enemy pawn from behind.", "apply": "Rooks are often strongest behind passed pawns.", "lens": "Endgame theory"}, {"title": "Rook Behind the Enemy Passed Pawn", "desc": "Attack a dangerous enemy passed pawn from behind.", "detail": "A rook can usually attack a pawn from behind while maintaining distance and flexibility.", "apply": "Attack passed pawns from behind when possible.", "lens": "Endgame theory"}, {"title": "Rook on the Sixth Rank", "desc": "Use the rook actively on the sixth rank when it supports your plan.", "detail": "A rook on the sixth rank can attack pawns, restrict the king and support a passed pawn.", "apply": "Active rook placement matters more than passive defence.", "lens": "Endgame theory"}, {"title": "Rook on the Seventh Rank", "desc": "Use the seventh rank to attack pawns and restrict the enemy king.", "detail": "A rook on the seventh can often attack multiple weaknesses and create mating or promotion threats.", "apply": "The seventh rank is a major attacking zone.", "lens": "Endgame theory"}, {"title": "Rook Cut-Off", "desc": "Use your rook to prevent the enemy king from approaching.", "detail": "A rook can cut the enemy king off along a rank or file, increasing the distance between the king and the action.", "apply": "Cut off the king before attacking the pawns.", "lens": "Endgame theory"}, {"title": "Lucena Position", "desc": "Learn the fundamental winning position for rook versus rook with a pawn.", "detail": "The Lucena technique shows how the stronger side builds a bridge to escape checks and promote the pawn.", "apply": "Lucena = build the bridge and promote.", "lens": "Endgame theory"}, {"title": "Philidor Position", "desc": "Learn the fundamental defensive method in rook endings.", "detail": "The defending rook controls the key rank and uses checking ideas to prevent the enemy king from advancing.", "apply": "Philidor = stop the king from crossing the key rank.", "lens": "Endgame theory"}, {"title": "Vancura Defence", "desc": "Use lateral rook checks and side attacks against certain rook-and-pawn positions.", "detail": "Vancura's method can save specific rook endings when the defending king cannot approach the pawn directly.", "apply": "Know the Vancura setup for rook-versus-rook endings.", "lens": "Endgame theory"}, {"title": "Checking Distance", "desc": "Keep enough distance to check the enemy king safely.", "detail": "A rook often needs lateral distance to give repeated checks without being attacked by the king.", "apply": "Check from a safe distance.", "lens": "Endgame theory"}, {"title": "Don't Give Useless Checks", "desc": "Every check should serve a purpose.", "detail": "Repeated checks without progress can lose tempi, allow the enemy king to improve, or permit the opponent to hide behind pieces.", "apply": "Check only when the check improves your position.", "lens": "Endgame theory"}, {"title": "Rook Activity Over Pawn Saving", "desc": "Active rook play is often more important than defending every pawn.", "detail": "A passive rook can allow the opponent's king to penetrate. Active checking or counterplay may provide better defence.", "apply": "An active rook can save more than a pawn.", "lens": "Endgame theory"}, {"title": "Rook Endgames Need Activity", "desc": "Keep the rook active rather than passively defending.", "detail": "Rook endings are highly dynamic; active rooks can attack pawns, check kings and create counterplay.", "apply": "Activity is often the best defence.", "lens": "Endgame theory"}, {"title": "King and Rook Coordination", "desc": "Coordinate your king and rook instead of using them independently.", "detail": "The king restricts the enemy king while the rook attacks from distance. Their coordination is essential for winning.", "apply": "King restricts; rook attacks.", "lens": "Endgame theory"}, {"title": "Don't Put the Rook in Front of Your Passed Pawn", "desc": "Avoid blocking your own pawn with the rook unless there is a concrete reason.", "detail": "A rook in front can sometimes protect the pawn, but it may also lose valuable checking distance and activity.", "apply": "Give your rook room to work.", "lens": "Endgame theory"}, {"title": "Bishop and Pawn vs King", "desc": "Understand when a bishop can support a pawn to promotion.", "detail": "The bishop must control important squares while the king supports the pawn's advance. Some positions are drawn because the bishop controls the wrong colour.", "apply": "Know the bishop's promotion-square colour.", "lens": "Endgame theory"}, {"title": "Wrong-Coloured Bishop", "desc": "A bishop may be unable to control the pawn's promotion square.", "detail": "In certain bishop-and-rook-pawn endings, the defending king can hold a draw when the bishop controls the wrong colour of square.", "apply": "Check the colour of the promotion square.", "lens": "Endgame theory"}, {"title": "Bishop vs Knight", "desc": "Understand the different strengths of bishops and knights.", "detail": "Bishops generally excel in open positions, while knights often perform better in closed positions with stable central outposts.", "apply": "Open board favors bishops; closed board often favors knights.", "lens": "Endgame theory"}, {"title": "Good Bishop vs Bad Bishop", "desc": "A good bishop operates outside its own pawn chain.", "detail": "A bishop blocked by its own pawns may become passive, while a bishop with open diagonals can influence both sides of the board.", "apply": "Free your bishop's diagonals.", "lens": "Endgame theory"}, {"title": "Bishop on Both Wings", "desc": "Use the bishop's long-range ability to influence both sides.", "detail": "A bishop can switch between kingside and queenside targets faster than a king or knight.", "apply": "Use long diagonals to attack distant weaknesses.", "lens": "Endgame theory"}, {"title": "Knight Outpost in the Endgame", "desc": "Establish a protected central square for the knight.", "detail": "A knight on a strong outpost can dominate important squares and attack pawns or restrict the enemy king.", "apply": "A centralized knight can dominate an ending.", "lens": "Endgame theory"}, {"title": "Knight and Pawn Coordination", "desc": "Coordinate the knight with the pawn's promotion route.", "detail": "Knights cannot lose tempi like bishops, so their placement must be calculated carefully to control key squares.", "apply": "Know exactly which squares your knight controls.", "lens": "Endgame theory"}, {"title": "Knight's Edge of the Board", "desc": "Avoid placing a knight on the edge without a concrete purpose.", "detail": "A knight on the rim controls fewer squares and may struggle to influence the centre.", "apply": "A knight needs central squares to stay effective.", "lens": "Endgame theory"}, {"title": "Use the King to Attack Pawns", "desc": "The king should actively target enemy pawns.", "detail": "In many endgames, capturing a pawn is more important than protecting your own pawn immediately.", "apply": "Your king is an attacking piece.", "lens": "Endgame theory"}, {"title": "Attack From Behind", "desc": "Approach enemy pawns from the rear or side when possible.", "detail": "Attacking from behind can force the opponent's king into passive defence and make pawn advances difficult.", "apply": "Find the safest route to the target.", "lens": "Endgame theory"}, {"title": "Create a Second Weakness", "desc": "Force the opponent to defend two separate targets.", "detail": "A king or piece may defend one weakness, but a second weakness can overload the defence and allow penetration.", "apply": "Two weaknesses can stretch the defence beyond its limits.", "lens": "Endgame theory"}, {"title": "Zugzwang in Piece Endings", "desc": "Use waiting moves to force the opponent into a concession.", "detail": "Zugzwang is not limited to pawn endings; it can also decide bishop, knight and rook endings.", "apply": "Look for useful waiting moves.", "lens": "Endgame theory"}, {"title": "Improve Before Attacking", "desc": "Improve your king or pieces before starting a forcing operation.", "detail": "Endgames often reward gradual improvement because there are fewer tactical resources and more emphasis on piece placement.", "apply": "Improve your position before forcing the issue.", "lens": "Endgame theory"}, {"title": "Restrict the Enemy King", "desc": "Take away important squares from the opposing king.", "detail": "King restriction can be achieved with your king, rook, bishop, knight or pawns and often precedes a winning penetration.", "apply": "First restrict the king, then attack.", "lens": "Endgame theory"}, {"title": "King Penetration", "desc": "Enter the opponent's position with your king when safe.", "detail": "A king that penetrates the enemy camp can attack pawns and create decisive zugzwang.", "apply": "Find the entry square.", "lens": "Endgame theory"}, {"title": "Blockade Before Attack", "desc": "Stop the opponent's dangerous pawn before searching for counterplay.", "detail": "A blocked passed pawn loses much of its immediate power and gives your pieces time to attack elsewhere.", "apply": "Stop the threat before creating your own.", "lens": "Endgame theory"}, {"title": "Pawn Majority", "desc": "Use a larger number of pawns on one wing to create a passed pawn.", "detail": "A pawn majority can be converted through exchanges and pawn advances that eventually create a passer.", "apply": "Use your majority to create a passer.", "lens": "Endgame theory"}, {"title": "Pawn Minority", "desc": "Use fewer pawns to create a target or weakness in the opponent's structure.", "detail": "A minority attack can force structural weaknesses and create long-term targets.", "apply": "A smaller pawn group can create bigger weaknesses.", "lens": "Endgame theory"}, {"title": "Fix Pawn Weaknesses", "desc": "Fix enemy pawns on squares where they become vulnerable.", "detail": "A fixed pawn cannot easily escape and may become a permanent target for your king or pieces.", "apply": "Fix it, attack it, win it.", "lens": "Endgame theory"}, {"title": "Avoid Creating Weak Pawns", "desc": "Keep your own pawn structure healthy whenever possible.", "detail": "Isolated, doubled or backward pawns can become permanent targets in simplified positions.", "apply": "Think about the endgame before damaging your structure.", "lens": "Endgame theory"}, {"title": "Calculate Pawn Races", "desc": "Count every move in a race to promotion.", "detail": "Pawn races are often decided by one tempo, promotion with check, or the ability to queen with a tactical threat.", "apply": "Count moves—not hopes.", "lens": "Endgame theory"}, {"title": "Promotion With Check", "desc": "A pawn that promotes with check gains a valuable tempo.", "detail": "Promotion with check can prevent the opponent from promoting immediately or allow the new queen to control the position.", "apply": "Always check whether promotion comes with check.", "lens": "Endgame theory"}, {"title": "Underpromotion", "desc": "Promote to a knight, rook or bishop when it is stronger than a queen.", "detail": "Underpromotion is rare but can be necessary to avoid stalemate or deliver a specific tactical effect.", "apply": "Promotion does not always mean queen.", "lens": "Endgame theory"}, {"title": "Stalemate Awareness", "desc": "Always check whether the opponent has legal moves before giving the final blow.", "detail": "A position that appears winning can become a draw if the defending king has no legal move but is not in check.", "apply": "Before your final move, check for stalemate.", "lens": "Endgame theory"}, {"title": "Don't Rush Promotion", "desc": "Promotion should be calculated, not automatic.", "detail": "Promoting may allow perpetual checks, stalemate, or tactical loss if the new queen is immediately trapped or captured.", "apply": "Calculate the position after promotion.", "lens": "Endgame theory"}, {"title": "Queen Endgame Safety", "desc": "Keep your king safe even when you have a queen.", "detail": "Queen endings contain many perpetual-check and tactical resources, so material advantage alone does not guarantee victory.", "apply": "A queen advantage still requires king safety.", "lens": "Endgame theory"}, {"title": "Avoid Perpetual Check", "desc": "Prevent the opponent from checking your king indefinitely.", "detail": "In queen endings, active king movement, queen exchanges or shelter can be necessary to escape perpetual check.", "apply": "Always calculate the opponent's checking resources.", "lens": "Endgame theory"}, {"title": "Exchange Queens When Appropriate", "desc": "Queen exchanges can remove major sources of counterplay.", "detail": "If you have a winning or clearly superior endgame, exchanging queens may make conversion easier—but only if the resulting ending is favourable.", "apply": "Trade queens when it improves your winning chances.", "lens": "Endgame theory"}, {"title": "Keep the Stronger King", "desc": "King activity can be more important than a small material advantage.", "detail": "An active king can dominate key squares and win pawns while a passive king may become trapped.", "apply": "Compare king activity, not just material.", "lens": "Endgame theory"}, {"title": "Opposition Before Capturing", "desc": "Sometimes refusing to capture immediately is the winning move.", "detail": "Capturing a pawn can surrender opposition or give the opponent a critical tempo.", "apply": "Before capturing, calculate the king position afterward.", "lens": "Endgame theory"}, {"title": "Don't Put the King in a Corner", "desc": "Keep the king active and avoid unnecessary edge squares.", "detail": "A cornered king takes longer to reach important targets and can become vulnerable to zugzwang.", "apply": "Centralize whenever the position allows.", "lens": "Endgame theory"}, {"title": "Use Waiting Moves", "desc": "Make a move that preserves the position while forcing the opponent to act.", "detail": "Waiting moves are powerful when the opponent's position has limited useful moves.", "apply": "Sometimes doing nothing useful is better than changing the position.", "lens": "Endgame theory"}, {"title": "Keep Your Pieces Connected", "desc": "Coordinate your remaining pieces.", "detail": "Even in simplified endings, pieces that support each other are much stronger than isolated pieces.", "apply": "Don't let your pieces fight separately.", "lens": "Endgame theory"}, {"title": "Cut Off the Enemy King With a Bishop", "desc": "Use the bishop's diagonal control to restrict the enemy king.", "detail": "Bishops can create invisible barriers across diagonals and force the opposing king toward less useful squares.", "apply": "Use diagonals as walls.", "lens": "Endgame theory"}, {"title": "Bishop and Wrong Pawn", "desc": "Recognize drawn bishop-and-rook-pawn positions.", "detail": "A bishop that controls the wrong colour of the promotion square may be unable to force the enemy king away.", "apply": "Check the promotion-square colour first.", "lens": "Endgame theory"}, {"title": "Two Bishops Advantage", "desc": "Two bishops can control both colour complexes and attack from distance.", "detail": "Their complementary diagonals make it difficult for the opponent to hide and can create strong mating or pawn-winning threats.", "apply": "Use the bishops on different diagonals.", "lens": "Endgame theory"}, {"title": "Bishop Against Pawns", "desc": "Use the bishop to blockade and attack pawns from a distance.", "detail": "A bishop can often stop pawns without approaching them directly, especially when it controls their promotion squares.", "apply": "Control the pawn's route, not just the pawn.", "lens": "Endgame theory"}, {"title": "Knight Against Pawns", "desc": "Use the knight to blockade, fork and attack pawns.", "detail": "Knights can attack multiple pawns with forks but require careful calculation because their movement is less flexible than a bishop's.", "apply": "Look for knight forks against king and pawns.", "lens": "Endgame theory"}, {"title": "Rook vs Pawn", "desc": "Know the critical rules for stopping a lone passed pawn.", "detail": "Rook-versus-pawn positions depend heavily on the pawn's rank, the king's location and whether the rook can check from behind or the side.", "apply": "Calculate the promotion square before checking.", "lens": "Endgame theory"}, {"title": "Active Defence", "desc": "Defend by creating counterplay.", "detail": "A rook can attack pawns or check the enemy king instead of passively guarding your own pawns.", "apply": "Defence should create threats whenever possible.", "lens": "Endgame theory"}, {"title": "Counterplay Is Essential", "desc": "When worse, create threats instead of waiting passively.", "detail": "Active counterplay forces the opponent to spend time defending and may create drawing chances.", "apply": "If you're worse, make the opponent work.", "lens": "Endgame theory"}, {"title": "Simplify When Winning", "desc": "Reduce the opponent's counterplay when you have a clear advantage.", "detail": "Exchanging pieces can make your advantage easier to convert, provided the resulting ending is technically winning.", "apply": "Win safely, not beautifully.", "lens": "Endgame theory"}, {"title": "Keep Pieces When You Need Counterplay", "desc": "Avoid exchanges that eliminate your practical chances.", "detail": "If you are defending a worse position, keeping active pieces can provide tactical resources and drawing opportunities.", "apply": "When worse, don't exchange automatically.", "lens": "Endgame theory"}, {"title": "Calculate Before Trading the Last Piece", "desc": "The final exchange can completely change the evaluation.", "detail": "A favourable piece ending can become a drawn pawn ending—or a winning pawn ending—after one exchange.", "apply": "Calculate the pawn ending before exchanging the last piece.", "lens": "Endgame theory"}, {"title": "Transition Into a Winning Pawn Ending", "desc": "Exchange pieces only when the resulting pawn ending is won.", "detail": "A superior piece position may be easier to win with pieces still on the board than after simplifying.", "apply": "Never enter a pawn ending without calculating it.", "lens": "Endgame theory"}, {"title": "Transition Into a Drawn Ending", "desc": "Recognize when simplification guarantees a draw.", "detail": "Some positions become theoretically drawn after exchanges even though the original position still contains winning chances.", "apply": "Know when the position has crossed the drawing line.", "lens": "Endgame theory"}, {"title": "Know the Theoretical Result", "desc": "Learn fundamental winning and drawing positions.", "detail": "Endgame knowledge saves calculation time and prevents you from trying to win positions that are objectively drawn.", "apply": "Know the theory before improvising.", "lens": "Endgame theory"}, {"title": "Use Tablebase Logic", "desc": "In very small endings, precise calculation determines the result.", "detail": "Six-piece-or-fewer endgames can often be solved exactly with tablebases, making theoretical knowledge especially valuable.", "apply": "In practical play, calculate as if the position were exact.", "lens": "Endgame theory"}, {"title": "Calculate the Enemy King Route", "desc": "Always know where the opposing king wants to go.", "detail": "A king's route to a key square can determine whether a pawn or piece ending is won or drawn.", "apply": "Don't just watch the king—predict its destination.", "lens": "Endgame theory"}, {"title": "Find the Entry Square", "desc": "Identify the square through which your king or rook can penetrate.", "detail": "One entry square may be enough to invade the opponent's position and win a pawn or create zugzwang.", "apply": "Find the doorway into the enemy position.", "lens": "Endgame theory"}, {"title": "Restrict Before Penetrating", "desc": "First limit the enemy king, then enter the position.", "detail": "Penetration is much easier when the defending king has fewer available squares.", "apply": "Restrict first; invade second.", "lens": "Endgame theory"}, {"title": "Don't Waste Tempi", "desc": "Every move matters in technical endings.", "detail": "A single tempo can decide opposition, pawn races, zugzwang or rook-checking positions.", "apply": "Count every tempo.", "lens": "Endgame theory"}, {"title": "Calculate the Last Pawn", "desc": "The final pawn can determine the entire result.", "detail": "Before simplifying, calculate whether the remaining pawn ending is winning, drawing or losing.", "apply": "Never underestimate the last pawn.", "lens": "Endgame theory"}, {"title": "Promote With a Plan", "desc": "Know what your new queen or piece will do after promotion.", "detail": "Promotion is not necessarily the end; the new piece must still avoid tactical traps, checks and stalemate.", "apply": "See one move beyond promotion.", "lens": "Endgame theory"}, {"title": "Don't Allow the Enemy King Behind Your Pawns", "desc": "Prevent the opposing king from attacking your pawns from the rear.", "detail": "A king behind your pawn chain can attack the pawns while remaining protected from frontal checks.", "apply": "Protect the rear of your pawn structure.", "lens": "Endgame theory"}, {"title": "Use Pawns to Restrict the King", "desc": "Pawns can create a barrier that limits enemy king movement.", "detail": "A well-placed pawn chain can deny important squares and support your king's penetration.", "apply": "Pawns are also pieces of territory.", "lens": "Endgame theory"}, {"title": "Create a Fortress", "desc": "Build a position that the opponent cannot break through.", "detail": "A fortress can hold a draw despite a material disadvantage when the stronger side cannot make progress.", "apply": "Material advantage does not always mean victory.", "lens": "Endgame theory"}, {"title": "Recognize Perpetual Resources", "desc": "Look for repeated checks or threats that can secure a draw.", "detail": "Even with less material, active checking or perpetual threats can prevent the stronger side from escaping.", "apply": "Always search for perpetual-check resources.", "lens": "Endgame theory"}, {"title": "Avoid Passive Defence", "desc": "Don't place your pieces where they can do nothing.", "detail": "Passive pieces may become trapped defending a single target while the opponent improves elsewhere.", "apply": "Defend actively whenever possible.", "lens": "Endgame theory"}, {"title": "Use the Principle of Two Targets", "desc": "Attack two weaknesses so one cannot be defended.", "detail": "When one piece cannot protect multiple targets, attacking both can force material loss or king penetration.", "apply": "Two targets can overload one defender.", "lens": "Endgame theory"}, {"title": "Patience Wins Endgames", "desc": "Improve your position gradually instead of forcing tactics unnecessarily.", "detail": "Many endgames are won by restriction, king improvement, creating weaknesses and waiting for the opponent to collapse.", "apply": "Don't rush a winning position.", "lens": "Endgame theory"}, {"title": "Technique Matters", "desc": "Convert advantages accurately and systematically.", "detail": "Winning an endgame requires a practical method: restrict counterplay, improve pieces, create weaknesses and convert the advantage.", "apply": "Winning the advantage is only half the job—convert it.", "lens": "Endgame theory"}, {"title": "Know When the Position Is Drawn", "desc": "Recognize theoretical and practical drawing mechanisms.", "detail": "Opposition, fortress, perpetual check, insufficient material and defensive activity can save apparently difficult positions.", "apply": "When winning is impossible, switch to drawing technique.", "lens": "Endgame theory"}, {"title": "Master the Golden
