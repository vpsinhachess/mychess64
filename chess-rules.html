 Endgame Rule", "desc": "King activity, pawn structure, piece activity and precise calculation decide endgames.", "detail": "Endgames reward accurate king placement, active pieces, careful pawn moves, calculation of races and knowledge of theoretical positions.", "apply": "Activate your king, improve your pieces, create a passed pawn—and calculate everything.", "lens": "Endgame theory"}], "Golden Rules in Chess": [{"title": "Control the Centre", "desc": "Control the central squares and fight for central influence.", "detail": "The centre gives your pieces maximum mobility and allows them to move quickly toward either wing. Central control is one of the foundations of classical chess strategy.", "apply": "Before attacking the wing, ask: “Who controls the centre?”", "ref": "Wilhelm Steinitz — The Modern Chess Instructor; classical positional school.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Develop Your Pieces", "desc": "Bring your pieces into the game quickly and purposefully.", "detail": "Development gives your army activity, prepares king safety and allows your pieces to coordinate. An undeveloped army cannot normally support a successful attack.", "apply": "Develop your army before starting a major operation.", "ref": "Classical Chess Theory — strongly emphasized by Paul Morphy, Adolf Anderssen and Siegbert Tarrasch.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Castle and Protect Your King", "desc": "Make king safety one of your first priorities.", "detail": "Castling normally places the king in greater safety and activates a rook. An exposed king can become a tactical target.", "apply": "King safety before unnecessary material hunting.", "ref": "Classical Opening Theory — especially the teachings of Tarrasch and the classical school.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Do Not Waste Tempi", "desc": "Avoid moves that do not contribute to your development, safety or plan.", "detail": "A wasted tempo gives your opponent time to improve their position. In sharp positions, one tempo can completely change the result.", "apply": "Every move should accomplish something.", "ref": "Classical Chess Theory — the concept of tempo is fundamental throughout opening theory.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Do Not Move the Same Piece Repeatedly", "desc": "Avoid moving one piece several times while others remain undeveloped.", "detail": "Repeated moves can give the opponent a development advantage. Exceptions are justified when the repeated move gains something concrete.", "apply": "Don't make three moves with one piece while your army sleeps.", "ref": "Siegbert Tarrasch — classical development principles.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Do Not Bring the Queen Out Too Early", "desc": "Develop your minor pieces before exposing the queen unnecessarily.", "detail": "The queen is valuable but vulnerable to attacks by developing pieces. Early queen adventures can result in loss of time.", "apply": "Don't make your queen do the knights' job.", "ref": "Classical Opening Theory — standard principle of rapid development.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Improve Your Worst Piece", "desc": "Find your least active piece and improve it.", "detail": "Improving the worst-placed piece often improves the entire position. Strong players constantly look for ways to increase the activity of their least useful piece.", "apply": "Ask: “Which of my pieces is doing the least?”", "ref": "Aron Nimzowitsch — My System; positional improvement and coordination.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Think Prophylactically", "desc": "Understand and prevent your opponent's plan.", "detail": "Prophylaxis means asking what the opponent wants to achieve and taking measures to prevent or restrict it.", "apply": "Before asking “What can I do?”, ask “What does my opponent want?”", "ref": "Aron Nimzowitsch — My System.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Restrict the Opponent", "desc": "Reduce the number of useful choices available to your opponent.", "detail": "Restriction makes enemy pieces passive and can prevent important pawn breaks, piece maneuvers and attacks.", "apply": "A strong move improves your position and limits theirs.", "ref": "Aron Nimzowitsch — My System.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Create an Outpost", "desc": "Occupy a strong square that enemy pawns cannot easily attack.", "detail": "A protected outpost, especially for a knight, can become a permanent strategic base.", "apply": "Look for squares enemy pawns cannot chase you from.", "ref": "Aron Nimzowitsch — My System; theory of the outpost.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Blockade the Passed Pawn", "desc": "Stop a dangerous passed pawn before trying to attack it.", "detail": "A piece placed directly in front of a passed pawn can neutralize its most important strength—its ability to advance.", "apply": "Stop the pawn first; attack it second.", "ref": "Aron Nimzowitsch — My System; theory of the blockade.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Attack the Base of the Pawn Chain", "desc": "Attack the foundation of an enemy pawn chain.", "detail": "Pawns in a chain usually support the pawn ahead of them. Attacking the base can undermine the entire chain.", "apply": "Attack the foundation, not just the tip.", "ref": "Aron Nimzowitsch — My System; pawn-chain theory.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Use Open Files", "desc": "Place your rooks on useful open or semi-open files.", "detail": "Open files give rooks access to enemy pawns, entry squares and important areas of the position.", "apply": "Open file + active rook = pressure.", "ref": "Aron Nimzowitsch — My System; “play in open files.”", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Occupy the Seventh Rank", "desc": "Use the seventh rank to attack weaknesses and restrict the king.", "detail": "A rook on the seventh rank can attack pawns, restrict the enemy king and create serious threats.", "apply": "Look for safe rook entry on the 7th rank.", "ref": "Aron Nimzowitsch — My System.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Create Passed Pawns", "desc": "A passed pawn can become a decisive strategic weapon.", "detail": "A passed pawn forces the opponent to devote pieces to stopping its advance and can eventually threaten promotion.", "apply": "Always look for a way to create a passed pawn.", "ref": "José Raúl Capablanca — Chess Fundamentals; endgame principles.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Rook Behind the Passed Pawn", "desc": "Place the rook behind a passed pawn whenever appropriate.", "detail": "A rook behind its own passed pawn can support its advance; behind an enemy passer, it can attack from the rear.", "apply": "Rook behind the passer.", "ref": "Siegbert Tarrasch — commonly known as the Tarrasch Rule.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Activate the King", "desc": "The king becomes a fighting piece in the endgame.", "detail": "Once the board is simplified, the king can approach pawns, control key squares and support promotion.", "apply": "In the endgame, bring your king into the game.", "ref": "José Raúl Capablanca — Chess Fundamentals.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Learn the Opposition", "desc": "Use king opposition to gain critical squares.", "detail": "Opposition is one of the fundamental techniques of king-and-pawn endings and can determine whether a position is won or drawn.", "apply": "Count the king squares before pushing the pawn.", "ref": "José Raúl Capablanca — Chess Fundamentals, discussion of The Opposition.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Understand Key Squares", "desc": "Identify the squares your king must reach to win.", "detail": "A pawn may be unable to promote unless its king reaches the correct key squares and drives away the defending king.", "apply": "Find the key squares before pushing the pawn.", "ref": "Classical Pawn-Endgame Theory — extensively developed in fundamental endgame literature.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Use Zugzwang", "desc": "Force your opponent to move when every move worsens their position.", "detail": "Zugzwang is especially powerful in pawn endings, where a single king or pawn move can surrender a critical square.", "apply": "Sometimes your best move is to make your opponent move.", "ref": "Classical Endgame Theory — developed through the study of king-and-pawn endings.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Use Triangulation", "desc": "Change whose turn it is without fundamentally changing the position.", "detail": "A king can make a three-move maneuver to return to a similar position while transferring the move to the opponent.", "apply": "Triangulation changes the move, not the plan.", "ref": "Classical Endgame Theory.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Create Two Weaknesses", "desc": "Force your opponent to defend two separate targets.", "detail": "One weakness may be defendable, but two weaknesses can stretch the opponent's defensive resources.", "apply": "One target is defendable; two may overload the defence.", "ref": "Classical Positional School — associated with Steinitz and later strategic theory.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Gain Positional Superiority Before Attacking", "desc": "Build an advantage before launching a major attack.", "detail": "Steinitz's theory emphasized that a successful attack generally needs positional justification and sufficient superiority.", "apply": "First improve the position; then attack.", "ref": "Wilhelm Steinitz — The Modern Chess Instructor.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Attack When You Have the Advantage", "desc": "Use your positional superiority to create concrete threats.", "detail": "Once your pieces are more active, your king is safer or the opponent has weaknesses, you can convert that advantage into an attack.", "apply": "Advantage → pressure → attack.", "ref": "Wilhelm Steinitz — classical theory of positional advantage.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Do Not Attack a Strong Position Without Reason", "desc": "Do not force an attack simply because you want one.", "detail": "Attacking without sufficient support can weaken your own position and allow the opponent to gain counterplay.", "apply": "Don't attack because you want to attack—attack because the position demands it.", "ref": "Wilhelm Steinitz — positional theory.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Maintain the Initiative", "desc": "Continue making useful threats when you have active play.", "detail": "The initiative allows you to dictate the direction of the game and prevents your opponent from freely improving.", "apply": "If you have the initiative, keep asking questions.", "ref": "José Raúl Capablanca — Chess Fundamentals; discussion of obtaining and maintaining the initiative.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Calculate Before Sacrificing", "desc": "A sacrifice must have concrete justification.", "detail": "Sacrificing material can be correct for attack, development, king exposure or positional compensation, but it must be calculated.", "apply": "Never sacrifice because it looks beautiful—calculate it.", "ref": "Mikhail Tal — practical legacy of sacrificial attacking chess.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Count Attackers and Defenders", "desc": "Compare the attacking and defending forces before committing.", "detail": "Many tactical operations succeed because the attacker has more pieces participating than the defender.", "apply": "Count before you sacrifice or capture.", "ref": "Classical Tactical Theory; widely exemplified in the games of Mikhail Tal.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Look for Forcing Moves", "desc": "Examine checks, captures and threats before quiet moves.", "detail": "Forcing moves restrict the opponent's choices and often reveal tactical opportunities.", "apply": "Checks → Captures → Threats.", "ref": "Classical Tactical Calculation Method; modern tactical training principle.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Calculate Candidate Moves", "desc": "Compare several serious moves before deciding.", "detail": "Candidate-move thinking prevents you from automatically playing the first attractive move you see.", "apply": "Find candidates → calculate → compare → play.", "ref": "Alexander Kotov — Think Like a Grandmaster.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Calculate the Opponent's Best Reply", "desc": "Test your move against the strongest possible response.", "detail": "A move is only reliable if it survives the opponent's best defensive or tactical resource.", "apply": "After finding your move, find their strongest reply.", "ref": "Alexander Kotov — Think Like a Grandmaster.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Don't Win a Pawn at the Cost of Development", "desc": "Material is not always worth losing time and activity.", "detail": "Grabbing a pawn while your pieces remain undeveloped can give the opponent dangerous compensation.", "apply": "Don't exchange development for a cheap pawn.", "ref": "Aron Nimzowitsch — My System.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Activity Can Be More Important Than Material", "desc": "Active pieces and initiative can compensate for material.", "detail": "A material advantage may be meaningless if the opponent has overwhelming activity or a dangerous attack.", "apply": "Evaluate material + activity + king safety.", "ref": "Emanuel Lasker — dynamic approach to chess evaluation.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Coordinate Your Pieces", "desc": "Pieces become stronger when they work together.", "detail": "Coordinated pieces can attack targets, defend each other and create tactical possibilities that isolated pieces cannot.", "apply": "Ask: “Are my pieces working together?”", "ref": "Wilhelm Steinitz / Aron Nimzowitsch — classical positional theory.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Improve Piece Mobility", "desc": "Give your pieces useful squares and freedom of movement.", "detail": "Mobility creates tactical possibilities and allows your army to switch from one wing to another.", "apply": "Active pieces create more options.", "ref": "Wilhelm Steinitz — positional evaluation principles.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Attack Weak Pawns", "desc": "Target permanent pawn weaknesses.", "detail": "Isolated, backward, doubled or fixed pawns can become long-term targets that tie down enemy pieces.", "apply": "Find the weakness and increase the pressure.", "ref": "Wilhelm Steinitz / Classical Positional School.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Fix a Weakness", "desc": "Prevent an enemy pawn weakness from advancing or escaping.", "detail": "A fixed weakness becomes a stable target for your king and pieces.", "apply": "Fix it → attack it → win it.", "ref": "Classical Positional Theory; later formalized in modern strategic chess.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Use Space Correctly", "desc": "Space gives your pieces room to maneuver.", "detail": "A space advantage can restrict the opponent, but excessive expansion may create weaknesses.", "apply": "Gain space only when you can use and support it.", "ref": "Aron Nimzowitsch — My System; space and restriction concepts.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Open Lines for Your Pieces", "desc": "Open files, ranks and diagonals when your pieces benefit.", "detail": "Opening a line is valuable when it increases the activity of your army more than the opponent's.", "apply": "Before opening a line, ask who benefits.", "ref": "Aron Nimzowitsch — My System.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Exchange With a Purpose", "desc": "Every exchange should improve your position or achieve a concrete goal.", "detail": "Exchanges can remove defenders, eliminate strong pieces, improve pawn structure or enter a favourable endgame.", "apply": "Don't exchange automatically—know why.", "ref": "Aron Nimzowitsch — My System; strategic exchange principles.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Simplify When It Helps You Win", "desc": "Exchange pieces when the resulting position is favourable.", "detail": "Simplification can remove counterplay and make a material or positional advantage easier to convert.", "apply": "When winning, reduce counterplay—not necessarily everything.", "ref": "José Raúl Capablanca — Chess Fundamentals.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Don't Simplify Into a Draw", "desc": "Avoid exchanges that destroy your winning chances.", "detail": "A superior middlegame may become a drawn ending if the wrong pieces are exchanged.", "apply": "Calculate the resulting ending before exchanging.", "ref": "José Raúl Capablanca — Chess Fundamentals.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "When Worse, Create Counterplay", "desc": "Don't defend passively when active chances exist.", "detail": "Threats, checks, passed pawns and tactical complications can force the stronger side to defend.", "apply": "When worse, make your opponent work.", "ref": "Emanuel Lasker — practical/dynamic chess philosophy.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Use the King as an Attacking Piece", "desc": "The king should actively attack pawns in appropriate endgames.", "detail": "In simplified positions, the king's ability to penetrate and capture pawns can determine the entire game.", "apply": "Endgame king = fighting piece.", "ref": "José Raúl Capablanca — Chess Fundamentals.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Calculate Pawn Races", "desc": "Count every move in a race to promotion.", "detail": "Pawn races are often decided by one tempo, promotion with check or the ability to control the promotion square.", "apply": "Count the moves—don't guess the race.", "ref": "Classical Endgame Theory.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Promotion With Check", "desc": "A promotion with check gains a critical tempo.", "detail": "Promoting with check can prevent the opponent from promoting immediately or force the enemy king into an inferior position.", "apply": "Always check whether promotion comes with check.", "ref": "Classical Endgame Calculation Theory.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Watch for Stalemate", "desc": "A winning position can become a draw through stalemate.", "detail": "When the defending king has no legal move but is not in check, the game ends immediately as a draw.", "apply": "Before the final move, check every legal move the opponent has.", "ref": "FIDE Laws of Chess — Article 5.2.1.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Study the Endgame", "desc": "Endgame knowledge improves decisions throughout the game.", "detail": "Knowing which endings are won, drawn or difficult helps you decide when to exchange pieces and which pawn structures to create.", "apply": "Before exchanging, ask: “What endgame am I entering?”", "ref": "José Raúl Capablanca — Chess Fundamentals.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Study Complete Games", "desc": "Learn how opening, middlegame and endgame principles connect.", "detail": "Studying complete master games teaches ideas in context rather than as isolated rules or memorized moves.", "apply": "Study the idea behind the move, not just the move.", "ref": "José Raúl Capablanca — Chess Fundamentals.", "lens": "Golden rule", "refLabel": "Source"}, {"title": "Principles Are Guides, Not Laws", "desc": "A chess principle must never override concrete calculation.", "detail": "Opening principles, positional rules and endgame techniques help you find good candidate moves, but a concrete tactical opportunity can require you to break a general rule.", "apply": "Know the rule → understand the exception → calculate → play.", "ref": "Modern Chess Theory — Steinitz → Nimzowitsch → Capablanca → Kotov; principles are subordinate to the concrete position.", "lens": "Golden rule", "refLabel": "Source"}], "Greatest Chess Quotes": [{"title": "Anatoly Karpov", "desc": "“Chess is everything: art, science and sport.”", "detail": "", "apply": "", "lens": "Quote"}, {"title": "Savielly Tartakower", "desc": "“Chess is a fairy tale of 1,001 blunders.”", "detail": "", "apply": "", "lens": "Quote"}, {"title": "Vladimir Kramnik", "desc": "“Chess is as much a mystery as women.”", "detail": "", "apply": "", "lens": "Quote"}, {"title": "Garry Kasparov", "desc": "“Chess is life in miniature.”", "detail": "", "apply": "", "lens": "Quote"}, {"title": "Bobby Fischer", "desc": "“Chess is a war over the board. The object is to crush the opponent's mind.”", "detail": "", "apply": "", "lens": "Quote"}, {"title": "José Raúl Capablanca", "desc": "“You may learn much more from a game you lose than from a game you win.”", "detail": "", "apply": "", "lens": "Quote"}, {"title": "Savielly Tartakower", "desc": "“The winner of the game is the player who makes the next-to-last mistake.”", "detail": "", "apply": "", "lens": "Quote"}, {"title": "Johannes Zukertort", "desc": "“Chess is a struggle against error.”", "detail": "", "apply": "", "lens": "Quote"}, {"title": "Emanuel Lasker", "desc": "“The hardest game to win is a won game.”", "detail": "", "apply": "", "lens": "Quote"}, {"title": "Emanuel Lasker", "desc": "“When you see a good move, look for a better one.”", "detail": "", "apply": "", "lens": "Quote"}, {"title": "Savielly Tartakower", "desc": "“Chess is a game of mistakes. The player who makes the last mistake loses.”", "detail": "", "apply": "", "lens": "Quote"}, {"title": "Emanuel Lasker", "desc": "“Without error there can be no brilliancy.”", "detail": "", "apply": "", "lens": "Quote"}, {"title": "Mikhail Chigorin", "desc": "“A bad plan is better than no plan at all.”", "detail": "", "apply": "", "lens": "Quote"}, {"title": "Aron Nimzowitsch", "desc": "“The threat is stronger than the execution.”", "detail": "", "apply": "", "lens": "Quote"}, {"title": "Aron Nimzowitsch", "desc": "“The passed pawn is a criminal, who should be kept under lock and key.”", "detail": "", "apply": "", "lens": "Quote"}, {"title": "Classical chess proverb", "desc": "“A knight on the rim is dim.”", "detail": "", "apply": "", "lens": "Quote"}, {"title": "Wilhelm Steinitz", "desc": "“The best way to refute a sacrifice is to accept it.”", "detail": "", "apply": "", "lens": "Quote"}, {"title": "Aaron Nimzowitsch", "desc": "“Only the player with the initiative has the right to attack.”", "detail": "", "apply": "", "lens": "Quote"}, {"title": "François-André Danican Philidor", "desc": "“The pawns are the soul of chess.”", "detail": "", "apply": "", "lens": "Quote"}, {"title": "Blaise Pascal", "desc": "“Chess is the gymnasium of the mind.”", "detail": "", "apply": "", "lens": "Quote"}, {"title": "Indian proverb", "desc": "“Chess is a sea in which a gnat may drink and an elephant may bathe.”", "detail": "", "apply": "", "lens": "Quote"}, {"title": "Vladimir Lenin", "desc": "“Chess makes men wiser and clear-sighted.”", "detail": "", "apply": "", "lens": "Quote"}, {"title": "David Bronstein", "desc": "“The essence of chess is thinking about what chess is.”", "detail": "", "apply": "", "lens": "Quote"}, {"title": "Alexander Alekhine", "desc": "“Chess is a terrible mistress.”", "detail": "", "apply": "", "lens": "Quote"}, {"title": "Mikhail Tal", "desc": "“I play with the pieces and not with the position.” e by playing, analyzing your games, and studying.”", "detail": "", "apply": "", "lens": "Quote"}, {"title": "Savielly Tartakower", "desc": "“The blunders are all there on the board, waiting to be made.”", "detail": "", "apply": "", "lens": "Quote"}, {"title": "Vasily Smyslov", "desc": "“In chess, as in life, a man is his own worst enemy.”", "detail": "", "apply": "", "lens": "Quote"}, {"title": "Garry Kasparov", "desc": "“Chess is a cruel game.”", "detail": "", "apply": "", "lens": "Quote"}, {"title": "Vladimir Kramnik", "desc": "“The ability to work hard for a long time is one of the most important qualities of a chess player.”", "detail": "", "apply": "", "lens": "Quote"}, {"title": "Garry Kasparov", "desc": "“You have to know what you want to get from the game.”", "detail": "", "apply": "", "lens": "Quote"}, {"title": "Classical chess maxim", "desc": "“Chess is a fight between two people who make mistakes.”", "detail": "", "apply": "", "lens": "Quote"}, {"title": "Modern chess maxim", "desc": "“The beauty of chess is that every game tells a different story.”", "detail": "", "apply": "", "lens": "Quote"}, {"title": "Modern chess principle", "desc": "“Chess is not about finding the best move. It is about finding the best move in the position.”", "detail": "", "apply": "", "lens": "Quote"}]}</script>
<script>
(()=>{
const D=JSON.parse(document.getElementById("data").textContent),CATS=Object.keys(D);
const IC={"FIDE Rules of Play": "♜", "30 Opening Fundamental Theories": "♗", "50 Middlegame Techniques & Tips": "♞", "101 Endgame Golden Theories": "♔", "Golden Rules in Chess": "♛", "Greatest Chess Quotes": "❝"};
const $=id=>document.getElementById(id);
const st={cat:"All",q:"",show:"all",grp:"all",sort:"n",view:"rail",fav:{},done:{}};
try{Object.assign(st,JSON.parse(localStorage.getItem("mc64v3")||"{}"),{cat:"All",q:""})}catch(e){}
const save=()=>{try{localStorage.setItem("mc64v3",JSON.stringify({fav:st.fav,done:st.done,view:st.view,theme:st.theme}))}catch(e){}};
const E=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
const INTRO={"FIDE Rules of Play": "The official Laws of Chess (FIDE Handbook, effective 1 January 2023), each with its article reference. Learn these first — they settle claims, draws and disputes.", "30 Opening Fundamental Theories": "Principles that guide the first 10–15 moves. Use them to choose good candidate moves, then calculate.", "50 Middlegame Techniques & Tips": "The bridge between opening and endgame: find targets, make plans, and avoid tactical oversights.", "101 Endgame Golden Theories": "Where games are won and saved. Study king activity, opposition, pawn play and key positions precisely.", "Golden Rules in Chess": "Timeless principles from the classical and modern schools, with their sources. Know the rule, understand the exception, then calculate.", "Greatest Chess Quotes": "Words from champions and thinkers. Quotes are shown as commonly cited; attributions of popular chess sayings are sometimes disputed."};const ACC={"FIDE Rules of Play": "#c0841a", "30 Opening Fundamental Theories": "#1e88e5", "50 Middlegame Techniques & Tips": "#8e55c7", "101 Endgame Golden Theories": "#2e9b62", "Golden Rules in Chess": "#d4a017", "Greatest Chess Quotes": "#d0457a"};const QC="Greatest Chess Quotes";const key=(c,i)=>c+"|"+i;let list=[],cur=-1;
if(st.theme)document.documentElement.dataset.theme=st.theme;
$("theme").onclick=()=>{const d=document.documentElement,dark=d.dataset.theme?d.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;st.theme=dark?"light":"dark";d.dataset.theme=st.theme;save()};
const total=CATS.reduce((a,c)=>a+D[c].length,0);
function stats(){const n=Object.keys(st.done).length;$("stats").innerHTML="";[[total,"Cards"],[CATS.length,"Categories"],[n,"Learned"],[Object.keys(st.fav).length,"Saved"]].forEach(([a,b])=>{const s=E("div","stat");s.append(E("b","",a),E("span","",b));$("stats").append(s)})}
function chips(){$("chips").innerHTML="";["All",...CATS].forEach(c=>{const b=E("button","chip"+(st.cat===c?" on":""),(IC[c]?IC[c]+" ":"")+c+" · "+(c==="All"?total:D[c].length));b.onclick=()=>{st.cat=c;st.grp="all";chips();grpUI();render()};$("chips").append(b)})}
function match(it,c,i){const q=st.q;if(st.grp!=="all"&&it.grp!==st.grp)return false;if(q&&!(it.title+it.desc+(it.detail||"")+(it.ref||"")+c).toLowerCase().includes(q))return false;const k=key(c,i);
return st.show==="all"||(st.show==="fav"&&st.fav[k])||(st.show==="done"&&st.done[k])||(st.show==="todo"&&!st.done[k])}
let dirty=false,lastFocus=null,pushed=false;
function render(){const m=$("main");m.innerHTML="";m.className="wrap"+(st.view==="grid"?" grid":"");list=[];let n=0;
CATS.forEach(c=>{if(st.cat!=="All"&&st.cat!==c)return;let f=D[c].map((it,i)=>({it,c,i})).filter(o=>match(o.it,c,o.i));if(!f.length)return;
if(st.sort==="a")f.sort((a,b)=>a.it.title.localeCompare(b.it.title));n+=f.length;
const s=E("section","cat");s.style.setProperty("--acc",ACC[c]||"#b8860b");
const h=E("div","ch"),l=E("div","cl"),t=E("div"),sub=E("div","sub",f.length+" cards");l.append(E("div","ci",IC[c]||"♟"),t);t.append(E("h2","",c),sub);
const ar=E("div","arrows"),p=E("button","arrow","‹"),nx=E("button","arrow","›");p.type=nx.type="button";p.setAttribute("aria-label","Previous cards");nx.setAttribute("aria-label","Next cards");ar.append(p,nx);h.append(l,ar);s.append(h);
{const done=D[c].filter((_,j)=>st.done[key(c,j)]).length,q=E("div","intro");q.append(E("p","",INTRO[c]||""));const pb=E("div","pb"),fl=E("i");fl.style.width=(100*done/D[c].length)+"%";pb.append(fl);q.append(pb,E("small","","Learned "+done+" of "+D[c].length));s.append(q)}
const r=E("div","rail");f.forEach(o=>{const idx=list.push(o)-1,k=key(o.c,o.i),b=E("div","card");b.tabIndex=0;b.setAttribute("role","button");b.setAttribute("aria-label",o.it.title);
b.append(E("div","no","♟ "+String(o.i+1).padStart(2,"0")+(o.it.badge?"  ·  "+o.it.badge:"")));if(o.c===QC){b.classList.add("quote");b.append(E("p","",o.it.desc),E("h3","","— "+o.it.title))}else{b.append(E("h3","",o.it.title),E("p","",o.it.desc),E("div","rem",o.it.apply))}
const ft=E("div","foot");ft.append(E("span","",o.c===QC?"Read full quote →":"Open details →"));const mk=E("span","mk");mk.append(E("i","",st.fav[k]?"★":""),E("i","",st.done[k]?"✓":""));ft.append(mk);b.append(ft);
b.onclick=()=>open(idx);b.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open(idx)}};r.append(b)});
s.append(r);m.append(s);
const upd=()=>{const c0=r.firstElementChild;if(!c0||st.view==="grid"){sub.textContent=f.length+" cards";return}const cw=c0.offsetWidth+14,per=Math.max(1,Math.round(r.clientWidth/cw)),a=Math.min(f.length,Math.round(r.scrollLeft/cw)+1);sub.textContent=f.length+" cards · showing "+a+"–"+Math.min(f.length,a+per-1);p.disabled=r.scrollLeft<4;nx.disabled=r.scrollLeft+r.clientWidth>=r.scrollWidth-4};
let tk;r.addEventListener("scroll",()=>{cancelAnimationFrame(tk);tk=requestAnimationFrame(upd)},{passive:true});
p.onclick=()=>r.scrollBy({left:-r.clientWidth*.85,behavior:"smooth"});nx.onclick=()=>r.scrollBy({left:r.clientWidth*.85,behavior:"smooth"});requestAnimationFrame(upd)});
$("empty").style.display=n?"none":"block";stats()}
function open(i,keep){if(cur<0){lastFocus=document.activeElement;try{history.pushState({m:1},"");pushed=true}catch(e){}}cur=i;const {it,c,i:ix}=list[i],k=key(c,ix),M=$("modal"),sc=keep?M.scrollTop:0;M.innerHTML="";
const h=E("div","mh"),tg=E("div","tagrow");tg.append(E("span","g",(IC[c]||"")+" "+c),E("span","",it.lens),...(it.grp?[E("span","",it.grp)]:[]),E("span","","Card "+String(ix+1).padStart(2,"0")+" / "+D[c].length));
const x=E("button","x","✕");x.setAttribute("aria-label","Close");x.onclick=()=>close();h.append(E("div","big",IC[c]||"♟"),x,tg,E("h2","",c===QC?"“Quote”":it.title));
const b=E("div","mb"),sec=(t,txt,cls)=>{const s=E("div","sec");s.append(E("h4","",t));s.append(E("p",cls||"",txt));b.append(s)};
if(c===QC){sec("Quote",it.desc,"qt");sec("Said by",it.title)}else{sec("In short",it.desc);sec("Detailed explanation",it.detail);sec("Remember & Apply on the board",it.apply,"tip");if(it.ref)sec(it.refLabel||"Reference",it.ref,"refl");
const near=[ix-2,ix-1,ix+1,ix+2].filter(j=>j>=0&&j<D[c].length),rs=E("div","sec"),rw=E("div","rel");rs.append(E("h4","","Related in "+c));
near.forEach(j=>{const bt=E("button","",D[c][j].title);bt.onclick=()=>{let t=list.findIndex(z=>z.c===c&&z.i===j);if(t<0){list=[...list,{it:D[c][j],c,i:j}];t=list.length-1}open(t)};rw.append(bt)});rs.append(rw);b.append(rs)}
const f=E("div","mf"),L=E("div"),R=E("div"),btn=(t,fn,on)=>{const e=E("button",on?"on":"",t);e.onclick=fn;return e};
L.append(btn("← Prev",()=>open((i-1+list.length)%list.length)),btn("Next →",()=>open((i+1)%list.length)));
const tog=o=>{o[k]?delete o[k]:o[k]=1;save();dirty=true;open(i,true)};
R.append(btn(st.fav[k]?"★ Saved":"☆ Save",()=>tog(st.fav),st.fav[k]),btn(st.done[k]?"✓ Learned":"Mark learned",()=>tog(st.done),st.done[k]));
f.append(L,R);M.append(h,b,f);M.scrollTop=sc;$("ov").classList.add("show");document.body.style.overflow="hidden";if(!keep)x.focus()}
function close(pop){if(cur<0)return;$("ov").classList.remove("show");document.body.style.overflow="";cur=-1;
if(dirty){dirty=false;const y=scrollY,rs=[...document.querySelectorAll(".rail")].map(r=>r.scrollLeft);render();document.querySelectorAll(".rail").forEach((r,j)=>r.scrollLeft=rs[j]||0);scrollTo(0,y)}else if(lastFocus&&lastFocus.focus)lastFocus.focus();
if(pushed){pushed=false;if(!pop){try{history.back()}catch(e){}}}}
addEventListener("popstate",()=>{if(cur>=0){pushed=false;close(true)}});
$("ov").onclick=e=>{if(e.target.id==="ov")close()};
addEventListener("keydown",e=>{if(cur<0)return;if(e.key==="Escape")close();else if(e.key==="ArrowRight")open((cur+1)%list.length);else if(e.key==="ArrowLeft")open((cur-1+list.length)%list.length);else if(e.key==="Tab"){const f=[...$("modal").querySelectorAll("button")],a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}});
function grpUI(){const g=$("grp"),gs=st.cat==="All"?[]:[...new Set(D[st.cat].map(x=>x.grp).filter(Boolean))];g.hidden=!gs.length;g.innerHTML="";if(!gs.length)return;[["all","All groups"],...gs.map(x=>[x,x])].forEach(([v,t])=>{const o=E("option","",t);o.value=v;g.append(o)});g.value=st.grp}
$("grp").onchange=e=>{st.grp=e.target.value;render()};
let tm;$("q").oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>{st.q=e.target.value.trim().toLowerCase();render()},120)};
$("show").onchange=e=>{st.show=e.target.value;render()};$("sort").onchange=e=>{st.sort=e.target.value;render()};

document.querySelectorAll("#view button").forEach(x=>x.classList.toggle("on",x.dataset.v===st.view));
const fab=$("fab");addEventListener("scroll",()=>fab.style.display=scrollY>600?"block":"none",{passive:true});fab.onclick=()=>scrollTo({top:0,behavior:"smooth"});
chips();render();
})();
</script></body></html>
