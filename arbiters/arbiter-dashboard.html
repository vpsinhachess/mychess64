<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arbiter Dashboard | MyChess64 Arbiters</title><link rel="stylesheet" href="mc64.css"></head><body>
<div id="app"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="mc64.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="arbiter-pdf.js"></script>
<script>
var $=MC.$,E=MC.esc,q=MC.q,sb,me,uid,V={},TN={IA:"International Arbiter",FA:"FIDE Arbiter",NA:"National Arbiter"},calM=new Date();
var NAV=[["overview","Dashboard","dash"],["profile","My Profile","user"],["certificates","Certificates","shield"],["availability","Availability","cal"],["enquiries","Appointment Enquiries","inbox"],["appointments","My Appointments","check"],["tournaments","Tournament Records","trophy"],["fees","Fees & Earnings","wallet"],["resume","Resume & Share","list"],["reviews","Reviews","star"],["settings","Account Settings","cog"]];
var TITLES={overview:["Dashboard","Your arbiter activity at a glance"],profile:["My Profile","Photo, FIDE ID, title and credentials"],certificates:["Certificates","Secure storage for your credentials"],availability:["Availability","Available dates and locations"],enquiries:["Appointment Enquiries","New requests from organizers"],appointments:["My Appointments","Upcoming and completed events"],tournaments:["Tournament Records","Keep every event's details in one place"],fees:["Fees & Earnings","Rate card, income and payment tracking"],resume:["Resume & Share","Generate your resume and share your profile"],reviews:["Reviews","Organizer feedback and ratings"],settings:["Account Settings","Password and notifications"]};
MC.boot({title:"Arbiter Dashboard",subtitle:"Sign in to manage your profile, enquiries and appointments.",signup:true,onSession:start});
function start(u){uid=u.id;sb=MC.sb;load().then(function(){MC.shell({role:"Arbiter Dashboard",items:NAV,user:me.full_name+" · "+u.email,go:go});badges()}).catch(function(e){if(e==="none")noProfile(u)})}
function load(){return sb.from("arb_arbiters").select("*").eq("id",uid).maybeSingle().then(function(r){if(r.error){MC.toast(r.error.message,1);throw r.error}if(!r.data)throw"none";me=r.data})}
function noProfile(u){document.getElementById("app").innerHTML='<div class="auth"><div class="lg"><img src="'+MC.LOGO+'" alt="MyChess64"></div><div class="card"><h2>Create your arbiter profile</h2><p class="muted">'+E(u.email)+' does not have an arbiter profile yet. Fill in a few details to apply.</p><form id="nf" class="fg"><div class="f full"><label>Full name *</label><input name="n" required></div><div class="f"><label>FIDE ID</label><input name="f" inputmode="numeric"></div><div class="f"><label>Arbiter title</label><select name="t"><option value="">Select</option><option value="IA">IA</option><option value="FA">FA</option><option value="NA">NA</option></select></div><div class="f"><label>Country</label><input name="c"></div><div class="f"><label>City</label><input name="ci"></div><div class="full"><button class="btn" style="width:100%">Create arbiter profile</button></div></form><p class="sw"><a href="#" id="so3">Sign out</a></p></div></div>';
 document.getElementById("so3").onclick=function(e){e.preventDefault();MC.sb.auth.signOut()};
 document.getElementById("nf").onsubmit=function(e){e.preventDefault();var f=e.target.elements;MC.sb.rpc("arb_become_arbiter",{p_name:f.n.value,p_fide:f.f.value,p_title:f.t.value,p_country:f.c.value,p_city:f.ci.value}).then(function(r){if(r.error)MC.toast(r.error.message,1);else start(u)})}}
function badges(){sb.from("arb_enquiries").select("id",{count:"exact",head:true}).eq("status","New").then(function(r){MC.badge("enquiries",r.count||0)})}
function go(id){var t=TITLES[id];$("#main").innerHTML=MC.top(t[0],t[1])+'<div class="empty">Loading...</div>';V[id]().catch(function(){})}
function page(id,html){var t=TITLES[id];$("#main").innerHTML=MC.top(t[0],t[1])+html}
function banner(){var s=me.status;
 if(s=="pending")return'<div class="banner w"><b>Application under review.</b> Your profile is not public yet. Complete your profile and upload certificates to speed up approval.</div>';
 if(s=="rejected")return'<div class="banner r"><b>Application not approved.</b> Please contact mychess.com@gmail.com for details.</div>';
 if(s=="suspended")return'<div class="banner r"><b>Profile suspended.</b> Your profile is hidden from organizers. Contact mychess.com@gmail.com.</div>';
 return me.verified?'<div class="banner g"><b>Verified arbiter.</b> Your public profile carries the Verified badge.</div>':'<div class="banner i"><b>Profile approved.</b> It is public. The Verified badge is granted after the team checks your FIDE ID and title against official records.</div>'}
function li(k,v){return v?'<li>'+k+': '+E(v)+'</li>':''}
function ecard(e,acts){return'<div class="enq"><div class="hd"><div><h4>'+E(e.event_name)+'</h4><div class="fr">From: '+E(e.organizer_name)+(e.organization?' ('+E(e.organization)+')':'')+' · '+MC.date(e.created_at)+'</div></div>'+MC.bd(e.status)+'</div><ul>'+li("Location",e.venue)+li("Dates",e.start_date?MC.date(e.start_date)+" to "+MC.date(e.end_date):"")+li("Expected participants",e.participants)+li("Required role",e.role)+li("Format",e.format)+li("Rounds",e.rounds)+li("FIDE rated",e.fide_rated)+li("Title norms",e.norms)+li("Remuneration",e.remuneration)+li("Travel & lodging",e.travel_lodging)+'</ul>'+(e.message?'<p class="sm">'+E(e.message)+'</p>':'')+(e.arbiter_note?'<p class="sm muted"><b>Your note:</b> '+E(e.arbiter_note)+'</p>':'')+'<div class="row">'+(acts||"")+'<a class="btn o sm" href="mailto:'+E(e.organizer_email)+'?subject='+encodeURIComponent("Re: "+e.event_name)+'">Email organizer</a></div></div>'}
function setStatus(id,s,extra){return q(sb.from("arb_enquiries").update(Object.assign({status:s},extra||{})).eq("id",id)).then(function(){MC.toast("Status: "+s);badges();MC.close();go(location.hash.slice(1)||"overview")})}
window.accept=function(id){setStatus(id,"Accepted")};
window.decline=function(id){if(confirm("Decline this appointment request?"))setStatus(id,"Declined")};
window.complete=function(id){if(confirm("Mark this appointment as completed?"))setStatus(id,"Completed")};
window.negotiate=function(id){MC.modal('<h3>Request negotiation</h3><p class="muted sm">Tell the organizer what you would like to change, for example fee, dates or travel.</p><textarea id="nn" rows="5" placeholder="e.g. My fee for this event is 7,000 per day with travel covered."></textarea><div class="row" style="margin-top:14px"><button class="btn" onclick="setStatus(\''+id+'\',\'Under Discussion\',{arbiter_note:document.getElementById(\'nn\').value})">Send &amp; mark under discussion</button><button class="btn o" onclick="MC.close()">Cancel</button></div>')};

function sec(t,sub,h){return'<div class="card"><h3>'+t+(sub?' <small>'+sub+'</small>':'')+'</h3>'+h+'</div>'}
function fi(l,n,v,t,x){return'<div class="f"><label>'+l+'</label><input name="'+n+'" type="'+(t||"text")+'" value="'+E(v==null?"":v)+'" '+(x||"")+'></div>'}
function op(a,v){return a.map(function(x){return'<option'+(x==v?" selected":"")+'>'+x+'</option>'}).join("")}
function ckb(n,arr,vals){return arr.map(function(v){return'<label><input type="checkbox" name="'+n+'" value="'+v+'"'+(vals.indexOf(v)>-1?" checked":"")+'> '+v+'</label>'}).join("")}
function num(v){return v===""||v==null?null:+v}
var HIS=[],RH=null,RC=null;
function getHist(){return RH?Promise.resolve(RH):q(sb.from("arb_history").select("*").order("event_date",{ascending:false})).then(function(h){RH=h;return h})}
function getCerts(){return RC?Promise.resolve(RC):q(sb.from("arb_certificates").select("*")).then(function(c){RC=c;return c})}
function invalidate(){RH=null;RC=null}

V.overview=function(){return Promise.all([q(sb.from("arb_enquiries").select("*").order("created_at",{ascending:false})),q(sb.from("arb_reviews").select("rating")),q(sb.from("arb_certificates").select("id")),q(sb.from("arb_history").select("id"))]).then(function(a){
 var en=a[0],rv=a[1],ce=a[2],hs=a[3],t=MC.today(),m=me;
 var nw=en.filter(function(x){return x.status=="New"}).length,up=en.filter(function(x){return["Accepted","Confirmed"].indexOf(x.status)>-1&&(x.end_date||"9999")>=t}).length,cp=en.filter(function(x){return x.status=="Completed"}).length,avg=rv.length?(rv.reduce(function(s,x){return s+x.rating},0)/rv.length).toFixed(1):"-";
 var steps=[[m.photo_url,"Add a profile photo","#profile"],[m.fide_id&&m.title,"Enter your FIDE ID and title","#profile"],[m.bio,"Write your professional summary","#profile"],[m.roles.length&&m.formats.length,"Choose your roles and formats","#profile"],[ce.length,"Upload your certificates","#certificates"],[m.fee_per_day||m.fee_per_event,"Set your fee rates","#fees"],[hs.length,"Record a tournament","#tournaments"]],done=steps.filter(function(s){return s[0]}).length,pc=Math.round(done/steps.length*100);
 page("overview",banner()+'<div class="card" style="background:linear-gradient(135deg,#eaf2fd,#f6f9ff)"><h3 style="font-size:20px">Welcome back, '+E(m.full_name)+'</h3><span class="muted">'+(TN[m.title]||"Arbiter")+(m.city?' · '+E(m.city):'')+'</span> '+MC.bd(m.status)+(m.verified?' '+MC.bd("Verified"):'')+'</div>'
 +'<div class="qa"><a class="btn a" href="#tournaments">+ Add tournament</a><a class="btn o" href="#availability">Update availability</a><a class="btn o" href="#resume">Resume &amp; PDF</a><button class="btn o" onclick="sp()">Share profile</button></div>'
 +'<div class="stats"><div class="stat"><b>'+nw+'</b><span>New enquiries</span></div><div class="stat"><b>'+up+'</b><span>Upcoming appointments</span></div><div class="stat"><b>'+cp+'</b><span>Completed events</span></div><div class="stat"><b>'+avg+'</b><span>Average rating</span></div></div>'
 +'<div class="card"><h3>Profile strength <small>'+pc+'% complete</small></h3><div class="bar" style="margin-bottom:14px"><i style="width:'+pc+'%"></i></div><div class="stp">'+steps.map(function(s){return'<a href="'+s[2]+'" class="'+(s[0]?"ok":"")+'"><i>'+(s[0]?"&#10003;":"")+'</i>'+s[1]+'</a>'}).join("")+'</div></div>'
 +'<div class="card"><h3>Latest enquiries</h3>'+(en.length?en.slice(0,3).map(function(e){return ecard(e,'<a class="btn sm" href="#enquiries">Open</a>')}).join(""):'<div class="empty">No enquiries yet. Organizers can contact you from your public profile.</div>')+'</div>')})};

V.profile=function(){return load().then(function(){var m=me;
 page("profile",banner()+'<form id="pf">'
 +sec("Basic details","Shown on your public profile",'<div class="row" style="margin-bottom:16px"><div class="av" style="width:76px;height:76px;font-size:26px">'+(m.photo_url?'<img src="'+E(m.photo_url)+'" alt="">':MC.ini(m.full_name))+'</div><div><label class="btn o sm" style="cursor:pointer">Upload photo<input type="file" id="ph" accept="image/*" hidden></label><div class="muted sm">Square JPG or PNG works best</div></div></div><div class="fg">'+fi("Full name","full_name",m.full_name,"text","required")+fi("Professional headline","headline",m.headline,"text",'placeholder="e.g. International Arbiter | Chief Arbiter for FIDE-rated Opens"')+fi("Phone / WhatsApp","phone",m.phone,"tel")+fi("Country","country",m.country)+fi("City","city",m.city)+'</div>')
 +sec("FIDE credentials","Checked by the MyChess64 team before the Verified badge",'<div class="fg">'+fi("FIDE ID","fide_id",m.fide_id,"text",'inputmode="numeric"')+'<div class="f"><label>Arbiter title</label><select name="title"><option value="">Select</option><option value="IA"'+(m.title=="IA"?" selected":"")+'>International Arbiter (IA)</option><option value="FA"'+(m.title=="FA"?" selected":"")+'>FIDE Arbiter (FA)</option><option value="NA"'+(m.title=="NA"?" selected":"")+'>National Arbiter (NA)</option></select></div>'+fi("Year title awarded","title_year",m.title_year,"number",'min="1950" max="2100"')+fi("Years of experience","years_exp",m.years_exp,"number",'min="0"')+fi("Events officiated (total)","events_count",m.events_count,"number",'min="0"')+fi("Norm events (total)","norm_events",m.norm_events,"number",'min="0"')+'</div>')
 +sec("Skills & roles","What organizers can appoint you for",'<div class="fg"><div class="f full"><label>Appointment roles</label><div class="ck">'+ckb("roles",["Chief Arbiter","Deputy Arbiter","Pairing Officer"],m.roles)+'</div></div><div class="f full"><label>Tournament formats</label><div class="ck">'+ckb("formats",["Classical","Rapid","Blitz","Team Events"],m.formats)+'</div></div>'+fi("Pairing software (comma separated)","software",m.software.join(", "),"text",'placeholder="Swiss Manager, Vega, JaVaFo"')+fi("Languages (comma separated)","languages",m.languages.join(", "),"text",'placeholder="English, Hindi"')+'</div>')
 +sec("Travel","Where you can officiate",'<div class="fg"><div class="f"><label>Travel preference</label><select name="travel_pref"><option value="">Select</option>'+op(["Local only","Within my state","Within my country","International"],m.travel_pref)+'</select></div>'+fi("Maximum travel distance (km)","travel_km",m.travel_km,"number",'min="0"')+'</div>')
 +sec("About you","Used on your public profile and resume",'<div class="fg"><div class="f full"><label>Professional summary</label><textarea name="bio" rows="5" placeholder="Your experience, strengths and the events you have handled">'+E(m.bio||"")+'</textarea></div><div class="f full"><label>Achievements (one per line)</label><textarea name="achievements" rows="3">'+E(m.achievements||"")+'</textarea></div><div class="f full"><label>Education &amp; training (one per line)</label><textarea name="education" rows="3">'+E(m.education||"")+'</textarea></div></div>')
 +'<div class="savebar"><span class="muted sm">Fee rates are managed under Fees &amp; Earnings.</span><button class="btn">Save profile</button></div></form>');
 $("#pf").onsubmit=function(e){e.preventDefault();var f=e.target,v={};new FormData(f).forEach(function(x,k){if(["roles","formats"].indexOf(k)<0)v[k]=x});
  ["title_year","travel_km"].forEach(function(k){v[k]=num(v[k])});["years_exp","events_count","norm_events"].forEach(function(k){v[k]=num(v[k])||0});v.title=v.title||null;
  v.languages=MC.list(v.languages);v.software=MC.list(v.software);v.roles=MC.vals('#pf [name=roles]');v.formats=MC.vals('#pf [name=formats]');
  q(sb.from("arb_arbiters").update(v).eq("id",uid)).then(function(){invalidate();return load()}).then(function(){MC.toast("Profile saved");V.profile()})};
 $("#ph").onchange=function(){var f=this.files[0];if(!f)return;if(f.size>5e6){MC.toast("Photo must be under 5 MB",1);return}var p=uid+"/avatar-"+Date.now();sb.storage.from("arb-avatars").upload(p,f,{upsert:true,contentType:f.type}).then(function(r){if(r.error){MC.toast(r.error.message,1);return}var u=sb.storage.from("arb-avatars").getPublicUrl(p).data.publicUrl;q(sb.from("arb_arbiters").update({photo_url:u}).eq("id",uid)).then(function(){me.photo_url=u;MC.toast("Photo updated");V.profile()})})}})};

V.certificates=function(){return q(sb.from("arb_certificates").select("*").order("created_at",{ascending:false})).then(function(ce){RC=ce;var t=MC.today(),soon=new Date(Date.now()+90*864e5).toISOString().slice(0,10);
 function stt(c){if(!c.expires_on)return"";return c.expires_on<t?MC.bd("Cancelled").replace("Cancelled","Expired"):c.expires_on<soon?'<span class="bd st-under">Expiring soon</span>':'<span class="bd st-confirmed">Valid</span>'}
 page("certificates",'<div class="banner i sm">Documents are stored privately. Only you and the MyChess64 verification team can open them. Upload your FIDE title certificate and licence to get the Verified badge faster.</div>'
 +sec("Your documents",ce.length+" stored",ce.length?ce.map(function(c){return'<div class="row sp" style="border-bottom:1px solid var(--bd);padding:12px 0"><div><b>'+E(c.name)+'</b> '+stt(c)+'<div class="muted sm">'+E(c.cert_type||"Document")+(c.issued_on?' &middot; Issued '+MC.date(c.issued_on):'')+(c.expires_on?' &middot; Valid until '+MC.date(c.expires_on):'')+'</div></div><div class="row"><button class="btn o sm" onclick="viewCert(\''+c.file_path+'\')">View</button><button class="btn r sm" onclick="delCert(\''+c.id+'\',\''+c.file_path+'\')">Delete</button></div></div>'}).join(""):'<div class="empty">No certificates uploaded yet.</div>')
 +sec("Upload a certificate","PDF or image, up to 10 MB",'<form id="cf" class="fg"><div class="f"><label>Document name *</label><input name="name" placeholder="e.g. FIDE Arbiter certificate" required></div><div class="f"><label>Type</label><select name="cert_type">'+op(["FIDE title certificate","Arbiter licence / card","Seminar / training","Title-norm certificate","Education","Other"])+'</select></div><div class="f"><label>Issued on</label><input type="date" name="issued_on"></div><div class="f"><label>Valid until (if any)</label><input type="date" name="expires_on"></div><div class="f full"><label>File *</label><input type="file" name="file" accept=".pdf,image/*" required></div><div class="full"><button class="btn">Upload certificate</button></div></form>'));
 $("#cf").onsubmit=function(e){e.preventDefault();var f=e.target,file=f.file.files[0];if(!file)return;if(file.size>10e6){MC.toast("File must be under 10 MB",1);return}var p=uid+"/"+Date.now()+"-"+file.name.replace(/[^\w.\-]/g,"_");
  sb.storage.from("arb-certificates").upload(p,file).then(function(r){if(r.error){MC.toast(r.error.message,1);return}q(sb.from("arb_certificates").insert({arbiter_id:uid,name:f.name.value,file_path:p,cert_type:f.cert_type.value,issued_on:f.issued_on.value||null,expires_on:f.expires_on.value||null})).then(function(){invalidate();MC.toast("Certificate stored securely");V.certificates()})})}})};
window.viewCert=function(p){sb.storage.from("arb-certificates").createSignedUrl(p,300).then(function(r){if(r.error){MC.toast(r.error.message,1);return}var u=r.data.signedUrl;if(/\.(png|jpe?g|webp|gif)$/i.test(p))MC.modal('<h3>Certificate preview</h3><img src="'+u+'" alt="Certificate" style="max-width:100%;border-radius:8px"><div class="row" style="margin-top:12px"><a class="btn o sm" target="_blank" rel="noopener" href="'+u+'">Open in new tab</a><button class="btn o sm" onclick="MC.close()">Close</button></div>');else window.open(u,"_blank")})};
window.delCert=function(id,p){if(!confirm("Delete this certificate?"))return;sb.storage.from("arb-certificates").remove([p]).then(function(){q(sb.from("arb_certificates").delete().eq("id",id)).then(function(){invalidate();V.certificates()})})};

var ROLES=["Chief Arbiter","Deputy Arbiter","Pairing Officer","Arbiter"],CATS=["Classical","Rapid","Blitz","Team Event","Youth / School"];
V.tournaments=function(){return q(sb.from("arb_history").select("*").order("event_date",{ascending:false})).then(function(h){HIS=h;RH=h;var yr=V.tournaments.y||"all";
 function yrs(){var s={};HIS.forEach(function(x){if(x.event_date)s[x.event_date.slice(0,4)]=1});return Object.keys(s).sort().reverse()}
 var L=HIS.filter(function(x){return yr=="all"||(x.event_date||"").slice(0,4)==yr});
 page("tournaments",'<div class="stats"><div class="stat"><b>'+HIS.length+'</b><span>Events recorded</span></div><div class="stat"><b>'+HIS.filter(function(x){return x.norm_event}).length+'</b><span>Norm events</span></div><div class="stat"><b>'+HIS.filter(function(x){return x.role=="Chief Arbiter"}).length+'</b><span>As Chief Arbiter</span></div><div class="stat"><b>'+HIS.reduce(function(s,x){return s+(x.participants||0)},0).toLocaleString("en-IN")+'</b><span>Players managed</span></div></div>'
 +'<div class="row sp" style="margin-bottom:14px"><div class="row"><button class="btn a" onclick="tmodal()">+ Add tournament</button><button class="btn o" onclick="importAppts()">Import completed appointments</button><button class="btn o" onclick="exportT()">Export CSV</button></div><select id="ty" style="max-width:150px"><option value="all">All years</option>'+yrs().map(function(y){return'<option'+(y==yr?" selected":"")+'>'+y+'</option>'}).join("")+'</select></div>'
 +(L.length?L.map(function(x){return'<div class="enq"><div class="hd"><div><h4>'+E(x.event_name)+'</h4><div class="fr">'+(x.event_date?MC.date(x.event_date)+(x.end_date&&x.end_date!=x.event_date?" to "+MC.date(x.end_date):""):"Date not set")+(x.venue?' &middot; '+E(x.venue):'')+'</div></div><div class="row">'+(x.norm_event?MC.bd("Norm event"):"")+(x.role?'<span class="bd">'+E(x.role)+'</span>':"")+'</div></div><ul>'+li("Category",x.category)+li("Participants",x.participants)+li("Organizer",x.organizer)+(x.enquiry_id?'<li>Fee: tracked in Fees &amp; Earnings (from appointment)</li>':x.fee!=null?'<li>Fee: '+MC.money(x.fee)+' &middot; Received: '+MC.money(x.received)+'</li>':'')+'</ul>'+(x.notes?'<p class="sm">'+E(x.notes)+'</p>':'')+'<div class="row"><button class="btn o sm" onclick="tmodal(\''+x.id+'\')">Edit</button><button class="btn r sm" onclick="delHi(\''+x.id+'\','+!!x.norm_event+')">Delete</button></div></div>'}).join(""):'<div class="empty">No tournaments yet. Add your events to build your record, resume and earnings.</div>'));
 $("#ty").onchange=function(){V.tournaments.y=this.value;V.tournaments()}})};
window.tmodal=function(id){var x=HIS.filter(function(h){return h.id==id})[0]||{},imp=!!x.enquiry_id;
 MC.modal('<h3>'+(id?"Edit":"Add")+' tournament</h3><form id="hf" class="fg"><div class="f full"><label>Tournament name *</label><input name="event_name" value="'+E(x.event_name||"")+'" required></div><div class="f"><label>Start date</label><input type="date" name="event_date" value="'+(x.event_date||"")+'"></div><div class="f"><label>End date</label><input type="date" name="end_date" value="'+(x.end_date||"")+'"></div><div class="f"><label>Venue (city, state)</label><input name="venue" value="'+E(x.venue||"")+'"></div><div class="f"><label>Organizer</label><input name="organizer" value="'+E(x.organizer||"")+'"></div><div class="f"><label>Your role</label><select name="role">'+op(ROLES,x.role)+'</select></div><div class="f"><label>Category</label><select name="category">'+op(CATS,x.category)+'</select></div><div class="f"><label>Participants</label><input type="number" min="0" name="participants" value="'+(x.participants==null?"":x.participants)+'"></div>'

V.reviews=function(){return q(sb.from("arb_reviews").select("*").order("created_at",{ascending:false})).then(function(r){
 var avg=r.length?r.reduce(function(s,x){return s+x.rating},0)/r.length:0;
 page("reviews",'<div class="stats"><div class="stat"><b>'+(r.length?avg.toFixed(1):"-")+'</b><span>Average rating</span></div><div class="stat"><b>'+r.length+'</b><span>Published reviews</span></div></div><div class="card"><h3>Organizer feedback</h3>'+(r.length?r.map(function(x){return'<div style="border-bottom:1px solid var(--bd);padding:12px 0"><span class="stars">'+"\u2605".repeat(x.rating)+"\u2606".repeat(5-x.rating)+'</span> <b>'+E(x.organizer_name||"Organizer")+'</b> <span class="muted sm">'+MC.date(x.created_at)+'</span><p style="margin:4px 0 0">'+E(x.comment||"")+'</p></div>'}).join(""):'<div class="empty">No reviews yet. After a completed event, the organizer can submit one. Reviews are moderated before they appear.</div>')+'</div>')})};

V.settings=function(){return Promise.resolve().then(function(){
 page("settings",'<div class="card"><h3>Notifications</h3><label class="row" style="cursor:pointer"><input type="checkbox" id="nt" style="width:auto"'+(me.notify?" checked":"")+'> Email me about new appointment enquiries</label></div><div class="card"><h3>Change password</h3><form id="pw" class="row"><input type="password" id="np" minlength="8" placeholder="New password (min 8 characters)" style="max-width:320px" required><button class="btn">Update password</button></form></div><div class="card"><h3>Account</h3><p class="muted">Signed in as <b>'+E(me.email)+'</b>. Status: '+MC.bd(me.status)+'</p><div class="row"><button class="btn o" id="so2">Sign out</button><a class="btn o" href="mailto:mychess.com@gmail.com?subject=Arbiter%20support">Contact support</a></div></div>');
 $("#nt").onchange=function(){q(sb.from("arb_arbiters").update({notify:this.checked}).eq("id",uid)).then(function(){MC.toast("Preference saved")})};
 $("#pw").onsubmit=function(e){e.preventDefault();sb.auth.updateUser({password:$("#np").value}).then(function(r){MC.toast(r.error?r.error.message:"Password updated",!!r.error);if(!r.error)$("#np").value=""})};
 $("#so2").onclick=function(){sb.auth.signOut()}})};
</script></body></html>
