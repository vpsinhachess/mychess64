<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Dashboard | MyChess64 Arbiters</title><link rel="stylesheet" href="mc64.css"></head><body>
<div id="app"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="mc64.js"></script>
<script>
var $=MC.$,E=MC.esc,q=MC.q,sb,V={},AR=[],EN=[],TN={IA:"International Arbiter",FA:"FIDE Arbiter",NA:"National Arbiter"},ST=["New","Under Discussion","Accepted","Confirmed","Completed","Cancelled","Declined"];
var NAV=[["overview","Overview & Reports","chart"],["applications","Arbiter Applications","users"],["verification","Credential Verification","shield"],["arbiters","Profile Management","user"],["requirements","Tournament Requirements","inbox"],["appointments","Appointment Monitoring","check"],["reviews","Reviews","star"]];
var TITLES={overview:["Overview & Reports","Registration and appointment statistics"],applications:["Arbiter Applications","Approve or reject registrations"],verification:["Credential Verification","Verify FIDE ID and title, then authorize the public Verified badge"],arbiters:["Profile Management","Edit, suspend or activate arbiter profiles"],requirements:["Tournament Requirements","All organizer requests and enquiries"],appointments:["Appointment Monitoring","Track every appointment end to end"],reviews:["Reviews","Moderate organizer feedback"]};
MC.boot({title:"Admin Dashboard",subtitle:"Authorized MyChess64 administrators only.",signup:false,onSession:start});
function start(u){sb=MC.sb;sb.rpc("arb_is_admin").then(function(r){if(!r.data){$("#app").innerHTML='<div class="auth"><div class="card"><h2>Access denied</h2><p class="muted">'+E(u.email)+' is not an administrator.</p><button class="btn o" onclick="MC.sb.auth.signOut()">Sign out</button></div></div>';return}
 MC.shell({role:"Admin Dashboard",items:NAV,user:u.email,go:go});refreshBadges()})}
function refreshBadges(){sb.from("arb_arbiters").select("id",{count:"exact",head:true}).eq("status","pending").then(function(r){MC.badge("applications",r.count||0)})}
function ld(){return Promise.all([q(sb.from("arb_arbiters").select("*").order("created_at",{ascending:false})),q(sb.from("arb_enquiries").select("*").order("created_at",{ascending:false}))]).then(function(a){AR=a[0];EN=a[1]})}
function go(id){var t=TITLES[id];$("#main").innerHTML=MC.top(t[0],t[1])+'<div class="empty">Loading...</div>';ld().then(function(){return V[id]()}).catch(function(){})}
function page(id,h){var t=TITLES[id];$("#main").innerHTML=MC.top(t[0],t[1])+h}
function nm(id){var a=AR.filter(function(x){return x.id==id})[0];return a?a.full_name:"Unassigned"}
function cur(){return location.hash.slice(1)||"overview"}
function upd(t,id,v,msg){return q(sb.from(t).update(v).eq("id",id)).then(function(){MC.toast(msg||"Saved");refreshBadges();go(cur())})}
function avt(a){return'<div class="av">'+(a.photo_url?'<img src="'+E(a.photo_url)+'" alt="">':MC.ini(a.full_name))+'</div>'}
function info(k,v){return v?'<li>'+k+': '+E(v)+'</li>':''}
function cnt(a,f){return a.filter(f).length}

V.overview=function(){return q(sb.from("arb_reviews").select("rating,status")).then(function(rv){
 var pub=rv.filter(function(r){return r.status=="published"}),avg=pub.length?(pub.reduce(function(s,x){return s+x.rating},0)/pub.length).toFixed(1):"-",d30=Date.now()-30*864e5;
 var mx=Math.max.apply(null,ST.map(function(s){return cnt(EN,function(e){return e.status==s})}).concat([1]));
 page("overview",'<div class="stats"><div class="stat"><b>'+AR.length+'</b><span>Registered arbiters</span></div><div class="stat"><b>'+cnt(AR,function(a){return a.status=="pending"})+'</b><span>Pending applications</span></div><div class="stat"><b>'+cnt(AR,function(a){return a.status=="approved"})+'</b><span>Approved</span></div><div class="stat"><b>'+cnt(AR,function(a){return a.verified})+'</b><span>Verified</span></div><div class="stat"><b>'+EN.length+'</b><span>Enquiries</span></div><div class="stat"><b>'+avg+'</b><span>Avg rating</span></div></div>'
 +'<div class="fg" style="align-items:start"><div class="card"><h3>Appointments by status</h3>'+ST.map(function(s){var n=cnt(EN,function(e){return e.status==s});return'<div style="margin-bottom:10px"><div class="row" style="justify-content:space-between"><span>'+MC.bd(s)+'</span><b>'+n+'</b></div><div class="bar"><i style="width:'+n/mx*100+'%"></i></div></div>'}).join("")+'</div>'
 +'<div class="card"><h3>Registrations</h3><p>Last 30 days: <b>'+cnt(AR,function(a){return new Date(a.created_at)>d30})+'</b></p><p>Suspended: <b>'+cnt(AR,function(a){return a.status=="suspended"})+'</b> &middot; Rejected: <b>'+cnt(AR,function(a){return a.status=="rejected"})+'</b></p><p>By title: IA <b>'+cnt(AR,function(a){return a.title=="IA"})+'</b> &middot; FA <b>'+cnt(AR,function(a){return a.title=="FA"})+'</b> &middot; NA <b>'+cnt(AR,function(a){return a.title=="NA"})+'</b></p><p>Unassigned requirements: <b>'+cnt(EN,function(e){return !e.arbiter_id})+'</b></p><h3 style="margin-top:18px">Export</h3><div class="row"><button class="btn o sm" onclick="MC.csv(\'arbiters.csv\',AR.map(function(a){var o=Object.assign({},a);delete o.photo_url;return o}))">Arbiters CSV</button><button class="btn o sm" onclick="MC.csv(\'enquiries.csv\',EN)">Enquiries CSV</button></div></div></div>')})};

function certs(ids){return q(sb.from("arb_certificates").select("*").in("arbiter_id",ids.length?ids:["00000000-0000-0000-0000-000000000000"]))}
window.viewCert=function(p){sb.storage.from("arb-certificates").createSignedUrl(p,300).then(function(r){if(r.error)MC.toast(r.error.message,1);else window.open(r.data.signedUrl,"_blank")})};
function cbtn(c,a){var L=c.filter(function(x){return x.arbiter_id==a.id});return L.length?L.map(function(x){return'<button class="btn o sm" onclick="viewCert(\''+x.file_path+'\')">'+E(x.name)+'</button>'}).join(" "):'<span class="muted sm">No documents uploaded</span>'}
function acard(a,c,acts){return'<div class="enq"><div class="row" style="gap:14px">'+avt(a)+'<div style="flex:1"><h4>'+E(a.full_name)+'</h4><div class="fr">'+(TN[a.title]||"Title not set")+' &middot; FIDE ID '+E(a.fide_id||"-")+' &middot; '+E([a.city,a.country].filter(Boolean).join(", "))+'</div></div>'+MC.bd(a.status)+(a.verified?' '+MC.bd("Verified"):'')+'</div><ul>'+info("Email",a.email)+info("Phone",a.phone)+info("Experience",a.years_exp+" years, "+a.events_count+" events, "+a.norm_events+" norm events")+info("Roles",a.roles.join(", "))+info("Formats",a.formats.join(", "))+info("Registered",MC.date(a.created_at))+'</ul><div class="row" style="margin-bottom:10px">'+cbtn(c,a)+'</div><div class="row">'+acts+'<a class="btn o sm" target="_blank" rel="noopener" href="https://arbiters.fide.com">Check on FIDE &#8599;</a></div></div>'}

V.applications=function(){var tab=V.applications.tab||"pending",L=AR.filter(function(a){return a.status==tab});return certs(L.map(function(a){return a.id})).then(function(c){
 page("applications",'<div class="tabs"><button data-t="pending" class="'+(tab=="pending"?"on":"")+'">Pending ('+cnt(AR,function(a){return a.status=="pending"})+')</button><button data-t="rejected" class="'+(tab=="rejected"?"on":"")+'">Rejected</button></div>'+(L.length?L.map(function(a){return acard(a,c,'<button class="btn g sm" onclick="setArb(\''+a.id+'\',\'approved\')">Approve</button>'+(tab=="pending"?'<button class="btn r sm" onclick="setArb(\''+a.id+'\',\'rejected\')">Reject</button>':''))}).join(""):'<div class="empty">No '+tab+' applications.</div>'));
 [].forEach.call(document.querySelectorAll(".tabs button"),function(b){b.onclick=function(){V.applications.tab=b.dataset.t;go("applications")}})})};
window.setArb=function(id,s){if(s=="rejected"&&!confirm("Reject this application?"))return;if(s=="suspended"&&!confirm("Suspend this profile? It will be hidden from organizers."))return;upd("arbiters",id,{status:s},"Profile "+s)};

V.verification=function(){var L=AR.filter(function(a){return a.status=="approved"});return certs(L.map(function(a){return a.id})).then(function(c){
 page("verification",'<div class="banner w sm"><b>Important:</b> grant the Verified badge only after checking the FIDE ID and title against official FIDE records and the uploaded certificate. It is never granted automatically on registration.</div>'+(L.length?L.map(function(a){return acard(a,c,a.verified?'<button class="btn r sm" onclick="verify(\''+a.id+'\',false)">Revoke badge</button>':'<button class="btn g sm" onclick="verifyAsk(\''+a.id+'\')">Verify &amp; grant badge</button>')}).join(""):'<div class="empty">No approved arbiters yet.</div>'))})};
window.verifyAsk=function(id){var a=AR.filter(function(x){return x.id==id})[0];MC.modal('<h3>Verify '+E(a.full_name)+'</h3><p class="muted sm">FIDE ID <b>'+E(a.fide_id||"-")+'</b> &middot; Title <b>'+(TN[a.title]||"-")+'</b></p><label class="row" style="cursor:pointer;align-items:flex-start"><input type="checkbox" id="vc" style="width:auto;margin-top:4px"> I have verified this FIDE ID and title against official records and the uploaded certificate.</label><div class="row" style="margin-top:16px"><button class="btn g" onclick="if(document.getElementById(\'vc\').checked){MC.close();verify(\''+id+'\',true)}else MC.toast(\'Please tick the confirmation\',1)">Grant Verified badge</button><button class="btn o" onclick="MC.close()">Cancel</button></div>')};
window.verify=function(id,v){if(!v&&!confirm("Revoke the Verified badge?"))return;upd("arbiters",id,{verified:v},v?"Verified badge granted":"Badge revoked")};

V.arbiters=function(){var f=V.arbiters.f||{s:"",st:""};function draw(){var L=AR.filter(function(a){return(!f.st||a.status==f.st)&&(!f.s||(a.full_name+" "+a.email+" "+a.fide_id+" "+a.country+" "+a.city).toLowerCase().indexOf(f.s.toLowerCase())>-1)});
 page("arbiters",'<div class="row" style="margin-bottom:14px"><input id="fs" placeholder="Search name, email, FIDE ID, country" value="'+E(f.s)+'" style="max-width:340px"><select id="fst" style="max-width:180px"><option value="">All statuses</option>'+["pending","approved","rejected","suspended"].map(function(s){return'<option'+(f.st==s?" selected":"")+'>'+s+'</option>'}).join("")+'</select></div><div class="card"><div class="tw"><table class="tbl"><thead><tr><th>Arbiter</th><th>Title</th><th>Location</th><th>Status</th><th></th></tr></thead><tbody>'
 +L.map(function(a){return'<tr><td><b>'+E(a.full_name)+'</b><div class="muted sm">'+E(a.email||"")+' &middot; '+E(a.fide_id||"")+'</div></td><td>'+E(a.title||"-")+'</td><td>'+E([a.city,a.country].filter(Boolean).join(", "))+'</td><td>'+MC.bd(a.status)+(a.verified?' '+MC.bd("Verified"):'')+'</td><td style="white-space:nowrap"><button class="btn o sm" onclick="editArb(\''+a.id+'\')">Edit</button> '+(a.status=="suspended"?'<button class="btn g sm" onclick="setArb(\''+a.id+'\',\'approved\')">Activate</button>':a.status=="approved"?'<button class="btn r sm" onclick="setArb(\''+a.id+'\',\'suspended\')">Suspend</button>':'')+'</td></tr>'}).join("")+'</tbody></table></div>'+(L.length?'':'<div class="empty">No profiles match.</div>')+'</div>');
 $("#fs").oninput=function(){f.s=this.value;V.arbiters.f=f;var p=this.selectionStart;draw();var i=$("#fs");i.focus();i.setSelectionRange(p,p)};$("#fst").onchange=function(){f.st=this.value;V.arbiters.f=f;draw()}}draw();return Promise.resolve()};
window.editArb=function(id){var a=AR.filter(function(x){return x.id==id})[0];function fi(l,n,v){return'<div class="f"><label>'+l+'</label><input name="'+n+'" value="'+E(v||"")+'"></div>'}
 MC.modal('<h3>Edit '+E(a.full_name)+'</h3><form id="ef" class="fg">'+fi("Full name","full_name",a.full_name)+fi("FIDE ID","fide_id",a.fide_id)+'<div class="f"><label>Title</label><select name="title"><option value="">-</option>'+["IA","FA","NA"].map(function(t){return'<option'+(a.title==t?" selected":"")+'>'+t+'</option>'}).join("")+'</select></div>'+fi("Country","country",a.country)+fi("City","city",a.city)+fi("Phone","phone",a.phone)+'<div class="full row"><button class="btn">Save changes</button><button type="button" class="btn r" onclick="delArb(\''+id+'\')">Delete profile</button></div></form>');
 $("#ef").onsubmit=function(e){e.preventDefault();var v={};new FormData(e.target).forEach(function(x,k){v[k]=x});v.title=v.title||null;MC.close();upd("arbiters",id,v,"Profile updated")}};
window.delArb=function(id){if(!confirm("Permanently delete this arbiter profile and all related records?"))return;MC.close();q(sb.from("arb_arbiters").delete().eq("id",id)).then(function(){MC.toast("Profile deleted");go("arbiters")})};

function stSel(e){return'<select style="max-width:150px" onchange="adminSt(\''+e.id+'\',this.value)">'+ST.map(function(s){return'<option'+(e.status==s?" selected":"")+'>'+s+'</option>'}).join("")+'</select>'}
window.adminSt=function(id,s){upd("enquiries",id,{status:s},"Status: "+s)};
V.requirements=function(){var f=V.requirements.f||"";function draw(){var L=EN.filter(function(e){return!f||e.status==f});
 page("requirements",'<div class="row" style="margin-bottom:14px"><select id="rf" style="max-width:200px"><option value="">All statuses</option>'+ST.map(function(s){return'<option'+(f==s?" selected":"")+'>'+s+'</option>'}).join("")+'</select><span class="muted sm">'+L.length+' requests</span></div><div class="card"><div class="tw"><table class="tbl"><thead><tr><th>Event</th><th>Organizer</th><th>Arbiter</th><th>Dates</th><th>Status</th><th></th></tr></thead><tbody>'
 +L.map(function(e){return'<tr><td><b>'+E(e.event_name)+'</b><div class="muted sm">'+E(e.venue||"")+'</div></td><td>'+E(e.organizer_name)+'<div class="muted sm">'+E(e.organizer_email)+'</div></td><td>'+(e.arbiter_id?E(nm(e.arbiter_id)):'<span class="bd st-under">Unassigned</span>')+'</td><td>'+MC.date(e.start_date)+'</td><td>'+stSel(e)+'</td><td><button class="btn o sm" onclick="enqView(\''+e.id+'\')">'+(e.arbiter_id?"Details":"Match")+'</button></td></tr>'}).join("")+'</tbody></table></div>'+(L.length?'':'<div class="empty">No requests.</div>')+'</div>');
 $("#rf").onchange=function(){V.requirements.f=f=this.value;draw()}}draw();return Promise.resolve()};
function score(a,e){var s=0;if(a.roles.indexOf(e.role)>-1)s+=3;if(e.format&&a.formats.some(function(x){return e.format.indexOf(x.split(" ")[0])>-1}))s+=3;if(a.availability=="Available")s+=2;if(a.verified)s+=2;if(e.norms&&e.norms!="No"&&a.title!="NA")s+=2;if(e.venue&&a.country&&e.venue.toLowerCase().indexOf(a.country.toLowerCase())>-1)s+=2;if(e.venue&&a.city&&e.venue.toLowerCase().indexOf(a.city.toLowerCase())>-1)s+=2;return s+Math.min(a.years_exp,20)/10}
window.enqView=function(id){var e=EN.filter(function(x){return x.id==id})[0];var sug=AR.filter(function(a){return a.status=="approved"}).map(function(a){return{a:a,s:score(a,e)}}).sort(function(x,y){return y.s-x.s}).slice(0,5);
 MC.modal('<h3>'+E(e.event_name)+'</h3><ul style="padding-left:20px">'+info("Organizer",e.organizer_name+" ("+e.organizer_email+")")+info("Organization",e.organization)+info("Phone",e.organizer_phone)+info("Venue",e.venue)+info("Dates",e.start_date?MC.date(e.start_date)+" to "+MC.date(e.end_date):"")+info("Role",e.role)+info("Format",e.format)+info("Rounds",e.rounds)+info("Participants",e.participants)+info("FIDE rated",e.fide_rated)+info("Norms",e.norms)+info("Remuneration",e.remuneration)+info("Travel & lodging",e.travel_lodging)+info("Message",e.message)+info("Arbiter note",e.arbiter_note)+'</ul>'
 +'<h3 style="margin-top:16px">'+(e.arbiter_id?'Assigned: '+E(nm(e.arbiter_id)):'Suggested arbiters')+'</h3>'+sug.map(function(x){return'<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--bd);padding:8px 0"><div><b>'+E(x.a.full_name)+'</b> '+(x.a.verified?MC.bd("Verified"):"")+'<div class="muted sm">'+(x.a.title||"")+' &middot; '+E(x.a.city||"")+' &middot; '+x.a.years_exp+' yrs &middot; '+x.a.availability+' &middot; match '+Math.round(x.s*10)/10+'</div></div><button class="btn sm" onclick="assign(\''+e.id+'\',\''+x.a.id+'\')">'+(e.arbiter_id==x.a.id?"Assigned":"Assign &amp; notify")+'</button></div>'}).join("")+(sug.length?'':'<div class="empty">No approved arbiters yet.</div>')+'<div class="row" style="margin-top:14px"><a class="btn o sm" href="mailto:'+E(e.organizer_email)+'?subject='+encodeURIComponent("Your arbiter request: "+e.event_name)+'">Email organizer</a><button class="btn o sm" onclick="MC.close()">Close</button></div>')};
window.assign=function(eid,aid){MC.close();q(sb.from("arb_enquiries").update({arbiter_id:aid,status:"New"}).eq("id",eid)).then(function(){MC.toast("Assigned. The arbiter sees it under Appointment Enquiries.");go("requirements")})};

V.appointments=function(){var L=EN.filter(function(e){return["Accepted","Confirmed","Completed","Cancelled"].indexOf(e.status)>-1});
 page("appointments",'<div class="banner i sm">The organizer confirms through you: set <b>Confirmed</b> once the organizer and arbiter have agreed in writing. After the event, mark <b>Completed</b> and share the review link with the organizer.</div><div class="card"><div class="tw"><table class="tbl"><thead><tr><th>Event</th><th>Arbiter</th><th>Organizer</th><th>Dates</th><th>Fee</th><th>Status</th><th></th></tr></thead><tbody>'
 +L.map(function(e){var a="";if(e.status=="Accepted")a='<button class="btn g sm" onclick="adminSt(\''+e.id+'\',\'Confirmed\')">Confirm</button>';if(e.status=="Confirmed")a='<button class="btn g sm" onclick="adminSt(\''+e.id+'\',\'Completed\')">Complete</button>';if(e.status=="Completed")a='<button class="btn o sm" onclick="revLink(\''+e.review_token+'\')">Copy review link</button>';if(["Accepted","Confirmed"].indexOf(e.status)>-1)a+=' <button class="btn r sm" onclick="if(confirm(\'Cancel this appointment?\'))adminSt(\''+e.id+'\',\'Cancelled\')">Cancel</button>';
  return'<tr><td><b>'+E(e.event_name)+'</b><div class="muted sm">'+E(e.venue||"")+'</div></td><td>'+E(nm(e.arbiter_id))+'</td><td>'+E(e.organizer_name)+'</td><td>'+MC.date(e.start_date)+'</td><td>'+(e.agreed_fee?MC.money(e.agreed_fee):"-")+'<div class="muted sm">'+e.payment_status+'</div></td><td>'+MC.bd(e.status)+'</td><td>'+a+'</td></tr>'}).join("")+'</tbody></table></div>'+(L.length?'':'<div class="empty">No appointments yet.</div>')+'</div>');return Promise.resolve()};
window.revLink=function(t){var base=(window.MC64_CONFIG.SITE_URL&&!/YOUR-/.test(window.MC64_CONFIG.SITE_URL))?window.MC64_CONFIG.SITE_URL:location.href.replace(/[^\/]*$/,"").replace(/\/$/,"");var u=base+"/review.html?t="+t;if(navigator.clipboard)navigator.clipboard.writeText(u).then(function(){MC.toast("Review link copied")},function(){prompt("Copy this link",u)});else prompt("Copy this link",u)};

V.reviews=function(){return q(sb.from("arb_reviews").select("*").order("created_at",{ascending:false})).then(function(r){
 page("reviews",'<div class="card">'+(r.length?r.map(function(x){var ev=EN.filter(function(e){return e.id==x.enquiry_id})[0];return'<div style="border-bottom:1px solid var(--bd);padding:14px 0"><div class="row" style="justify-content:space-between"><div><span class="stars">'+"\u2605".repeat(x.rating)+"\u2606".repeat(5-x.rating)+'</span> <b>'+E(x.organizer_name||"Organizer")+'</b> for <b>'+E(nm(x.arbiter_id))+'</b> '+MC.bd(x.status)+'<div class="muted sm">'+(ev?E(ev.event_name)+" &middot; ":"")+MC.date(x.created_at)+'</div></div><div class="row">'+(x.status!="published"?'<button class="btn g sm" onclick="revSt(\''+x.id+'\',\'published\')">Publish</button>':'')+(x.status!="hidden"?'<button class="btn o sm" onclick="revSt(\''+x.id+'\',\'hidden\')">Hide</button>':'')+'<button class="btn r sm" onclick="revDel(\''+x.id+'\')">Delete</button></div></div><p style="margin:6px 0 0">'+E(x.comment||"")+'</p></div>'}).join(""):'<div class="empty">No reviews submitted yet.</div>')+'</div>')})};
window.revSt=function(id,s){upd("reviews",id,{status:s},"Review "+s)};
window.revDel=function(id){if(confirm("Delete this review?"))q(sb.from("arb_reviews").delete().eq("id",id)).then(function(){go("reviews")})};
</script></body></html>
