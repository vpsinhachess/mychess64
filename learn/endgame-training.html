#msg{padding:10px;border-radius:4px;background:var(--b2);text-align:center}#msg.ok{background:var(--ac);color:#fff}#msg.bad{background:var(--bad);color:#fff}
#ml{position:relative;background:var(--b1);border-radius:4px;height:150px;overflow:auto;padding:6px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:2px 0}
#ml .n{width:12%;color:#888;padding:3px 0 3px 4px}#ml .m{width:44%;padding:3px 6px;cursor:pointer;border-radius:3px;color:var(--hi)}#ml .m.on{background:var(--bl)}
.nav,.acts{display:flex;gap:6px}.nav .btn,.acts .btn{flex:1;padding:9px 2px}
.fen{font:11px monospace;color:#777;word-break:break-all}
.set{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;border-bottom:1px solid #3334}
select,input[type=text]{font:inherit;background:var(--b2);color:var(--hi);border:1px solid #444;border-radius:4px;padding:6px}
a{color:var(--bl)}
.stat{display:flex;gap:18px;flex-wrap:wrap;margin:8px 0 12px}.stat div{font-size:26px;color:var(--hi);font-weight:700}.stat span{display:block;font-size:12px;color:#888;font-weight:400}
