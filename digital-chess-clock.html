<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080909">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MyChess64 — Premium Chess Clock</title>


<style>
:root{
  --bg:#080909;
  --panel:#111315;
  --panel2:#1a1c1e;
  --ivory:#f2eee3;
  --ivory2:#e4dfd2;
  --sage:#e6eee0;
  --sage2:#d4e0ca;
  --ink:#111315;
  --muted:#77736b;
  --white:#f8f5ed;
  --gold:#d4ad62;
  --gold2:#f0d18a;
  --amber:#c78b2f;
  --red:#a33232;
  --line:#393c3f;
}
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg)}
body{
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#eee;
}
button,input,select{font:inherit}
input{
  -webkit-user-select:text;
  user-select:text;
  -webkit-touch-callout:default;
}
button{cursor:pointer}

#app{
  position:fixed;
  inset:0;
  width:100%;
  height:100dvh;
  min-height:100dvh;
  display:grid;
  grid-template-rows:minmax(0,1fr) auto minmax(0,1fr);
  background:
    radial-gradient(circle at 50% 0,#292822 0,#111312 24%,#080909 68%);
  overflow:hidden;
  padding:
    max(6px,env(safe-area-inset-top))
    max(6px,env(safe-area-inset-right))
    max(6px,env(safe-area-inset-bottom))
    max(6px,env(safe-area-inset-left));
}

/* ---------- PLAYER CLOCK ---------- */
.clock{
  position:relative;
  min-height:0;
  margin:5px 0;
  border-radius:24px;
  border:1px solid #7a6744;
  overflow:hidden;
  color:var(--ink);
  background:linear-gradient(135deg,#fffdf6 0%,var(--ivory) 56%,#ddd5c4 100%);
  box-shadow:
    0 16px 38px #000b,
    inset 0 2px 0 #fff,
    inset 0 -1px 0 #8b754d,
    0 0 0 1px #111;
  touch-action:manipulation;
  user-select:none;
}
.clock::after{
  content:"";
  position:absolute;
  inset:7px;
  border:1px solid #c9a76288;
  border-radius:18px;
  pointer-events:none;
}
.clock-inner{
  position:absolute;
  inset:0;
  padding:clamp(13px,2.6vh,25px) clamp(18px,5vw,30px);
  display:grid;
  grid-template-rows:auto 1fr auto;
  align-items:center;
  z-index:1;
}
.clock.black .clock-inner{transform:rotate(180deg)}

.clock.inactive{
  background:linear-gradient(135deg,#eeeae0 0%,#e2ddd1 58%,#d7d0c1 100%);
}
.clock.active{
  background:linear-gradient(135deg,#242628 0%,#111315 55%,#070809 100%);
  border-color:#d4ad62;
  color:#f7f3e8;
  box-shadow:
    0 0 0 2px #d4ad62,
    0 17px 42px #000b,
    inset 0 2px 0 #ffffff10,
    inset 0 -1px 0 #000;
}
.clock.active .player-line,
.clock.active .clock-meta{color:#e2ddd2}
.clock.active .status{
  color:#f3d58f;
  border-color:#d4ad62;
  background:#00000033;
}
.clock.active .time{color:#fffdf6;text-shadow:0 1px 0 #000}

.clock.warning{
  background:linear-gradient(135deg,#fff8e8,#f2e3c4);
  border-color:#c78b2f;
}
.clock.critical{
  background:linear-gradient(135deg,#fff0ed,#eecfca);
  border-color:#a33232;
}

.clock.running-red{
  background:linear-gradient(135deg,#f6d7d4 0%,#e9b7b3 58%,#dca19e 100%);
  border-color:#a33232;
  box-shadow:0 0 0 2px #a33232,0 17px 42px #000b,inset 0 2px 0 #fff,inset 0 -1px 0 #7d2525;
}
.clock.running-red .status{color:#741f1f;border-color:#a33232;background:#fff1ef66}
.clock.running-red .clock-meta{color:#6e2929}
.clock.running-red .live-dot{background:#a33232;box-shadow:0 0 12px #a33232,inset 0 1px #fff}
.clock.flag{
  background:linear-gradient(135deg,#b43f3f,#761f1f);
  border-color:#e07c7c;
  color:#fff;
}

.player-line{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(11px,2.1vw,15px);
  font-weight:700;
  letter-spacing:.12em;
}
.player-name{display:flex;align-items:center;gap:7px}
.player-symbol{font-size:1.2em}
.clock.black .player-symbol{font-size:1.2em}
.status{
  border:1px solid #aaa398;
  border-radius:8px;
  padding:5px 10px;
  font:700 9px/1 Inter,system-ui,sans-serif;
  letter-spacing:.13em;
  background:#d8d2c688;
}
.active .status{
  color:#6c5525;
  border-color:var(--gold);
  background:#f0d18a33;
}
.flag .status{
  color:#fff;
  border-color:#f2b6b6;
  background:#741c1c55;
}
.time{
  align-self:center;
  justify-self:center;
  font-family:"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans","DejaVu Sans",sans-serif;
  font-variant-numeric:tabular-nums lining-nums;
  font-feature-settings:"tnum","lnum";
  font-size:clamp(78px,22vw,148px);
  line-height:.86;
  font-weight:700;
  letter-spacing:-.01em;
  white-space:nowrap;
  text-shadow:0 1px 0 #fff9;
}
.flag .time{color:#fff;text-shadow:0 1px #641818}
.clock-meta{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:18px;
  color:#716c63;
  font-size:11px;
}
.clock-meta b{font-weight:800}
.active .clock-meta{color:#58614f}
.flag .clock-meta{color:#f7d8d8}
.live-dot{
  display:inline-block;
  width:8px;height:8px;border-radius:50%;
  margin-right:5px;
  background:#a7a299;
  box-shadow:inset 0 1px #fff;
}
.active .live-dot{
  background:var(--gold);
  box-shadow:0 0 12px #d4ad62,inset 0 1px #fff;
}
.warning .live-dot{background:var(--amber)}
.critical .live-dot{background:var(--red)}
.flag .live-dot{background:#fff}

/* ---------- CENTRAL CONTROL DECK ---------- */
#controlDeck{
  position:relative;
  z-index:5;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  padding:8px;
  border:1px solid #4b4030;
  border-radius:19px;
  background:linear-gradient(145deg,#25282a,#0f1011);
  box-shadow:0 12px 30px #000c,inset 0 1px #fff1;
}
.control{
  min-height:56px;
  border:1px solid #50483b;
  border-radius:14px;
  color:#ddd8ce;
  background:radial-gradient(circle at 50% 15%,#383b3d,#17191b 72%);
  box-shadow:inset 0 1px #fff2,0 4px 9px #0009;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
}
.control:active{transform:translateY(1px) scale(.99)}
.control .icon{font-size:18px;color:#f0eadf}
.control small{font-size:8px;letter-spacing:.11em;color:#bdb7aa}
.control.primary{
  border-color:var(--gold);
  box-shadow:inset 0 1px #fff2,0 0 15px #d4ad6220,0 4px 9px #0009;
}
.control.primary .icon{color:var(--gold2)}

/* ---------- MODE SHEET ---------- */
#modeSheet{
  position:fixed;
  inset:0;
  z-index:50;
  display:none;
  align-items:flex-end;
  justify-content:center;
  padding:8px;
  background:#000b;
}
#modeSheet.open{display:flex}
.sheet{
  width:min(600px,100%);
  max-height:92dvh;
  overflow:auto;
  border:1px solid #4b4030;
  border-radius:22px;
  padding:16px;
  background:linear-gradient(145deg,#1b1d1f,#0e0f10);
  box-shadow:0 -15px 50px #000;
}
.sheet-head{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:14px;
}
.sheet-title{font:700 13px/1 Inter,sans-serif;letter-spacing:.17em}
.close{
  width:38px;height:38px;border-radius:10px;
  border:1px solid #45484b;background:#25282a;color:#eee;
}
.section-title{
  margin:15px 0 8px;
  color:#9d988e;font-size:9px;font-weight:800;letter-spacing:.17em;
}
.time-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.time-btn,.mode-card{
  border:1px solid #3b3f42;
  border-radius:11px;
  background:linear-gradient(145deg,#292c2f,#1b1d1f);
  color:#ddd;
  box-shadow:inset 0 1px #fff1;
}
.time-btn{padding:10px 4px;font-size:11px}
.time-btn:hover,.time-btn:focus{border-color:var(--gold)}
.mode-card{
  width:100%;
  text-align:left;
  padding:12px;
  margin-top:7px;
}
.mode-card b{display:block;font-size:11px;margin-bottom:3px}
.mode-card span{display:block;color:#919498;font-size:9px;line-height:1.4}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}

/* ---------- CUSTOM TIME ---------- */
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{
  padding:9px;border:1px solid #393d40;border-radius:11px;background:#1b1d1f;
}
.field label{display:block;margin-bottom:5px;color:#92969a;font-size:8px;letter-spacing:.11em}
.field input{
  width:100%;padding:9px;border-radius:8px;
  border:1px solid #404449;background:#0d0f10;color:#fff;
  text-align:center;outline:none;
}
.field input:focus{border-color:var(--gold)}
.full-field{margin-top:8px}
.sheet-actions{display:flex;gap:8px;margin-top:12px}
.gold-btn,.dark-btn{
  flex:1;padding:12px;border-radius:11px;font-weight:800;letter-spacing:.04em
}
.gold-btn{border:1px solid #e2bf75;background:linear-gradient(145deg,#d9b66d,#a98443);color:#17130b}
.dark-btn{border:1px solid #414548;background:#25282b;color:#ddd}

/* ---------- STATUS TOAST ---------- */
#toast{
  position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));
  z-index:80;transform:translate(-50%,20px);
  padding:10px 15px;border:1px solid #4a4e51;border-radius:99px;
  background:#202326;color:#eee;font-size:11px;opacity:0;pointer-events:none;
  transition:.18s;
}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* active clock = green (your turn); amber <30s, pulsing red <10s */
.clock.running-red{background:linear-gradient(135deg,#e3f2da,#bfdeb1 58%,#a5cba2);border-color:#3f8a52;box-shadow:0 0 0 3px #3f8a52,0 17px 42px #000b,inset 0 2px 0 #fff}
.clock.running-red .status{color:#1f5a30;border-color:#3f8a52;background:#fffa}
.clock.running-red .clock-meta{color:#2c5a38}
.clock.running-red .live-dot{background:#3f8a52;box-shadow:0 0 12px #3f8a52}
.clock.running-red.warning{background:linear-gradient(135deg,#fff3d6,#f3d894 58%,#e6c070);border-color:#c78b2f;box-shadow:0 0 0 3px #c78b2f,0 17px 42px #000b,inset 0 2px 0 #fff}
.clock.running-red.warning .status,.clock.running-red.warning .clock-meta{color:#6b4a10;border-color:#c78b2f}
.clock.running-red.critical{background:linear-gradient(135deg,#f6d2cd,#e8a9a2 58%,#d98d86);border-color:#a33232;box-shadow:0 0 0 3px #a33232,0 17px 42px #000b,inset 0 2px 0 #fff;animation:pulse 1s infinite}
.clock.running-red.critical .status,.clock.running-red.critical .clock-meta{color:#741f1f;border-color:#a33232}
@keyframes pulse{50%{opacity:.82}}
.control.go{border-color:#5f9a6a}.control.go .icon{color:#8fe0a0}
.control.hold{border-color:#d4a24a}.control.hold .icon{color:#f6c667}
.control.reset .icon{color:#e58a82}.control.snd .icon{color:#8cc4f0}.control.mode .icon{color:#e8d9a8}
.time.long{font-size:clamp(46px,13.5vw,100px)}
.mode-card.sel{border-color:var(--gold);background:linear-gradient(145deg,#3a3426,#201d15)}
.clock:focus-visible{outline:2px solid var(--gold);outline-offset:-4px}
@media(max-height:650px){
  .clock-inner{padding:10px 18px}
  .control{min-height:48px}
  #controlDeck{padding:6px}
  .clock{margin:3px 0}
}
@media(min-width:700px){
  #app{width:min(680px,100%);margin:auto}
}
</style>
</head>

<body>
<main id="app" aria-label="MyChess64 Premium Chess Clock">

  <!-- BLACK: physically upside-down for the opponent -->
  <section id="blackClock" class="clock black inactive" data-player="black" aria-label="Black clock" role="button" tabindex="0">
    <div class="clock-inner">
      <div class="player-line">
        <span class="player-name"><span class="player-symbol">♚</span>BLACK</span>
        <span class="status" id="blackStatus">WAITING</span>
      </div>
      <div class="time" id="blackTime">10:00</div>
      <div class="clock-meta">
        <span><i class="live-dot"></i>Moves: <b id="blackMoves">0</b></span>
        <span id="blackInc">+0 sec</span>
      </div>
    </div>
  </section>

  <!-- CENTRAL PHYSICAL-CLOCK-LIKE CONTROL DECK -->
  <nav id="controlDeck" aria-label="Clock controls">
    <button class="control reset" id="resetBtn" type="button">
      <span class="icon">↻</span><small>RESET</small>
    </button>
    <button class="control primary" id="startBtn" type="button">
      <span class="icon" id="startIcon">▶</span><small id="startLabel">START</small>
    </button>
    <button class="control mode" id="modeBtn" type="button">
      <span class="icon">◴</span><small>MODE</small>
    </button>
    <button class="control snd" id="soundBtn" type="button">
      <span class="icon" id="soundIcon">◉</span><small id="soundLabel">SOUND</small>
    </button>
  </nav>

  <!-- WHITE -->
  <section id="whiteClock" class="clock white active" data-player="white" aria-label="White clock" role="button" tabindex="0">
    <div class="clock-inner">
      <div class="player-line">
        <span class="player-name"><span class="player-symbol">♔</span>WHITE</span>
        <span class="status" id="whiteStatus">READY</span>
      </div>
      <div class="time" id="whiteTime">10:00</div>
      <div class="clock-meta">
        <span><i class="live-dot"></i>Moves: <b id="whiteMoves">0</b></span>
        <span id="whiteInc">+0 sec</span>
      </div>
    </div>
  </section>

</main>

<!-- MODE IS THE SINGLE GATEWAY FOR TIME CONTROL + ADVANCED SETTINGS -->
<div id="modeSheet" aria-hidden="true">
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <span class="sheet-title" id="sheetTitle">MODE</span>
      <button class="close" id="closeSheet" type="button">✕</button>
    </div>
    <div id="sheetContent"></div>
  </section>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

/* ============================================================
   MyChess64 — Architecture
   1. State is the single source of truth.
   2. Timing is timestamp based; setInterval is only a renderer.
   3. Player switching and visual state happen in one transaction.
   4. Mode sheet owns every time-control setting.
   5. Main game screen never scrolls.
   ============================================================ */


const PRESETS = [ // [label, seconds, increment, bonusMoves, bonusSeconds, category]
  ["1 + 0",60,0,0,0,"BULLET"],["1 + 1",60,1,0,0,"BULLET"],["2 + 1",120,1,0,0,"BULLET"],
  ["3 + 0",180,0,0,0,"BLITZ"],["3 + 2",180,2,0,0,"BLITZ"],["5 + 0",300,0,0,0,"BLITZ"],
  ["5 + 3",300,3,0,0,"BLITZ"],["10 + 0",600,0,0,0,"BLITZ"],
  ["10 + 5",600,5,0,0,"RAPID"],["15 + 0",900,0,0,0,"RAPID"],["15 + 10",900,10,0,0,"RAPID"],["25 + 10",1500,10,0,0,"RAPID"],
  ["45 + 45",2700,45,0,0,"CLASSICAL"],["60 + 30",3600,30,0,0,"CLASSICAL"],["FIDE 90+30",5400,30,40,1800,"CLASSICAL"],["120 + 30",7200,30,0,0,"CLASSICAL"]
];

const state = {
  players:{
    white:{base:180,remain:180,inc:2,moves:0},
    black:{base:180,remain:180,inc:2,moves:0}
  },
  activePlayer:"white",
  status:"ready", // ready | running | paused | finished
  vol:2, // 0 muted, 1 low, 2 medium, 3 high
  
  haptic:true,
  fullscreen:false,
  wakeLock:null,
  lastTimestamp:0,
  renderHandle:0,
  flagAlarmTimer:null,
  flagAlarmActive:false,
  stage:null, // {moves,add}: time added when a player completes that move (FIDE classical)
  mode:"fischer", // fischer | delay | bronstein | none
  turnMs:0,
  warnSec:-1,
  controlLabel:"3 + 2"
};

const $ = id => document.getElementById(id);

function inProgress(){return state.status==="running"||state.status==="paused";}
function incLabel(n){
  return state.mode==="none"?"sudden death":state.mode==="delay"?`delay ${n} sec`:state.mode==="bronstein"?`bronstein ${n} sec`:`+${n} sec`;
}
function formatTime(ms){
  if(ms>0 && ms<10000){const t=Math.ceil(ms/100)/10;return "00:"+(t<10?"0":"")+t.toFixed(1);}
  let total = Math.max(0,Math.ceil(ms/1000));
  const h = Math.floor(total/3600);
  total %= 3600;
  const m = Math.floor(total/60);
  const s = total % 60;
  return h
    ? `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`
    : `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

function playerClass(p){
  const x = state.players[p];
  if(x.remain <= 0) return "flag";
  if(state.status === "running" && state.activePlayer === p)
    return "running-red"+(x.remain<=10000?" critical":x.remain<=30000?" warning":"");
  if(x.remain <= 10000) return "critical";
  if(x.remain <= 30000) return "warning";
  return "inactive";
}

function statusText(p){
  const x = state.players[p];
  if(x.remain <= 0) return "FLAG FALL";
  if(state.status === "finished") return "GAME OVER";
  if(state.status === "paused") return "PAUSED";
  if(state.status === "running") return state.activePlayer === p ? "YOUR TURN" : "WAITING";
  return p === "white" ? "TAP TO START" : "READY";
}

/* ---------- Rendering: only reflects state ---------- */
function render(){
  for(const p of ["white","black"]){
    const x = state.players[p];
    const clock = $(p+"Clock");
    clock.className = `clock ${p} ${playerClass(p)}`;
    const tt=formatTime(x.remain);
    $(p+"Time").textContent = tt;
    $(p+"Time").classList.toggle("long",tt.length>5);
    $(p+"Moves").textContent = x.moves;
    $(p+"Inc").textContent = incLabel(x.inc);
    $(p+"Status").textContent = statusText(p);
  }

  $("startIcon").textContent =
    state.status === "running" ? "Ⅱ" :
    state.status === "paused" ? "▶" : "▶";

  $("startLabel").textContent =
    state.status === "running" ? "PAUSE" :
    state.status === "paused" ? "RESUME" : "START";

  $("soundIcon").textContent = state.vol ? "◉" : "○";
  $("soundLabel").textContent = VOLS[state.vol];
  $("startBtn").classList.toggle("hold",state.status==="running");
  $("startBtn").classList.toggle("go",state.status!=="running");
}

/* ---------- Audio / haptic ---------- */
let audioContext=null;

function ensureAudio(){
  try{
    const AudioCtx=window.AudioContext||window.webkitAudioContext;
    if(!AudioCtx)return null;
    if(!audioContext) audioContext=new AudioCtx();
    if(audioContext.state==="suspended") audioContext.resume();
    return audioContext;
  }catch(_){return null}
}

const VOLS=["MUTED","VOL LOW","VOL MED","VOL HIGH"];
function cycleVol(){state.vol=(state.vol+1)%4;}
let master=null,noiseBuf=null;
function ensureMaster(ctx){
  if(master)return master;
  const comp=ctx.createDynamicsCompressor();
  master=ctx.createGain();
  master.connect(comp);comp.connect(ctx.destination);
  const n=Math.floor(ctx.sampleRate*0.12);
  noiseBuf=ctx.createBuffer(1,n,ctx.sampleRate);
  const d=noiseBuf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  return master;
}
function tone(ctx,out,t,f0,f1,dur,type,vol){
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type;
  o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.004);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(out);o.start(t);o.stop(t+dur+0.01);
}
function click(ctx,out,t,freq,vol,dur,q=1.2){
  const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();
  s.buffer=noiseBuf;f.type="bandpass";f.frequency.value=freq;f.Q.value=q;
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(out);s.start(t);s.stop(t+dur);
}
/* Move = mechanical clock "tock": filtered noise click + short low body thump. */
function beep(type="move"){
  const ctx=ensureAudio();
  if(!ctx||!state.vol)return;
  try{
    const out=ensureMaster(ctx);
    out.gain.value=[0,0.35,0.7,1][state.vol];
    const t=ctx.currentTime;
    if(type==="move"){
      /* Plastic clock button: sharp contact, ringing casing, body thump, then a softer release click. */
      const r=1+(Math.random()-0.5)*0.06, v=0.92+Math.random()*0.16;
      click(ctx,out,t,4200*r,1.0*v,0.012);
      click(ctx,out,t+0.001,1500*r,2.6*v,0.06,9);
      tone(ctx,out,t,190*r,70,0.09,"sine",0.9*v);
      click(ctx,out,t+0.075,3300*r,0.5*v,0.012);
      click(ctx,out,t+0.076,1900*r,1.1*v,0.035,8);
      tone(ctx,out,t+0.075,230,110,0.04,"sine",0.25*v);
    }
    else if(type==="start"){tone(ctx,out,t,660,880,0.09,"sine",0.35);tone(ctx,out,t+0.1,880,1100,0.12,"sine",0.35);}
    else if(type==="warn"){tone(ctx,out,t,1400,1400,0.06,"sine",0.22);}
    else{for(let i=0;i<3;i++)tone(ctx,out,t+i*0.2,880,880,0.14,"square",0.22);}
  }catch(_){}
}

function haptic(ms=12){
  if(state.haptic && navigator.vibrate) navigator.vibrate(ms);
}

/* Ensure the browser unlocks audio on the first real user gesture. */
["pointerdown","touchstart","click"].forEach(evt=>{
  document.addEventListener(evt,()=>ensureAudio(),{passive:true});
});
/* ---------- Touch protection ---------- */
document.addEventListener("contextmenu", e=>{
  if(!e.target.closest("input,textarea,select")) e.preventDefault();
});
document.addEventListener("selectstart", e=>{
  if(!e.target.closest("input,textarea,select")) e.preventDefault();
});
document.addEventListener("dragstart", e=>e.preventDefault());

/* ---------- Screen / wake ---------- */
async function requestImmersive(){
  try{
    if(document.fullscreenElement !== document.documentElement &&
       document.documentElement.requestFullscreen){
      await document.documentElement.requestFullscreen();
    }
    state.fullscreen=true;
  }catch(_){
    state.fullscreen=false;
  }
  await requestWakeLock();
}
async function requestWakeLock(){
  try{
    if("wakeLock" in navigator){
      if(state.wakeLock) return;
      state.wakeLock = await navigator.wakeLock.request("screen");
      state.wakeLock.addEventListener("release",()=>state.wakeLock=null);
    }
  }catch(_){}
}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible" && state.status==="running"){
    consumeElapsed(); // keep real elapsed time while hidden
    scheduleRender();
    render();
    requestWakeLock();
  }
});

function startFlagAlarm(){
  if(state.flagAlarmActive)return;
  state.flagAlarmActive=true;
  beep("flag");
  haptic(180);
  clearInterval(state.flagAlarmTimer);
  state.flagAlarmTimer=setInterval(()=>{
    if(state.status==="finished" && state.flagAlarmActive){
      beep("flag");
      haptic(180);
    }else{
      stopFlagAlarm();
    }
  },900);
}

function stopFlagAlarm(){
  state.flagAlarmActive=false;
  clearInterval(state.flagAlarmTimer);
  state.flagAlarmTimer=null;
}

/* ---------- Timing engine ---------- */
function startGame(){
  if(state.status==="finished"){toast("Game over — press Reset");return;}
  ensureAudio();
  stopFlagAlarm();
  state.status="running";
  state.lastTimestamp=performance.now();
  requestImmersive();
  beep("start"); haptic(16);
  scheduleRender();
  render();
}

function pauseGame(){
  if(state.status!=="running") return;
  consumeElapsed();
  state.status="paused";
  stopFlagAlarm();
  beep("move");
  render();
}

function resumeGame(){
  if(state.status!=="paused") return;
  ensureAudio();
  stopFlagAlarm();
  state.status="running";
  state.lastTimestamp=performance.now();
  requestImmersive();
  scheduleRender();
  beep("start");
  render();
}

function consumeElapsed(){
  if(state.status!=="running") return true;
  const now=performance.now();
  const delta=now-state.lastTimestamp;
  state.lastTimestamp=now;
  const p=state.players[state.activePlayer];
  const before=state.turnMs;
  state.turnMs+=delta;
  let charge=delta;
  if(state.mode==="delay") charge=Math.max(0,state.turnMs-Math.max(before,p.inc*1000));
  p.remain -= charge;
  if(p.remain<=0){
    p.remain=0;
    state.status="finished";
    startFlagAlarm();
    return false;
  }
  const sec=Math.ceil(p.remain/1000);
  if(sec<=10 && sec!==state.warnSec){state.warnSec=sec;beep("warn");}
  return true;
}

function renderLoop(){
  if(state.status!=="running") return;
  consumeElapsed();
  render();
  if(state.status==="running") scheduleRender();
}
function scheduleRender(){
  cancelAnimationFrame(state.renderHandle);
  state.renderHandle=requestAnimationFrame(renderLoop);
}

/* ---------- The critical move transaction ---------- */
function completeMove(player){
  if(state.status==="ready"){startGame();return;}
  if(state.status==="paused"){toast("Paused — press Resume");return;}
  if(state.status!=="running") return;
  if(state.activePlayer!==player) return;
  ensureAudio(); // inactive side cannot switch clock

  if(!consumeElapsed()){
    render();
    return;
  }

  const current=state.players[player];

  if(state.mode==="fischer") current.remain += current.inc*1000;
  else if(state.mode==="bronstein") current.remain += Math.min(current.inc*1000,state.turnMs);
  current.moves += 1;
  if(state.stage && current.moves===state.stage.moves){
    current.remain += state.stage.add*1000;
    toast(`Move ${state.stage.moves}: +${state.stage.add/60} min added`);
  }

  // Single authoritative switch.
  state.activePlayer = player==="white" ? "black" : "white";
  state.lastTimestamp = performance.now();
  state.turnMs=0; state.warnSec=-1;

  beep("move");
  haptic(12);
  render();
}

/* ---------- Reset protection ---------- */
function resetGame(){
  if(inProgress() && !confirm("Reset the current game?")) return;
  stopFlagAlarm();
  cancelAnimationFrame(state.renderHandle);
  state.turnMs=0; state.warnSec=-1;
  state.status="ready";
  state.activePlayer="white";
  for(const p of ["white","black"]){
    state.players[p].remain=state.players[p].base*1000;
    state.players[p].moves=0;
  }
  render();
}

/* ---------- Time control ---------- */
function applyPreset(label,seconds,increment,bm=0,bs=0){
  if(inProgress() && !confirm("Start a new game with this time control?")) return;
  state.players.white={base:seconds,remain:seconds*1000,inc:increment,moves:0};
  state.players.black={base:seconds,remain:seconds*1000,inc:increment,moves:0};
  state.activePlayer="white";
  state.status="ready";
  state.turnMs=0; state.warnSec=-1;
  state.stage=bm?{moves:bm,add:bs}:null;
  if(bm) state.mode="fischer";
  state.controlLabel=label;
  saveLastProgram();
  closeMode();
  render();
  toast(label+" ready — tap a clock or press Start");
}

function applyCustomTime(){
  const wm=Math.max(0,+$("wm").value||0);
  const ws=Math.max(0,Math.min(59,+$("ws").value||0));
  const wi=Math.max(0,+$("wi").value||0);
  const bm=Math.max(0,+$("bm").value||0);
  const bs=Math.max(0,Math.min(59,+$("bs").value||0));
  const bi=Math.max(0,+$("bi").value||0);

  const white=wm*60+ws;
  const black=bm*60+bs;

  if(white<=0 || black<=0){
    toast("Both players need a starting time.");
    return;
  }

  if(inProgress() && !confirm("Start a new game with custom time?")) return;

  state.players.white={base:white,remain:white*1000,inc:wi,moves:0};
  state.players.black={base:black,remain:black*1000,inc:bi,moves:0};
  state.activePlayer="white";
  state.status="ready";
  state.turnMs=0; state.warnSec=-1; state.stage=null;
  state.controlLabel=`W ${formatTime(white*1000)} +${wi} / B ${formatTime(black*1000)} +${bi}`;
  saveLastProgram();
  closeMode();
  render();
  toast("Custom time ready — tap a clock to start");
}

/* ---------- Mode UI ---------- */
function openMode(content){
  $("sheetContent").innerHTML=content;
  $("modeSheet").classList.add("open");
  $("modeSheet").setAttribute("aria-hidden","false");
}
function closeMode(){
  $("modeSheet").classList.remove("open");
  $("modeSheet").setAttribute("aria-hidden","true");
}
function modeHome(){
  openMode(`
    ${["BULLET","BLITZ","RAPID","CLASSICAL"].map(c=>`
      <div class="section-title">${c}</div>
      <div class="time-grid">${PRESETS.map((p,i)=>p[5]===c?`<button class="time-btn" data-preset="${i}">${p[0]}</button>`:"").join("")}</div>`).join("")}

    <div class="section-title">CUSTOM</div>
    <button class="mode-card" id="customCard">
      <b>Custom Time — Independent White & Black</b>
      <span>Different starting times and different increments for each player.</span>
    </button>

    <div class="section-title">ADVANCED</div>
    <div class="mode-grid">
      <button class="mode-card${state.mode==="fischer"?" sel":""}" id="fischerCard"><b>Fischer Increment</b><span>Seconds added after each move.</span></button>
      <button class="mode-card${state.mode==="delay"?" sel":""}" id="delayCard"><b>Delay</b><span>Clock waits the delay seconds each turn before counting down.</span></button>
      <button class="mode-card${state.mode==="bronstein"?" sel":""}" id="bronsteinCard"><b>Bronstein</b><span>Time spent is returned after the move, up to the delay value.</span></button>
      <button class="mode-card${state.mode==="none"?" sel":""}" id="periodCard"><b>Sudden Death</b><span>No increment or delay.</span></button>
    </div>

    <div class="section-title">ARBITER</div>
    <button class="mode-card" id="arbiterCard">
      <b>Arbiter Mode</b><span>Correct time, move count, active side and game state.</span>
    </button>

    <div class="section-title">DEVICE</div>
    <div class="mode-grid">
      <button class="mode-card" id="soundCard"><b>Sound</b><span>${VOLS[state.vol]} — tap to change</span></button>
      <button class="mode-card" id="hapticCard"><b>Haptic</b><span>${state.haptic?"ON":"OFF"}</span></button>
    </div>
  `);

  document.querySelectorAll("[data-preset]").forEach(btn=>{
    btn.onclick=()=>{
      const p=PRESETS[+btn.dataset.preset];
      applyPreset(...p);
    };
  });
  $("customCard").onclick=customView;
  const setMode=(m,n)=>()=>{state.mode=m;modeHome();render();toast(n+" selected")};
  $("fischerCard").onclick=setMode("fischer","Fischer");
  $("delayCard").onclick=setMode("delay","Delay");
  $("bronsteinCard").onclick=setMode("bronstein","Bronstein");
  $("periodCard").onclick=setMode("none","Sudden death");
  $("arbiterCard").onclick=arbiterView;
  $("soundCard").onclick=()=>{cycleVol();beep("move");modeHome();render()};
  $("hapticCard").onclick=()=>{state.haptic=!state.haptic;modeHome();render()};
}

function customView(){
  openMode(`
    <div class="section-title">WHITE CLOCK</div>
    <div class="fields">
      <div class="field"><label>MINUTES</label><input id="wm" type="number" min="0" value="${Math.floor(state.players.white.base/60)}"></div>
      <div class="field"><label>SECONDS</label><input id="ws" type="number" min="0" max="59" value="${state.players.white.base%60}"></div>
    </div>
    <div class="field full-field"><label>WHITE INCREMENT / DELAY (SEC)</label><input id="wi" type="number" min="0" value="${state.players.white.inc}"></div>

    <div class="section-title">BLACK CLOCK</div>
    <div class="fields">
      <div class="field"><label>MINUTES</label><input id="bm" type="number" min="0" value="${Math.floor(state.players.black.base/60)}"></div>
      <div class="field"><label>SECONDS</label><input id="bs" type="number" min="0" max="59" value="${state.players.black.base%60}"></div>
    </div>
    <div class="field full-field"><label>BLACK INCREMENT / DELAY (SEC)</label><input id="bi" type="number" min="0" value="${state.players.black.inc}"></div>

    <div class="sheet-actions">
      <button class="gold-btn" id="applyCustom">APPLY CUSTOM TIME</button>
      <button class="dark-btn" id="backMode">BACK</button>
    </div>
  `);
  $("applyCustom").onclick=applyCustomTime;
  $("backMode").onclick=modeHome;
}

function arbiterView(){
  openMode(`
    <div class="section-title">ARBITER CORRECTION</div>
    <div class="fields">
      <div class="field"><label>WHITE SECONDS</label><input id="aw" type="number" min="0" value="${Math.ceil(state.players.white.remain/1000)}"></div>
      <div class="field"><label>BLACK SECONDS</label><input id="ab" type="number" min="0" value="${Math.ceil(state.players.black.remain/1000)}"></div>
    </div>
    <div class="field full-field"><label>MOVE COUNT</label><input id="am" type="number" min="0" value="${Math.max(state.players.white.moves,state.players.black.moves)}"></div>
    <div class="section-title">ACTIVE CLOCK</div>
    <div class="mode-grid">
      <button class="mode-card" id="activeWhite"><b>WHITE</b><span>Make White the active side.</span></button>
      <button class="mode-card" id="activeBlack"><b>BLACK</b><span>Make Black the active side.</span></button>
    </div>
    <div class="sheet-actions">
      <button class="gold-btn" id="applyArbiter">APPLY CORRECTION</button>
      <button class="dark-btn" id="backArbiter">BACK</button>
    </div>
  `);
  let pick=state.activePlayer;
  const sel=()=>{$("activeWhite").classList.toggle("sel",pick==="white");$("activeBlack").classList.toggle("sel",pick==="black");};
  sel();
  $("activeWhite").onclick=()=>{pick="white";sel()};
  $("activeBlack").onclick=()=>{pick="black";sel()};
  $("applyArbiter").onclick=()=>{
    state.players.white.remain=Math.max(0,+$("aw").value||0)*1000;
    state.players.black.remain=Math.max(0,+$("ab").value||0)*1000;
    const m=Math.max(0,+$("am").value||0);
    if(m!==Math.max(state.players.white.moves,state.players.black.moves)){state.players.white.moves=m;state.players.black.moves=m;}
    state.activePlayer=pick;state.turnMs=0;state.warnSec=-1;state.lastTimestamp=performance.now();
    if(state.status==="finished")state.status="paused";
    render();closeMode();toast("Arbiter correction applied");
  };
  $("backArbiter").onclick=modeHome;
}

/* ---------- Persistence ---------- */
function saveLastProgram(){
  try{localStorage.setItem("mychess64-last-program",JSON.stringify({
    white:{base:state.players.white.base,inc:state.players.white.inc},
    black:{base:state.players.black.base,inc:state.players.black.inc},
    label:state.controlLabel
  }));}catch(_){}
}
function loadLastProgram(){
  // Keep the product default on every fresh page load:
  // 03:00 for both players, +2 seconds per move.
  // Saved programs are not allowed to override the startup default.
  state.players.white={base:180,remain:180000,inc:2,moves:0};
  state.players.black={base:180,remain:180000,inc:2,moves:0};
  state.controlLabel="3 + 2";
}

/* ---------- UX ---------- */
function toast(message){
  const t=$("toast");
  t.textContent=message;t.classList.add("show");
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>t.classList.remove("show"),1800);
}

$("startBtn").onclick=()=>{
  if(state.status==="running") pauseGame();
  else if(state.status==="paused") resumeGame();
  else startGame();
};
$("resetBtn").onclick=resetGame;
$("modeBtn").onclick=()=>{
  if(state.status==="running"){pauseGame();toast("Clock paused");}
  modeHome();
};
$("soundBtn").onclick=()=>{
  cycleVol();
  render();
  beep("move");
};

$("whiteClock").addEventListener("pointerdown",()=>completeMove("white"));
$("blackClock").addEventListener("pointerdown",()=>completeMove("black"));

/* Keyboard: Space = press clock / start, P = pause, R = reset, M = mode, Esc = close */
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeMode();return;}
  if(e.target.closest("input")||$("modeSheet").classList.contains("open"))return;
  if(e.code==="Space"){
    e.preventDefault();
    if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
    state.status==="running"?completeMove(state.activePlayer):$("startBtn").click();
  }else if(e.key==="p"||e.key==="P"){if(inProgress())$("startBtn").click();}
  else if(e.key==="r"||e.key==="R")resetGame();
  else if(e.key==="m"||e.key==="M")$("modeBtn").click();
});
document.addEventListener("keyup",e=>{if(e.code==="Space"&&!e.target.closest("input"))e.preventDefault();});

$("closeSheet").onclick=closeMode;
$("modeSheet").addEventListener("pointerup",e=>{
  if(e.target===$("modeSheet"))closeMode();
});

document.addEventListener("fullscreenchange",()=>{
  state.fullscreen=!!document.fullscreenElement;
});

/* Initial state */
loadLastProgram();
render();

/* PWA-first immersive behavior:
   - Installed standalone PWA: already occupies the app window; do not call
     browser Fullscreen API, avoiding Android's fullscreen notification.
   - Normal browser tab: retain the existing automatic fullscreen request. */
if (window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone === true) {
  state.fullscreen = true;
  requestWakeLock();
} else {
  requestImmersive();
}
</script>
