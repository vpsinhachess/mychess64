<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1d33">
<title>MyChess64</title>
<link rel="icon" href="assets/logo.png">
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#10253e;--muted:#66758a;--line:#d9e2ec;--acc:#0a68e8;--ok:#2b9a58;--bad:#c44343;--lt:#f0d9b5;--dk:#b58863}
body.dark{--bg:#0b1220;--card:#111b2d;--text:#edf4ff;--muted:#9fb0c5;--line:#263850;--lt:#e8cda0;--dk:#9c6b45}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:var(--acc);color:#fff;font-weight:700;margin:3px}
button.alt{background:transparent;color:var(--text);border:1px solid var(--line)}
button.warn{background:var(--bad)}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--card);margin:4px 0 12px}
textarea{font-family:ui-monospace,Menlo,monospace;font-size:12px;min-height:84px;word-break:break-all}
label{font-size:13px;color:var(--muted)}
#top{display:flex;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800}
.brand img{width:36px;height:24px;object-fit:contain}
#app{max-width:1100px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:580px;margin:10px auto}
.center{text-align:center}
.muted{color:var(--muted);font-size:13px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#d99a18;margin-right:6px}
.dot.on{background:var(--ok)}.dot.off{background:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.game{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
#board{position:relative;width:min(100%,560px,calc(100vh - 190px));aspect-ratio:1;margin:0 auto;display:grid;grid-template-columns:repeat(8,1fr);border-radius:4px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.25);touch-action:none;user-select:none}
.sq{position:relative;display:flex;align-items:center;justify-content:center}
.sq.light{background:var(--lt)}.sq.dark{background:var(--dk)}
.sq.last{background:rgba(246,196,66,.5)}
.sq.sel{box-shadow:inset 0 0 0 4px rgba(20,120,255,.85)}
.sq.check{background:radial-gradient(circle,#ff6060 0,#d62c2c 75%)}
.sq.dot::after{content:'';position:absolute;width:28%;height:28%;border-radius:50%;background:rgba(0,0,0,.28)}
.sq.cap::after{content:'';position:absolute;inset:6%;border-radius:50%;border:5px solid rgba(0,0,0,.28)}
.pc{font-size:clamp(26px,7vmin,60px);line-height:1;pointer-events:none}
.pw{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000}
.pb{color:#111}
.bar{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:6px 0}
.bar .nm{font-weight:700}
.clk{font-family:ui-monospace,Menlo,monospace;font-size:1.3rem;font-weight:800;background:#07101d;color:#fff;border-radius:7px;padding:4px 10px;min-width:96px;text-align:center}
.clk.on{box-shadow:0 0 0 2px var(--acc)}
.clk.low{background:var(--bad)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.status{font-weight:700}
.banner{border:1px solid var(--acc);border-radius:10px;padding:10px;background:var(--bg);font-size:14px}
.notation{min-height:140px;max-height:300px;overflow:auto;font-family:ui-monospace,Menlo,monospace;font-size:14px;border:1px solid var(--line);border-radius:9px;padding:6px}
.notation .r{display:grid;grid-template-columns:34px 1fr 1fr;padding:2px 4px}
.promo{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:5}
.promo div{background:var(--card);padding:12px;border-radius:12px;text-align:center}
.promo button{font-size:28px;padding:6px 12px}
.code{font-family:ui-monospace,Menlo,monospace}
.hist{border-bottom:1px solid var(--line);padding:8px 0}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(140px);background:#07101d;color:#fff;padding:10px 16px;border-radius:10px;transition:.25s;z-index:99;max-width:90vw;font-size:14px}
#toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:820px){.game{grid-template-columns:1fr}#board{width:min(100%,560px)}}
</style>
</head>
<body>
<header id="top"><div class="brand"><img src="assets/logo.png" alt=""><span>MyChess64</span></div></header>
<main id="app"></main>
<div id="toast"></div>
<script src="lib/chess.js"></script>
<script>
/* ================= helpers ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
let toastT;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2800); }
const LS = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ toast('Browser storage is unavailable or full'); } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
function readJ(k,d){ try{ const v=JSON.parse(LS.get(k)); return v==null?d:v; }catch(e){ return d; } }
const DEF = {name:'', stun:'stun:stun.l.google.com:19302', repo:'', token:'', theme:'light'};
const settings = () => Object.assign({}, DEF, readJ('mychess64_settings', {}));
function saveSettings(p){ LS.set('mychess64_settings', JSON.stringify(Object.assign(settings(), p))); }
const getGames = () => readJ('mychess64_games', []);
const setGames = g => LS.set('mychess64_games', JSON.stringify(g));
const GLYPH = {k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};
const PRESETS = {off:[0,0,'No clock'],'3+2':[3,2,'3 + 2'],'5+0':[5,0,'5 + 0'],'10+0':[10,0,'10 + 0'],'15+10':[15,10,'15 + 10'],'30+0':[30,0,'30 + 0']};
const opp = c => c==='w' ? 'b' : 'w';
const makeId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function download(name, text, type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:type||'text/plain'})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); toast('Copied'); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast('Copied'); }catch(_){ toast('Select the text and copy it manually'); } ta.remove(); }
}
function applyTheme(){ document.body.classList.toggle('dark', settings().theme==='dark'); }

/* ================= state ================= */
let view='home', role=null, game=null, chess=new Chess();
let rtc=null, link=false, lastSeen=0, pingT=null, inviteCode='', replyCode='';
let ui={sel:null, targets:[], promo:null, reconnecting:false, lastSq:[], flip:false};
let drag=null;

/* ================= chess + clock ================= */
function rebuild(moves){ chess=new Chess(); for(const m of moves||[]){ if(!chess.move({from:m.from,to:m.to,promotion:m.promotion||'q'})) break; } }
const clockOn = () => !!game && PRESETS[game.preset][0] > 0;
function remaining(c){ const k=game.clock; let v=k[c]||0; if(k.running && k.active===c) v-=performance.now()-k.t0; return Math.max(0,v); }
function freshClock(p){ const ms=PRESETS[p][0]*60000; return {w:ms,b:ms,active:null,running:false,t0:0}; }
function newGame(o){ return {id:makeId(),date:new Date().toISOString(),hostName:o.name,guestName:'',hostColor:o.color,preset:o.preset,moves:[],result:null,drawBy:null,takebackBy:null,version:0,clock:freshClock(o.preset)}; }
function myCol(){ return role==='host' ? game.hostColor : opp(game.hostColor); }
function nameOf(c){
  const w = game.hostColor==='w' ? game.hostName : game.guestName;
  const b = game.hostColor==='w' ? game.guestName : game.hostName;
  return (c==='w' ? w : b) || (c==='w' ? 'White' : 'Black');
}
function lastMoveBy(c){ const h=chess.history({verbose:true}); return h.length>0 && h[h.length-1].color===c; }
function clockOnMove(mover){
  if(!clockOn()) return;
  const k=game.clock, now=performance.now(), inc=PRESETS[game.preset][1]*1000;
  if(k.running && k.active===mover) k[mover]=remaining(mover)+inc;
  k.active=opp(mover); k.running=true; k.t0=now;
}
function gameEnd(){
  if(chess.in_checkmate()) return {code: chess.turn()==='w' ? '0-1' : '1-0', reason:'Checkmate'};
  if(chess.in_stalemate()) return {code:'1/2-1/2', reason:'Stalemate'};
  if(chess.in_threefold_repetition()) return {code:'1/2-1/2', reason:'Threefold repetition'};
  if(chess.in_draw()) return {code:'1/2-1/2', reason:'Draw'};
  return null;
}
function resultText(){ const r=game.result; const w=r.code==='1-0'?'White wins':r.code==='0-1'?'Black wins':'Draw'; return w+' — '+r.reason; }
function buildRecord(){
  const tmp=new Chess(), san=[];
  for(const m of game.moves){ const mv=tmp.move({from:m.from,to:m.to,promotion:m.promotion||'q'}); san.push(mv?mv.san:'?'); }
  const code = game.result ? game.result.code : '*';
  let body=''; san.forEach((s,i)=>{ body += (i%2===0 ? (i/2+1)+'. ' : '') + s + ' '; });
  const white=nameOf('w'), black=nameOf('b');
  const head = `[Event "MyChess64 game"]\n[Date "${game.date.slice(0,10).replace(/-/g,'.')}"]\n[White "${white}"]\n[Black "${black}"]\n[Result "${code}"]\n\n`;
  return {id:game.id, date:game.date, white, black, result:code, reason: game.result ? game.result.reason : 'In progress', preset:game.preset, moves:san.join(' '), pgn: head + body + code};
}
function saveRecord(){ const rec=buildRecord(); const all=getGames().filter(g=>g.id!==rec.id); all.push(rec); setGames(all); }
function endGame(code, reason){
  game.result={code, reason}; game.drawBy=null; game.takebackBy=null; game.clock.running=false;
  onResultSeen();
}
function onResultSeen(){
  saveRecord();
  const s=settings();
  if(s.repo && s.token) pushToGitHub().then(n=>toast('Saved to GitHub ✓ ('+n+' games)')).catch(e=>toast('GitHub: '+e.message));
}
function newRound(){
  game.hostColor = opp(game.hostColor); game.id=makeId(); game.date=new Date().toISOString();
  game.moves=[]; game.result=null; game.drawBy=null; game.takebackBy=null; game.clock=freshClock(game.preset); rebuild([]);
}

/* Host is the single source of truth. Every action goes through here. */
function applyAction(a, who){
  if(!game || (game.result && a.type!=='rematch')) return false;
  switch(a.type){
    case 'move': {
      if(chess.turn()!==who) return false;
      const mv=chess.move({from:a.from,to:a.to,promotion:a.promotion||'q'});
      if(!mv) return false;
      game.moves.push({from:mv.from,to:mv.to,promotion:mv.promotion});
      clockOnMove(who);
      const end=gameEnd(); if(end) endGame(end.code,end.reason);
      break; }
    case 'resign': endGame(who==='w'?'0-1':'1-0','Resignation'); break;
    case 'draw': if(game.drawBy) return false; game.drawBy=who; break;
    case 'drawAnswer': {
      if(!game.drawBy || game.drawBy===who) return false;
      if(a.accept) endGame('1/2-1/2','Draw by agreement'); else game.drawBy=null;
      break; }
    case 'takeback': if(game.takebackBy || !lastMoveBy(who)) return false; game.takebackBy=who; break;
    case 'takebackAnswer': {
      const req=game.takebackBy;
      if(!req || req===who) return false;
      if(a.accept){
        game.moves.pop(); rebuild(game.moves);
        if(clockOn()){ game.clock.active=req; game.clock.running=game.moves.length>0; game.clock.t0=performance.now(); }
      }
      game.takebackBy=null; break; }
    case 'rematch': if(!game.result) return false; newRound(); break;
    default: return false;
  }
  afterHostChange();
  return true;
}
function doAct(a){
  if(role==='host'){ if(!applyAction(a, game.hostColor)){ toast('Not allowed right now'); renderAll(); } return; }
  if(!send({t:'act', a})){ toast('Not connected — press Reconnect'); renderAll(); }
}
function tick(){
  if(!game) return;
  if(!game.result && clockOn() && game.clock.running){
    if(role==='host' && remaining(game.clock.active)<=0){
      endGame(game.clock.active==='w'?'0-1':'1-0','Time out');
      afterHostChange();
      return;
    }
  }
  if(view==='game') updateClocks();
}
function updateClocks(){
  const top=$('clkTop'), bot=$('clkBot'); if(!top||!bot||!game) return;
  const me=myCol(), op=opp(me);
  const fmt=ms=>{ if(!clockOn()) return '—'; const s=ms/1000; if(s<10) return s.toFixed(1); const t=Math.floor(s); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); };
  const on=c=>clockOn() && !game.result && game.clock.running && game.clock.active===c;
  const low=c=>clockOn() && remaining(c)<10000;
  top.textContent=fmt(remaining(op)); bot.textContent=fmt(remaining(me));
  top.className='clk'+(on(op)?' on':'')+(low(op)?' low':'');
  bot.className='clk'+(on(me)?' on':'')+(low(me)?' low':'');
}

/* ================= WebRTC with copy/paste codes (no server) ================= */
function iceServers(){ const s=settings().stun.split(/[\s,]+/).filter(Boolean); return s.length ? [{urls:s}] : []; }
function gather(pc){
  return new Promise(res=>{
    if(pc.iceGatheringState==='complete') return res();
    const t=setTimeout(res,6000);
    pc.addEventListener('icegatheringstatechange', function h(){
      if(pc.iceGatheringState==='complete'){ clearTimeout(t); pc.removeEventListener('icegatheringstatechange',h); res(); }
    });
  });
}
const b64u = {
  enc(bytes){ let s=''; for(const b of bytes) s+=String.fromCharCode(b); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); },
  dec(str){ str=str.replace(/-/g,'+').replace(/_/g,'/'); while(str.length%4) str+='='; const bin=atob(str); const out=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i); return out; }
};
async function pack(obj){
  const raw=new TextEncoder().encode(JSON.stringify(obj));
  if(window.CompressionStream){
    try{ const z=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer()); return 'z'+b64u.enc(z); }catch(e){}
  }
  return 'p'+b64u.enc(raw);
}
async function unpack(code){
  code=String(code||'').replace(/\s+/g,'');
  if(!code) throw new Error('Paste the code first');
  try{
    const body=b64u.dec(code.slice(1)); let raw;
    if(code[0]==='z') raw=new Uint8Array(await new Response(new Blob([body]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    else if(code[0]==='p') raw=body;
    else throw new Error('bad');
    return JSON.parse(new TextDecoder().decode(raw));
  }catch(e){ throw new Error('That code is not valid. Copy the whole code again.'); }
}
function newPc(){
  const pc=new RTCPeerConnection({iceServers:iceServers()});
  rtc={pc, dc:null};
  pc.onconnectionstatechange=()=>{
    if((pc.connectionState==='failed'||pc.connectionState==='closed') && rtc && rtc.pc===pc){
      if(link) onLinkDown(); else toast('Could not connect. Create a new code and try again.');
    }
  };
  return pc;
}
function attach(dc){ if(!rtc) return; rtc.dc=dc; dc.onopen=onLinkUp; dc.onclose=onLinkDown; dc.onmessage=e=>onMsg(e.data); }
function closeRtc(){
  stopPing();
  try{ rtc && rtc.dc && rtc.dc.close(); }catch(e){}
  try{ rtc && rtc.pc && rtc.pc.close(); }catch(e){}
  rtc=null; link=false;
}
async function hostInvite(){
  closeRtc(); inviteCode=''; view='host-invite'; renderAll();
  const pc=newPc();
  attach(pc.createDataChannel('mychess64',{ordered:true}));
  await pc.setLocalDescription(await pc.createOffer());
  await gather(pc);
  inviteCode=await pack({t:'o', s:pc.localDescription.sdp});
  renderAll();
}
async function hostAccept(code){
  if(!rtc) throw new Error('Create an invite first');
  const a=await unpack(code);
  if(a.t!=='a') throw new Error('This is an invite code. Your friend must paste your invite, then send you the reply code.');
  await rtc.pc.setRemoteDescription({type:'answer', sdp:a.s});
  toast('Connecting…');
}
async function guestReply(code){
  closeRtc();
  const o=await unpack(code);
  if(o.t!=='o') throw new Error('This is a reply code. Paste the invite code from your friend instead.');
  const pc=newPc();
  pc.ondatachannel=e=>attach(e.channel);
  await pc.setRemoteDescription({type:'offer', sdp:o.s});
  await pc.setLocalDescription(await pc.createAnswer());
  await gather(pc);
  replyCode=await pack({t:'a', s:pc.localDescription.sdp});
  view='guest-reply'; renderAll();
}
function send(obj){
  if(rtc && rtc.dc && rtc.dc.readyState==='open'){ try{ rtc.dc.send(JSON.stringify(obj)); return true; }catch(e){} }
  return false;
}
function startPing(){ stopPing(); pingT=setInterval(()=>{ if(!link) return; if(Date.now()-lastSeen>15000){ onLinkDown(); return; } send({t:'ping'}); },4000); }
function stopPing(){ if(pingT){ clearInterval(pingT); pingT=null; } }
function onLinkUp(){
  link=true; lastSeen=Date.now(); startPing(); view='game';
  if(role==='host'){ send(snapshot()); } else { send({t:'hello', name:settings().name||'Guest'}); }
  toast('Connected'); renderAll();
}
function onLinkDown(){
  if(!link) return;
  closeRtc(); toast('Connection lost — tap Reconnect. Your game is saved.'); renderAll();
}
function onMsg(raw){
  let m; try{ m=JSON.parse(raw); }catch(e){ return; }
  lastSeen=Date.now();
  if(m.t==='ping'){ send({t:'pong'}); return; }
  if(m.t==='pong') return;
  if(role==='host'){
    if(m.t==='hello'){ game.guestName=String(m.name||'Guest').slice(0,30); afterHostChange(); }
    else if(m.t==='act'){ if(!applyAction(m.a, opp(game.hostColor))) send(snapshot()); }
  } else if(m.t==='state'){ adoptState(m.g); }
}

/* ================= state sync ================= */
function snapshot(){
  const k=game.clock;
  return {t:'state', g:{id:game.id, date:game.date, hostName:game.hostName, guestName:game.guestName, hostColor:game.hostColor, preset:game.preset, moves:game.moves, result:game.result, drawBy:game.drawBy, takebackBy:game.takebackBy, version:game.version, clock:{w:remaining('w'), b:remaining('b'), active:k.active, running:k.running}}};
}
function adoptState(g){
  const hadResult=!!(game && game.result);
  game=Object.assign({}, g, {clock:{w:g.clock.w, b:g.clock.b, active:g.clock.active, running:g.clock.running, t0:performance.now()}});
  rebuild(game.moves);
  if(game.result && !hadResult) onResultSeen();
  saveSession();
  view='game'; renderAll();
}
function afterHostChange(){ game.version++; send(snapshot()); saveSession(); renderAll(); }
function plainGame(){ const k=game.clock; return Object.assign({}, game, {clock:{w:remaining('w'), b:remaining('b'), active:k.active, running:k.running, t0:0}}); }
function saveSession(){
  if(!game || !role) return;
  if(game.result){ LS.del('mychess64_session'); return; }
  LS.set('mychess64_session', JSON.stringify({role, game:plainGame()}));
}

/* ================= GitHub storage (direct from browser, no server) ================= */
function b64encodeUtf8(str){ const bytes=new TextEncoder().encode(str); let bin=''; for(let i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]); return btoa(bin); }
function b64decodeUtf8(b64){ const bin=atob(b64.replace(/\s/g,'')); const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i); return new TextDecoder().decode(bytes); }
async function pushToGitHub(){
  const s=settings();
  if(!s.repo || !s.token) throw new Error('Add your repo and token in Settings');
  const url='https://api.github.com/repos/'+s.repo+'/contents/data/games.json';
  const h={Authorization:'Bearer '+s.token, Accept:'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'};
  for(let attempt=0; attempt<3; attempt++){
    let remote=[], sha=null;
    const g=await fetch(url,{headers:h});
    if(g.status===200){ const j=await g.json(); sha=j.sha; try{ remote=JSON.parse(b64decodeUtf8(j.content)); }catch(e){ remote=[]; } }
    else if(g.status!==404) throw new Error('GitHub: cannot read repo (status '+g.status+'). Check repo name and token.');
    const map=new Map(); remote.forEach(r=>map.set(r.id,r)); getGames().forEach(r=>map.set(r.id,r));
    const merged=[...map.values()].sort((a,b)=>((a.date||'')<(b.date||'')?-1:1));
    const body={message:'MyChess64: update game records', content:b64encodeUtf8(JSON.stringify(merged,null,2))};
    if(sha) body.sha=sha;
    const p=await fetch(url,{method:'PUT',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(p.ok){ setGames(merged); return merged.length; }
    if(p.status!==409 && p.status!==422) throw new Error('GitHub: cannot write (status '+p.status+'). Token needs Contents read/write on this repo.');
  }
  throw new Error('GitHub was busy, try again');
}

/* ================= screens ================= */
function renderAll(){
  const screens={home:renderHome, settings:renderSettings, history:renderHistory, 'host-create':renderHostCreate,
    'host-invite':renderInvite, 'guest-join':renderJoin, 'guest-reply':renderReply, game:renderGame};
  (screens[view]||renderHome)();
}
function renderHome(){
  const s=readJ('mychess64_session',null);
  let resume='';
  if(s && s.game && !s.game.result){
    const who=(s.role==='host'? s.game.guestName : s.game.hostName) || 'your opponent';
    resume=`<div class="banner">Unfinished game with <b>${esc(who)}</b>.<div class="row" style="margin-top:6px"><button data-a="resume">Reconnect</button><button class="alt" data-a="discard">Discard</button></div></div>`;
  }
  $('app').innerHTML=`<div class="card center"><h2 style="margin:4px 0">Play chess with a friend</h2>
    <p class="muted">Games connect directly between your browsers. No accounts. Results are saved in your browser and, if you set it up, in your GitHub repo.</p>
    ${resume}
    <div class="row" style="justify-content:center;margin-top:12px"><button data-a="go-create">Create game</button><button class="alt" data-a="go-join">Join game</button></div>
    <div class="row" style="justify-content:center;margin-top:8px"><button class="alt" data-a="go-history">My games</button><button class="alt" data-a="go-settings">Settings</button></div></div>`;
}
function renderHostCreate(){
  const s=settings();
  $('app').innerHTML=`<div class="card"><h3>Create a game</h3>
    <label>Your name</label><input id="hName" maxlength="30" value="${esc(s.name)}">
    <label>Your colour</label><select id="hColor"><option value="w">White</option><option value="b">Black</option><option value="r">Random</option></select>
    <label>Clock</label><select id="hTime">${Object.keys(PRESETS).map(k=>`<option value="${k}">${PRESETS[k][2]}</option>`).join('')}</select>
    <div class="row"><button data-a="create">Create invite</button><button class="alt" data-a="go-home">Back</button></div></div>`;
}
function renderInvite(){
  $('app').innerHTML=`<div class="card"><h3>Step 1 — Send this invite</h3>
    <p class="muted">Copy it and send it to your friend (WhatsApp, email, anything). They paste it under “Join game”.</p>
    ${inviteCode ? `<textarea id="inviteArea" class="code" readonly>${esc(inviteCode)}</textarea><div class="row"><button data-a="copy" data-t="inviteArea">Copy invite</button></div>` : '<p class="muted">Creating invite…</p>'}
    <h3>Step 2 — Paste their reply</h3>
    <p class="muted">Your friend gets a reply code after pasting your invite. Paste it here.</p>
    <textarea id="answerIn" placeholder="Paste the reply code"></textarea>
    <div class="row"><button data-a="connect-host">Connect</button><button class="alt" data-a="leave">Back</button></div>
    <p class="muted"><span class="dot"></span>Waiting for your friend…</p></div>`;
}
function renderJoin(){
  const s=settings();
  $('app').innerHTML=`<div class="card"><h3>${ui.reconnecting ? 'Reconnect to your game' : 'Join a game'}</h3>
    <label>Your name</label><input id="jName" maxlength="30" value="${esc(s.name)}">
    <label>Paste the invite code from your friend</label><textarea id="jOffer" placeholder="Paste invite code"></textarea>
    <div class="row"><button data-a="join">Create reply code</button><button class="alt" data-a="leave">Back</button></div></div>`;
}
function renderReply(){
  $('app').innerHTML=`<div class="card"><h3>Step 2 — Send this reply</h3>
    <p class="muted">Send this reply code back to your friend. When they paste it, you connect automatically.</p>
    <textarea id="replyArea" class="code" readonly>${esc(replyCode)}</textarea>
    <div class="row"><button data-a="copy" data-t="replyArea">Copy reply</button><button class="alt" data-a="leave">Cancel</button></div>
    <p class="muted"><span class="dot"></span>Waiting for your friend to paste the reply…</p></div>`;
}
function renderSettings(){
  const s=settings();
  $('app').innerHTML=`<div class="card"><h3>Settings</h3>
    <label>Your name</label><input id="sName" maxlength="30" value="${esc(s.name)}">
    <label>Connection helper (STUN). Used only to find a route between the two browsers. Clear it to use one local network only.</label>
    <input id="sStun" value="${esc(s.stun)}">
    <hr style="border:0;border-top:1px solid var(--line)">
    <h4 style="margin:6px 0">Save games to GitHub (optional)</h4>
    <p class="muted">Use your site repo or a separate one. Create a fine-grained token with “Contents: Read and write” on that repo only. The token stays in this browser.</p>
    <label>Repository (owner/name)</label><input id="sRepo" placeholder="yourname/mychess64" value="${esc(s.repo)}">
    <label>Token</label><input id="sToken" type="password" value="${esc(s.token)}">
    <div class="row"><button data-a="save-settings">Save</button><button class="alt" data-a="push-gh">Push games to GitHub</button><button class="alt" data-a="export">Export JSON</button><button class="alt" data-a="theme">Light / dark</button></div>
    <div class="row" style="margin-top:8px"><button class="alt" data-a="go-home">Back</button></div></div>`;
}
function renderHistory(){
  const list=getGames().slice().reverse();
  $('app').innerHTML=`<div class="card"><h3>My games</h3>${list.length ? list.map(r=>`<div class="hist"><b>${esc(r.white)}</b> vs <b>${esc(r.black)}</b> — ${esc(r.result)}<div class="muted">${esc(r.reason)} · ${new Date(r.date).toLocaleString()}</div><button class="alt" data-a="pgn" data-id="${esc(r.id)}">Download PGN</button></div>`).join('') : '<p class="muted">No finished games yet.</p>'}
    <div class="row"><button class="alt" data-a="go-home">Back</button></div></div>`;
}
function bannerHtml(){
  const me=myCol(), out=[];
  if(game.result){
    return `<div class="banner"><b>${esc(resultText())}</b><div class="row" style="margin-top:6px"><button data-a="rematch">Rematch (swap colours)</button><button class="alt" data-a="pgn-current">Download PGN</button><button class="alt" data-a="lobby">Back to lobby</button></div></div>`;
  }
  if(!link) out.push('Connection lost. Press Reconnect, your game is saved.');
  if(game.drawBy) out.push(game.drawBy===me ? 'Draw offered, waiting for reply.' : 'Your opponent offers a draw. <button data-a="draw-yes">Accept</button><button class="alt" data-a="draw-no">Decline</button>');
  if(game.takebackBy) out.push(game.takebackBy===me ? 'Takeback requested, waiting…' : 'Your opponent asks to take back their last move. <button data-a="tb-yes">Allow</button><button class="alt" data-a="tb-no">Refuse</button>');
  return out.map(t=>`<div class="banner">${t}</div>`).join('');
}
function statusText(){
  if(game.result) return resultText();
  return (chess.turn()==='w'?'White':'Black')+' to move'+(chess.in_check()?' — check!':'');
}
function renderGame(){
  if(!game){ $('app').innerHTML='<div class="card center"><p>Syncing with your opponent…</p><button class="alt" data-a="leave">Leave</button></div>'; return; }
  const me=myCol(), op=opp(me);
  const controls = game.result ? '' :
    `<button class="alt" data-a="draw" ${game.drawBy?'disabled':''}>Offer draw</button>
     <button class="alt" data-a="takeback" ${(game.takebackBy || !lastMoveBy(me))?'disabled':''}>Take back</button>
     <button class="warn" data-a="resign">Resign</button>`;
  $('app').innerHTML=`<div class="game">
    <section>
      <div class="bar"><span class="nm">${esc(nameOf(op))}</span><span class="clk" id="clkTop"></span></div>
      <div id="board"></div>
      <div class="bar"><span class="nm">${esc(nameOf(me))} (you)</span><span class="clk" id="clkBot"></span></div>
    </section>
    <aside class="panel">
      <div><span class="dot ${link?'on':'off'}"></span><span class="muted">${link?'Connected':'Disconnected'}</span> ${link?'':'<button class="alt" data-a="reconnect">Reconnect</button>'}</div>
      <div class="status" id="status"></div>
      ${bannerHtml()}
      <div class="notation" id="notation"></div>
      <div class="row">${controls}</div>
      <div class="row"><button class="alt" data-a="flip">Flip board</button><button class="alt" data-a="leave">Leave</button></div>
    </aside></div>`;
  renderBoard(); renderNotation(); updateClocks();
  $('status').textContent=statusText();
}
function renderBoard(){
  const el=$('board'); if(!el||!game) return;
  const flip=(myCol()==='b') !== ui.flip;
  const lm=game.moves.length ? game.moves[game.moves.length-1] : null;
  ui.lastSq = lm ? [lm.from, lm.to] : [];
  let h='';
  for(let i=0;i<8;i++) for(let j=0;j<8;j++){
    const file = flip ? 7-j : j, rank = flip ? i : 7-i;
    const name='abcdefgh'[file]+(rank+1);
    const p=chess.get(name), light=(file+rank)%2===1;
    let c='sq '+(light?'light':'dark');
    if(ui.lastSq.includes(name)) c+=' last';
    if(ui.sel===name) c+=' sel';
    if(ui.targets.includes(name)) c+=p?' cap':' dot';
    if(p && p.type==='k' && p.color===chess.turn() && chess.in_check()) c+=' check';
    h+=`<div class="${c}" data-sq="${name}">${p?`<span class="pc ${p.color==='w'?'pw':'pb'}">${GLYPH[p.type]}</span>`:''}</div>`;
  }
  if(ui.promo) h+=`<div class="promo"><div><b>Promote to</b><br>${['q','r','b','n'].map(t=>`<button data-a="promo" data-p="${t}">${GLYPH[t]}</button>`).join('')}<br><button class="alt" data-a="promo-cancel">Cancel</button></div></div>`;
  el.innerHTML=h;
}
function renderNotation(){
  const el=$('notation'); if(!el) return;
  const san=chess.history(); let h='';
  for(let i=0;i<san.length;i+=2) h+=`<div class="r"><span class="muted">${i/2+1}.</span><span>${esc(san[i])}</span><span>${san[i+1]?esc(san[i+1]):''}</span></div>`;
  el.innerHTML=h || '<span class="muted">No moves yet</span>';
  el.scrollTop=el.scrollHeight;
}

/* ================= board input: tap or drag ================= */
function legalTargets(s){ return chess.moves({square:s, verbose:true}).map(m=>m.to); }
function tryMove(from,to){
  ui.sel=null; ui.targets=[];
  const ms=chess.moves({square:from, verbose:true}).filter(m=>m.to===to);
  if(!ms.length){ renderBoard(); return; }
  if(ms[0].promotion){ ui.promo={from,to}; renderBoard(); return; }
  doAct({type:'move', from, to});
}
$('app').addEventListener('pointerdown', e=>{
  const sq=e.target.closest && e.target.closest('.sq');
  if(!sq || !game || game.result || view!=='game') return;
  const s=sq.dataset.sq;
  if(ui.sel && ui.targets.includes(s)){ tryMove(ui.sel,s); return; }
  const p=chess.get(s);
  if(p && p.color===myCol() && chess.turn()===myCol()){ ui.sel=s; ui.targets=legalTargets(s); drag=s; }
  else { ui.sel=null; ui.targets=[]; }
  renderBoard();
});
document.addEventListener('pointerup', e=>{
  if(!drag) return;
  const from=drag; drag=null;
  const t=document.elementFromPoint(e.clientX,e.clientY);
  const sq=t && t.closest && t.closest('.sq');
  if(sq && sq.dataset.sq!==from && ui.sel===from && ui.targets.includes(sq.dataset.sq)) tryMove(from, sq.dataset.sq);
  else renderBoard();
});

/* ================= actions ================= */
function saveFromForm(){
  const f={};
  if($('sName')) f.name=$('sName').value.trim().slice(0,30);
  if($('sStun')) f.stun=$('sStun').value.trim();
  if($('sRepo')) f.repo=$('sRepo').value.trim();
  if($('sToken')) f.token=$('sToken').value.trim();
  saveSettings(f);
}
function act(a, el){
  switch(a){
    case 'go-home': view='home'; renderAll(); break;
    case 'go-create': view='host-create'; renderAll(); break;
    case 'go-join': ui.reconnecting=false; view='guest-join'; renderAll(); break;
    case 'go-settings': view='settings'; renderAll(); break;
    case 'go-history': view='history'; renderAll(); break;
    case 'leave': closeRtc(); view='home'; renderAll(); break;
    case 'create': {
      const name=($('hName').value.trim()||'Player 1').slice(0,30);
      let color=$('hColor').value; if(color==='r') color=Math.random()<0.5?'w':'b';
      saveSettings({name});
      role='host'; game=newGame({name, color, preset:$('hTime').value}); ui.flip=false;
      saveSession();
      hostInvite().catch(err=>toast(err.message||'Could not create invite'));
      break; }
    case 'connect-host': hostAccept($('answerIn').value.trim()).catch(err=>toast(err.message||'Could not connect')); break;
    case 'join': {
      const code=$('jOffer').value.trim();
      if(!code){ toast('Paste the invite code first'); break; }
      const name=($('jName').value.trim()||'Guest').slice(0,30);
      saveSettings({name});
      role='guest';
      if(!ui.reconnecting) game=null;
      guestReply(code).catch(err=>toast(err.message||'Invalid code'));
      break; }
    case 'copy': copyText($(el.dataset.t).value); break;
    case 'resume': {
      const s=readJ('mychess64_session',null); if(!s) break;
      role=s.role; game=s.game;
      game.clock.t0=performance.now(); game.clock.running=!!game.clock.running && !game.result;
      rebuild(game.moves);
      if(role==='host'){ hostInvite().catch(err=>toast(err.message)); }
      else { ui.reconnecting=true; closeRtc(); view='guest-join'; renderAll(); }
      break; }
    case 'discard': LS.del('mychess64_session'); game=null; role=null; renderAll(); break;
    case 'reconnect':
      if(role==='host'){ hostInvite().catch(err=>toast(err.message)); }
      else { ui.reconnecting=true; closeRtc(); view='guest-join'; renderAll(); }
      break;
    case 'lobby': LS.del('mychess64_session'); closeRtc(); game=null; role=null; view='home'; renderAll(); break;
    case 'save-settings': saveFromForm(); toast('Settings saved'); break;
    case 'push-gh': saveFromForm(); pushToGitHub().then(n=>toast('Saved '+n+' games to GitHub ✓')).catch(err=>toast(err.message)); break;
    case 'export': download('mychess64-games.json', JSON.stringify(getGames(),null,2), 'application/json'); break;
    case 'theme': saveSettings({theme: settings().theme==='dark' ? 'light' : 'dark'}); applyTheme(); break;
    case 'pgn': { const r=getGames().find(x=>x.id===el.dataset.id); if(r) download('mychess64-'+r.id+'.pgn', r.pgn); break; }
    case 'pgn-current': { const r=buildRecord(); download('mychess64-'+r.id+'.pgn', r.pgn); break; }
    case 'flip': ui.flip=!ui.flip; renderAll(); break;
    case 'draw': doAct({type:'draw'}); break;
    case 'draw-yes': doAct({type:'drawAnswer', accept:true}); break;
    case 'draw-no': doAct({type:'drawAnswer', accept:false}); break;
    case 'takeback': doAct({type:'takeback'}); break;
    case 'tb-yes': doAct({type:'takebackAnswer', accept:true}); break;
    case 'tb-no': doAct({type:'takebackAnswer', accept:false}); break;
    case 'resign': if(confirm('Resign this game?')) doAct({type:'resign'}); break;
    case 'rematch': doAct({type:'rematch'}); break;
    case 'promo': { const pr=ui.promo; ui.promo=null; if(pr) doAct({type:'move', from:pr.from, to:pr.to, promotion:el.dataset.p}); break; }
    case 'promo-cancel': ui.promo=null; renderBoard(); break;
  }
}
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-a]');
  if(el) act(el.dataset.a, el);
});

/* ================= start ================= */
applyTheme();
setInterval(tick, 250);
window.addEventListener('pagehide', ()=>{ saveSession(); });
renderAll();
</script>
</body>
</html>
