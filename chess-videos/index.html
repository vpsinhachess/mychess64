<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Chess Videos</title>
<script>
  // Apply saved or system theme before first paint to avoid a flash
  try {
    const t = localStorage.getItem('cv-theme') ||
      (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<style>
  :root {
    --bg:#14130f; --panel:#221f1a; --panel2:#2c2821; --text:#f3efe6; --muted:#a39c8c;
    --accent:#d4a72c; --accent-ink:#17150f; --border:rgba(255,255,255,.09);
    --shadow:0 10px 30px rgba(0,0,0,.35); --sq:rgba(255,255,255,.035); --err:#f08a80;
  }
  [data-theme="light"] {
    --bg:#f5efdf; --panel:#fffdf7; --panel2:#f1eadb; --text:#2a2519; --muted:#6f6758;
    --accent:#8a6310; --accent-ink:#fff; --border:rgba(60,40,10,.12);
    --shadow:0 10px 25px rgba(70,50,10,.12); --sq:rgba(60,40,10,.06); --err:#b3261e;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh; position:relative;
    transition: background .3s, color .3s;
  }
  body::before {
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background: conic-gradient(var(--sq) 25%, transparent 0 50%, var(--sq) 0 75%, transparent 0) 0 0 / 96px 96px;
    -webkit-mask-image: radial-gradient(ellipse at top, #000 15%, transparent 75%);
            mask-image: radial-gradient(ellipse at top, #000 15%, transparent 75%);
  }
  body::after {
    content:"♞"; position:fixed; right:-4vmin; bottom:-10vmin; z-index:0; pointer-events:none;
    font-size:70vmin; line-height:1; font-family:Georgia, serif; color:var(--accent); opacity:.05;
  }
  .wrap { position:relative; z-index:1; max-width:1400px; margin:0 auto; padding:0 clamp(12px,2.5vw,28px); }

  /* Header */
  .top { padding-top: clamp(16px,3vw,28px); }
  .brand { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  h1 { margin:0; font-size:clamp(1.5rem,3vw,2.1rem); color:var(--accent); font-family:Georgia,"Times New Roman",serif; }
  .muted { color:var(--muted); margin:4px 0 0; font-size:.9rem; }
  .toolbar { display:flex; flex-wrap:wrap; gap:10px; margin:18px 0 12px; }
  input[type=search], select {
    font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--border);
    border-radius:10px; padding:10px 12px;
  }
  input[type=search] { flex:1 1 260px; }
  .check { display:inline-flex; align-items:center; gap:6px; padding:8px 12px; border:1px solid var(--border);
    border-radius:10px; background:var(--panel); cursor:pointer; user-select:none; }
  .tags { display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; scrollbar-width:none; }
  .tags::-webkit-scrollbar { display:none; }
  .tag { white-space:nowrap; font:inherit; font-size:.85rem; padding:6px 14px; border-radius:999px;
    border:1px solid var(--border); background:var(--panel); color:var(--text); cursor:pointer; }
  .tag.on { background:var(--accent); color:var(--accent-ink); border-color:transparent; }
  .playbar { display:flex; flex-wrap:wrap; gap:10px; margin:12px 0 4px; align-items:center; }
  .btn { font:inherit; font-weight:600; padding:10px 18px; border-radius:10px; border:1px solid var(--border);
    background:var(--panel); color:var(--text); cursor:pointer; }
  .btn.primary { background:var(--accent); color:var(--accent-ink); border-color:transparent; }
  .icon-btn { font:inherit; width:42px; height:42px; border-radius:50%; border:1px solid var(--border);
    background:var(--panel); color:var(--text); cursor:pointer; display:inline-grid; place-items:center; font-size:1rem; }
  .icon-btn:disabled { opacity:.4; cursor:default; }

  /* Grid: 1 column on phones, 2 columns on laptops and wider */
  .grid { display:grid; grid-template-columns:minmax(0,1fr); gap:clamp(14px,2vw,24px); padding-top:12px; padding-bottom:110px; }
  @media (min-width:900px) {
    .grid { grid-template-columns:repeat(2, minmax(0,1fr)); }
    .card.theater { grid-column:1 / -1; }
  }
  @media (max-width:899px) {
    .grid { scroll-snap-type:y proximity; }
    .card { scroll-snap-align:start; scroll-margin-top:12px; }
  }

  /* Cards */
  .card { background:var(--panel); border:1px solid var(--border); border-radius:16px; overflow:hidden;
    box-shadow:var(--shadow); display:flex; flex-direction:column; min-width:0;
    transition: transform .25s, box-shadow .25s, border-color .25s; }
  .card:hover { transform:translateY(-3px); }
  .card.playing { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent), var(--shadow); }
  .card.flash { animation: flash 1.6s ease-in-out 2; }
  @keyframes flash { 50% { box-shadow:0 0 0 6px var(--accent), var(--shadow); } }

  .media { position:relative; aspect-ratio:16/9; background:#000; overflow:hidden; }
  .media iframe, .media video { position:absolute; inset:0; width:100%; height:100%; border:0; background:#000; }
  .media video { object-fit:contain; }
  .media > div { position:absolute; inset:0; }
  .media:fullscreen { aspect-ratio:auto; width:100%; height:100%; }

  .poster { position:absolute; inset:0; width:100%; height:100%; border:0; padding:0; cursor:pointer;
    background:#111 center / cover no-repeat; display:grid; place-items:center; }
  .poster::after { content:""; position:absolute; inset:0; background:linear-gradient(transparent 45%, rgba(0,0,0,.5)); }
  .poster.nothumb { background:radial-gradient(circle at 30% 30%, #4a3f2e, #0d0c0a); }
  .play { position:relative; z-index:1; width:68px; height:68px; border-radius:50%; background:rgba(212,167,44,.95);
    color:#17150f; display:grid; place-items:center; font-size:1.5rem; padding-left:4px;
    box-shadow:0 6px 20px rgba(0,0,0,.4); transition:transform .2s; }
  .poster:hover .play { transform:scale(1.08); }
  .bad { position:absolute; inset:0; display:grid; place-items:center; padding:16px; text-align:center;
    color:var(--err); font-size:.9rem; background:#111; }

  .body { padding:14px 16px 16px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .meta { font-size:.8rem; color:var(--muted); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .prov { text-transform:uppercase; letter-spacing:.08em; color:var(--accent); font-weight:700; }
  h2 { margin:0; font-size:1.1rem; line-height:1.3; overflow-wrap:anywhere; }
  .note { margin:0; color:var(--muted); font-size:.92rem; line-height:1.5; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font-size:.75rem; padding:3px 9px; border-radius:999px; background:var(--panel2); color:var(--muted); }
  .acts { margin-top:auto; display:flex; flex-wrap:wrap; gap:6px; padding-top:8px; }
  .act { font:inherit; font-size:.82rem; padding:6px 10px; border-radius:8px; border:1px solid var(--border);
    background:var(--panel2); color:var(--text); cursor:pointer; text-decoration:none;
    display:inline-flex; align-items:center; gap:4px; }
  .act:hover { border-color:var(--accent); }
  .act.on { color:#e0525a; border-color:rgba(224,82,90,.45); }

  /* Now-playing bar */
  .now { position:fixed; left:50%; transform:translateX(-50%); bottom:max(14px, env(safe-area-inset-bottom));
    z-index:20; width:min(640px, calc(100% - 24px)); display:flex; align-items:center; justify-content:space-between;
    gap:12px; padding:8px 8px 8px 16px; border-radius:999px; background:var(--panel); border:1px solid var(--border);
    box-shadow:var(--shadow); backdrop-filter:blur(10px); }
  .now[hidden] { display:none; }
  .now-title { font-size:.9rem; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .now-ctrl { display:flex; gap:6px; flex-shrink:0; }
  .now-ctrl .icon-btn { width:38px; height:38px; }

  .toast { position:fixed; left:50%; bottom:92px; transform:translate(-50%,20px); opacity:0; z-index:30;
    background:var(--text); color:var(--bg); padding:8px 14px; border-radius:999px; font-size:.9rem;
    transition:.3s; pointer-events:none; }
  .toast.show { opacity:1; transform:translate(-50%,0); }

  .status { grid-column:1 / -1; text-align:center; color:var(--muted); padding:60px 0; }
  .foot { text-align:center; color:var(--muted); font-size:.8rem; padding:0 0 110px; position:relative; z-index:1; }

  @media (max-width:600px) {
    .play { width:56px; height:56px; }
    .toolbar select { flex:1; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>

<header class="top wrap">
  <div class="brand">
    <div>
      <h1>♞ Chess Videos</h1>
      <p class="muted" id="stats">Loading…</p>
    </div>
    <button id="themeBtn" class="icon-btn" type="button" aria-label="Toggle light or dark mode" title="Toggle theme">☾</button>
  </div>

  <div class="toolbar">
    <input id="search" type="search" placeholder="Search title, note or tag…" aria-label="Search videos">
    <select id="sort" aria-label="Sort order">
      <option value="new">Newest first</option>
      <option value="old">Oldest first</option>
      <option value="az">Title A–Z</option>
    </select>
    <label class="check"><input type="checkbox" id="favOnly"> ♥ Saved only</label>
  </div>

  <div id="tags" class="tags" role="group" aria-label="Filter by topic"></div>

  <div class="playbar">
    <button id="playAll" class="btn primary" type="button">▶ Play all</button>
    <select id="mode" aria-label="Playback mode">
      <option value="once">Play once</option>
      <option value="loop">Loop list</option>
      <option value="shuffle">Shuffle</option>
      <option value="one">Loop one</option>
    </select>
  </div>
</header>

<main id="grid" class="grid wrap" aria-live="polite"></main>

<footer class="foot wrap" id="foot"></footer>

<div id="now" class="now" hidden>
  <div class="now-title" id="nowTitle"></div>
  <div class="now-ctrl">
    <button id="prevBtn" class="icon-btn" type="button" aria-label="Previous video">⏮</button>
    <button id="nextBtn" class="icon-btn" type="button" aria-label="Next video">⏭</button>
    <button id="stopBtn" class="icon-btn" type="button" aria-label="Stop">■</button>
  </div>
</div>

<div id="toast" class="toast" role="status"></div>

<script>
(() => {
  // ---------- Helpers ----------
  const $ = id => document.getElementById(id);
  const $grid = $('grid'), $tags = $('tags'), $search = $('search'), $sort = $('sort'),
        $fav = $('favOnly'), $mode = $('mode'), $playAll = $('playAll'), $now = $('now'),
        $nowTitle = $('nowTitle'), $stats = $('stats'), $foot = $('foot'), $theme = $('themeBtn'),
        $prev = $('prevBtn'), $next = $('nextBtn'), $stop = $('stopBtn');

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  function h(tag, attrs = {}, text) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    if (text != null) n.textContent = text;
    return n;
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // Short stable ID from any string (used for keys of non-YouTube/Vimeo links)
  function hashStr(s) {
    let x = 5381;
    for (let i = 0; i < s.length; i++) x = ((x << 5) + x + s.charCodeAt(i)) | 0;
    return (x >>> 0).toString(36);
  }

  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  // ---------- Link handling: accept any link ----------
  // Adds https:// when the scheme is missing; leaves relative paths (/x.mp4, ./x.mp4) alone.
  function normalizeUrl(s) {
    s = String(s || '').trim();
    if (!s) return '';
    if (s.startsWith('//')) return 'https:' + s;
    if (/^(https?:|\/|\.\/|\.\.\/)/i.test(s)) return s;
    if (/^[a-z][a-z0-9+.-]*:/i.test(s)) return s;   // other schemes, e.g. blob: or data:
    return 'https://' + s;
  }

  function parseVideo(url) {
    if (!url) return null;

    // YouTube single videos (watch, youtu.be, shorts, live, embed, music, mobile)
    const yt = url.match(/(?:youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/)|youtu\.be\/)([A-Za-z0-9_-]{11})(?![A-Za-z0-9_-])/);
    if (yt) return {
      provider: 'yt', id: yt[1],
      embed: `https://www.youtube-nocookie.com/embed/${yt[1]}`,
      thumb: `https://i.ytimg.com/vi/${yt[1]}/hqdefault.jpg`,
      open: `https://www.youtube.com/watch?v=${yt[1]}`
    };

    // YouTube playlists (no single video)
    const ytList = url.match(/youtube(?:-nocookie)?\.com\/.*[?&]list=([A-Za-z0-9_-]+)/);
    if (ytList) return {
      provider: 'iframe', id: 'pl-' + ytList[1],
      embed: `https://www.youtube-nocookie.com/embed/videoseries?list=${ytList[1]}`,
      thumb: null, open: url
    };

    // Vimeo, including unlisted videos (vimeo.com/ID/HASH)
    const vm = url.match(/vimeo\.com\/(?:video\/)?(\d+)(?:\/([A-Za-z0-9]+))?/);
    if (vm) {
      const [, id, hash] = vm;
      return {
        provider: 'vm', id,
        embed: `https://player.vimeo.com/video/${id}${hash ? '?h=' + hash : ''}`,
        thumb: null,
        open: `https://vimeo.com/${id}${hash ? '/' + hash : ''}`
      };
    }

    // Direct video files
    if (/\.(mp4|webm|ogg|ogv|mov|m4v)([?#]|$)/i.test(url)) return {
      provider: 'file', id: hashStr(url), embed: url, thumb: null, open: url
    };

    // Any other web link: shown in an embedded frame
    return { provider: 'iframe', id: hashStr(url), embed: url, thumb: null, open: url };
  }

  const PROVIDER_LABEL = { yt: 'YouTube', vm: 'Vimeo', file: 'Video file', iframe: 'Web video' };

  // ---------- State ----------
  let videos = [];          // all loaded videos
  let filtered = [];        // currently visible videos (display order)
  let queue = [];           // playback queue
  let qIdx = -1;            // index in queue of the playing video
  let activeKey = null;     // key of the playing video
  let player = null;        // current player (YouTube, Vimeo, or <video>)
  let mountSeq = 0;         // invalidates stale async player setup
  let activeTag = 'All';
  let favs = new Set(store.get('cv-fav', []));
  let theaters = new Set();

  const mode = () => $mode.value;

  // ---------- External player APIs (loaded on demand) ----------
  function loadScript(src) {
    return new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = src; s.async = true;
      s.onload = res;
      s.onerror = () => rej(new Error('Failed: ' + src));
      document.head.appendChild(s);
    });
  }
  let ytReady = null, vmReady = null;
  function loadYT() {
    if (window.YT && window.YT.Player) return Promise.resolve();
    if (!ytReady) ytReady = new Promise((res, rej) => {
      const prev = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = () => { if (prev) prev(); res(); };
      loadScript('https://www.youtube.com/iframe_api').catch(rej);
    });
    return ytReady;
  }
  function loadVimeo() {
    if (window.Vimeo && window.Vimeo.Player) return Promise.resolve();
    if (!vmReady) vmReady = loadScript('https://player.vimeo.com/api/player.js');
    return vmReady;
  }

  // ---------- Player control ----------
  function destroyPlayer() {
    mountSeq++;                       // cancel any pending setup
    const p = player; player = null;
    if (!p) return;
    try {
      if (p instanceof HTMLMediaElement) { p.pause(); p.removeAttribute('src'); p.load(); }
      else { const r = p.destroy(); if (r && r.catch) r.catch(() => {}); }
    } catch (e) {}
  }

  function markBroken(media, msg) {
    media.innerHTML = '';
    media.appendChild(h('div', { class: 'bad' }, msg || 'This video could not load. Use “Original” to open it.'));
  }

  const FRAME_ALLOW = 'autoplay; fullscreen; picture-in-picture; encrypted-media; clipboard-write; accelerometer; gyroscope; web-share';

  function mountPlayer(v, card) {
    destroyPlayer();
    document.querySelectorAll('.card.playing').forEach(x => x.classList.remove('playing'));
    card.classList.add('playing');
    const media = card.querySelector('.media');
    media.innerHTML = '';
    const token = mountSeq;

    if (v.info.provider === 'yt') {
      const holder = document.createElement('div');
      media.appendChild(holder);
      loadYT().then(() => {
        if (token !== mountSeq) return;
        player = new YT.Player(holder, {
          videoId: v.info.id, width: '100%', height: '100%',
          playerVars: { autoplay: 1, rel: 0, playsinline: 1, modestbranding: 1 },
          events: {
            onStateChange: e => { if (e.data === 0 && token === mountSeq) setTimeout(onEnded, 300); },
            onError: () => {
              if (token !== mountSeq) return;
              markBroken(media, 'YouTube will not play this video here. Skipping…');
              setTimeout(() => { if (token === mountSeq) go(1, true); }, 2500);
            }
          }
        });
      }).catch(() => { if (token === mountSeq) markBroken(media); });

    } else if (v.info.provider === 'vm') {
      const sep = v.info.embed.includes('?') ? '&' : '?';
      const f = h('iframe', {
        src: v.info.embed + sep + 'autoplay=1&playsinline=1&dnt=1',
        allow: FRAME_ALLOW, allowfullscreen: '', title: v.title
      });
      media.appendChild(f);
      loadVimeo().then(() => {
        if (token !== mountSeq) return;
        player = new Vimeo.Player(f);
        player.on('ended', () => { if (token === mountSeq) setTimeout(onEnded, 300); });
        player.on('error', () => { if (token === mountSeq) markBroken(media); });
      }).catch(() => { if (token === mountSeq) markBroken(media); });

    } else if (v.info.provider === 'file') {
      const vid = h('video', { src: v.info.embed, controls: '', autoplay: '', playsinline: '', preload: 'auto' });
      vid.addEventListener('ended', () => { if (token === mountSeq) onEnded(); });
      vid.addEventListener('error', () => { if (token === mountSeq) markBroken(media, 'This video file could not be played. Use “Original” to open it.'); });
      media.appendChild(vid);
      player = vid;
      vid.play().catch(() => {});   // browsers may block autoplay; the controls still work

    } else {
      // Generic web embed: plays in a frame; no auto-advance because the page can't see its state
      media.appendChild(h('iframe', { src: v.info.embed, allow: FRAME_ALLOW, allowfullscreen: '', title: v.title }));
    }
  }

  function resetCard(key) {
    const old = document.getElementById(key);
    const v = videos.find(x => x.key === key);
    if (old && v) old.replaceWith(buildCard(v));
  }

  function playIndex(i, scroll) {
    if (i < 0 || i >= queue.length) return stop();
    const v = queue[i];
    const prev = activeKey;
    qIdx = i; activeKey = v.key;
    if (prev && prev !== v.key) resetCard(prev);
    const card = document.getElementById(v.key);
    if (!card) return stop();
    mountPlayer(v, card);
    updateNow();
    if (scroll) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function startQueue(key) {
    if (!filtered.length) return;
    let list;
    if (mode() === 'shuffle') {
      if (key) {
        const first = filtered.find(v => v.key === key);
        list = first ? [first, ...shuffle(filtered.filter(v => v.key !== key))] : shuffle(filtered);
      } else list = shuffle(filtered);
    } else {
      list = [...filtered];
    }
    const idx = key && mode() !== 'shuffle' ? list.findIndex(v => v.key === key) : 0;
    queue = list;
    playIndex(Math.max(0, idx), false);
  }

  function go(dir, scroll) {
    let n = qIdx + dir;
    if (n >= queue.length) {
      if (mode() === 'once') return stop();
      if (mode() === 'shuffle') queue = shuffle(queue);
      n = 0;
    }
    if (n < 0) n = mode() === 'once' ? 0 : queue.length - 1;
    playIndex(n, scroll);
  }

  function onEnded() {
    if (mode() === 'one') playIndex(qIdx, false);
    else go(1, true);
  }

  function stop() {
    const prev = activeKey;
    destroyPlayer();
    activeKey = null; qIdx = -1;
    if (prev) resetCard(prev);
    $now.hidden = true;
    $playAll.textContent = '▶ Play all';
  }

  function updateNow() {
    const v = queue[qIdx];
    if (!activeKey || !v) { $now.hidden = true; $playAll.textContent = '▶ Play all'; return; }
    $now.hidden = false;
    $nowTitle.textContent = `${qIdx + 1}/${queue.length} · ${v.title}`;
    $playAll.textContent = '■ Stop';
  }

  // ---------- Filtering & sorting ----------
  function getFiltered() {
    const q = $search.value.trim().toLowerCase();
    const list = videos.filter(v => {
      if ($fav.checked && !favs.has(v.key)) return false;
      if (activeTag !== 'All' && !v.tags.includes(activeTag)) return false;
      if (!q) return true;
      return (v.title + ' ' + v.note + ' ' + v.tags.join(' ')).toLowerCase().includes(q);
    });
    const s = $sort.value;
    return list.sort((a, b) => {
      if (s === 'az') return a.title.localeCompare(b.title, undefined, { sensitivity: 'base' });
      if (!a.time !== !b.time) return a.time ? -1 : 1;   // undated videos go last
      const d = s === 'old' ? a.time - b.time : b.time - a.time;
      return d || a.title.localeCompare(b.title);
    });
  }

  function renderTags() {
    const counts = new Map();
    videos.forEach(v => v.tags.forEach(t => counts.set(t, (counts.get(t) || 0) + 1)));
    const all = [...counts.keys()].sort((a, b) => a.localeCompare(b));
    if (activeTag !== 'All' && !counts.has(activeTag)) activeTag = 'All';
    $tags.innerHTML = '';
    $tags.style.display = all.length ? '' : 'none';
    ['All', ...all].forEach(t => {
      const n = t === 'All' ? videos.length : counts.get(t);
      const b = h('button', {
        class: 'tag' + (t === activeTag ? ' on' : ''), type: 'button',
        'aria-pressed': String(t === activeTag)
      }, `${t} (${n})`);
      b.onclick = () => { activeTag = t; render(); };
      $tags.appendChild(b);
    });
  }

  // ---------- Cards ----------
  function buildCard(v) {
    const c = h('article', { class: 'card', id: v.key });
    if (theaters.has(v.key)) c.classList.add('theater');

    // Media area: poster with play button
    const media = h('div', { class: 'media' });
    const poster = h('button', { class: 'poster', type: 'button', 'aria-label': 'Play ' + v.title });
    if (v.info.thumb) poster.style.backgroundImage = `url("${v.info.thumb}")`;
    else poster.classList.add('nothumb');
    poster.appendChild(h('span', { class: 'play', 'aria-hidden': 'true' }, '▶'));
    poster.onclick = () => startQueue(v.key);
    media.appendChild(poster);
    c.appendChild(media);

    // Body
    const body = h('div', { class: 'body' });
    const meta = h('div', { class: 'meta' });
    meta.appendChild(h('span', { class: 'prov' }, PROVIDER_LABEL[v.info.provider] || 'Video'));
    if (v.time) meta.appendChild(h('span', {}, new Date(v.time).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' })));
    body.appendChild(meta);
    body.appendChild(h('h2', {}, v.title));
    if (v.note) body.appendChild(h('p', { class: 'note' }, v.note));
    if (v.tags.length) {
      const chips = h('div', { class: 'chips' });
      v.tags.forEach(t => chips.appendChild(h('span', { class: 'chip' }, t)));
      body.appendChild(chips);
    }

   
  // ---------- Rendering ----------
  function render() {
    filtered = getFiltered();
    renderTags();
    $grid.innerHTML = '';

    if (!videos.length) {
      $grid.appendChild(h('div', { class: 'status' }, 'No videos yet. Add entries to videos.json.'));
    } else if (!filtered.length) {
      $grid.appendChild(h('div', { class: 'status' }, 'No videos match your filters.'));
    } else {
      filtered.forEach(v => $grid.appendChild(buildCard(v)));
    }

    // Keep the playing video going if it is still visible
    if (activeKey) {
      const keep = new Set(filtered.map(v => v.key));
      queue = queue.filter(v => keep.has(v.key));
      qIdx = queue.findIndex(v => v.key === activeKey);
      if (qIdx < 0) stop();
      else mountPlayer(queue[qIdx], document.getElementById(activeKey));
    }
    updateNow();
    updateStats();
    updateFooter();
  }

  function updateStats() {
    const topics = new Set(videos.flatMap(v => v.tags)).size;
    const saved = [...favs].filter(k => videos.some(v => v.key === k)).length;
    $stats.textContent = `${videos.length} videos · ${topics} topics · ${saved} saved`;
  }

  function updateFooter() {
    $foot.textContent = 'Paste any link in videos.json: YouTube, Vimeo, direct video files (.mp4, .webm…), or other web video pages.';
  }

  function focusHash() {
    const key = decodeURIComponent(location.hash.slice(1));
    const card = key && document.getElementById(key);
    if (!card) return;
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    card.classList.add('flash');
    setTimeout(() => card.classList.remove('flash'), 3500);
  }

  // ---------- Theme ----------
  function setTheme(t) {
    document.documentElement.dataset.theme = t;
    $theme.textContent = t === 'dark' ? '☀︎' : '☾';
    try { localStorage.setItem('cv-theme', t); } catch (e) {}
  }
  $theme.onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

  // ---------- Controls ----------
  $search.addEventListener('input', render);
  $sort.addEventListener('change', () => { store.set('cv-sort', $sort.value); render(); });
  $fav.addEventListener('change', render);
  $mode.addEventListener('change', () => store.set('cv-mode', $mode.value));
  $playAll.onclick = () => (activeKey ? stop() : startQueue(null));
  $prev.onclick = () => go(-1, true);
  $next.onclick = () => go(1, true);
  $stop.onclick = stop;

  document.addEventListener('keydown', e => {
    if (e.target.matches('input, select, textarea')) return;
    if (!activeKey) return;
    if (e.key === 'ArrowRight' || e.key === 'n') go(1, true);
    if (e.key === 'ArrowLeft' || e.key === 'p') go(-1, true);
    if (e.key === 'Escape') stop();
  });

  // ---------- Load data ----------
  async function load() {
    try {
      const r = await fetch('videos.json', { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      const raw = Array.isArray(data) ? data : (data.videos || []);
      const seen = new Set();

      videos = raw
        .filter(v => v && typeof v === 'object' && normalizeUrl(v.url))
        .map((v, i) => {
          const url = normalizeUrl(v.url);
          const info = parseVideo(url);
          let key = `${info.provider}-${info.id}`;
          if (seen.has(key)) key += `-${i}`;          // duplicate links stay distinct
          seen.add(key);
          const [y, m, d] = String(v.date || '').split('-').map(Number);
          return {
            key, info, url,
            title: String(v.title || 'Untitled'),
            date: v.date || '',
            time: y ? new Date(y, (m || 1) - 1, d || 1).getTime() : 0,
            note: String(v.note || ''),
            tags: (Array.isArray(v.tags) ? v.tags : []).map(t => String(t).trim()).filter(Boolean)
          };
        });

      $sort.value = store.get('cv-sort', 'new');
      $mode.value = store.get('cv-mode', 'once');

      render();
      focusHash();
    } catch (e) {
      $grid.innerHTML = '';
      $grid.appendChild(h('div', { class: 'status' },
        'Could not load videos.json. Keep it in the same folder as index.html and open the page through a web server ' +
        '(for example: python -m http.server), not by double-clicking the file.'));
      $stats.textContent = 'Data not loaded';
    }
  }

  setTheme(document.documentElement.dataset.theme || 'dark');
  load();
})();
</script>
</body>
</html>
