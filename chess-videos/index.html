<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Chess Learning Videos from MyChess64: learn, play and improve, anytime, anywhere.">
<title>Chess Learning Videos</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<script>
  // Apply the saved or system theme before first paint, so there is no flash
  try {
    const t = localStorage.getItem('clv-theme') ||
      (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<style>
  :root {
    --bg:#f4f6fa; --surface:#ffffff; --surface2:#eef2f8; --text:#111827; --muted:#5b6679;
    --border:#e2e8f0; --primary:#1d4ed8; --primary-ink:#ffffff; --accent:#d4a017;
    --shadow:0 1px 2px rgba(15,23,42,.06), 0 4px 16px rgba(15,23,42,.06);
    --shadow-hover:0 2px 4px rgba(15,23,42,.08), 0 14px 34px rgba(15,23,42,.14);
    --danger:#b91c1c; --header:#ffffff; --focus:rgba(29,78,216,.25);
  }
  [data-theme="dark"] {
    --bg:#0b1020; --surface:#121a2e; --surface2:#1a2440; --text:#e8edf7; --muted:#9aa6bf;
    --border:#243050; --primary:#3b82f6; --primary-ink:#ffffff; --accent:#f5b82e;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
    --shadow-hover:0 2px 6px rgba(0,0,0,.5), 0 16px 36px rgba(0,0,0,.5);
    --danger:#f87171; --header:#0f1729; --focus:rgba(59,130,246,.35);
  }

  * { box-sizing:border-box; }
  html, body { margin:0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh; line-height:1.5;
    display:flex; flex-direction:column; transition:background-color .3s, color .3s;
  }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .wrap { width:100%; max-width:1280px; margin:0 auto; padding:0 clamp(14px,3vw,28px); }
  main { flex:1; }

  /* ---------- Header ---------- */
  .site-header { background:var(--header); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:40; }
  .header-inner { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:68px; }
  .brand { display:inline-flex; align-items:center; }
  .brand img { height:42px; width:auto; display:block; border-radius:8px; background:#fff; padding:4px 8px; }
  .icon-btn {
    font:inherit; width:40px; height:40px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface); color:var(--text); cursor:pointer; display:inline-grid; place-items:center; font-size:1rem;
  }
  .icon-btn:hover { border-color:var(--primary); }
  .icon-btn:focus-visible, button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible {
    outline:3px solid var(--focus); outline-offset:2px;
  }

  /* ---------- Page heading ---------- */
  .intro { padding:clamp(24px,4vw,40px) 0 clamp(16px,2.5vw,24px); }
  h1 { margin:0; font-size:clamp(1.7rem,4vw,2.4rem); font-weight:750; letter-spacing:-.02em; line-height:1.15; }
  .intro p { margin:8px 0 0; color:var(--muted); font-size:1rem; }
  .stats { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .stat { font-size:.85rem; font-weight:600; padding:5px 12px; border-radius:999px; background:var(--surface); border:1px solid var(--border); color:var(--muted); }

  /* ---------- Toolbar ---------- */
  .toolbar {
    background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px;
    box-shadow:var(--shadow);
  }
  .controls { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .searchbar { position:relative; flex:1 1 320px; min-width:0; }
  .searchbar svg { position:absolute; left:13px; top:50%; transform:translateY(-50%); width:18px; height:18px; color:var(--muted); pointer-events:none; }
  #search {
    width:100%; font:inherit; font-size:.98rem; color:var(--text); background:var(--surface2);
    border:1px solid var(--border); border-radius:12px; padding:11px 12px 11px 40px;
  }
  #search::placeholder { color:var(--muted); }
  #search:focus { border-color:var(--primary); background:var(--surface); }
  .playbar { display:flex; gap:10px; align-items:center; }
  .btn-primary {
    font:inherit; font-weight:700; font-size:.94rem; padding:11px 18px; border-radius:12px; border:0;
    background:var(--primary); color:var(--primary-ink); cursor:pointer; white-space:nowrap;
  }
  .btn-primary:hover { filter:brightness(1.08); }
  select.mode {
    font:inherit; font-size:.92rem; color:var(--text); background:var(--surface2); border:1px solid var(--border);
    border-radius:12px; padding:10px 12px; cursor:pointer;
  }
  .tags { display:flex; gap:8px; overflow-x:auto; padding-top:12px; scrollbar-width:none; }
  .tags::-webkit-scrollbar { display:none; }
  .tag {
    white-space:nowrap; font:inherit; font-size:.84rem; font-weight:600; padding:6px 13px; border-radius:999px;
    border:1px solid var(--border); background:var(--surface2); color:var(--text); cursor:pointer;
  }
  .tag:hover { border-color:var(--primary); }
  .tag.on { background:var(--primary); border-color:var(--primary); color:var(--primary-ink); }

  /* ---------- Video grid ---------- */
  .grid {
    display:grid; grid-template-columns:minmax(0,1fr); gap:clamp(16px,2.2vw,24px);
    padding:clamp(20px,3vw,28px) 0 140px;
  }
  @media (min-width:860px) { .grid { grid-template-columns:repeat(2, minmax(0,1fr)); } }
  .status { grid-column:1 / -1; text-align:center; color:var(--muted); padding:48px 0; }

  .card {
    display:flex; flex-direction:column; min-width:0; background:var(--surface);
    border:1px solid var(--border); border-radius:16px; overflow:hidden; box-shadow:var(--shadow);
    transition:box-shadow .25s, border-color .25s;
  }
  .card[hidden] { display:none !important; }
  .card:hover { box-shadow:var(--shadow-hover); }
  .card.playing { border-color:var(--primary); box-shadow:0 0 0 2px var(--primary), var(--shadow); }

  .media { position:relative; aspect-ratio:16/9; background:#000; overflow:hidden; }
  .media iframe, .media video { position:absolute; inset:0; width:100%; height:100%; border:0; background:#000; }
  .media video { object-fit:contain; }
  .media > div { position:absolute; inset:0; }
  .media:fullscreen { aspect-ratio:auto; width:100%; height:100%; }

  .poster {
    position:absolute; inset:0; width:100%; height:100%; border:0; padding:0; cursor:pointer;
    background:#0f172a center / cover no-repeat; display:grid; place-items:center;
  }
  .poster.nothumb { background:linear-gradient(135deg,#1e293b,#0f172a); }
  .poster::after { content:""; position:absolute; inset:0; background:rgba(0,0,0,.18); transition:background .25s; }
  .poster:hover::after { background:rgba(0,0,0,.05); }
  .play {
    position:relative; z-index:1; width:64px; height:64px; border-radius:50%; background:rgba(255,255,255,.95);
    color:#111827; display:grid; place-items:center; font-size:1.35rem; padding-left:4px;
    box-shadow:0 6px 18px rgba(0,0,0,.35); transition:transform .2s;
  }
  .poster:hover .play { transform:scale(1.06); }
  .bad { position:absolute; inset:0; display:grid; place-items:center; padding:18px; text-align:center; color:#fca5a5; font-size:.92rem; background:#000; }

  .body { padding:14px 16px 16px; display:flex; flex-direction:column; gap:10px; flex:1; }
  .meta { display:flex; flex-wrap:wrap; gap:7px; align-items:center; }
  .spacer { flex:1; }
  .pill {
    font:inherit; font-size:.8rem; font-weight:600; padding:6px 11px; border-radius:8px;
    border:1px solid var(--border); background:var(--surface2); color:var(--text); cursor:pointer;
    text-decoration:none; display:inline-flex; align-items:center; gap:5px; white-space:nowrap;
  }
  .pill:hover { border-color:var(--primary); }
  .pill.play-pill { background:var(--primary); border-color:var(--primary); color:var(--primary-ink); }
  .pill.prov { background:transparent; border-color:transparent; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; font-size:.7rem; padding-left:0; cursor:default; }
  .pill.icon { padding:6px 9px; font-size:.95rem; }
  .pill.icon.on { color:#e11d48; border-color:#fda4af; }
  [data-theme="dark"] .pill.icon.on { color:#fb7185; border-color:#9f1239; }
  h2 { margin:2px 0 0; font-size:1.08rem; line-height:1.35; font-weight:650; overflow-wrap:anywhere; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font-size:.72rem; font-weight:600; padding:3px 9px; border-radius:6px; background:var(--surface2); color:var(--muted); }

  /* ---------- Now playing bar ---------- */
  .now {
    position:fixed; left:50%; transform:translateX(-50%); bottom:max(14px, env(safe-area-inset-bottom)); z-index:50;
    width:min(640px, calc(100% - 24px)); display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:8px 8px 8px 16px; border-radius:14px; background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow-hover);
  }
  .now[hidden] { display:none; }
  .now-title { font-size:.9rem; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .now-ctrl { display:flex; gap:6px; flex-shrink:0; }
  .now-ctrl .icon-btn { width:38px; height:38px; }

  .toast {
    position:fixed; left:50%; bottom:100px; transform:translate(-50%,16px); opacity:0; z-index:60;
    background:var(--text); color:var(--bg); padding:8px 14px; border-radius:8px; font-size:.88rem; font-weight:600;
    transition:.25s; pointer-events:none;
  }
  .toast.show { opacity:1; transform:translate(-50%,0); }

  /* ---------- Footer ---------- */
  .site-footer { background:var(--header); border-top:1px solid var(--border); }
  .footer-inner { display:flex; flex-direction:column; align-items:center; gap:14px; padding:32px 0 calc(32px + 80px); text-align:center; }
  .foot-logo { background:#fff; border-radius:12px; padding:12px 20px; border:1px solid var(--border); }
  .foot-logo img { width:min(280px,70vw); height:auto; display:block; }
  .foot-links { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; }
  .foot-link {
    font-size:.88rem; font-weight:600; color:var(--text); text-decoration:none; padding:8px 14px;
    border-radius:8px; border:1px solid var(--border); background:var(--surface);
  }
  .foot-link:hover { border-color:var(--primary); color:var(--primary); }
  .foot-note { margin:0; font-size:.82rem; color:var(--muted); }

  @media (max-width:640px) {
    .brand img { height:36px; }
    .playbar { width:100%; }
    .playbar .btn-primary { flex:1; }
    select.mode { flex:1; }
    .play { width:56px; height:56px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="./" aria-label="Chess Learning Videos home">

    </a>
    <button id="themeBtn" class="icon-btn" type="button" aria-label="Switch light or dark mode" title="Switch theme">☾</button>

    <div class="stats">

        <div class="searchbar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="Search videos by title or topic" aria-label="Search videos" autocomplete="off">

<script>
(() => {
  // ---------- DOM ----------
  const $ = id => document.getElementById(id);
  const $grid = $('grid'), $tags = $('tags'), $search = $('search'), $mode = $('mode'),
        $playAll = $('playAll'), $now = $('now'), $nowTitle = $('nowTitle'),
        $statV = $('statVideos'), $statT = $('statTopics'),
        $theme = $('themeBtn'), $prev = $('prevBtn'), $next = $('nextBtn'), $stop = $('stopBtn'),
        $empty = $('empty');

  // ---------- Helpers ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  function h(tag, attrs = {}, text) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    if (text != null) n.textContent = text;
    return n;
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function hashStr(s) {
    let x = 5381;
    for (let i = 0; i < s.length; i++) x = ((x << 5) + x + s.charCodeAt(i)) | 0;
    return (x >>> 0).toString(36);
  }

  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  // ---------- Link handling: accepts any link ----------
  function normalizeUrl(s) {
    s = String(s || '').trim();
    if (!s) return '';
    if (s.startsWith('//')) return 'https:' + s;
    if (/^(https?:|\/|\.\/|\.\.\/)/i.test(s)) return s;
    if (/^[a-z][a-z0-9+.-]*:/i.test(s)) return s;
    return 'https://' + s;
  }

  function parseVideo(url) {
    const yt = url.match(/(?:youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/)|youtu\.be\/)([A-Za-z0-9_-]{11})(?![A-Za-z0-9_-])/);
    if (yt) return {
      provider: 'yt', id: yt[1],
      embed: `https://www.youtube-nocookie.com/embed/${yt[1]}`,
      thumb: `https://i.ytimg.com/vi/${yt[1]}/hqdefault.jpg`,
      open: `https://www.youtube.com/watch?v=${yt[1]}`
    };

    const ytList = url.match(/youtube(?:-nocookie)?\.com\/.*[?&]list=([A-Za-z0-9_-]+)/);
    if (ytList) return {
      provider: 'iframe', id: 'pl-' + ytList[1],
      embed: `https://www.youtube-nocookie.com/embed/videoseries?list=${ytList[1]}`,
      thumb: null, open: url
    };

    const vm = url.match(/vimeo\.com\/(?:video\/)?(\d+)(?:\/([A-Za-z0-9]+))?/);
    if (vm) {
      const [, id, hash] = vm;
      return {
        provider: 'vm', id,
        embed: `https://player.vimeo.com/video/${id}${hash ? '?h=' + hash : ''}`,
        thumb: null,
        open: `https://vimeo.com/${id}${hash ? '/' + hash : ''}`
      };
    }

    if (/\.(mp4|webm|ogg|ogv|mov|m4v)([?#]|$)/i.test(url)) return {
      provider: 'file', id: hashStr(url), embed: url, thumb: null, open: url
    };

    return { provider: 'iframe', id: hashStr(url), embed: url, thumb: null, open: url };
  }

  const PROVIDER_LABEL = { yt: 'YouTube', vm: 'Vimeo', file: 'Video', iframe: 'Web' };

  // ---------- State ----------
  let videos = [];
  let byKey = new Map();
  let cards = new Map();
  let visible = new Set();
  let queue = [];
  let qIdx = -1;
  let activeKey = null;
  let player = null;
  let mountSeq = 0;
  let activeTag = 'All';
  let favs = new Set(store.get('clv-fav', []));

  const mode = () => $mode.value;
  const visibleList = () => videos.filter(v => visible.has(v.key));

  // ---------- External player APIs (loaded on demand) ----------
  function loadScript(src) {
    return new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = src; s.async = true;
      s.onload = res;
      s.onerror = () => rej(new Error('Failed: ' + src));
      document.head.appendChild(s);
    });
  }
  let ytReady = null, vmReady = null;
  function loadYT() {
    if (window.YT && window.YT.Player) return Promise.resolve();
    if (!ytReady) ytReady = new Promise((res, rej) => {
      const prev = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = () => { if (prev) prev(); res(); };
      loadScript('https://www.youtube.com/iframe_api').catch(rej);
    });
    return ytReady;
  }
  function loadVimeo() {
    if (window.Vimeo && window.Vimeo.Player) return Promise.resolve();
    if (!vmReady) vmReady = loadScript('https://player.vimeo.com/api/player.js');
    return vmReady;
  }

  // ---------- Player control ----------
  function destroyPlayer() {
    mountSeq++;
    const p = player; player = null;
    if (!p) return;
    try {
      if (p instanceof HTMLMediaElement) { p.pause(); p.removeAttribute('src'); p.load(); }
      else { const r = p.destroy(); if (r && r.catch) r.catch(() => {}); }
    } catch (e) {}
  }

  function markBroken(media, msg) {
    media.innerHTML = '';
    media.appendChild(h('div', { class: 'bad' }, msg || 'This video could not load. Use “Original” to open it.'));
  }

  const FRAME_ALLOW = 'autoplay; fullscreen; picture-in-picture; encrypted-media; clipboard-write; accelerometer; gyroscope; web-share';

  function makePoster(v) {
    const p = h('button', { class: 'poster', type: 'button', 'aria-label': 'Play ' + v.title });
    if (v.info.thumb) p.style.backgroundImage = `url("${v.info.thumb}")`;
    else p.classList.add('nothumb');
    p.appendChild(h('span', { class: 'play', 'aria-hidden': 'true' }, '▶'));
    p.onclick = () => startQueue(v.key);
    return p;
  }

  function mountPlayer(v, card) {
    destroyPlayer();
    document.querySelectorAll('.card.playing').forEach(x => x.classList.remove('playing'));
    card.classList.add('playing');
    const media = card.querySelector('.media');
    media.innerHTML = '';
    const token = mountSeq;

    if (v.info.provider === 'yt') {
      const holder = document.createElement('div');
      media.appendChild(holder);
      loadYT().then(() => {
        if (token !== mountSeq) return;
        player = new YT.Player(holder, {
          videoId: v.info.id, width: '100%', height: '100%',
          playerVars: { autoplay: 1, rel: 0, playsinline: 1, modestbranding: 1 },
          events: {
            onStateChange: e => { if (e.data === 0 && token === mountSeq) setTimeout(onEnded, 300); },
            onError: () => {
              if (token !== mountSeq) return;
              markBroken(media, 'YouTube will not play this video here. Skipping…');
              setTimeout(() => { if (token === mountSeq) go(1, true); }, 2500);
            }
          }
        });
      }).catch(() => { if (token === mountSeq) markBroken(media); });

    } else if (v.info.provider === 'vm') {
      const sep = v.info.embed.includes('?') ? '&' : '?';
      const f = h('iframe', {
        src: v.info.embed + sep + 'autoplay=1&playsinline=1&dnt=1',
        allow: FRAME_ALLOW, allowfullscreen: '', title: v.title
      });
      media.appendChild(f);
      loadVimeo().then(() => {
        if (token !== mountSeq) return;
        player = new Vimeo.Player(f);
        player.on('ended', () => { if (token === mountSeq) setTimeout(onEnded, 300); });
        player.on('error', () => { if (token === mountSeq) markBroken(media); });
      }).catch(() => { if (token === mountSeq) markBroken(media); });

    } else if (v.info.provider === 'file') {
      const vid = h('video', { src: v.info.embed, controls: '', playsinline: '', preload: 'auto' });
      vid.addEventListener('ended', () => { if (token === mountSeq) onEnded(); });
      vid.addEventListener('error', () => { if (token === mountSeq) markBroken(media, 'This video file could not be played. Use “Original” to open it.'); });
      media.appendChild(vid);
      player = vid;
      vid.play().catch(() => {});

    } else {
      media.appendChild(h('iframe', { src: v.info.embed, allow: FRAME_ALLOW, allowfullscreen: '', title: v.title }));
    }
  }

  function resetCard(key) {
    const card = cards.get(key), v = byKey.get(key);
    if (!card || !v) return;
    card.classList.remove('playing');
    const media = card.querySelector('.media');
    media.innerHTML = '';
    media.appendChild(makePoster(v));
  }

  function playIndex(i, scroll) {
    if (i < 0 || i >= queue.length) return stop();
    const v = queue[i];
    const card = cards.get(v.key);
    if (!card) return stop();
    const prev = activeKey;
    qIdx = i; activeKey = v.key;
    if (prev && prev !== v.key) resetCard(prev);
    mountPlayer(v, card);
    updateNow();
    if (scroll) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function startQueue(key) {
    const list0 = visibleList();
    if (!list0.length) return;
    let list;
    if (mode() === 'shuffle') {
      if (key) {
        const first = list0.find(v => v.key === key);
        list = first ? [first, ...shuffle(list0.filter(v => v.key !== key))] : shuffle(list0);
      } else list = shuffle(list0);
    } else {
      list = [...list0];
    }
    const idx = key && mode() !== 'shuffle' ? list.findIndex(v => v.key === key) : 0;
    queue = list;
    playIndex(Math.max(0, idx), false);
  }

  function go(dir, scroll) {
    let n = qIdx + dir;
    if (n >= queue.length) {
      if (mode() === 'once') return stop();
      if (mode() === 'shuffle') queue = shuffle(queue);
      n = 0;
    }
    if (n < 0) n = mode() === 'once' ? 0 : queue.length - 1;
    playIndex(n, scroll);
  }

  function onEnded() {
    if (mode() === 'one') playIndex(qIdx, false);
    else go(1, true);
  }

  function stop() {
    const prev = activeKey;
    destroyPlayer();
    activeKey = null; qIdx = -1;
    if (prev) resetCard(prev);
    $now.hidden = true;
    $playAll.textContent = '▶ Play all';
  }

  function updateNow() {
    const v = queue[qIdx];
    if (!activeKey || !v) { $now.hidden = true; $playAll.textContent = '▶ Play all'; return; }
    $now.hidden = false;
    $nowTitle.textContent = `${qIdx + 1}/${queue.length} · ${v.title}`;
    $playAll.textContent = '■ Stop';
  }

  // ---------- Cards (built once; filtering shows or hides them, so playback is not interrupted) ----------
  function buildCard(v) {
    const card = h('article', { class: 'card', id: v.key });
    const media = h('div', { class: 'media' });
    media.appendChild(makePoster(v));
    card.appendChild(media);

    const body = h('div', { class: 'body' });
    const meta = h('div', { class: 'meta' });

    meta.appendChild(h('span', { class: 'pill prov' }, PROVIDER_LABEL[v.info.provider] || 'Video'));

    const playBtn = h('button', { class: 'pill play-pill', type: 'button' }, '▶ Play');
    playBtn.onclick = () => startQueue(v.key);

    const fsBtn = h('button', { class: 'pill', type: 'button', title: 'Full screen', 'aria-label': 'Full screen' }, '⛶ Full screen');
    fsBtn.onclick = () => {
      if (activeKey !== v.key) startQueue(v.key);
      const m = cards.get(v.key)?.querySelector('.media');
      if (m && m.requestFullscreen) m.requestFullscreen().catch(() => {});
    };

    const orig = h('a', { class: 'pill', href: v.info.open, target: '_blank', rel: 'noopener' }, '↗ Original');

    const favOn = favs.has(v.key);
    const favBtn = h('button', {
      class: 'pill icon' + (favOn ? ' on' : ''), type: 'button',
      title: favOn ? 'Saved' : 'Save', 'aria-label': favOn ? 'Remove from saved' : 'Save video'
    }, favOn ? '♥' : '♡');
    favBtn.onclick = () => {
      const on = !favs.has(v.key);
      on ? favs.add(v.key) : favs.delete(v.key);
      store.set('clv-fav', [...favs]);
      favBtn.className = 'pill icon' + (on ? ' on' : '');
      favBtn.textContent = on ? '♥' : '♡';
      favBtn.setAttribute('aria-label', on ? 'Remove from saved' : 'Save video');
    };

    const shareBtn = h('button', { class: 'pill icon', type: 'button', title: 'Copy link', 'aria-label': 'Copy link' }, '🔗');
    shareBtn.onclick = async () => {
      const link = location.href.split('#')[0] + '#' + v.key;
      try { await navigator.clipboard.writeText(link); toast('Link copied'); }
      catch (e) { window.prompt('Copy this link:', link); }
    };

    meta.append(playBtn, fsBtn, orig, h('span', { class: 'spacer' }), favBtn, shareBtn);
    body.appendChild(meta);
    body.appendChild(h('h2', {}, v.title));

    if (v.tags.length) {
      const chips = h('div', { class: 'chips' });
      v.tags.forEach(t => chips.appendChild(h('span', { class: 'chip' }, t)));
      body.appendChild(chips);
    }
    card.appendChild(body);
    return card;
  }

  // ---------- Filtering ----------
  function applyFilter() {
    const q = $search.value.trim().toLowerCase();
    visible = new Set();
    videos.forEach(v => {
      const tagOk = activeTag === 'All' || v.tags.includes(activeTag);
      const textOk = !q || (v.title + ' ' + v.note + ' ' + v.tags.join(' ')).toLowerCase().includes(q);
      const ok = tagOk && textOk;
      if (ok) visible.add(v.key);
      cards.get(v.key).hidden = !ok;
    });

    $empty.hidden = visible.size > 0 && videos.length > 0;
    $empty.textContent = videos.length ? 'No videos match your search.' : 'No videos yet. Add links to videos.json.';

    if (activeKey) {
      queue = queue.filter(v => visible.has(v.key));
      qIdx = queue.findIndex(v => v.key === activeKey);
      if (qIdx < 0) stop();
    }
    renderTags();
    updateNow();
    updateStats();
  }

  function renderTags() {
    const counts = new Map();
    videos.forEach(v => v.tags.forEach(t => counts.set(t, (counts.get(t) || 0) + 1)));
    const all = [...counts.keys()].sort((a, b) => a.localeCompare(b));
    if (activeTag !== 'All' && !counts.has(activeTag)) activeTag = 'All';
    $tags.innerHTML = '';
    $tags.style.display = all.length ? '' : 'none';
    ['All', ...all].forEach(t => {
      const n = t === 'All' ? videos.length : counts.get(t);
      const b = h('button', {
        class: 'tag' + (t === activeTag ? ' on' : ''), type: 'button', 'aria-pressed': String(t === activeTag)
      }, `${t} (${n})`);
      b.onclick = () => { activeTag = t; applyFilter(); };
      $tags.appendChild(b);
    });
  }

  function updateStats() {
    const n = videos.length;
    const topics = new Set(videos.flatMap(v => v.tags)).size;
    $statV.textContent = visible.size === n
      ? `${n} video${n === 1 ? '' : 's'}`
      : `${visible.size} of ${n} shown`;
    $statT.textContent = `${topics} topic${topics === 1 ? '' : 's'}`;
  }

  // ---------- Theme ----------
  function setTheme(t) {
    document.documentElement.dataset.theme = t;
    $theme.textContent = t === 'dark' ? '☀︎' : '☾';
    try { localStorage.setItem('clv-theme', t); } catch (e) {}
  }
  $theme.onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

  // ---------- Controls ----------
  $search.addEventListener('input', applyFilter);
  $mode.addEventListener('change', () => store.set('clv-mode', $mode.value));
  $playAll.onclick = () => (activeKey ? stop() : startQueue(null));
  $prev.onclick = () => go(-1, true);
  $next.onclick = () => go(1, true);
  $stop.onclick = stop;
  $('backTop').addEventListener('click', e => { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); });

  document.addEventListener('keydown', e => {
    if (e.target.matches('input, select, textarea')) return;
    if (!activeKey) return;
    if (e.key === 'ArrowRight' || e.key === 'n') go(1, true);
    if (e.key === 'ArrowLeft' || e.key === 'p') go(-1, true);
    if (e.key === 'Escape') stop();
  });

  function focusHash() {
    const key = decodeURIComponent(location.hash.slice(1));
    const card = key && cards.get(key);
    if (!card || card.hidden) return;
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    card.classList.add('flash');
    setTimeout(() => card.classList.remove('flash'), 3000);
  }

  // ---------- Load data ----------
  async function load() {
    try {
      const r = await fetch('videos.json', { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      const raw = Array.isArray(data) ? data : (data.videos || []);
      const seen = new Set();

      videos = raw
        .filter(v => v && typeof v === 'object' && normalizeUrl(v.url))
        .map((v, i) => {
          const url = normalizeUrl(v.url);
          const info = parseVideo(url);
          let key = `${info.provider}-${info.id}`;
          if (seen.has(key)) key += `-${i}`;
          seen.add(key);
          const [y, m, d] = String(v.date || '').split('-').map(Number);
          return {
            key, info, url,
            title: String(v.title || 'Untitled'),
            time: y ? new Date(y, (m || 1) - 1, d || 1).getTime() : 0,
            note: String(v.note || ''),
            tags: (Array.isArray(v.tags) ? v.tags : []).map(t => String(t).trim()).filter(Boolean)
          };
        })
        .sort((a, b) => b.time - a.time);

      byKey = new Map(videos.map(v => [v.key, v]));
      videos.forEach(v => {
        const card = buildCard(v);
        cards.set(v.key, card);
        $grid.insertBefore(card, $empty);
      });

      $mode.value = store.get('clv-mode', 'once');
      applyFilter();
      focusHash();
    } catch (e) {
      $empty.hidden = false;
      $empty.textContent = 'Could not load videos.json. Keep it in the same folder as index.html and open the page through a web server (for example: python -m http.server), not by double-clicking the file.';
      $statV.textContent = 'Data not loaded';
      $statT.textContent = '';
    }
  }

  // ---------- Start ----------
  setTheme(document.documentElement.dataset.theme || 'light');
  $('year').textContent = new Date().getFullYear();
  load();
})();
</script>
</body>
</html>
