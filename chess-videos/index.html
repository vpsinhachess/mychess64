<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Learn, Fun &amp; Play - Chess Videos</title>
<meta name="description" content="Chess videos from MyChess64: learn, play and improve, anytime, anywhere.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<script>
  // Apply saved or system theme before first paint to avoid a flash
  try {
    const t = localStorage.getItem('cv-theme') ||
      (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<style>
  :root {
    --bg:#11100d; --panel:#1f1c17; --panel2:#2a261f; --text:#f3efe6; --muted:#a39c8c;
    --accent:#d4a72c; --accent-ink:#17150f; --border:rgba(255,255,255,.09);
    --shadow:0 10px 30px rgba(0,0,0,.4); --sq:rgba(255,255,255,.03); --piece:#d4a72c; --piece-op:.09;
    --err:#f08a80; --brand:#1f6fff;
  }
  [data-theme="light"] {
    --bg:#f6f1e3; --panel:#fffdf7; --panel2:#f1eadb; --text:#1f1b12; --muted:#6f6758;
    --accent:#8a6310; --accent-ink:#fff; --border:rgba(60,40,10,.12);
    --shadow:0 10px 25px rgba(70,50,10,.12); --sq:rgba(60,40,10,.055); --piece:#5a4210; --piece-op:.12;
    --err:#b3261e; --brand:#0f5fd6;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh; position:relative; overflow-x:hidden;
    transition: background .3s, color .3s;
  }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  /* ---------- Chess background ---------- */
  .checks {
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background: conic-gradient(var(--sq) 25%, transparent 0 50%, var(--sq) 0 75%, transparent 0) 0 0 / 96px 96px;
  }
  .bg { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .bgp {
    position:absolute; color:var(--piece); opacity:var(--piece-op); line-height:1; user-select:none;
    font-family: "Segoe UI Symbol", "Noto Sans Symbols 2", "Apple Symbols", serif;
    animation: drift 20s ease-in-out infinite alternate;
    will-change: transform;
  }
  @keyframes drift {
    0%   { transform: translate(0,0) rotate(var(--rot)); }
    50%  { transform: translate(22px,-30px) rotate(calc(var(--rot) * -1)); }
    100% { transform: translate(-16px,14px) rotate(var(--rot)); }
  }
  .vignette {
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background: radial-gradient(ellipse at center, transparent 40%, var(--bg) 100%);
    opacity:.55;
  }

  .wrap { position:relative; z-index:1; max-width:1400px; margin:0 auto; padding:0 clamp(12px,2.5vw,28px); }

  /* ---------- Header ---------- */
  .top { padding-top: clamp(14px,3vw,26px); }
  .brand { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .logo-wrap {
    display:inline-flex; background:#fff; border-radius:16px; padding:8px 16px;
    box-shadow:0 8px 24px rgba(0,0,0,.25); border:1px solid rgba(0,0,0,.06);
  }
  .logo-wrap img { height:clamp(52px,8vw,78px); width:auto; display:block; }
  .caption { margin:10px 2px 0; color:var(--muted); font-size:.9rem; letter-spacing:.04em; text-transform:uppercase; font-weight:600; }
  .caption b { color:var(--accent); font-weight:700; }

  .icon-btn { font:inherit; width:44px; height:44px; border-radius:50%; border:1px solid var(--border);
    background:var(--panel); color:var(--text); cursor:pointer; display:inline-grid; place-items:center; font-size:1.05rem; flex-shrink:0; }
  .icon-btn:disabled { opacity:.4; cursor:default; }

  .searchbar { position:relative; margin:18px 0 12px; }
  .searchbar::before { content:"⌕"; position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:1.2rem; color:var(--muted); pointer-events:none; }
  #search { width:100%; font:inherit; font-size:1rem; color:var(--text); background:var(--panel);
    border:1px solid var(--border); border-radius:14px; padding:13px 14px 13px 40px; box-shadow:var(--shadow); outline:none; }
  #search:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(212,167,44,.25), var(--shadow); }

  .tags { display:flex; gap:8px; overflow-x:auto; padding:2px 0 6px; scrollbar-width:none; }
  .tags::-webkit-scrollbar { display:none; }
  .tag { white-space:nowrap; font:inherit; font-size:.85rem; padding:6px 14px; border-radius:999px;
    border:1px solid var(--border); background:var(--panel); color:var(--text); cursor:pointer; }
  .tag.on { background:var(--accent); color:var(--accent-ink); border-color:transparent; }

  .playbar { display:flex; flex-wrap:wrap; gap:10px; margin:10px 0 4px; align-items:center; }
  .btn { font:inherit; font-weight:600; padding:10px 18px; border-radius:12px; border:1px solid var(--border);
    background:var(--panel); color:var(--text); cursor:pointer; }
  .btn.primary { background:linear-gradient(135deg,#e6bd3e,var(--accent)); color:var(--accent-ink); border-color:transparent; box-shadow:0 6px 18px rgba(212,167,44,.3); }
  select.mode { font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:10px 12px; }

  /* ---------- Grid ---------- */
  .grid { display:grid; grid-template-columns:minmax(0,1fr); gap:clamp(14px,2vw,24px); padding-top:14px; padding-bottom:120px; }
  @media (min-width:900px) {
    .grid { grid-template-columns:repeat(2, minmax(0,1fr)); }
  }
  @media (max-width:899px) {
    .grid { scroll-snap-type:y proximity; }
    .card { scroll-snap-align:start; scroll-margin-top:12px; }
  }
  .status { grid-column:1 / -1; text-align:center; color:var(--muted); padding:60px 0; }

  /* ---------- Cards ---------- */
  .card { background:var(--panel); border:1px solid var(--border); border-radius:18px; overflow:hidden;
    box-shadow:var(--shadow); display:flex; flex-direction:column; min-width:0;
    transition: transform .25s, box-shadow .25s, border-color .25s; }
  .card[hidden] { display:none !important; }
  .card:hover { transform:translateY(-3px); }
  .card.playing { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent), var(--shadow); }
  .card.flash { animation: flash 1.6s ease-in-out 2; }
  @keyframes flash { 50% { box-shadow:0 0 0 6px var(--accent), var(--shadow); } }

  .media { position:relative; aspect-ratio:16/9; background:#000; overflow:hidden; }
  .media iframe, .media video { position:absolute; inset:0; width:100%; height:100%; border:0; background:#000; }
  .media video { object-fit:contain; }
  .media > div { position:absolute; inset:0; }
  .media:fullscreen { aspect-ratio:auto; width:100%; height:100%; }

  .poster { position:absolute; inset:0; width:100%; height:100%; border:0; padding:0; cursor:pointer;
    background:#111 center / cover no-repeat; display:grid; place-items:center; }
  .poster::after { content:""; position:absolute; inset:0; background:linear-gradient(transparent 45%, rgba(0,0,0,.5)); }
  .poster.nothumb { background:radial-gradient(circle at 30% 30%, #4a3f2e, #0d0c0a); }
  .poster.nothumb::before { content:"♞"; position:absolute; font-size:9rem; color:rgba(212,167,44,.12); z-index:0; }
  .play { position:relative; z-index:1; width:68px; height:68px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #f1cd62, var(--accent)); color:#17150f;
    display:grid; place-items:center; font-size:1.5rem; padding-left:4px;
    box-shadow:0 6px 20px rgba(0,0,0,.45); transition:transform .2s; }
  .poster:hover .play { transform:scale(1.08); }
  .bad { position:absolute; inset:0; display:grid; place-items:center; padding:16px; text-align:center;
    color:var(--err); font-size:.9rem; background:#111; }

  .body { padding:12px 14px 16px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .meta { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .spacer { flex:1; }
  .pill { font:inherit; font-size:.78rem; font-weight:600; padding:6px 11px; border-radius:999px;
    border:1px solid var(--border); background:var(--panel2); color:var(--text); cursor:pointer;
    text-decoration:none; display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
  .pill:hover { border-color:var(--accent); }
  .pill.prov { background:var(--accent); color:var(--accent-ink); border-color:transparent;
    text-transform:uppercase; letter-spacing:.07em; font-size:.68rem; cursor:default; }
  .pill.icon { padding:6px 9px; font-size:.95rem; }
  .pill.icon.on { color:#e0525a; border-color:rgba(224,82,90,.5); }
  h2 { margin:2px 0 0; font-size:1.12rem; line-height:1.3; overflow-wrap:anywhere; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font-size:.72rem; padding:3px 9px; border-radius:999px; background:var(--panel2); color:var(--muted); }

  /* ---------- Now playing ---------- */
  .now { position:fixed; left:50%; transform:translateX(-50%); bottom:max(14px, env(safe-area-inset-bottom));
    z-index:20; width:min(640px, calc(100% - 24px)); display:flex; align-items:center; justify-content:space-between;
    gap:12px; padding:8px 8px 8px 16px; border-radius:999px; background:var(--panel); border:1px solid var(--border);
    box-shadow:var(--shadow); backdrop-filter:blur(10px); }
  .now[hidden] { display:none; }
  .now-title { font-size:.9rem; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .now-ctrl { display:flex; gap:6px; flex-shrink:0; }
  .now-ctrl .icon-btn { width:38px; height:38px; }

  .toast { position:fixed; left:50%; bottom:96px; transform:translate(-50%,20px); opacity:0; z-index:30;
    background:var(--text); color:var(--bg); padding:8px 14px; border-radius:999px; font-size:.9rem;
    transition:.3s; pointer-events:none; }
  .toast.show { opacity:1; transform:translate(-50%,0); }

  /* ---------- Footer ---------- */
  .foot { position:relative; z-index:1; text-align:center; padding:0 0 110px; color:var(--muted); font-size:.85rem; }
  .foot-logo { display:inline-block; background:#fff; border-radius:18px; padding:14px 22px; box-shadow:0 8px 24px rgba(0,0,0,.2); }
  .foot-logo img { width:min(320px,70vw); height:auto; display:block; }
  .foot p { margin:12px 0 0; }

  @media (max-width:600px) {
    .playbar .btn { flex:1; }
    select.mode { flex:1; }
    .play { width:56px; height:56px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>

<div class="checks" aria-hidden="true"></div>
<div id="bg" class="bg" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<header class="top wrap">
  <div class="brand">
    <a class="logo-wrap" href="./" aria-label="MyChess64 home">
      <img src="assets/Header_Logo.png" alt="MyChess64 – Learn. Play. Improve. Anytime, Anywhere.">
    </a>
    <button id="themeBtn" class="icon-btn" type="button" aria-label="Switch light or dark mode" title="Switch theme">☾</button>
  </div>
  <h1 class="sr-only">Learn, Fun &amp; Play - Chess Videos</h1>
  <p class="caption">Chess <b>Videos</b> · Learn, Fun &amp; Play</p>

  <div class="searchbar">
    <input id="search" type="search" placeholder="Search videos…" aria-label="Search videos" autocomplete="off">
  </div>

  <div id="tags" class="tags" role="group" aria-label="Filter by topic"></div>

  <div class="playbar">
    <button id="playAll" class="btn primary" type="button">▶ Play all</button>
    <select id="mode" class="mode" aria-label="Playback mode">
      <option value="once">Play once</option>
      <option value="loop">Loop list</option>
      <option value="shuffle">Shuffle</option>
      <option value="one">Loop one</option>
    </select>
  </div>
</header>

<main id="grid" class="grid wrap" aria-live="polite">
  <div id="empty" class="status" hidden>No videos match your search.</div>
</main>

<footer class="foot wrap">
  <div class="foot-logo"><img src="assets/Footer_Logo.png" alt="MyChess64 – Learn. Play. Improve. Anytime, Anywhere."></div>
  <p id="stats"></p>
</footer>

<div id="now" class="now" hidden>
  <div class="now-title" id="nowTitle"></div>
  <div class="now-ctrl">
    <button id="prevBtn" class="icon-btn" type="button" aria-label="Previous video">⏮</button>
    <button id="nextBtn" class="icon-btn" type="button" aria-label="Next video">⏭</button>
    <button id="stopBtn" class="icon-btn" type="button" aria-label="Stop">■</button>
  </div>
</div>

<div id="toast" class="toast" role="status"></div>

<script>
(() => {
  // ---------- DOM ----------
  const $ = id => document.getElementById(id);
  const $grid = $('grid'), $tags = $('tags'), $search = $('search'), $mode = $('mode'),
        $playAll = $('playAll'), $now = $('now'), $nowTitle = $('nowTitle'), $stats = $('stats'),
        $theme = $('themeBtn'), $prev = $('prevBtn'), $next = $('nextBtn'), $stop = $('stopBtn'),
        $empty = $('empty'), $bg = $('bg');

  // ---------- Helpers ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  function h(tag, attrs = {}, text) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    if (text != null) n.textContent = text;
    return n;
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function hashStr(s) {
    let x = 5381;
    for (let i = 0; i < s.length; i++) x = ((x << 5) + x + s.charCodeAt(i)) | 0;
    return (x >>> 0).toString(36);
  }

  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  // ---------- Link handling: accepts any link ----------
  function normalizeUrl(s) {
    s = String(s || '').trim();
    if (!s) return '';
    if (s.startsWith('//')) return 'https:' + s;
    if (/^(https?:|\/|\.\/|\.\.\/)/i.test(s)) return s;
    if (/^[a-z][a-z0-9+.-]*:/i.test(s)) return s;
    return 'https://' + s;
  }

  function parseVideo(url) {
    const yt = url.match(/(?:youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/)|youtu\.be\/)([A-Za-z0-9_-]{11})(?![A-Za-z0-9_-])/);
    if (yt) return {
      provider: 'yt', id: yt[1],
      embed: `https://www.youtube-nocookie.com/embed/${yt[1]}`,
      thumb: `https://i.ytimg.com/vi/${yt[1]}/hqdefault.jpg`,
      open: `https://www.youtube.com/watch?v=${yt[1]}`
    };

    const ytList = url.match(/youtube(?:-nocookie)?\.com\/.*[?&]list=([A-Za-z0-9_-]+)/);
    if (ytList) return {
      provider: 'iframe', id: 'pl-' + ytList[1],
      embed: `https://www.youtube-nocookie.com/embed/videoseries?list=${ytList[1]}`,
      thumb: null, open: url
    };

    const vm = url.match(/vimeo\.com\/(?:video\/)?(\d+)(?:\/([A-Za-z0-9]+))?/);
    if (vm) {
      const [, id, hash] = vm;
      return {
        provider: 'vm', id,
        embed: `https://player.vimeo.com/video/${id}${hash ? '?h=' + hash : ''}`,
        thumb: null,
        open: `https://vimeo.com/${id}${hash ? '/' + hash : ''}`
      };
    }

    if (/\.(mp4|webm|ogg|ogv|mov|m4v)([?#]|$)/i.test(url)) return {
      provider: 'file', id: hashStr(url), embed: url, thumb: null, open: url
    };

    return { provider: 'iframe', id: hashStr(url), embed: url, thumb: null, open: url };
  }

  const PROVIDER_LABEL = { yt: 'YouTube', vm: 'Vimeo', file: 'Video', iframe: 'Web' };

  // ---------- State ----------
  let videos = [];               // all videos, newest first
  let byKey = new Map();         // key -> video
  let cards = new Map();         // key -> card element (built once, shown/hidden)
  let visible = new Set();       // keys currently shown
  let queue = [];                // playback queue
  let qIdx = -1;
  let activeKey = null;
  let player = null;
  let mountSeq = 0;              // invalidates stale async player setup
  let activeTag = 'All';
  let favs = new Set(store.get('cv-fav', []));

  const mode = () => $mode.value;
  const visibleList = () => videos.filter(v => visible.has(v.key));

  // ---------- External player APIs (loaded on demand) ----------
  function loadScript(src) {
    return new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = src; s.async = true;
      s.onload = res;
      s.onerror = () => rej(new Error('Failed: ' + src));
      document.head.appendChild(s);
    });
  }
  let ytReady = null, vmReady = null;
  function loadYT() {
    if (window.YT && window.YT.Player) return Promise.resolve();
    if (!ytReady) ytReady = new Promise((res, rej) => {
      const prev = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = () => { if (prev) prev(); res(); };
      loadScript('https://www.youtube.com/iframe_api').catch(rej);
    });
    return ytReady;
  }
  function loadVimeo() {
    if (window.Vimeo && window.Vimeo.Player) return Promise.resolve();
    if (!vmReady) vmReady = loadScript('https://player.vimeo.com/api/player.js');
    return vmReady;
  }

  // ---------- Player control ----------
  function destroyPlayer() {
    mountSeq++;
    const p = player; player = null;
    if (!p) return;
    try {
      if (p instanceof HTMLMediaElement) { p.pause(); p.removeAttribute('src'); p.load(); }
      else { const r = p.destroy(); if (r && r.catch) r.catch(() => {}); }
    } catch (e) {}
  }

  function markBroken(media, msg) {
    media.innerHTML = '';
    media.appendChild(h('div', { class: 'bad' }, msg || 'This video could not load. Use “Original” to open it.'));
  }

  const FRAME_ALLOW = 'autoplay; fullscreen; picture-in-picture; encrypted-media; clipboard-write; accelerometer; gyroscope; web-share';

  function makePoster(v) {
    const p = h('button', { class: 'poster', type: 'button', 'aria-label': 'Play ' + v.title });
    if (v.info.thumb) p.style.backgroundImage = `url("${v.info.thumb}")`;
    else p.classList.add('nothumb');
    p.appendChild(h('span', { class: 'play', 'aria-hidden': 'true' }, '▶'));
    p.onclick = () => startQueue(v.key);
    return p;
  }

  function mountPlayer(v, card) {
    destroyPlayer();
    document.querySelectorAll('.card.playing').forEach(x => x.classList.remove('playing'));
    card.classList.add('playing');
    const media = card.querySelector('.media');
    media.innerHTML = '';
    const token = mountSeq;

    if (v.info.provider === 'yt') {
      const holder = document.createElement('div');
      media.appendChild(holder);
      loadYT().then(() => {
        if (token !== mountSeq) return;
        player = new YT.Player(holder, {
          videoId: v.info.id, width: '100%', height: '100%',
          playerVars: { autoplay: 1, rel: 0, playsinline: 1, modestbranding: 1 },
          events: {
            onStateChange: e => { if (e.data === 0 && token === mountSeq) setTimeout(onEnded, 300); },
            onError: () => {
              if (token !== mountSeq) return;
              markBroken(media, 'YouTube will not play this video here. Skipping…');
              setTimeout(() => { if (token === mountSeq) go(1, true); }, 2500);
            }
          }
        });
      }).catch(() => { if (token === mountSeq) markBroken(media); });

    } else if (v.info.provider === 'vm') {
      const sep = v.info.embed.includes('?') ? '&' : '?';
      const f = h('iframe', {
        src: v.info.embed + sep + 'autoplay=1&playsinline=1&dnt=1',
        allow: FRAME_ALLOW, allowfullscreen: '', title: v.title
      });
      media.appendChild(f);
      loadVimeo().then(() => {
        if (token !== mountSeq) return;
        player = new Vimeo.Player(f);
        player.on('ended', () => { if (token === mountSeq) setTimeout(onEnded, 300); });
        player.on('error', () => { if (token === mountSeq) markBroken(media); });
      }).catch(() => { if (token === mountSeq) markBroken(media); });

    } else if (v.info.provider === 'file') {
      const vid = h('video', { src: v.info.embed, controls: '', playsinline: '', preload: 'auto' });
      vid.addEventListener('ended', () => { if (token === mountSeq) onEnded(); });
      vid.addEventListener('error', () => { if (token === mountSeq) markBroken(media, 'This video file could not be played. Use “Original” to open it.'); });
      media.appendChild(vid);
      player = vid;
      vid.play().catch(() => {});

    } else {
      media.appendChild(h('iframe', { src: v.info.embed, allow: FRAME_ALLOW, allowfullscreen: '', title: v.title }));
    }
  }

  function resetCard(key) {
    const card = cards.get(key), v = byKey.get(key);
    if (!card || !v) return;
    card.classList.remove('playing');
    const media = card.querySelector('.media');
    media.innerHTML = '';
    media.appendChild(makePoster(v));
  }

  function playIndex(i, scroll) {
    if (i < 0 || i >= queue.length) return stop();
    const v = queue[i];
    const card = cards.get(v.key);
    if (!card) return stop();
    const prev = activeKey;
    qIdx = i; activeKey = v.key;
    if (prev && prev !== v.key) resetCard(prev);
    mountPlayer(v, card);
    updateNow();
    if (scroll) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function startQueue(key) {
    const list0 = visibleList();
    if (!list0.length) return;
    let list;
    if (mode() === 'shuffle') {
      if (key) {
        const first = list0.find(v => v.key === key);
        list = first ? [first, ...shuffle(list0.filter(v => v.key !== key))] : shuffle(list0);
      } else list = shuffle(list0);
    } else {
      list = [...list0];
    }
    const idx = key && mode() !== 'shuffle' ? list.findIndex(v => v.key === key) : 0;
    queue = list;
    playIndex(Math.max(0, idx), false);
  }

  function go(dir, scroll) {
    let n = qIdx + dir;
    if (n >= queue.length) {
      if (mode() === 'once') return stop();
      if (mode() === 'shuffle') queue = shuffle(queue);
      n = 0;
    }
    if (n < 0) n = mode() === 'once' ? 0 : queue.length - 1;
    playIndex(n, scroll);
  }

  function onEnded() {
    if (mode() === 'one') playIndex(qIdx, false);
    else go(1, true);
  }

  function stop() {
    const prev = activeKey;
    destroyPlayer();
    activeKey = null; qIdx = -1;
    if (prev) resetCard(prev);
    $now.hidden = true;
    $playAll.textContent = '▶ Play all';
  }

  function updateNow() {
    const v = queue[qIdx];
    if (!activeKey || !v) { $now.hidden = true; $playAll.textContent = '▶ Play all'; return; }
    $now.hidden = false;
    $nowTitle.textContent = `${qIdx + 1}/${queue.length} · ${v.title}`;
    $playAll.textContent = '■ Stop';
  }

  // ---------- Cards (built once; filtering only shows/hides them, so playback is never interrupted) ----------
  function buildCard(v) {
    const card = h('article', { class: 'card', id: v.key });
    const media = h('div', { class: 'media' });
    media.appendChild(makePoster(v));
    card.appendChild(media);

    const body = h('div', { class: 'body' });
    const meta = h('div', { class: 'meta' });

    meta.appendChild(h('span', { class: 'pill prov' }, PROVIDER_LABEL[v.info.provider] || 'Video'));

    const playBtn = h('button', { class: 'pill', type: 'button' }, '▶ Play');
    playBtn.onclick = () => startQueue(v.key);

    const fsBtn = h('button', { class: 'pill', type: 'button', title: 'Full screen', 'aria-label': 'Full screen' }, '⛶ Full screen');
    fsBtn.onclick = () => {
      if (activeKey !== v.key) startQueue(v.key);
      const m = cards.get(v.key)?.querySelector('.media');
      if (m && m.requestFullscreen) m.requestFullscreen().catch(() => {});
    };

    const orig = h('a', { class: 'pill', href: v.info.open, target: '_blank', rel: 'noopener' }, '↗ Original');

    const favOn = favs.has(v.key);
    const favBtn = h('button', {
      class: 'pill icon' + (favOn ? ' on' : ''), type: 'button',
      title: favOn ? 'Saved' : 'Save', 'aria-label': favOn ? 'Remove from saved' : 'Save video'
    }, favOn ? '♥' : '♡');
    favBtn.onclick = () => {
      const on = !favs.has(v.key);
      on ? favs.add(v.key) : favs.delete(v.key);
      store.set('cv-fav', [...favs]);
      favBtn.className = 'pill icon' + (on ? ' on' : '');
      favBtn.textContent = on ? '♥' : '♡';
      favBtn.setAttribute('aria-label', on ? 'Remove from saved' : 'Save video');
    };

    const shareBtn = h('button', { class: 'pill icon', type: 'button', title: 'Copy link', 'aria-label': 'Copy link' }, '🔗');
    shareBtn.onclick = async () => {
      const link = location.href.split('#')[0] + '#' + v.key;
      try { await navigator.clipboard.writeText(link); toast('Link copied'); }
      catch (e) { window.prompt('Copy this link:', link); }
    };

    meta.append(playBtn, fsBtn, orig, h('span', { class: 'spacer' }), favBtn, shareBtn);
    body.appendChild(meta);
    body.appendChild(h('h2', {}, v.title));

    if (v.tags.length) {
      const chips = h('div', { class: 'chips' });
      v.tags.forEach(t => chips.appendChild(h('span', { class: 'chip' }, t)));
      body.appendChild(chips);
    }
    card.appendChild(body);
    return card;
  }

  // ---------- Filtering ----------
  function applyFilter() {
    const q = $search.value.trim().toLowerCase();
    visible = new Set();
    videos.forEach(v => {
      const tagOk = activeTag === 'All' || v.tags.includes(activeTag);
      const textOk = !q || (v.title + ' ' + v.note + ' ' + v.tags.join(' ')).toLowerCase().includes(q);
      const ok = tagOk && textOk;
      if (ok) visible.add(v.key);
      cards.get(v.key).hidden = !ok;
    });

    $empty.hidden = visible.size > 0 && videos.length > 0;
    $empty.textContent = videos.length ? 'No videos match your search.' : 'No videos yet. Add links to videos.json.';

    // If the playing video was filtered out, stop it; otherwise keep the queue in step
    if (activeKey) {
      queue = queue.filter(v => visible.has(v.key));
      qIdx = queue.findIndex(v => v.key === activeKey);
      if (qIdx < 0) stop();
    }
    renderTags();
    updateNow();
    updateStats();
  }

  function renderTags() {
    const counts = new Map();
    videos.forEach(v => v.tags.forEach(t => counts.set(t, (counts.get(t) || 0) + 1)));
    const all = [...counts.keys()].sort((a, b) => a.localeCompare(b));
    if (activeTag !== 'All' && !counts.has(activeTag)) activeTag = 'All';
    $tags.innerHTML = '';
    $tags.style.display = all.length ? '' : 'none';
    ['All', ...all].forEach(t => {
      const n = t === 'All' ? videos.length : counts.get(t);
      const b = h('button', {
        class: 'tag' + (t === activeTag ? ' on' : ''), type: 'button', 'aria-pressed': String(t === activeTag)
      }, `${t} (${n})`);
      b.onclick = () => { activeTag = t; applyFilter(); };
      $tags.appendChild(b);
    });
  }

  function updateStats() {
    const n = videos.length;
    const topics = new Set(videos.flatMap(v => v.tags)).size;
    $stats.textContent = visible.size === n
      ? `${n} video${n === 1 ? '' : 's'} · ${topics} topic${topics === 1 ? '' : 's'}`
      : `Showing ${visible.size} of ${n} videos`;
  }

  // ---------- Background: faded floating chess pieces ----------
  function buildBackground() {
    const pieces = ['♔', '♕', '♖', '♗', '♘', '♙', '♚', '♛', '♜', '♝', '♞', '♟'];
    const count = window.innerWidth < 700 ? 14 : 26;
    const frag = document.createDocumentFragment();
    for (let i = 0; i < count; i++) {
      const s = h('span', { class: 'bgp' }, pieces[Math.floor(Math.random() * pieces.length)]);
      s.style.left = (Math.random() * 100) + '%';
      s.style.top = (Math.random() * 100) + '%';
      s.style.fontSize = (34 + Math.random() * 96) + 'px';
      s.style.animationDuration = (16 + Math.random() * 18) + 's';
      s.style.animationDelay = (-Math.random() * 20) + 's';
      s.style.setProperty('--rot', (Math.random() * 40 - 20) + 'deg');
      frag.appendChild(s);
    }
    $bg.appendChild(frag);
  }

  // ---------- Theme ----------
  function setTheme(t) {
    document.documentElement.dataset.theme = t;
    $theme.textContent = t === 'dark' ? '☀︎' : '☾';
    try { localStorage.setItem('cv-theme', t); } catch (e) {}
  }
  $theme.onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

  // ---------- Controls ----------
  $search.addEventListener('input', applyFilter);
  $mode.addEventListener('change', () => store.set('cv-mode', $mode.value));
  $playAll.onclick = () => (activeKey ? stop() : startQueue(null));
  $prev.onclick = () => go(-1, true);
  $next.onclick = () => go(1, true);
  $stop.onclick = stop;

  document.addEventListener('keydown', e => {
    if (e.target.matches('input, select, textarea')) return;
    if (!activeKey) return;
    if (e.key === 'ArrowRight' || e.key === 'n') go(1, true);
    if (e.key === 'ArrowLeft' || e.key === 'p') go(-1, true);
    if (e.key === 'Escape') stop();
  });

  function focusHash() {
    const key = decodeURIComponent(location.hash.slice(1));
    const card = key && cards.get(key);
    if (!card || card.hidden) return;
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    card.classList.add('flash');
    setTimeout(() => card.classList.remove('flash'), 3500);
  }

  // ---------- Load data ----------
  async function load() {
    try {
      const r = await fetch('videos.json', { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      const raw = Array.isArray(data) ? data : (data.videos || []);
      const seen = new Set();

      videos = raw
        .filter(v => v && typeof v === 'object' && normalizeUrl(v.url))
        .map((v, i) => {
          const url = normalizeUrl(v.url);
          const info = parseVideo(url);
          let key = `${info.provider}-${info.id}`;
          if (seen.has(key)) key += `-${i}`;
          seen.add(key);
          const [y, m, d] = String(v.date || '').split('-').map(Number);
          return {
            key, info, url,
            title: String(v.title || 'Untitled'),
            time: y ? new Date(y, (m || 1) - 1, d || 1).getTime() : 0,
            note: String(v.note || ''),
            tags: (Array.isArray(v.tags) ? v.tags : []).map(t => String(t).trim()).filter(Boolean)
          };
        })
        // Newest first by date (undated last); the date itself is not displayed
        .sort((a, b) => b.time - a.time);

      byKey = new Map(videos.map(v => [v.key, v]));
      videos.forEach(v => {
        const card = buildCard(v);
        cards.set(v.key, card);
        $grid.insertBefore(card, $empty);
      });

      $mode.value = store.get('cv-mode', 'once');
      applyFilter();
      focusHash();
    } catch (e) {
      $empty.hidden = false;
      $empty.textContent = 'Could not load videos.json. Keep it in the same folder as index.html and open the page through a web server (for example: python -m http.server), not by double-clicking the file.';
      $stats.textContent = '';
    }
  }

  setTheme(document.documentElement.dataset.theme || 'dark');
  buildBackground();
  load();
})();
</script>
</body>
</html>
