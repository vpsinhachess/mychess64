<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chess Basics — Learn Chess Step by Step</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
:root{--bg:#e4f4ff;--s:#fff;--s2:#f3efe7;--bd:#e3d6bd;--tx:#2b2118;--mu:#78695a;--ac:#b58863;--ac2:#f0d9b5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17202b;--s:#232d3a;--s2:#2d3949;--bd:#3d4b5f;--tx:#f6f0e6;--mu:#b9c3cf;--ac:#e0b080}}
:root[data-theme="dark"]{--bg:#17202b;--s:#232d3a;--s2:#2d3949;--bd:#3d4b5f;--tx:#f6f0e6;--mu:#b9c3cf;--ac:#e0b080}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg) conic-gradient(rgba(181,136,99,.10) 25%,transparent 0 50%,rgba(181,136,99,.10) 0 75%,transparent 0) 0 0/84px 84px;color:var(--tx);font:700 16px/1.45 Nunito,'Trebuchet MS',system-ui,sans-serif}
h1,h2,h3,.brand,.b,.big,.lv b,.num{font-family:Fredoka,'Trebuchet MS',system-ui,sans-serif}
.app{position:relative;z-index:1;max-width:1300px;margin:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--s);border:3px solid var(--bd);border-radius:20px;box-shadow:0 6px 0 rgba(90,60,30,.14)}
.top{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;gap:8px;flex-wrap:wrap}
.brand{font-weight:700;font-size:26px;color:var(--tx);text-decoration:none;display:flex;align-items:center;gap:8px}.brand .ps{width:38px;height:38px}
.acts{display:flex;gap:8px;align-items:center}#vol{width:80px;accent-color:#2ecc71}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px}nav .b{flex:none;white-space:nowrap}
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;border:3px solid var(--bd);border-bottom-width:6px;background:var(--s);color:var(--tx);border-radius:16px;padding:8px 12px;cursor:pointer;font-size:15px;font-weight:600;min-height:46px;transition:transform .12s,filter .12s;-webkit-tap-highlight-color:transparent}
.b:hover{transform:translateY(-3px);filter:brightness(1.07)}.b:active{transform:translateY(3px);border-bottom-width:3px}
.b.on{background:#ffd34d;border-color:#d99e00;color:#2b2118}.b.p{background:#2ecc71;border-color:#1c9a50;color:#fff}.b:disabled{opacity:.45;pointer-events:none}.w{width:100%}
.hero{text-align:center;padding:14px 8px 4px}.hero h1{margin:4px 0;font-size:clamp(36px,7vw,68px);background:linear-gradient(90deg,#ff5e62,#ff9f43,#e1b800,#1dd1a1,#2e86de,#8e7cf0);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.hero p{margin:0 0 10px;color:var(--mu);font-size:19px}.mascot .ps{width:120px;height:120px;animation:bob 2.2s ease-in-out infinite;filter:drop-shadow(0 8px 0 rgba(0,0,0,.16))}
.pill{display:inline-block;background:#ffd34d;color:#2b2118;border:3px solid #d99e00;border-radius:99px;padding:4px 16px;font-family:Fredoka,sans-serif;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;padding:16px 0 28px}
.tc{position:relative;display:flex;flex-direction:column;gap:6px;padding:18px 16px 16px;text-decoration:none;color:var(--tx);border-radius:24px;border:3px solid var(--c);border-bottom-width:9px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 14%,var(--s)),var(--s) 60%);transition:transform .15s}
.tc:hover{transform:translateY(-7px) rotate(-1.2deg)}.tc:hover .ic{animation:wig .5s}.tc:active{transform:translateY(2px)}
.tc .ic{width:78px;height:78px;border-radius:22px;background:var(--c);padding:8px;display:block;box-shadow:0 5px 0 rgba(0,0,0,.18)}.tc .ic .ps{width:100%;height:100%}
.tc .num{position:absolute;top:10px;right:16px;font-size:34px;font-weight:700;color:var(--c)}.tc .star{position:absolute;top:50px;right:16px;font-size:24px}
.tc h3{margin:6px 0 0;font-size:23px}.tc p{margin:0;color:var(--mu);font-size:14px;flex:1}
.tc .go{align-self:flex-start;background:var(--c);color:#fff;border-radius:99px;padding:5px 16px;font-family:Fredoka,sans-serif;font-weight:600;margin-top:6px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.livec{padding:10px 14px;margin-bottom:12px}.lvs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lv{text-align:center;border-radius:14px;padding:4px 2px;background:var(--s2);color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.lv b{display:block;font-size:34px;line-height:1.1;color:#2e86de}.lv.c b{color:#17b062}.lv.i b{color:#ee4d4d}.lv.s b{color:#ff8a00}
.bump{animation:bump .55s}
.mrow{display:flex;align-items:center;gap:10px;margin-top:8px}.meter{flex:1;height:14px;background:var(--s2);border-radius:99px;overflow:hidden;border:2px solid var(--bd)}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff6b6b,#ffd34d,#2ecc71);transition:width .6s}#pct{font-family:Fredoka,sans-serif;min-width:46px;text-align:right}
.lay{display:flex;gap:12px;align-items:flex-start}
.ba{flex:1;min-width:0;display:flex;justify-content:center;padding:14px}
.bw{position:relative;width:min(100%,calc(100vh - 300px),720px);min-width:260px;aspect-ratio:1;border-radius:10px}
.bw.shake{animation:shake .45s}.bw.glow{animation:glow .7s}
.bd{display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr);width:100%;height:100%;border-radius:8px;overflow:hidden;container-type:inline-size;user-select:none;box-shadow:0 10px 26px rgba(0,0,0,.3)}
.sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer}
.l{background:#f0d9b5}.d{background:#b58863}.l .co{color:#b58863}.d .co{color:#f0d9b5}
.co{position:absolute;font:800 clamp(9px,1.7cqw,15px)/1 Nunito,system-ui;font-style:normal;pointer-events:none;z-index:2}
.pc{position:relative;z-index:1;width:100%;height:100%;pointer-events:none;display:block}.pc.pin{animation:pin .4s}
.ps{display:inline-block;width:34px;height:34px;vertical-align:middle}.ps .pc{width:100%;height:100%}
.sel::before,.ok::before,.bad::before{content:"";position:absolute;inset:0}
.sel::before{background:rgba(20,85,30,.5)}.ok::before{background:rgba(20,160,40,.55)}.bad::before{background:rgba(225,45,45,.5)}
.tgt{box-shadow:inset 0 0 0 5px #fff,inset 0 0 0 8px rgba(0,0,0,.3)}
.dot::after{content:"";width:30%;height:30%;border-radius:50%;background:rgba(20,85,30,.55);position:absolute;z-index:2}
.cap{background-image:radial-gradient(transparent 0,transparent 79%,rgba(20,85,30,.45) 80%)}
.fb{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:Fredoka,sans-serif;font-size:clamp(54px,12vw,100px);font-weight:700;pointer-events:none;text-shadow:0 4px 14px rgba(0,0,0,.6);animation:pop .4s;border-radius:8px}
.fb small{font-size:.32em;text-align:center;padding:0 10px}.fb.g{background:rgba(30,160,70,.38)}.fb.r{background:rgba(210,40,40,.38)}
.pn{width:350px;flex:none;padding:16px;display:flex;flex-direction:column;gap:12px}
.pn h2{margin:0;font-size:26px}.mu{color:var(--mu);font-size:14px}.c{text-align:center}
.g2,.g3,.g6,.g8{display:grid;gap:6px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g6{grid-template-columns:repeat(6,1fr)}.g8{grid-template-columns:repeat(8,1fr)}
.g6 .b,.g8 .b{padding:2px}.g3 .b{flex-direction:column;font-size:13px}
.big{min-height:80px;display:flex;align-items:center;justify-content:center;border-radius:18px;background:var(--s2);border:3px dashed var(--ac);font-size:50px;font-weight:700;letter-spacing:2px;color:var(--ac)}
.msg{background:var(--s2);border-radius:14px;padding:10px;font-size:14px;text-align:center;border:2px solid var(--bd)}
ul.t{margin:0;padding-left:18px;font-size:13px;color:var(--mu)}
table{width:100%;border-collapse:collapse}td{padding:4px;border-bottom:2px solid var(--bd)}td:last-child{text-align:right;font-family:Fredoka,sans-serif;color:var(--ac);font-size:22px}
.bgp{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}.bgp div{position:absolute;width:70px;opacity:.14;animation:bob 4s ease-in-out infinite}
.burst{position:fixed;inset:0;z-index:50;pointer-events:none;overflow:hidden}
.fp{position:absolute;bottom:-70px;width:64px;animation:fly 1.9s ease-out forwards;filter:drop-shadow(0 4px 4px rgba(0,0,0,.3))}
.cf{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall 2.3s linear forwards}
.sp{position:absolute;font-size:30px;animation:star 1.1s ease-out forwards;margin:-15px 0 0 -15px}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
@keyframes fall{to{transform:translate(var(--x),110vh) rotate(720deg)}}
@keyframes star{to{transform:translate(var(--x),var(--y)) scale(1.6) rotate(200deg);opacity:0}}
@keyframes bob{50%{transform:translateY(-12px) rotate(4deg)}}
@keyframes wig{25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes pop{from{transform:scale(.5);opacity:0}}
@keyframes pin{0%{transform:scale(.3) translateY(-35%);opacity:0}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes bump{40%{transform:scale(1.35)}}
@keyframes shake{20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(46,204,113,.9)}100%{box-shadow:0 0 0 28px rgba(46,204,113,0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Full-screen game layout ===== */
.b,.sq,.tc{touch-action:manipulation;-webkit-touch-callout:none}
html.in,html.in body{height:100%;overflow:hidden;overscroll-behavior:none}
html.in .app{height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));padding:8px;gap:8px}
html.in #topic{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.top{padding:6px 12px}.top .b{min-height:40px;padding:4px 12px;border-bottom-width:5px}.brand{font-size:24px}
nav{padding:6px;flex:none}nav .b{min-height:38px;padding:2px 12px}.nm{display:none}
.lay{flex:1;min-height:0;display:flex;flex-direction:row;gap:8px;align-items:stretch}
.ba{flex:1;min-width:0;min-height:0;padding:8px;container-type:size;display:flex;align-items:center;justify-content:center}
.bw{width:min(100cqw,100cqh);height:min(100cqw,100cqh);min-width:0;aspect-ratio:auto}
.pn{width:clamp(280px,34vw,400px);flex:none;overflow-y:auto;overscroll-behavior:contain;padding:14px}
.livec{flex:none;padding:6px 12px 8px;margin:0}.lvs{gap:6px}.lv{padding:2px}.lv b{font-size:28px}.mrow{margin-top:4px}.meter{height:10px}
@media(min-width:1100px){.nm{display:inline}}
@media(orientation:portrait){.lay{flex-direction:column}.ba{flex:none;width:100%;height:min(100vw - 16px,50vh);height:min(100vw - 16px,50dvh)}.pn{width:100%;flex:1;min-height:0}}
@media(max-width:600px){.hs{display:none}.brand>span:last-child{display:none}#vol{display:none}.lv b{font-size:24px}.pn h2{font-size:21px}.top .b{padding:4px 10px}
.grid{grid-template-columns:1fr 1fr;gap:12px;padding-top:10px}.tc{padding:12px 10px 12px;border-bottom-width:7px}.tc p{font-size:12px}.tc .go{display:none}.tc .ic{width:56px;height:56px}.tc h3{font-size:17px}.tc .num{font-size:24px;right:10px}.tc .star{top:38px;right:10px}.hero .ps{width:90px;height:90px}}
@media(max-height:520px){nav{display:none}.top{padding:3px 10px}.top .b{min-height:34px}.brand>span:last-child{display:none}.lv{font-size:9px}.lv b{font-size:20px;display:inline;margin-right:4px}.mrow{display:none}html.in .app{padding:4px;gap:4px}html.in #topic{gap:4px}.pn{padding:8px;gap:8px}.msg{padding:6px}.pn h2{font-size:18px}}

.lvs{grid-template-columns:repeat(5,1fr)}.lv.p b{color:#8e7cf0}.lv #pct{min-width:0;text-align:center}.lv{font-size:11px;line-height:1.1}.lv b{font-size:24px;line-height:1.15}
.livec{padding:6px 10px 8px}.meter{height:7px;margin-top:5px}
@media(orientation:portrait){.ba{height:min(100vw - 16px,47vh);height:min(100vw - 16px,47dvh)}}
@media(max-height:520px){.ba{padding:3px}.lvs{gap:2px}.lv b{font-size:18px}.meter{display:none}.livec{padding:3px 8px}}
@media(max-width:600px){.lv b{font-size:21px}.lv{font-size:9px}}
@media(orientation:portrait) and (min-height:800px){.ba{height:min(100vw - 16px,55vh);height:min(100vw - 16px,55dvh)}}

.logo{display:flex;align-items:center;flex:none;background:#fff;border-radius:12px;padding:2px 8px;border:2px solid var(--bd)}.logo img{height:40px;width:auto;display:block}
html:not(.in) .logo img{height:50px}.top{flex-wrap:nowrap}
@media(max-width:600px){.logo img{height:30px}html:not(.in) .logo img{height:40px}html.in #theme{display:none}.top{gap:6px;padding:5px 8px}.acts{gap:5px}.top .b{min-width:42px;padding:4px 8px}}
@media(orientation:portrait){.lay{overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}.ba{position:sticky;top:0;z-index:5;height:min(100vw - 16px,44vh);height:min(100vw - 16px,44dvh)}.pn{flex:none;overflow:visible;min-height:auto}}
@media(orientation:portrait) and (min-height:800px){.ba{height:min(100vw - 16px,50vh);height:min(100vw - 16px,50dvh)}}
.g2 .b{font-size:14px;padding:4px 6px}
@media(max-width:600px){.top .b{min-width:38px}.logo{padding:2px 5px}.logo img{height:26px}}
</style></head><body>

if(ok){if(streak&&streak%5===0){snd('win');burst(1);banner(1,'🌟','Amazing! '+streak+' in a row!',1600)}else{snd('good');burst();banner(1,'✓',rnd(['Correct!','Great job!','Awesome!','Super!','Brilliant!']))}ret(bw,'glow')}
else{snd('bad');banner(0,'✕','Try again!');ret(bw,'shake')}}
function live(ks){const L=$('#live');L.hidden=!M.sc;if(!M.sc)return;
const v={a:st.a,c:st.c,i:st.i,s:streak},p=st.a?Math.round(st.c/st.a*100):0;
for(const q in v)L.querySelector('[data-k='+q+'] b').textContent=v[q];
$('#mt').style.width=p+'%';$('#pct').textContent=p+'%';
(ks||[]).forEach(k=>ret(L.querySelector('[data-k='+k+']'),'bump'))}
function hit(ok,big){st.a++;if(ok){st.c++;streak++;if(st.c>=5)done.add(cur)}else{st.i++;streak=0}live(['a',ok?'c':'i']);if(ok&&big)win();else feed(ok)}

/* Board drawing */
function draw(){const b=$('#bd');b.innerHTML='';
for(let r=0;r<8;r++)for(let c=0;c<8;c++){const fi=S.flip?7-c:c,rk=S.flip?r+1:8-r,sq=F[fi]+rk,d=document.createElement('div');
d.className='sq '+((fi+rk)%2?'d':'l')+' '+(S.mk[sq]||'');d.dataset.s=sq;
const p=S.pc[sq];if(p){d.innerHTML=SVG(p[0],p[1]);if(S.an[sq])d.firstChild.classList.add('pin')}
if(S.co==='all')d.innerHTML+='<i class="co" style="left:4px;top:3px">'+sq+'</i>';
else if(S.co==='edge'){if(r===7)d.innerHTML+='<i class="co" style="right:4px;bottom:2px">'+F[fi]+'</i>';if(c===0)d.innerHTML+='<i class="co" style="left:4px;top:2px">'+rk+'</i>'}
b.appendChild(d)}S.an={}}
function go(){draw();$('#pn').innerHTML=`<h2>${M.n}</h2><div class="mu">${M.d}</div>`+M.p();live()}
$('#bd').onclick=e=>{const s=e.target.closest('.sq');if(s&&M.c)M.c(s.dataset.s)};
$('#pn').onclick=e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled&&M.a)M.a(b.dataset.a,b.dataset.v)};
$('#flip').onclick=()=>{S.flip=!S.flip;draw()};
const vi=()=>{$('#snd').textContent=vol?'🔊':'🔇'};
$('#snd').onclick=()=>{vol=vol?0:1;$('#vol').value=vol;vi()};
$('#vol').oninput=e=>{vol=+e.target.value;vi()};$('#vol').onchange=()=>snd('move');
$('#theme').onclick=()=>{const r=document.documentElement,d=(r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))==='dark';r.dataset.theme=d?'light':'dark';$('#theme').textContent=d?'☾':'☀'};
document.addEventListener('pointerdown',e=>{if(e.target.closest('.b,.tc'))snd('click')});

/* Chess logic (FIDE): move generation + attacked squares */
const DIR={R:[[1,0],[-1,0],[0,1],[0,-1]],B:[[1,1],[1,-1],[-1,1],[-1,-1]]};DIR.Q=DIR.K=DIR.R.concat(DIR.B);
const JM=[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]],sqa=(x,y)=>x>=0&&x<8&&y>0&&y<9?F[x]+y:null;
function reach(t,sq,P,col,att){const f=F.indexOf(sq[0]),r=+sq[1],o=[],dr=col==='w'?1:-1;
if(t==='P'){if(att)[-1,1].forEach(d=>{const c=sqa(f+d,r+dr);c&&o.push(c)});
else{const a=sqa(f,r+dr);if(a&&!P[a]){o.push(a);const b=(col==='w'?r===2:r===7)&&sqa(f,r+2*dr);if(b&&!P[b])o.push(b)}[-1,1].forEach(d=>{const c=sqa(f+d,r+dr);if(c&&P[c]&&P[c][0]!==col)o.push(c)})}}
else if(t==='N')JM.forEach(([x,y])=>{const c=sqa(f+x,r+y);if(c&&(att||!(P[c]&&P[c][0]===col)))o.push(c)});
else DIR[t].forEach(([x,y])=>{for(let i=1;i<8;i++){const c=sqa(f+x*i,r+y*i);if(!c)break;if(P[c]){if(att||P[c][0]!==col)o.push(c);break}o.push(c);if(t==='K')break}});
return o}
function atk(P,by){const s=new Set();for(const q in P)if(P[q][0]===by)reach(P[q][1],q,P,by,1).forEach(x=>s.add(x));return s}
function legal(t,sq,P){let o=reach(t,sq,P,'w');if(t==='K'){const Q={...P};delete Q[sq];const a=atk(Q,'b');o=o.filter(x=>!a.has(x))}return o}
const DESC={K:'Moves one square in any direction — but NEVER onto a square the enemy attacks (that would be check!).',Q:'Moves any number of squares in a straight line or diagonal — rook and bishop combined.',R:'Moves any number of squares along ranks and files (straight lines).',B:'Moves any number of squares diagonally and stays on one colour for the whole game.',N:'Jumps in an L-shape: two squares one way, one sideways. The only piece that can jump over others.',P:'Moves forward one square (two from its starting square) and captures diagonally. Never moves backward.'};

const MODS=[
{n:'1 · Board Setup',d:'Place all 32 pieces in the starting position.',sc:1,
i(){rs();S.pc={};S.mk={};S.co='edge';this.sel='wK';this.msg='Pick a piece, then tap a square to place it.'},
p(){return `<div class="g6">${['w','b'].map(c=>[...T].map(t=>B('sel',c+t,PG(c,t),this.sel===c+t))).flat().join('')}</div>${B('sel','x','🧽 Eraser',this.sel==='x','w')}${MSG(this.msg)}<div class="g2">${B('check',0,'✅ Check setup','','p')}${B('fill',0,'👀 Show answer')}</div>${B('clear',0,'🗑️ Clear board','','w')}<ul class="t"><li>White pieces start on ranks 1–2, black on 7–8.</li><li>Rooks in the corners, then knights, bishops.</li><li>Queen goes on her own colour (white queen on a light square).</li><li>Light square in the bottom-right corner (h1).</li></ul>`},
a(a,v){if(a==='sel')this.sel=v;
if(a==='fill'){S.pc=start();S.mk={};this.msg='This is the starting position.';snd('move')}
if(a==='clear'){S.pc={};S.mk={};this.msg='Board cleared.'}
if(a==='check'){const s=start();let ok=0,bad=0;S.mk={};for(let i=0;i<8;i++)for(let r=1;r<9;r++){const q=F[i]+r,e=s[q],g=S.pc[q];if(e||g){if(e===g){ok++;S.mk[q]='ok'}else{bad++;S.mk[q]='bad'}}}
const perfect=!bad&&ok===32;this.msg=perfect?'🎉 Perfect setup!':`${ok} correct, ${bad} wrong or missing (red).`;hit(perfect,true)}
go()},
c(q){snd('move');S.mk={};if(this.sel==='x')delete S.pc[q];else{S.pc[q]=this.sel;S.an={[q]:1}}go()}},

{n:'2 · Identify Pieces',d:'Name the piece shown on the board.',sc:1,
i(){rs();this.on=0;S.pc={};S.co='edge'},
nx(){this.t=rnd(T);this.sq=rsq(this.sq);S.pc={[this.sq]:rnd('wb')+this.t};S.an={[this.sq]:1}},
p(){return `<div class="g3">${[...T].map(t=>`<button class="b" data-a="ans" data-v="${t}" ${this.on?'':'disabled'}>${PG('w',t)}${NM[t]}</button>`).join('')}</div>${B('s',0,this.on?'🔄 Restart':'▶ Start',0,'p w')}${MSG(this.on?'Which piece is this?':'Press Start')}`},
a(a,v){if(a==='s'){rs();this.on=1;this.nx()}
if(a==='ans'){if(v===this.t){hit(1);this.nx()}else hit(0)}go()}},

{n:'3 · Learn Coordinates',d:'Files a–h run left to right, ranks 1–8 bottom to top (from White\'s side). Tap any square.',
i(){S.pc=start();S.co='edge';this.sq=null},
p(){const s=this.sq,i=s?F.indexOf(s[0]):0;return `<div class="big">${s||'—'}</div>${MSG(s?`File ${s[0]} (column ${i+1}), rank ${s[1]} · ${(i+ +s[1])%2?'dark':'light'} square`:'Tap a square to see its name.')}<div class="g3">${B('co','none','Hidden',S.co==='none')}${B('co','edge','Edges',S.co==='edge')}${B('co','all','Every square',S.co==='all')}</div>${B('pcs',0,S.pc.a1?'Hide pieces':'Show pieces',0,'w')}<ul class="t"><li>Name = file letter + rank number, e.g. e4.</li><li>White's king starts on e1, black's on e8.</li><li>a1 is always a dark square.</li></ul>`},
a(a,v){if(a==='co')S.co=v;if(a==='pcs')S.pc=S.pc.a1?{}:start();go()},
c(q){snd('move');this.sq=q;S.mk={[q]:'sel'};go()}},

{n:'4 · Find the Square',d:'A coordinate appears — tap the matching square.',sc:1,
i(){rs();this.on=0;this.m=30;this.left=30;this.t=null;this.msg='';S.pc={};S.co='none'},
p(){return `<div class="g2">${B('m',30,'⏱ 30 sec',this.m===30)}${B('m',0,'∞ No limit',this.m===0)}</div><div class="big">${this.on?this.t:'—'}</div>${this.m?`<div class="mu c">Time left: <b id="tm">${this.left}</b>s</div>`:''}${MSG(this.msg||'Press Start')}${B('s',0,this.on?'🔄 Restart':'▶ Start training',0,'p w')}`},
a(a,v){if(a==='m'){this.m=+v;this.left=this.m;this.on=0;clearInterval(tm)}
if(a==='s'){rs();this.on=1;this.left=this.m;this.t=rsq();this.msg='Tap the square shown.';clearInterval(tm);if(this.m)tm=setInterval(()=>{this.left--;const e=$('#tm');if(e)e.textContent=this.left;if(this.left<=0){clearInterval(tm);this.on=0;this.msg=`Time's up! Score: ${st.c}`;if(st.c)win();go()}},1000)}
go()},
c(q){if(!this.on)return;if(q===this.t){hit(1);this.t=rsq(q)}else hit(0);go()}},

{n:'5 · Name the Square',d:'Name the highlighted square using the file and rank keys.',sc:1,
i(){rs();this.on=0;this.t=null;this.f=this.r=null;S.pc={};S.co='edge'},
p(){return `<div class="big">${(this.f||'')+(this.r||'')||'—'}</div><div class="mu">FILE</div><div class="g8">${[...F].map(x=>B('f',x,x,this.f===x)).join('')}</div><div class="mu">RANK</div><div class="g8">${[1,2,3,4,5,6,7,8].map(x=>B('r',x,x,this.r==x)).join('')}</div>${B('s',0,this.on?'🔄 Restart':'▶ Start training',0,'p w')}${B('tc',0,'Coordinates '+(S.co==='none'?'off':'on'),0,'w')}`},
a(a,v){if(a==='tc')S.co=S.co==='none'?'edge':'none';
if(a==='s'){rs();this.on=1;this.t=rsq();this.f=this.r=null;S.mk={[this.t]:'tgt'}}
if((a==='f'||a==='r')&&this.on){this[a]=v;if(this.f&&this.r){if(this.f+this.r===this.t){hit(1);this.t=rsq(this.t);S.mk={[this.t]:'tgt'}}else hit(0);this.f=this.r=null}}
go()}},

{n:'6 · Piece Points',d:'Learn how much each piece is worth, then test yourself.',sc:1,
i(){rs();this.q=null;S.co='edge';S.pc={};[...'PNBRQK'].forEach((t,k)=>S.pc[F[k+1]+4]='w'+t);this.info='Tap a piece on the board.'},
p(){return `<table>${[...'PNBRQK'].map(t=>`<tr><td>${PG('w',t)}</td><td>${NM[t]}</td><td>${VAL[t]}</td></tr>`).join('')}</table><ul class="t"><li>The king is priceless — losing it loses the game.</li><li>Bishop + knight (6) ≈ rook + pawn (6).</li><li>These points are a handy guide, not an official FIDE rule.</li></ul>${MSG(this.q?`How many points is the ${NM[this.q]}?`:this.info)}<div class="g6">${[1,3,5,9,'∞'].map(v=>`<button class="b" data-a="q" data-v="${v}" ${this.q?'':'disabled'}>${v}</button>`).join('')}</div><div class="g2">${B('s',0,'▶ Start quiz',0,'p')}${B('r',0,'Stop')}</div>`},
nx(){this.q=rnd(T);S.mk={['bcdefg'['PNBRQK'.indexOf(this.q)]+4]:'tgt'}},
a(a,v){if(a==='s'){rs();this.nx()}if(a==='r'){this.q=null;S.mk={}}
if(a==='q'){if(v===String(VAL[this.q])){hit(1);this.nx()}else hit(0)}go()},
c(q){if(this.q||!S.pc[q])return;const t=S.pc[q][1];this.info=`${NM[t]} = ${VAL[t]} point${VAL[t]===1?'':'s'}`;S.mk={[q]:'sel'};snd('move');go()}},

{n:'7 · Piece Movement',d:'Pick a piece, then tap a green dot to move it. A wrong tap costs a point!',sc:1,
i(){rs();this.t='N';this.dg=0;this.setup()},
setup(){const p=this.t==='P',pos=p?'e2':'d4';S.pc={[pos]:'w'+this.t};(p?['d3','f3']:['b6','f6','d7','e6']).forEach(x=>S.pc[x]='bP');this.pos=pos;S.co='edge';this.msg=DESC[this.t];this.mv()},
mv(){S.mk={};const add=(x,c)=>S.mk[x]=(S.mk[x]||'')+' '+c;
if(this.dg){const Q={...S.pc};delete Q[this.pos];atk(Q,'b').forEach(x=>add(x,'bad'))}
legal(this.t,this.pos,S.pc).forEach(x=>add(x,S.pc[x]?'cap':'dot'));add(this.pos,'sel');go()},
p(){return `<div class="g3">${[...T].map(t=>B('t',t,PG('w',t)+NM[t],this.t===t)).join('')}</div>${MSG(this.msg)}${B('dg',0,this.dg?'🙈 Hide danger squares':'⚠️ Show danger squares',this.dg,'w')}<ul class="t"><li>Green dots = legal moves.</li><li>Ring around a piece = you can capture it.</li><li>Red squares = attacked by black pawns. A king can never go there!</li></ul>${B('rst',0,'↺ Reset position',0,'w')}`},
a(a,v){if(a==='t')this.t=v;if(a==='dg'){this.dg=!this.dg;return this.mv()}this.setup()},
c(q){if(q===this.pos)return;const L=legal(this.t,this.pos,S.pc);
if(L.includes(q)){const cp=S.pc[q];delete S.pc[this.pos];S.pc[q]='w'+this.t;this.pos=q;S.an={[q]:1};snd(cp?'cap':'move');this.msg=cp?'Captured! 🎉':'Nice move!';hit(1);this.mv()}
else{const Q={...S.pc};delete Q[this.pos];const ill=this.t==='K'&&reach('K',this.pos,S.pc,'w').includes(q)&&atk(Q,'b').has(q);
this.msg=ill?'🚫 Illegal! A king may never move into check.':'❌ A '+NM[this.t]+' can’t move there.';hit(0);go()}}},

{n:'8 · Castling',d:'Move king and rook together — but only when FIDE rules allow it.',sc:1,
i(){rs();this.setup()},
setup(){S.pc=start();S.co='edge';S.mk={};this.mvd={w:0,b:0};this.sel=null;this.msg='Pieces are in the way! Press “Clear the way”, then tap a king or a castling button.'},
why(c,s){const r=c==='w'?1:8,k=s==='k',a=atk(S.pc,c==='w'?'b':'w');
if(this.mvd[c])return 'King and rook have already moved (castled).';
if(S.pc['e'+r]!==c+'K'||S.pc[(k?'h':'a')+r]!==c+'R')return 'King and rook must both be on their home squares.';
if((k?['f','g']:['b','c','d']).some(x=>S.pc[x+r]))return 'Pieces are standing between the king and rook.';
if(a.has('e'+r))return 'The king is in check — castling is not allowed.';
if((k?['f','g']:['d','c']).some(x=>a.has(x+r)))return 'The king would pass through or land on an attacked square.';return ''},
do(c,s){const r=c==='w'?1:8,k=s==='k',K=(k?'g':'c')+r,R=(k?'f':'d')+r;delete S.pc['e'+r];delete S.pc[(k?'h':'a')+r];S.pc[K]=c+'K';S.pc[R]=c+'R';this.mvd[c]=1;this.sel=null;S.mk={};S.an={[K]:1,[R]:1};this.msg=k?'Kingside castling (O-O): king to g, rook to f.':'Queenside castling (O-O-O): king to c, rook to d.';snd('move');hit(1,true)},
p(){return `${MSG(this.msg)}<div class="g2">${B('cs','wk','♔ White O-O')}${B('cs','wq','♔ White O-O-O')}</div><div class="g2">${B('cs','bk','♚ Black O-O')}${B('cs','bq','♚ Black O-O-O')}</div>${B('clr',0,'🧹 Clear the way',0,'p w')}<div class="g2">${B('dng',0,'⚠️ Attack demo')}${B('rst',0,'↺ Reset')}</div><ul class="t"><li>Neither the king nor that rook has moved before.</li><li>No pieces between the king and rook.</li><li>The king is not in check, does not pass over, and does not land on an attacked square.</li><li>King moves two squares toward the rook; the rook jumps to the other side.</li></ul>`},
a(a,v){if(a==='rst')return this.setup(),go();
if(a==='clr'){['w','b'].forEach(c=>{const r=c==='w'?1:8;[...'bcdfg'].forEach(x=>delete S.pc[x+r])});S.mk={};this.msg='Squares cleared. Now try to castle!'}
if(a==='dng'){this.setup();['w','b'].forEach(c=>{const r=c==='w'?1:8;[...'bcdfg'].forEach(x=>delete S.pc[x+r])});delete S.pc.f2;delete S.pc.f7;S.pc.f8='bR';S.mk={f8:'bad'};this.msg='A black rook now attacks the f-file. Try White O-O, then White O-O-O!'}
if(a==='cs'){const c=v[0],s=v[1],w=this.why(c,s);if(!w)return this.do(c,s),go();this.msg='❌ '+w;hit(0)}
go()},
c(q){const p=S.pc[q];
if(this.sel&&this.sel[q]){const c=q[1]==1?'w':'b';return this.do(c,this.sel[q]),go()}
if(p&&p[1]==='K'){const c=p[0],r=c==='w'?1:8,bad=[];S.mk={[q]:'sel'};this.sel={};
['k','q'].forEach(s=>{const w=this.why(c,s);if(w)bad.push(w);else{const g=(s==='k'?'g':'c')+r;this.sel[g]=s;S.mk[g]='dot'}});
this.msg=Object.keys(this.sel).length?'Tap a green dot to castle!':'Cannot castle: '+bad[0]}
else{S.mk={};this.sel=null}go()}}
];

function load(i){clearInterval(tm);cur=i;M=MODS[i];S.mk={};S.pc={};S.an={};S.co='edge';M.i();go()}
function home(){$('#prog').textContent='⭐ '+done.size+' / 8 stars';$('#grid').innerHTML=MODS.map((m,i)=>{const[a,b]=m.n.split(' · ');return `<a class="tc" href="#/${i+1}" style="--c:${TINT[i]}"><span class="num">${a}</span>${done.has(i)?'<span class="star">⭐</span>':''}<span class="ic">${PG('w',ICON[i])}</span><h3>${EMO[i]} ${b}</h3><p>${m.d}</p><span class="go">Let's go! ▶</span></a>`}).join('')}
function route(){const m=/^#\/([1-8])$/.exec(location.hash),t=!!m;clearInterval(tm);$('#home').hidden=t;$('#topic').hidden=!t;$('#flip').hidden=!t;$('#hm').hidden=!t;document.documentElement.classList.toggle('in',t);if(t)load(m[1]-1);else home();scrollTo(0,0)}
$('#mascot').innerHTML=PG('w','N');
$('#bgp').innerHTML=[...'KQRBNPKQRBNP'].map((t,i)=>`<div style="left:${(i*8.5+3)%96}%;top:${(i*29+7)%88}%;animation-delay:${i*.35}s">${SVG(i%2?'b':'w',t)}</div>`).join('');
addEventListener('hashchange',route);route();
})();
</script></body></html>
