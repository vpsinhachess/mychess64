<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0618"><title>CHESSA — MyChess64</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%99%9B%3C/text%3E%3C/svg%3E">
<style>
:root{--gold:#f5c65a;--cy:#5ee6ff;--pk:#ff7ad9;--line:#ffffff1a;--glass:#ffffff10}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;height:100dvh}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#f4f1ff;background:radial-gradient(1000px 600px at 20% -10%,#3b1d7a55,transparent),radial-gradient(900px 600px at 100% 100%,#0b4a6e55,transparent),#0a0618;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#fx i{position:absolute;bottom:-60px;font-style:normal;color:#ffffff10;animation:up linear infinite}
@keyframes up{to{transform:translateY(-115vh) rotate(40deg)}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.app{position:relative;height:100%;max-width:880px;margin:auto;display:flex;flex-direction:column}

/* header */
header{display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 14px 10px;position:relative;z-index:5}
header .mini{width:42px;height:42px;border-radius:50%;overflow:hidden;border:2px solid var(--gold);box-shadow:0 0 18px #f5c65a66;background:#1a0f3a;flex:none}
.nm{font-weight:900;letter-spacing:.18em;font-size:15px}
.nm small{display:block;font-size:9px;letter-spacing:.1em;color:#7ef0b4;font-weight:600}
.nm small::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#7ef0b4;margin-right:5px;vertical-align:1px;animation:pl2 2s infinite}
@keyframes pl2{50%{box-shadow:0 0 0 5px #7ef0b422}}
.sp{flex:1}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#ffffff0d;color:#fff;font-size:17px;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:.2s}
.ib:hover{background:#ffffff1c;transform:translateY(-1px)}
.ib:active{transform:scale(.92)}
.ib.on{border-color:var(--gold);box-shadow:0 0 14px #f5c65a55}

/* main */
main{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:6px 14px 20px;scroll-behavior:smooth;position:relative}
#hero{text-align:center;padding-top:2vh;transition:.5s}
body.chat #hero{display:none}
.stage{position:relative;width:min(250px,60vw);aspect-ratio:1;margin:auto}
.stage::before{content:"";position:absolute;inset:-8%;border-radius:50%;background:conic-gradient(from 0deg,var(--cy),var(--pk),var(--gold),var(--cy));filter:blur(22px);opacity:.55;animation:spin 8s linear infinite}
.stage::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #ffffff30}
.stage svg{position:relative;z-index:1;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 50% 30%,#3a2380,#120a2c);animation:fl 4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fl{50%{transform:translateY(-6px)}}
h1{margin:18px 0 4px;font-size:clamp(34px,9vw,52px);letter-spacing:.22em;font-weight:900;background:linear-gradient(90deg,#fff,var(--gold),var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent}
/* FIX: animated letters inside the gradient heading were invisible in some browsers */
h1 .c{-webkit-text-fill-color:var(--gold);color:var(--gold);text-shadow:0 0 22px #f5c65a66}
.tg{color:#b9afdc;font-size:14px;margin:0 0 20px}
#sug{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{border:1px solid #f5c65a55;background:#f5c65a12;color:#ffe4a3;border-radius:99px;padding:9px 14px;font-size:13px;cursor:pointer;transition:.2s;font-family:inherit}
.chip:hover{background:#f5c65a2a;transform:translateY(-2px);box-shadow:0 6px 18px #f5c65a30}
.chip:active{transform:scale(.96)}

/* messages */
.msg{display:flex;gap:9px;margin:14px 0;align-items:flex-end;animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.msg.user{justify-content:flex-end}
.av{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#ffe08a,#c98a1a);color:#2a1700;font-size:17px;box-shadow:0 0 12px #f5c65a55}
.bubble{max-width:88%;min-width:0;padding:13px 16px;border-radius:20px;line-height:1.65;font-size:15px;border:1px solid var(--line);overflow-wrap:anywhere}
.user .bubble{background:linear-gradient(135deg,#7c4dff,#4b2fc9);border-bottom-right-radius:6px;box-shadow:0 8px 24px #4b2fc955}
.bot .bubble{background:#ffffff0e;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom-left-radius:6px;box-shadow:0 8px 28px #0006,inset 0 0 0 1px #5ee6ff14}
.txt{white-space:pre-wrap}
.w{display:inline-block;white-space:nowrap}
.c{display:inline-block;opacity:0;animation:drop .5s cubic-bezier(.2,.9,.3,1.3) both;color:inherit}
@keyframes drop{0%{opacity:0;transform:translateY(-22px) rotate(-8deg);filter:blur(3px)}60%{opacity:1;color:var(--cy)}100%{opacity:1;transform:none;filter:none}}
.txt [style*=grid]{animation:in .8s both}

/* FIX: board size + display. Targets the 8-column grid your JS renders, on any screen */
.bubble:has([style*="repeat(8"]){width:min(100%,440px)}
.txt [style*="repeat(8"]{
  display:grid!important;width:100%!important;max-width:400px!important;height:auto!important;
  aspect-ratio:1/1;margin:12px auto 4px!important;border-radius:12px;overflow:hidden;
  grid-template-columns:repeat(8,1fr)!important;grid-template-rows:repeat(8,1fr)!important;
  box-shadow:0 10px 30px #0008,0 0 0 2px #f5c65a55;white-space:normal;
}
.txt [style*="repeat(8"]>*{
  min-width:0;min-height:0;width:auto!important;height:auto!important;display:grid;place-items:center;
  font-size:clamp(18px,7vw,38px)!important;line-height:1;user-select:none;
}

.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;opacity:0;animation:in .6s both}
.meta span{font-size:11px;color:#a99fd0;border:1px solid var(--line);border-radius:99px;padding:4px 9px}
.meta .rl{cursor:pointer;color:#ffe4a3;border-color:#f5c65a44;transition:.2s}
.meta .rl:hover{background:#f5c65a22}
.dots{display:flex;gap:5px;padding:6px 2px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--cy);animation:bn 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bn{50%{transform:translateY(-7px);opacity:.4}}

/* scroll-to-bottom */
#down{position:absolute;right:16px;bottom:128px;width:40px;height:40px;border-radius:50%;border:1px solid #f5c65a66;background:#1a0f3acc;color:var(--gold);font-size:18px;cursor:pointer;opacity:0;pointer-events:none;transform:translateY(8px);transition:.25s;z-index:6;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#down.show{opacity:1;pointer-events:auto;transform:none}

/* composer */
footer{padding:4px 12px max(14px,env(safe-area-inset-bottom));position:relative;z-index:5}
#qa{display:none;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
body.chat #qa{display:flex}
#qa::-webkit-scrollbar{display:none}
#qa .chip{flex:none;padding:7px 12px;font-size:12px;white-space:nowrap}
.cmp{display:flex;gap:6px;align-items:center;padding:6px;border-radius:30px;border:1px solid #ffffff26;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 10px 40px #0008;transition:.25s}
.cmp:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px #f5c65a22,0 10px 40px #0008}
#q{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font-size:16px;padding:10px 12px;font-family:inherit}
#q::placeholder{color:#a99fd0}
.cmp button{width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;font-size:18px;background:#ffffff14;color:#fff;transition:.2s;flex:none}
.cmp button:hover{background:#ffffff26}
.cmp button:active{transform:scale(.9)}
.cmp #send{background:linear-gradient(135deg,#ffe08a,#e0a12a);color:#241500;font-weight:900;box-shadow:0 4px 16px #f5c65a44}
.cmp #send:hover{filter:brightness(1.08)}
.cmp #send.idle{opacity:.45;box-shadow:none;filter:grayscale(.4)}
.cmp #mic.rec{background:#ff3b6b;animation:pl 1s infinite}
@keyframes pl{50%{box-shadow:0 0 0 8px #ff3b6b33}}
#xq{display:none;width:30px!important;height:30px!important;font-size:13px!important;background:#ffffff1c!important}
#xq.show{display:block}
#cnt{display:none;font-size:11px;color:#a99fd0;padding:0 4px}
#cnt.show{display:block}
#cnt.warn{color:#ff9aa8}
.hint{text-align:center;font-size:11px;color:#8d83b3;margin:7px 0 0}
@media(max-width:600px){.hint{display:none}}

/* chessa face */
.eye{transform-box:fill-box;transform-origin:center;animation:bl 4.5s infinite}
@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
.mo{display:none;transform-box:fill-box;transform-origin:center}
.talk .mo{display:block;animation:tk .28s infinite alternate}
.talk .sm{display:none}
@keyframes tk{from{transform:scaleY(.5)}to{transform:scaleY(2.6)}}
.glow{animation:gw 2.5s ease-in-out infinite alternate}
@keyframes gw{to{opacity:.55}}
::-webkit-scrollbar{width:0}

/* celebration toast */
#toast{position:fixed;left:50%;top:max(70px,env(safe-area-inset-top));transform:translate(-50%,-20px) scale(.9);padding:10px 20px;border-radius:99px;font-weight:800;letter-spacing:.04em;color:#241500;background:linear-gradient(135deg,#ffe08a,#f5a623);box-shadow:0 10px 40px #f5c65a88;opacity:0;pointer-events:none;transition:.4s cubic-bezier(.2,.9,.3,1.3);z-index:70}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}

/* accessibility: respect reduced motion (text must never stay invisible) */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .c{opacity:1}
}
</style></head><body>
<div id="fx" aria-hidden="true"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<div id="toast" role="status" aria-live="polite"></div>
<div class="app">
<header><div class="mini" id="mini"></div><div class="nm">CHESSA<small>ONLINE</small></div><div class="sp"></div><button class="ib on" id="vc" title="Voice on/off" aria-label="Toggle voice">🔊</button><button class="ib" id="clear" title="Clear chat" aria-label="Clear chat">✕</button></header>
<main id="main">
 <section id="hero"><div class="stage" id="big"></div><h1 id="t1">CHESSA</h1><p class="tg" id="t2">Ask me anything about chess</p><div id="sug"></div></section>
 <div id="chat" aria-live="polite"></div>
 <button id="down" aria-label="Scroll to latest message">↓</button>
</main>
<footer>
 <div id="qa" aria-label="Quick actions">
  <button class="chip" data-q="Give me a chess puzzle">🧩 Puzzle</button>
  <button class="chip" data-q="Teach me an opening">📖 Opening</button>
  <button class="chip" data-q="Explain a chess tactic">⚔️ Tactic</button>
  <button class="chip" data-q="Explain the rules of chess">📜 Rules</button>
  <button class="chip" data-q="Give me an endgame tip">🏁 Endgame</button>
  <button class="chip" data-q="शतरंज के नियम बताओ">🇮🇳 हिंदी</button>
 </div>
 <div class="cmp">
  <input id="q" maxlength="700" placeholder="Ask CHESSA…" autocomplete="off" enterkeyhint="send" aria-label="Message CHESSA">
  <span id="cnt"></span>
  <button id="xq" title="Clear text" aria-label="Clear text">✕</button>
  <button id="mic" title="Speak" aria-label="Speak">🎤</button>
  <button id="send" class="idle" title="Send" aria-label="Send">➤</button>
 </div>
 <p class="hint">Press <b>/</b> to focus · <b>Enter</b> to send · <b>Esc</b> to clear</p>
</footer>
</div>
<noscript><p style="position:fixed;inset:auto 0 50% 0;text-align:center;color:#ffe4a3">CHESSA needs JavaScript enabled.</p></noscript>

<script src="js/core.js"></script>
<script src="data/kb-data.js"></script>
<script src="data/kb-extra.js"></script>
<script src="data/manifest.js"></script>
<script src="data/puzzles.js"></script>
<script src="js/kb.js"></script>
<script src="js/app.js"></script>
<script src="js/knowledge.js"></script>
<script src="js/live.js"></script>
<script src="js/hindi.js"></script>
<script src="js/learn.js"></script>
<script src="js/puzzles.js"></script>
<script src="js/engine.js"></script>
<script src="js/wiki.js"></script>
<script src="js/tutor.js"></script>
<script src="js/ui.js"></script>

<!-- UI enhancements: non-invasive, never touches your app logic -->
<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var q=$('#q'),send=$('#send'),xq=$('#xq'),cnt=$('#cnt'),mic=$('#mic'),main=$('#main'),chat=$('#chat'),down=$('#down'),fx=$('#fx');
  var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

  /* FIX: hide mic when speech recognition is unsupported (e.g. Firefox) */
  if(!('SpeechRecognition' in window||'webkitSpeechRecognition' in window)) mic.style.display='none';

  /* FIX: floating chess glyph background if none were created */
  if(!fx.children.length){
    var g='♟♞♝♜♛♚',i;
    for(i=0;i<14;i++){var e=document.createElement('i');e.textContent=g[i%6];
      e.style.cssText='left:'+(Math.random()*100)+'%;font-size:'+(24+Math.random()*40)+'px;animation-duration:'+(18+Math.random()*22)+'s;animation-delay:-'+(Math.random()*30)+'s';
      fx.appendChild(e);}
  }

  /* composer state: send button idle when empty, clear button, counter */
  function sync(){
    var n=q.value.length;
    send.classList.toggle('idle',!q.value.trim());
    xq.classList.toggle('show',n>0);
    var show=n>560;cnt.classList.toggle('show',show);cnt.classList.toggle('warn',n>660);
    cnt.textContent=(700-n);
  }
  q.addEventListener('input',sync);
  setInterval(sync,300); // catches programmatic clears after sending
  xq.addEventListener('click',function(){q.value='';sync();q.focus()});

  /* keyboard shortcuts */
  document.addEventListener('keydown',function(e){
    var typing=/^(INPUT|TEXTAREA)$/.test((document.activeElement||{}).tagName);
    if(e.key==='/'&&!typing){e.preventDefault();q.focus()}
    else if(e.key==='Escape'){q.value='';sync();q.blur()}
  });

  /* quick action chips */
  document.querySelectorAll('#qa .chip').forEach(function(b){
    b.addEventListener('click',function(){
      q.value=b.getAttribute('data-q');
      q.dispatchEvent(new Event('input',{bubbles:true}));
      send.click();
    });
  });

  /* scroll-to-bottom button + auto scroll */
  function atBottom(){return main.scrollHeight-main.scrollTop-main.clientHeight<140}
  main.addEventListener('scroll',function(){down.classList.toggle('show',!atBottom())});
  down.addEventListener('click',function(){main.scrollTo({top:main.scrollHeight,behavior:'smooth'})});

  /* ===== celebration: canvas confetti with chess pieces ===== */
  var cv=$('#confetti'),ctx=cv.getContext('2d'),parts=[],run=false;
  function size(){var d=window.devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0)}
  size();addEventListener('resize',size);
  var cols=['#f5c65a','#5ee6ff','#ff7ad9','#7ef0b4','#ffffff','#a78bfa'],glyphs=['♛','♞','♟','♜','♝','★'];
  function burst(x,y,n,spread){
    for(var i=0;i<n;i++){
      var a=-Math.PI/2+(Math.random()-.5)*spread,v=7+Math.random()*10;
      parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:Math.random()*6,vr:(Math.random()-.5)*.3,
        s:6+Math.random()*8,c:cols[(Math.random()*cols.length)|0],
        g:Math.random()<.22?glyphs[(Math.random()*glyphs.length)|0]:null,life:0});
    }
  }
  function tick(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    parts=parts.filter(function(p){return p.y<innerHeight+30&&p.life<260});
    parts.forEach(function(p){
      p.vy+=.28;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life++;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);
      ctx.globalAlpha=Math.max(0,1-p.life/260);ctx.fillStyle=p.c;
      if(p.g){ctx.font=(p.s*2.2)+'px serif';ctx.fillText(p.g,-p.s,p.s)}
      else ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);
      ctx.restore();
    });
    if(parts.length)requestAnimationFrame(tick);else{run=false;ctx.clearRect(0,0,innerWidth,innerHeight)}
  }
  var tt;
  window.celebrate=function(msg){
    if(!reduce){
      var w=innerWidth,h=innerHeight;
      burst(w/2,h*.65,110,2.4);
      setTimeout(function(){burst(w*.12,h*.85,70,1.1);burst(w*.88,h*.85,70,1.1)},180);
      setTimeout(function(){burst(w/2,h*.5,60,3)},420);
      if(!run){run=true;requestAnimationFrame(tick)}
    }
    var t=$('#toast');t.textContent=msg||'🏆 Brilliant!';t.classList.add('show');
    clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show')},2200);
  };

  /* auto-celebrate when CHESSA confirms a win (puzzle solved, correct answer, etc.) */
  var seen=new WeakSet(),re=/(🎉|🏆|🥳|congratulations|well done|correct!|that'?s right|puzzle solved|you solved|brilliant move|excellent!|checkmate!? you win|शाबाश|बधाई)/i;
  new MutationObserver(function(list){
    list.forEach(function(m){
      m.addedNodes.forEach(function(n){
        if(n.nodeType!==1)return;
        var msg=n.matches&&n.matches('.msg.bot')?n:(n.closest&&n.closest('.msg.bot'));
        if(msg&&!seen.has(msg)){
          seen.add(msg);
          setTimeout(function(){
            if(re.test(msg.textContent||''))window.celebrate('🏆 Well played!');
          },700);
        }
      });
    });
    if(atBottom())main.scrollTo({top:main.scrollHeight});
  }).observe(chat,{childList:true,subtree:true});

  sync();
})();
</script>
</body></html>
