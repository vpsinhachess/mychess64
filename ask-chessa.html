<style>
:root{--gold:#f5c65a;--cy:#5ee6ff;--pk:#ff7ad9;--line:#ffffff1a}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#f4f1ff;background:radial-gradient(1000px 600px at 20% -10%,#3b1d7a55,transparent),radial-gradient(900px 600px at 100% 100%,#0b4a6e55,transparent),#0a0618;overflow:hidden}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#fx i{position:absolute;bottom:-60px;font-style:normal;color:#ffffff10;animation:up linear infinite}
@keyframes up{to{transform:translateY(-115vh) rotate(40deg)}}
.app{position:relative;height:100%;max-width:880px;margin:auto;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 14px 10px}
header .mini{width:42px;height:42px;border-radius:50%;overflow:hidden;border:2px solid var(--gold);box-shadow:0 0 18px #f5c65a66;background:#1a0f3a}
.nm{font-weight:900;letter-spacing:.18em;font-size:15px}.nm small{display:block;font-size:9px;letter-spacing:.1em;color:#7ef0b4;font-weight:600}
.sp{flex:1}.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#ffffff0d;color:#fff;font-size:17px;cursor:pointer;backdrop-filter:blur(8px)}
.ib.on{border-color:var(--gold);box-shadow:0 0 14px #f5c65a55}
main{flex:1;overflow:auto;padding:6px 14px 20px;scroll-behavior:smooth}
#hero{text-align:center;padding-top:2vh;transition:.5s}body.chat #hero{display:none}
.stage{position:relative;width:min(250px,60vw);aspect-ratio:1;margin:auto}
.stage::before{content:"";position:absolute;inset:-8%;border-radius:50%;background:conic-gradient(from 0deg,var(--cy),var(--pk),var(--gold),var(--cy));filter:blur(22px);opacity:.55;animation:spin 8s linear infinite}
.stage::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #ffffff30}
.stage svg{position:relative;z-index:1;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 50% 30%,#3a2380,#120a2c);animation:fl 4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes fl{50%{transform:translateY(-6px)}}
h1{margin:18px 0 4px;font-size:clamp(34px,9vw,52px);letter-spacing:.22em;font-weight:900;background:linear-gradient(90deg,#fff,var(--gold),var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent}
h1 .c{-webkit-text-fill-color:transparent}
.tg{color:#b9afdc;font-size:14px;margin:0 0 20px}
#sug{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{border:1px solid #f5c65a55;background:#f5c65a12;color:#ffe4a3;border-radius:99px;padding:9px 14px;font-size:13px;cursor:pointer;transition:.2s}
.chip:hover{background:#f5c65a2a;transform:translateY(-2px);box-shadow:0 6px 18px #f5c65a30}
.msg{display:flex;gap:9px;margin:14px 0;align-items:flex-end;animation:in .35s ease both}@keyframes in{from{opacity:0;transform:translateY(10px) scale(.97)}}
.msg.user{justify-content:flex-end}.av{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#ffe08a,#c98a1a);color:#2a1700;font-size:17px;box-shadow:0 0 12px #f5c65a55}
.bubble{max-width:88%;padding:13px 16px;border-radius:20px;line-height:1.65;font-size:15px;border:1px solid var(--line)}
.user .bubble{background:linear-gradient(135deg,#7c4dff,#4b2fc9);border-bottom-right-radius:6px;box-shadow:0 8px 24px #4b2fc955}
.bot .bubble{background:#ffffff0e;backdrop-filter:blur(14px);border-bottom-left-radius:6px;box-shadow:0 8px 28px #0006,inset 0 0 0 1px #5ee6ff14}
.txt{white-space:pre-wrap}.w{display:inline-block;white-space:nowrap}
.c{display:inline-block;opacity:0;animation:drop .5s cubic-bezier(.2,.9,.3,1.3) both;color:inherit}
@keyframes drop{0%{opacity:0;transform:translateY(-22px) rotate(-8deg);filter:blur(3px)}60%{opacity:1;color:var(--cy)}100%{opacity:1;transform:none;filter:none}}
.txt [style*=grid]{animation:in .8s both}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;opacity:0;animation:in .6s both}
.meta span{font-size:11px;color:#a99fd0;border:1px solid var(--line);border-radius:99px;padding:4px 9px}
.meta .rl{cursor:pointer;color:#ffe4a3;border-color:#f5c65a44}.meta .rl:hover{background:#f5c65a22}
.dots{display:flex;gap:5px;padding:6px 2px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--cy);animation:bn 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bn{50%{transform:translateY(-7px);opacity:.4}}
footer{padding:8px 12px max(14px,env(safe-area-inset-bottom))}
.cmp{display:flex;gap:8px;align-items:center;padding:6px;border-radius:30px;border:1px solid #ffffff26;background:#ffffff10;backdrop-filter:blur(16px);box-shadow:0 10px 40px #0008}
.cmp:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px #f5c65a22,0 10px 40px #0008}
#q{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font-size:16px;padding:10px 12px}
.cmp button{width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;font-size:18px;background:#ffffff14;color:#fff}
.cmp #send{background:linear-gradient(135deg,#ffe08a,#e0a12a);color:#241500;font-weight:900}.cmp #mic.rec{background:#ff3b6b;animation:pl 1s infinite}
@keyframes pl{50%{box-shadow:0 0 0 8px #ff3b6b33}}
.eye{transform-box:fill-box;transform-origin:center;animation:bl 4.5s infinite}@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
.mo{display:none;transform-box:fill-box;transform-origin:center}.talk .mo{display:block;animation:tk .28s infinite alternate}.talk .sm{display:none}@keyframes tk{from{transform:scaleY(.5)}to{transform:scaleY(2.6)}}
.glow{animation:gw 2.5s ease-in-out infinite alternate}@keyframes gw{to{opacity:.55}}
::-webkit-scrollbar{width:0}
</style></head><body>

<script>
const AV='<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a5cff"/><stop offset="1" stop-color="#3a1a8f"/></linearGradient><linearGradient id="gd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a0"/><stop offset="1" stop-color="#d9981f"/></linearGradient><radialGradient id="ey" cx=".4" cy=".35"><stop offset="0" stop-color="#d8fbff"/><stop offset=".55" stop-color="#3fd7ff"/><stop offset="1" stop-color="#1b6bff"/></radialGradient></defs><path d="M36 125C22 62 58 14 100 14s78 48 64 111c-4 22-10 42-22 56H58c-12-14-18-34-22-56z" fill="url(#hg)"/><path d="M36 200c0-34 26-46 64-46s64 12 64 46z" fill="#1d1250"/><path d="M70 160l30 26 30-26" stroke="url(#gd)" stroke-width="5" fill="none" stroke-linejoin="round"/><circle cx="100" cy="186" r="5" fill="#5ee6ff" class="glow"/><rect x="89" y="136" width="22" height="28" rx="9" fill="#e8bfa8"/><ellipse cx="100" cy="102" rx="40" ry="46" fill="#f9dfcd"/><path d="M56 96c8-36 36-44 48-44 18 0 36 12 40 44-14-20-32-24-48-22-16 2-30 8-40 22z" fill="url(#hg)"/><path d="M62 70l-16 44M138 70l16 44" stroke="#5ee6ff" stroke-width="2" opacity=".6" class="glow"/><g class="eye"><ellipse cx="82" cy="106" rx="9" ry="11" fill="url(#ey)"/><circle cx="85" cy="102" r="3" fill="#fff"/></g><g class="eye"><ellipse cx="118" cy="106" rx="9" ry="11" fill="url(#ey)"/><circle cx="121" cy="102" r="3" fill="#fff"/></g><path d="M71 92q10-6 20-1M109 91q10-5 20 1" stroke="#4a2a8f" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="72" cy="124" r="6" fill="#ff7ad9" opacity=".3"/><circle cx="128" cy="124" r="6" fill="#ff7ad9" opacity=".3"/><path class="sm" d="M90 127q10 8 20 0" stroke="#c0405f" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse class="mo" cx="100" cy="128" rx="7" ry="2.4" fill="#b8324f"/><path d="M68 46l8-24 14 14 10-22 10 22 14-14 8 24z" fill="url(#gd)" stroke="#a8700f" stroke-width="1.5" stroke-linejoin="round"/><circle cx="76" cy="21" r="3.5" fill="#fff"/><circle cx="100" cy="12" r="4" fill="#fff"/><circle cx="124" cy="21" r="3.5" fill="#fff"/><circle cx="100" cy="62" r="4.5" fill="#ff7ad9" class="glow"/></svg>';
const DB=[{"topic": "FIDE Rules", "title": "Castling", "key": "castling", "answer": "Castling is a special king-and-rook move. The king moves two squares toward the rook and the rook moves to the square next to the king. It is legal only if the king and that rook have not moved, the squares between them are empty, the king is not currently in check, and the king does not pass through or finish on an attacked square.", "ref": "FIDE Laws of Chess"}, {"topic": "FIDE Rules", "title": "En passant", "key": "en passant", "answer": "En passant is a special pawn capture. If an enemy pawn advances two squares from its original square and lands beside your pawn, your pawn may capture it as though the enemy pawn had moved one square. The capture must be made immediately on the following move.", "ref": "FIDE Laws of Chess"}, {"topic": "FIDE Rules", "title": "Check", "key": "check", "answer": "A king is in check when it is attacked by one or more enemy pieces. The player in check must make a legal move that removes the check.", "ref": "FIDE Laws of Chess"}, {"topic": "FIDE Rules", "title": "Checkmate", "key": "checkmate", "answer": "Checkmate occurs when a king is in check and there is no legal move that removes the attack. The game ends immediately.", "ref": "FIDE Laws of Chess"}, {"topic": "FIDE Rules", "title": "Stalemate", "key": "stalemate", "answer": "Stalemate occurs when the player to move has no legal move and the king is not in check. The result is a draw.", "ref": "FIDE Laws of Chess"}, {"topic": "FIDE Rules", "title": "Dead position", "key": "dead position", "answer": "A dead position is one in which neither player can checkmate the opponent by any possible series of legal moves. Under the Laws of Chess, the game is drawn.", "ref": "FIDE Laws of Chess"}, {"topic": "FIDE Rules", "title": "Promotion", "key": "promotion", "answer": "When a pawn reaches the farthest rank, it must be exchanged for a queen, rook, bishop or knight of the same color. The choice is not restricted to captured pieces.", "ref": "FIDE Laws of Chess"}, {"topic": "FIDE Rules", "title": "Touch-move", "key": "touch move", "answer": "In over-the-board chess, deliberately touching your own piece normally creates an obligation to move it if it has a legal move. Touching an opponent's piece normally creates an obligation to capture it if legal, subject to the Laws and event regulations.", "ref": "FIDE Laws of Chess"}, {"topic": "FIDE Rules", "title": "Illegal move", "key": "illegal move", "answer": "A move is illegal if it violates the Laws of Chess, for example by leaving the moving player's king in check. Tournament penalties depend on the applicable competition regulations.", "ref": "FIDE Laws of Chess"}, {"topic": "FIDE Rules", "title": "Threefold repetition", "key": "threefold repetition", "answer": "A draw may be claimed when the same position has occurred at least three times with the same player to move and the same possible moves and rights. The exact claim procedure matters in tournament play.", "ref": "FIDE Laws of Chess"}, {"topic": "FIDE Rules", "title": "Fifty-move rule", "key": "fifty move rule", "answer": "A player may claim a draw after each player has made at least 50 consecutive moves without a pawn move or capture, subject to the applicable claim procedure.", "ref": "FIDE Laws of Chess"}, {"topic": "FIDE Rules", "title": "Draw by agreement", "key": "draw agreement", "answer": "Players may agree to a draw according to the Laws and event regulations. A draw agreement should follow the tournament's permitted procedure.", "ref": "FIDE Laws of Chess"}, {"topic": "FIDE Rules", "title": "Resignation", "key": "resignation", "answer": "A player may resign, normally by clearly indicating resignation. The game then ends with the opponent as winner, provided the event rules recognize the resignation.", "ref": "FIDE Laws of Chess"}, {"topic": "FIDE Rules", "title": "Piece movement", "key": "piece movement", "answer": "Each chess piece has a defined movement: king one square, queen along ranks/files/diagonals, rook along ranks/files, bishop diagonally, knight in an L-shape, and pawns forward with captures diagonally.", "ref": "FIDE Laws of Chess"}, {"topic": "FIDE Rules", "title": "King capture", "key": "king capture", "answer": "Kings are never actually captured. A legal position can never leave a king in check after a completed move. A move that would expose your king to attack is illegal.", "ref": "FIDE Laws of Chess"}, {"topic": "FIDE Rules", "title": "Castling through check", "key": "castle through check", "answer": "You cannot castle out of check, through an attacked square, or into check. The king's starting, crossing and destination squares are therefore critical.", "ref": "FIDE Laws of Chess"}, {"topic": "FIDE Rules", "title": "Chess clock", "key": "chess clock", "answer": "In timed chess, each player's clock records their remaining time. A player normally presses the clock after completing their move, transferring the running time to the opponent according to the event's time-control rules.", "ref": "FIDE Laws of Chess"}, {"topic": "FIDE Rules", "title": "Time forfeit", "key": "flag fall", "answer": "When a player's allotted time expires, the result is normally a loss on time unless the applicable Laws and position make the opponent unable to checkmate by any possible legal series of moves.", "ref": "FIDE Laws of Chess"}, {"topic": "Opening Theory", "title": "Develop pieces", "key": "development", "answer": "Develop your knights and bishops toward useful squares, usually while competing for the center. Avoid spending many tempi moving the same piece without a concrete reason.", "ref": "Opening Fundamentals"}, {"topic": "Opening Theory", "title": "Control the center", "key": "center", "answer": "The center gives pieces mobility and supports pawn breaks. Control it with pawns and pieces, either directly or from a distance.", "ref": "Opening Fundamentals"}, {"topic": "Opening Theory", "title": "King safety", "key": "king safety", "answer": "King safety is a central opening priority. Castling often achieves safety and rook connection, but the best timing depends on the position.", "ref": "Opening Fundamentals"}, {"topic": "Opening Theory", "title": "Avoid unnecessary pawn moves", "key": "pawn moves", "answer": "Every pawn move changes the structure and does not develop a piece. Make pawn moves when they control the center, create a useful square, support development or prepare a concrete plan.", "ref": "Opening Fundamentals"}, {"topic": "Opening Theory", "title": "Do not bring the queen out too early", "key": "early queen", "answer": "An early queen move can allow the opponent to gain tempi by developing with attacks. Bring the queen out early only when there is a concrete benefit.", "ref": "Opening Fundamentals"}, {"topic": "Opening Theory", "title": "Connect the rooks", "key": "connect rooks", "answer": "Once the minor pieces and queen have developed and the king is safe, the rooks become connected. This usually indicates healthy opening development.", "ref": "Opening Fundamentals"}, {"topic": "Opening Theory", "title": "Development versus material", "key": "opening material", "answer": "In the opening, development and king safety can be more valuable than grabbing a pawn. Material gains should be checked against tactical and positional consequences.", "ref": "Opening Fundamentals"}, {"topic": "Opening Theory", "title": "Opening traps", "key": "opening trap", "answer": "An opening trap is a short tactical sequence that punishes a specific mistake. Strong players should learn the idea behind the trap rather than rely on opponents falling into it.", "ref": "Opening Fundamentals"}, {"topic": "Opening Theory", "title": "Tempo", "key": "opening tempo", "answer": "A tempo is a useful move or unit of time. A move that develops a piece while creating a threat can gain a tempo by forcing a response.", "ref": "Opening Fundamentals"}, {"topic": "Opening Theory", "title": "Opening preparation", "key": "opening preparation", "answer": "Good preparation includes understanding typical plans, pawn structures, tactical motifs and critical variations. Memorizing moves without understanding makes the repertoire fragile.", "ref": "Opening Fundamentals"}, {"topic": "Opening Theory", "title": "London System", "key": "london system", "answer": "The London System is a solid White setup commonly involving d4, Nf3, Bf4, e3 and a stable central structure. Typical plans include development, castling, c3 or c4 depending on the position, and pressure on the kingside or center.", "ref": "Opening"}, {"topic": "Opening Theory", "title": "Ruy Lopez", "key": "ruy lopez", "answer": "The Ruy Lopez begins 1.e4 e5 2.Nf3 Nc6 3.Bb5. White puts pressure on the c6-knight and e5 center and often seeks long-term strategic pressure.", "ref": "Opening"}, {"topic": "Opening Theory", "title": "Italian Game", "key": "italian game", "answer": "The Italian Game begins 1.e4 e5 2.Nf3 Nc6 3.Bc4. It often leads to rapid development, central tension and kingside attacking ideas.", "ref": "Opening"}, {"topic": "Opening Theory", "title": "Sicilian Defense", "key": "sicilian defense", "answer": "The Sicilian Defense begins 1.e4 c5. Black creates an asymmetrical position and fights for the center from the flank, often producing dynamic play.", "ref": "Opening"}, {"topic": "Opening Theory", "title": "French Defense", "key": "french defense", "answer": "The French Defense begins 1.e4 e6 and normally follows with ...d5. Black challenges White's center and accepts characteristic pawn-chain structures.", "ref": "Opening"}, {"topic": "Opening Theory", "title": "Caro-Kann Defense", "key": "caro kann", "answer": "The Caro-Kann begins 1.e4 c6, preparing ...d5. It is known for a solid structure and generally sound development.", "ref": "Opening"}, {"topic": "Opening Theory", "title": "Queen's Gambit", "key": "queen gambit", "answer": "The Queen's Gambit begins 1.d4 d5 2.c4. White challenges the d5-pawn and seeks central influence and development.", "ref": "Opening"}, {"topic": "Opening Theory", "title": "Queen's Gambit Declined", "key": "queen gambit declined", "answer": "In the Queen's Gambit Declined, Black responds to 1.d4 d5 2.c4 with ...e6, maintaining a strong central pawn structure while accepting some spatial pressure.", "ref": "Opening"}, {"topic": "Opening Theory", "title": "Queen's Gambit Accepted", "key": "queen gambit accepted", "answer": "The Queen's Gambit Accepted begins 1.d4 d5 2.c4 dxc4. Black temporarily takes the pawn and aims for development and central counterplay.", "ref": "Opening"}, {"topic": "Opening Theory", "title": "Nimzo-Indian Defense", "key": "nimzo indian", "answer": "The Nimzo-Indian begins 1.d4 Nf6 2.c4 e6 3.Nc3 Bb4. Black pins the knight and pressures White's center, often accepting structural concessions for activity.", "ref": "Opening"}, {"topic": "Opening Theory", "title": "King's Indian Defense", "key": "kings indian", "answer": "The King's Indian commonly arises after 1.d4 Nf6 2.c4 g6 3.Nc3 Bg7. Black allows White a broad center and seeks dynamic counterplay with ...e5 or ...c5.", "ref": "Opening"}, {"topic": "Opening Theory", "title": "English Opening", "key": "english opening", "answer": "The English Opening begins 1.c4. White controls central and queenside squares from the flank and can transpose into many structures.", "ref": "Opening"}, {"topic": "Opening Theory", "title": "Scotch Game", "key": "scotch game", "answer": "The Scotch Game begins 1.e4 e5 2.Nf3 Nc6 3.d4. White immediately challenges the e5 center and often obtains active piece play.", "ref": "Opening"}, {"topic": "Opening Theory", "title": "Vienna Game", "key": "vienna game", "answer": "The Vienna Game begins 1.e4 e5 2.Nc3. White develops the knight to support central ideas and can choose aggressive or positional setups.", "ref": "Opening"}, {"topic": "Opening Theory", "title": "Pirc Defense", "key": "pirc defense", "answer": "The Pirc begins 1.e4 d6 2.d4 Nf6 3.Nc3 g6. Black allows White a large center and attacks it with pieces and pawn breaks.", "ref": "Opening"}, {"topic": "Opening Theory", "title": "Modern Defense", "key": "modern defense", "answer": "The Modern Defense uses an early ...g6 and fianchetto idea while allowing White central occupation. Black intends to challenge the center later.", "ref": "Opening"}, {"topic": "Opening Theory", "title": "Grünfeld Defense", "key": "grunfeld defense", "answer": "The Grünfeld commonly begins 1.d4 Nf6 2.c4 g6 3.Nc3 d5. Black challenges White's center directly and often accepts a temporary pawn center for dynamic counterplay.", "ref": "Opening"}, {"topic": "Tactics", "title": "Fork", "key": "fork", "answer": "A fork is a tactic in which one piece attacks two or more targets simultaneously. Knights are famous for forks, but any piece can fork.", "ref": "Tactics"}, {"topic": "Tactics", "title": "Pin", "key": "pin", "answer": "A pin occurs when moving a piece would expose a more valuable piece behind it. An absolute pin involves the king; a relative pin involves another valuable target.", "ref": "Tactics"}, {"topic": "Tactics", "title": "Skewer", "key": "skewer", "answer": "A skewer attacks a valuable piece first, forcing it to move and exposing a less valuable target behind it. It is often described as the reverse geometry of a pin.", "ref": "Tactics"}, {"topic": "Tactics", "title": "Discovered attack", "key": "discovered attack", "answer": "A discovered attack happens when a moving piece uncovers an attack by another piece. A discovered check is the special case where the revealed attack checks the king.", "ref": "Tactics"}, {"topic": "Tactics", "title": "Double check", "key": "double check", "answer": "Double check means the king is attacked by two pieces at once. Because blocking one line cannot normally stop the other attack, the king generally has to move.", "ref": "Tactics"}, {"topic": "Tactics", "title": "Zwischenzug", "key": "zwischenzug", "answer": "Zwischenzug, or an intermediate move, inserts a forcing move before an expected recapture. Checks and tactical threats are common intermediate moves.", "ref": "Tactics"}, {"topic": "Tactics", "title": "Deflection", "key": "deflection", "answer": "Deflection forces a defending piece away from an important square or duty so that another target becomes vulnerable.", "ref": "Tactics"}, {"topic": "Tactics", "title": "Decoy", "key": "decoy", "answer": "A decoy lures an enemy piece onto a particular square where it can be exploited by a tactical combination.", "ref": "Tactics"}, {"topic": "Tactics", "title": "Removal of defender", "key": "removal defender", "answer": "Remove or distract a key defender before capturing or attacking the target it protects.", "ref": "Tactics"}, {"topic": "Tactics", "title": "Overloading", "key": "overloading", "answer": "An overloaded piece has too many defensive jobs. A tactical sequence can force it to abandon one duty and allow another target to fall.", "ref": "Tactics"}, {"topic": "Tactics", "title": "Interference", "key": "interference", "answer": "Interference blocks or disrupts a line between an enemy piece and the piece or square it protects.", "ref": "Tactics"}, {"topic": "Tactics", "title": "Clearance", "key": "clearance", "answer": "A clearance move vacates a square, file, rank or diagonal so another piece can use it for an attack or combination.", "ref": "Tactics"}, {"topic": "Tactics", "title": "Back-rank mate", "key": "back rank mate", "answer": "A back-rank mate often occurs when a king is trapped behind its own pawns and a rook or queen gives check along the back rank.", "ref": "Tactics"}, {"topic": "Tactics", "title": "Smothered mate", "key": "smothered mate", "answer": "A smothered mate occurs when a king is surrounded by its own pieces and a knight delivers checkmate.", "ref": "Tactics"}, {"topic": "Tactics", "title": "Greek Gift", "key": "greek gift", "answer": "The Greek Gift is a classic bishop sacrifice on h7 or h2, often followed by Ng5, Qh5 or related attacking ideas. It works only when the attacking pieces and king position justify it.", "ref": "Tactical pattern"}, {"topic": "Tactics", "title": "Deflection versus decoy", "key": "deflection decoy", "answer": "Deflection moves a defender away from its duty; a decoy lures a piece to a particular square. Both manipulate the location of a piece to enable tactics.", "ref": "Tactics"}, {"topic": "Middlegame", "title": "Candidate moves", "key": "candidate moves", "answer": "When choosing a move, first consider forcing moves—checks, captures and direct threats. Then consider improving pieces, pawn breaks, prophylaxis and strategic plans.", "ref": "Calculation"}, {"topic": "Middlegame", "title": "Checks captures threats", "key": "checks captures threats", "answer": "Checks, captures and threats are forcing moves. They deserve priority in calculation because they reduce the opponent's reply choices.", "ref": "Calculation"}, {"topic": "Middlegame", "title": "Improve the worst piece", "key": "worst piece", "answer": "When there is no forcing tactic, identify your least active piece and improve it. This is one of the most reliable positional decision-making methods.", "ref": "Positional play"}, {"topic": "Middlegame", "title": "Prophylaxis", "key": "prophylaxis", "answer": "Prophylaxis means anticipating and preventing the opponent's useful plan before pursuing your own. Ask: What does my opponent want next?", "ref": "Positional play"}, {"topic": "Middlegame", "title": "Pawn break", "key": "pawn break", "answer": "A pawn break is a pawn advance or exchange designed to challenge the opponent's structure, open lines or create new weaknesses.", "ref": "Middlegame"}, {"topic": "Middlegame", "title": "Open file", "key": "open file", "answer": "An open file has no pawns and can become a route for rooks to invade, attack targets and control key squares.", "ref": "Rook strategy"}, {"topic": "Middlegame", "title": "Semi-open file", "key": "semi open file", "answer": "A semi-open file has no pawn of one color. It can provide a useful rook route toward enemy pawns or the king.", "ref": "Rook strategy"}, {"topic": "Middlegame", "title": "Outpost", "key": "outpost", "answer": "An outpost is a strong square, often in enemy territory, where a piece—especially a knight—can remain because enemy pawns cannot easily challenge it.", "ref": "Positional play"}, {"topic": "Middlegame", "title": "Weak square", "key": "weak square", "answer": "A weak square cannot be effectively challenged by an enemy pawn and may become a stable home for an opposing piece.", "ref": "Positional play"}, {"topic": "Middlegame", "title": "Space advantage", "key": "space advantage", "answer": "Space gives your pieces more room to maneuver. Too much space can also create overextension and targets, so space must be supported.", "ref": "Positional play"}, {"topic": "Middlegame", "title": "Initiative", "key": "initiative", "answer": "Initiative is the ability to make threats that require responses. It can compensate temporarily for material or structural disadvantages if used accurately.", "ref": "Positional play"}, {"topic": "Middlegame", "title": "King safety", "key": "king safety", "answer": "King safety depends on pawn shelter, open lines, attacking pieces and tactical resources. Before attacking, check whether your own king can survive counterplay.", "ref": "Strategy"}, {"topic": "Middlegame", "title": "Piece coordination", "key": "coordination", "answer": "Well-coordinated pieces defend one another, control important squares and combine against targets. Coordination often matters more than moving an individual piece repeatedly.", "ref": "Strategy"}, {"topic": "Middlegame", "title": "Exchange pieces", "key": "exchange pieces", "answer": "Exchange pieces when it improves your position, removes a strong enemy defender, reduces counterplay or reaches a favorable endgame. Avoid automatic exchanges.", "ref": "Strategy"}, {"topic": "Middlegame", "title": "Pawn structure", "key": "pawn structure", "answer": "Pawn structure determines open lines, weak squares, pawn breaks, good and bad pieces, and many long-term plans. Understanding the structure is often more important than memorizing moves.", "ref": "Strategy"}, {"topic": "Middlegame", "title": "Isolated pawn", "key": "isolated pawn", "answer": "An isolated pawn has no friendly pawn on an adjacent file. It can be a weakness, but it can also give open files and active piece play.", "ref": "Pawn structure"}, {"topic": "Middlegame", "title": "Hanging pawns", "key": "hanging pawns", "answer": "Hanging pawns are adjacent pawns without friendly pawns on neighboring files. They can gain space and dynamic potential but may become targets.", "ref": "Pawn structure"}, {"topic": "Middlegame", "title": "Backward pawn", "key": "backward pawn", "answer": "A backward pawn is behind pawns on neighboring files and cannot safely advance to join them. It can become a target on an open or semi-open file.", "ref": "Pawn structure"}, {"topic": "Middlegame", "title": "Passed pawn", "key": "passed pawn", "answer": "A passed pawn has no enemy pawn on its file or adjacent files that can stop it by a normal pawn capture. Passed pawns can become powerful endgame assets.", "ref": "Pawn structure"}, {"topic": "Endgame", "title": "Opposition", "key": "opposition", "answer": "Opposition is a king-and-pawn endgame technique where kings face each other with an odd number of squares between them. It can force the opponent's king to give way.", "ref": "Pawn endgame"}, {"topic": "Endgame", "title": "Rule of the square", "key": "rule of the square", "answer": "Imagine a square extending from a passed pawn toward promotion. If the defending king can enter that square in time, it may catch the pawn, subject to special cases and move order.", "ref": "Pawn endgame"}, {"topic": "Endgame", "title": "Key squares", "key": "key squares", "answer": "Key squares are critical squares that allow a king to support pawn promotion or force progress. The exact key-square pattern depends on pawn location and type.", "ref": "Pawn endgame"}, {"topic": "Endgame", "title": "Zugzwang", "key": "zugzwang", "answer": "Zugzwang is a position where having the move is a disadvantage because every legal move worsens the position.", "ref": "Endgame"}, {"topic": "Endgame", "title": "Triangulation", "key": "triangulation", "answer": "Triangulation uses a three-move king maneuver to lose a tempo and transfer the move to the opponent, often creating zugzwang.", "ref": "Pawn endgame"}, {"topic": "Endgame", "title": "Reserve tempo", "key": "reserve tempo", "answer": "A reserve tempo is a pawn move that can be saved and used later to lose a tempo at the right moment in a pawn ending.", "ref": "Pawn endgame"}, {"topic": "Endgame", "title": "Opposition and distant opposition", "key": "distant opposition", "answer": "Distant opposition occurs when kings face each other with an even number of squares between them. The geometry can determine who gains the direct opposition after king moves.", "ref": "Pawn endgame"}, {"topic": "Endgame", "title": "Outside passed pawn", "key": "outside passed pawn", "answer": "An outside passed pawn is far from the main battle. It can distract the enemy king and allow your king to penetrate elsewhere.", "ref": "Endgame strategy"}, {"topic": "Endgame", "title": "King activity", "key": "king activity", "answer": "In simplified positions the king becomes a strong fighting piece. Active king placement often decides whether pawns can be won or promoted.", "ref": "Endgame principle"}, {"topic": "Endgame", "title": "Lucena position", "key": "lucena", "answer": "The Lucena position is a fundamental rook-endgame winning method with king, rook and pawn against rook. The key idea is to shelter the king and use a rook lift to build a bridge.", "ref": "Rook endgame"}, {"topic": "Endgame", "title": "Philidor position", "key": "philidor", "answer": "The Philidor position is a key rook-endgame defensive technique. The defending rook restricts the enemy king and then checks from behind when the pawn advances.", "ref": "Rook endgame"}, {"topic": "Endgame", "title": "Rook behind passed pawn", "key": "rook behind passed pawn", "answer": "A classic rook principle is to place the rook behind a passed pawn. From behind, the rook can support promotion or attack the pawn effectively.", "ref": "Rook endgame"}, {"topic": "Endgame", "title": "Rook active behind enemy pawn", "key": "rook active", "answer": "In rook endings, active rook placement can be more important than passively defending pawns. Checking from the side or rear and attacking targets creates counterplay.", "ref": "Rook endgame"}, {"topic": "Endgame", "title": "Wrong bishop rook pawn", "key": "wrong bishop rook pawn", "answer": "With a rook pawn and a bishop that does not control the promotion square, the defending king may sometimes secure a draw. This is a classic theoretical exception.", "ref": "Bishop endgame"}, {"topic": "Endgame", "title": "Bishop versus knight", "key": "bishop knight", "answer": "Bishops tend to improve in open positions and on both wings; knights can excel in closed positions and strong central outposts. The pawn structure and targets decide the practical value.", "ref": "Minor-piece endgame"}, {"topic": "Endgame", "title": "Two bishops", "key": "two bishops endgame", "answer": "The bishop pair can be powerful in open endgames because the bishops control both colors and can attack from long range.", "ref": "Minor-piece endgame"}, {"topic": "Endgame", "title": "Opposite-colored bishops", "key": "opposite bishops", "answer": "Opposite-colored bishop endings often have strong drawing tendencies because each bishop controls different colors. Attacking chances can still exist, especially with extra pawns and king activity.", "ref": "Bishop endgame"}, {"topic": "Endgame", "title": "King and pawn versus king", "key": "king pawn king", "answer": "The basic king-and-pawn ending depends on king position, opposition, key squares and promotion rules. Do not assume an extra pawn always wins.", "ref": "Pawn endgame"}, {"topic": "Training", "title": "Calculation", "key": "calculation", "answer": "To improve calculation, examine forcing moves first, visualize one line at a time, search for the opponent's strongest reply, and evaluate the resulting position. Do not stop after finding your first attractive idea.", "ref": "Training"}, {"topic": "Training", "title": "Blunder check", "key": "blunder check", "answer": "Before playing, ask: What changed after my move? What checks, captures and threats does my opponent have? This routine prevents many one-move blunders.", "ref": "Training"}, {"topic": "Training", "title": "Tactical puzzles", "key": "tactical puzzles", "answer": "Solve tactics regularly, preferably by calculating before moving. After each puzzle, identify the pattern so the motif becomes reusable knowledge.", "ref": "Training"}, {"topic": "Training", "title": "Analyze your own games", "key": "analyze own games", "answer": "First analyze your game without an engine. Mark critical moments and explain your thoughts. Then use an engine to verify the analysis and discover missed resources.", "ref": "Training"}, {"topic": "Training", "title": "Opening study", "key": "opening study", "answer": "Study opening ideas, pawn structures, typical plans and tactical motifs before memorizing deep variations. Build a compact repertoire and review your own games.", "ref": "Training"}, {"topic": "Training", "title": "Endgame study", "key": "endgame study", "answer": "Learn essential king-and-pawn endings and basic rook endings before collecting rare theoretical positions. Endgame knowledge improves calculation and evaluation.", "ref": "Training"}, {"topic": "Training", "title": "Blunder journal", "key": "blunder journal", "answer": "Record important mistakes, your thought process, the correct idea and the lesson. Review recurring patterns to turn errors into targeted training.", "ref": "Training"}, {"topic": "Training", "title": "Calculation tree", "key": "calculation tree", "answer": "Calculate variations as a tree: identify candidate moves, find the opponent's strongest reply, continue forcing lines, then compare final positions. Avoid calculating every legal move.", "ref": "Training"}, {"topic": "Training", "title": "Think before moving", "key": "think before moving", "answer": "Use a short routine: identify the opponent's threat, check forcing moves, compare candidate moves, calculate the critical line, then make a final blunder check.", "ref": "Training"}, {"topic": "Training", "title": "Rating improvement", "key": "rating improvement", "answer": "To improve rating, combine serious games, self-analysis, tactical calculation, essential endgames, strategic study and consistent practice. Fix recurring weaknesses instead of only learning new openings.", "ref": "Training"}, {"topic": "Chess Knowledge", "title": "FEN", "key": "fen", "answer": "FEN (Forsyth-Edwards Notation) is a compact text representation of one chess position. It records piece placement, side to move, castling rights, en passant target and move counters.", "ref": "Notation"}, {"topic": "Chess Knowledge", "title": "PGN", "key": "pgn", "answer": "PGN (Portable Game Notation) is a text format for recording chess games, including moves and metadata such as players, event, date and result.", "ref": "Notation"}, {"topic": "Chess Knowledge", "title": "SAN", "key": "san", "answer": "SAN (Standard Algebraic Notation) is the standard move notation used in chess, such as Nf3, Bxe5, O-O and Qh7#.", "ref": "Notation"}, {"topic": "Chess Knowledge", "title": "ECO codes", "key": "eco", "answer": "ECO codes classify chess openings into five broad volumes, A00–E99, with more specific codes identifying opening families and variations.", "ref": "Opening classification"}, {"topic": "Chess Knowledge", "title": "Elo rating", "key": "elo", "answer": "Elo is a rating method that estimates relative playing strength. A player's rating changes based on results and opponent ratings under the applicable federation calculation.", "ref": "Chess ratings"}, {"topic": "Chess Knowledge", "title": "FIDE rating", "key": "fide rating", "answer": "A FIDE rating is an official rating published by FIDE under its rating regulations. Different lists and time controls can have separate ratings.", "ref": "FIDE"}, {"topic": "Chess Knowledge", "title": "Blunder", "key": "blunder", "answer": "A blunder is a serious error that substantially worsens a player's position, often by losing material, allowing mate or throwing away a winning advantage.", "ref": "Chess terminology"}, {"topic": "Chess Knowledge", "title": "Mistake", "key": "mistake", "answer": "A mistake is a significant error that worsens the position but is generally less severe than a blunder.", "ref": "Chess terminology"}, {"topic": "Chess Knowledge", "title": "Inaccuracy", "key": "inaccuracy", "answer": "An inaccuracy is a smaller-than-ideal decision that may reduce the evaluation without immediately losing the game.", "ref": "Chess terminology"}, {"topic": "Chess Knowledge", "title": "Gambit", "key": "gambit", "answer": "A gambit is an opening idea in which a player voluntarily offers material, usually a pawn, in exchange for development, initiative, activity or another form of compensation.", "ref": "Chess terminology"}, {"topic": "Chess Knowledge", "title": "Sacrifice", "key": "sacrifice", "answer": "A sacrifice intentionally gives up material for a concrete or positional return such as attack, development, king exposure, promotion or perpetual check.", "ref": "Chess terminology"}, {"topic": "Chess Knowledge", "title": "Perpetual check", "key": "perpetual check", "answer": "Perpetual check is a sequence of repeated checks that prevents the opponent from escaping and can force a draw when no winning continuation exists.", "ref": "Chess terminology"}, {"topic": "Chess Knowledge", "title": "Tempo", "key": "tempo", "answer": "A tempo is a useful move or unit of time. Gaining a tempo can mean developing with a threat or forcing an opponent to spend a move responding.", "ref": "Chess terminology"}, {"topic": "Chess Knowledge", "title": "Initiative", "key": "initiative", "answer": "Initiative is the ability to make threats and dictate the flow of the game. It can be temporary but can produce lasting advantages if handled accurately.", "ref": "Chess terminology"}, {"topic": "Chess Knowledge", "title": "Transposition", "key": "transposition", "answer": "A transposition occurs when different move orders lead to the same or a closely related position. Strong opening knowledge includes recognizing common transpositions.", "ref": "Opening terminology"}, {"topic": "Chess History", "title": "Garry Kasparov", "key": "kasparov", "answer": "Garry Kasparov is a former World Chess Champion and one of the most influential players in chess history. He was renowned for dynamic play, deep preparation and calculation.", "ref": "Chess history"}, {"topic": "Chess History", "title": "Magnus Carlsen", "key": "carlsen", "answer": "Magnus Carlsen is a Norwegian grandmaster and former classical World Chess Champion, widely regarded as one of the strongest players in chess history.", "ref": "Chess history"}, {"topic": "Chess History", "title": "Viswanathan Anand", "key": "viswanathan anand", "answer": "Viswanathan Anand is India's first undisputed World Chess Champion and a five-time World Champion across his championship career. He is celebrated for calculation, speed and opening preparation.", "ref": "Chess history"}, {"topic": "Chess History", "title": "Bobby Fischer", "key": "fischer", "answer": "Bobby Fischer was an American grandmaster and 11th World Chess Champion. His 1972 title match and exceptional tournament results made him one of chess's most famous figures.", "ref": "Chess history"}, {"topic": "Chess History", "title": "José Capablanca", "key": "capablanca", "answer": "José Raúl Capablanca was a Cuban World Chess Champion celebrated for clear positional play, endgame technique and exceptional natural accuracy.", "ref": "Chess history"}, {"topic": "Chess History", "title": "Mikhail Tal", "key": "tal", "answer": "Mikhail Tal was the eighth World Chess Champion, famous for imaginative sacrifices, attacking play and tactical complications.", "ref": "Chess history"}, {"topic": "Chess History", "title": "Anatoly Karpov", "key": "karpov", "answer": "Anatoly Karpov was a former World Chess Champion known for positional pressure, prophylaxis, endgame technique and precise exploitation of small advantages.", "ref": "Chess history"}, {"topic": "Chess History", "title": "Alexander Alekhine", "key": "alekhine", "answer": "Alexander Alekhine was a World Chess Champion renowned for complex calculation, attacking play and deep opening preparation.", "ref": "Chess history"}, {"topic": "Chess History", "title": "Paul Morphy", "key": "morphy", "answer": "Paul Morphy was a 19th-century American chess master celebrated for rapid development, open lines and classical attacking principles.", "ref": "Chess history"}, {"topic": "Chess History", "title": "World Chess Championship", "key": "world chess championship", "answer": "The World Chess Championship determines the classical world champion through the FIDE championship system and its applicable regulations. Champions and schedules change, so current title information should be verified live.", "ref": "Chess history"}, {"topic": "Golden Rules", "title": "Opponent's threat", "key": "opponent threat", "answer": "Before choosing your move, ask: What is my opponent threatening? This simple habit is one of the strongest practical rules for reducing blunders.", "ref": "Chess training principle"}, {"topic": "Golden Rules", "title": "Checks captures threats", "key": "golden rule checks captures threats", "answer": "When calculating, examine forcing moves first: checks, captures and threats. They narrow the opponent's reply set and reveal tactical opportunities.", "ref": "Chess calculation principle"}, {"topic": "Golden Rules", "title": "Improve worst piece", "key": "golden rule worst piece", "answer": "If there is no immediate tactic, improve your worst-placed piece. Better coordination frequently creates the next useful tactical or strategic opportunity.", "ref": "Positional principle"}, {"topic": "Golden Rules", "title": "King safety first", "key": "golden rule king safety", "answer": "Do not launch an attack while ignoring your own king. A successful attack requires enough safety to survive the opponent's forcing counterplay.", "ref": "Chess training principle"}, {"topic": "Golden Rules", "title": "Do not rush", "key": "golden rule don't rush", "answer": "Strong chess is not about moving quickly when the position is critical. Spend time at tactical decision points and use a repeatable thinking routine.", "ref": "Chess training principle"}, {"topic": "Golden Rules", "title": "Look for better move", "key": "lasker quote", "answer": "A famous chess maxim commonly attributed to Emanuel Lasker is: “When you see a good move, look for a better one.” Use it as a reminder to compare candidate moves.", "ref": "Emanuel Lasker — commonly attributed"}, {"topic": "Golden Rules", "title": "Chess is 99 percent tactics", "key": "99 percent tactics", "answer": "The famous phrase “Chess is 99 percent tactics” is commonly attributed to Rudolf Spielmann. It is best understood as a humorous emphasis on tactical awareness rather than a literal statistic.", "ref": "Rudolf Spielmann — commonly attributed"}, {"topic": "Golden Rules", "title": "Strategy and tactics", "key": "strategy tactics", "answer": "A useful practical relationship is: strategy creates favorable conditions; tactics exploit them. Strong players continually switch between long-term plans and concrete calculation.", "ref": "Chess training principle"}, {"topic": "Greatest Chess Quotes", "title": "Capablanca quote", "key": "capablanca quote", "answer": "A widely quoted Capablanca maxim is: “You may learn much more from a game you lose than from a game you win.” The practical lesson is to analyze losses carefully.", "ref": "José Raúl Capablanca — commonly attributed"}, {"topic": "Greatest Chess Quotes", "title": "Tal quote", "key": "tal quote", "answer": "Mikhail Tal is famously associated with imaginative attacking chess and the idea that a successful sacrifice is one the opponent cannot refute. Exact wording varies across sources.", "ref": "Mikhail Tal — commonly attributed"}, {"topic": "Greatest Chess Quotes", "title": "Botvinnik quote", "key": "botvinnik quote", "answer": "Mikhail Botvinnik is commonly associated with systematic preparation and the idea that chess improvement requires disciplined analysis and study.", "ref": "Mikhail Botvinnik — paraphrased chess wisdom"}, {"topic": "Greatest Chess Quotes", "title": "Nimzowitsch quote", "key": "nimzowitsch quote", "answer": "Aron Nimzowitsch is associated with foundational positional concepts such as prophylaxis, blockade and overprotection, especially through his classic strategic writings.", "ref": "Aron Nimzowitsch — chess theory"}, {"topic": "Position & FEN", "title": "What is a legal FEN?", "key": "legal fen", "answer": "A legal FEN should describe a coherent chess position: exactly one king for each side, valid piece placement, a valid side to move, and consistent castling and en-passant information. A syntactically valid FEN is not automatically a legally reachable position.", "ref": "FEN / chess legality"}, {"topic": "Position & FEN", "title": "How do I read a FEN?", "key": "read fen", "answer": "Read FEN from rank 8 down to rank 1, left to right within each rank. Digits represent consecutive empty squares. The remaining fields specify side to move, castling rights, en-passant target, halfmove clock and fullmove number.", "ref": "Forsyth-Edwards Notation"}, {"topic": "Position & FEN", "title": "What does side to move mean in FEN?", "key": "side to move fen", "answer": "The second FEN field is w or b. It tells you whose turn it is. This matters because a position can have completely different legal moves and evaluation depending on the player to move.", "ref": "FEN"}, {"topic": "Position & FEN", "title": "What are castling rights in FEN?", "key": "castling rights fen", "answer": "The fourth FEN field records castling rights using K, Q, k and q. A dash means no castling rights are recorded. The rights describe whether the king and rook have retained the relevant castling status; they do not by themselves guarantee that castling is currently legal.", "ref": "FEN / FIDE Laws"}, {"topic": "Position & FEN", "title": "Can CHESSA analyze a FEN?", "key": "analyze fen", "answer": "CHESSA v4 can identify and explain FEN structure and use a browser chess engine for legal move/position support when the engine module is available. For exact tactical evaluation, use the built-in position panel rather than relying on a text-only explanation.", "ref": "CHESSA v4 Position Mode"}, {"topic": "Position & FEN", "title": "Best move in a position", "key": "best move position", "answer": "A strong chess answer requires the exact position, side to move and tactical context. Paste a FEN into CHESSA's Position Mode to inspect the position. A strategic explanation should then consider checks, captures, threats, king safety, material and piece activity.", "ref": "CHESSA Position Method"}, {"topic": "Position & FEN", "title": "Candidate moves from a position", "key": "candidate moves position", "answer": "Start with forcing candidates—checks, captures and threats. Then consider improving a piece, prophylaxis and pawn breaks. For each candidate, calculate the opponent's strongest reply before comparing the resulting positions.", "ref": "Chess calculation method"}, {"topic": "Position & FEN", "title": "How to evaluate a position", "key": "evaluate position", "answer": "Use a structured checklist: material, king safety, piece activity, pawn structure, space, weak squares, passed pawns, initiative and immediate tactics. Do not judge a position from material alone.", "ref": "Positional evaluation"}, {"topic": "Training", "title": "How should a beginner train chess?", "key": "beginner training", "answer": "A practical beginner plan is: learn legal moves and basic mates, solve simple tactics, play slow games, analyze your mistakes, learn essential king-and-pawn endings, then build a small opening repertoire. Understanding is more valuable than memorizing long lines.", "ref": "MyChess64 Training Principle"}, {"topic": "Training", "title": "How should an intermediate player train?", "key": "intermediate training", "answer": "An intermediate player should emphasize calculation, tactical patterns, positional plans, pawn structures, rook endgames and analysis of their own serious games. Use openings as a framework for middlegame understanding rather than as a memory contest.", "ref": "MyChess64 Training Principle"}, {"topic": "Training", "title": "How to stop blundering", "key": "stop blunders", "answer": "Use a repeatable pre-move check: What is my opponent threatening? What checks do they have? What captures do they have? What attacks changed after my move? Then verify your candidate move does not allow a simple tactical reply.", "ref": "Blunder Prevention"}, {"topic": "Strategy", "title": "How do I make a chess plan?", "key": "make a plan", "answer": "First identify the position's features: king safety, pawn structure, weak squares, open files, worst piece and possible pawn breaks. Then choose a plan that improves your position while limiting the opponent's counterplay.", "ref": "Positional Planning"}, {"topic": "Strategy", "title": "Attack the king or center?", "key": "attack king center", "answer": "Do not attack automatically. Compare the position: king exposure, available attacking pieces, open lines and central stability. If the opponent's king is safe and the center is unresolved, a premature attack can backfire.", "ref": "Attacking Principles"}, {"topic": "Opening Theory", "title": "How many opening moves should I memorize?", "key": "memorize opening moves", "answer": "Memorize critical patterns and forcing variations, but prioritize ideas, pawn structures and plans. A player who understands why an opening works can adapt when the opponent leaves the book.", "ref": "Opening Study"}];
