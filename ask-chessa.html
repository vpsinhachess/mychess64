<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0618"><title>CHESSA — MyChess64</title>
<style>
:root{--gold:#f5c65a;--cy:#5ee6ff;--pk:#ff7ad9;--line:#ffffff1a}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#f4f1ff;background:radial-gradient(1000px 600px at 20% -10%,#3b1d7a55,transparent),radial-gradient(900px 600px at 100% 100%,#0b4a6e55,transparent),#0a0618;overflow:hidden}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#fx i{position:absolute;bottom:-60px;font-style:normal;color:#ffffff10;animation:up linear infinite}
@keyframes up{to{transform:translateY(-115vh) rotate(40deg)}}
.app{position:relative;height:100%;max-width:880px;margin:auto;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 14px 10px}
header .mini{width:42px;height:42px;border-radius:50%;overflow:hidden;border:2px solid var(--gold);box-shadow:0 0 18px #f5c65a66;background:#1a0f3a}
.nm{font-weight:900;letter-spacing:.18em;font-size:15px}.nm small{display:block;font-size:9px;letter-spacing:.1em;color:#7ef0b4;font-weight:600}
.sp{flex:1}.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#ffffff0d;color:#fff;font-size:17px;cursor:pointer;backdrop-filter:blur(8px)}
.ib.on{border-color:var(--gold);box-shadow:0 0 14px #f5c65a55}
main{flex:1;overflow:auto;padding:6px 14px 20px;scroll-behavior:smooth}
#hero{text-align:center;padding-top:2vh;transition:.5s}body.chat #hero{display:none}
.stage{position:relative;width:min(250px,60vw);aspect-ratio:1;margin:auto}
.stage::before{content:"";position:absolute;inset:-8%;border-radius:50%;background:conic-gradient(from 0deg,var(--cy),var(--pk),var(--gold),var(--cy));filter:blur(22px);opacity:.55;animation:spin 8s linear infinite}
.stage::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #ffffff30}
.stage svg{position:relative;z-index:1;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 50% 30%,#3a2380,#120a2c);animation:fl 4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes fl{50%{transform:translateY(-6px)}}
h1{margin:18px 0 4px;font-size:clamp(34px,9vw,52px);letter-spacing:.22em;font-weight:900;background:linear-gradient(90deg,#fff,var(--gold),var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent}
h1 .c{-webkit-text-fill-color:transparent}
.tg{color:#b9afdc;font-size:14px;margin:0 0 20px}
#sug{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{border:1px solid #f5c65a55;background:#f5c65a12;color:#ffe4a3;border-radius:99px;padding:9px 14px;font-size:13px;cursor:pointer;transition:.2s}
.chip:hover{background:#f5c65a2a;transform:translateY(-2px);box-shadow:0 6px 18px #f5c65a30}
.msg{display:flex;gap:9px;margin:14px 0;align-items:flex-end;animation:in .35s ease both}@keyframes in{from{opacity:0;transform:translateY(10px) scale(.97)}}
.msg.user{justify-content:flex-end}.av{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#ffe08a,#c98a1a);color:#2a1700;font-size:17px;box-shadow:0 0 12px #f5c65a55}
.bubble{max-width:88%;padding:13px 16px;border-radius:20px;line-height:1.65;font-size:15px;border:1px solid var(--line)}
.user .bubble{background:linear-gradient(135deg,#7c4dff,#4b2fc9);border-bottom-right-radius:6px;box-shadow:0 8px 24px #4b2fc955}
.bot .bubble{background:#ffffff0e;backdrop-filter:blur(14px);border-bottom-left-radius:6px;box-shadow:0 8px 28px #0006,inset 0 0 0 1px #5ee6ff14}
.txt{white-space:pre-wrap}.w{display:inline-block;white-space:nowrap}
.c{display:inline-block;opacity:0;animation:drop .5s cubic-bezier(.2,.9,.3,1.3) both;color:inherit}
@keyframes drop{0%{opacity:0;transform:translateY(-22px) rotate(-8deg);filter:blur(3px)}60%{opacity:1;color:var(--cy)}100%{opacity:1;transform:none;filter:none}}
.txt [style*=grid]{animation:in .8s both}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;opacity:0;animation:in .6s both}
.meta span{font-size:11px;color:#a99fd0;border:1px solid var(--line);border-radius:99px;padding:4px 9px}
.meta .rl{cursor:pointer;color:#ffe4a3;border-color:#f5c65a44}.meta .rl:hover{background:#f5c65a22}
.dots{display:flex;gap:5px;padding:6px 2px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--cy);animation:bn 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bn{50%{transform:translateY(-7px);opacity:.4}}
footer{padding:8px 12px max(14px,env(safe-area-inset-bottom))}
.cmp{display:flex;gap:8px;align-items:center;padding:6px;border-radius:30px;border:1px solid #ffffff26;background:#ffffff10;backdrop-filter:blur(16px);box-shadow:0 10px 40px #0008}
.cmp:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px #f5c65a22,0 10px 40px #0008}
#q{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font-size:16px;padding:10px 12px}
.cmp button{width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;font-size:18px;background:#ffffff14;color:#fff}
.cmp #send{background:linear-gradient(135deg,#ffe08a,#e0a12a);color:#241500;font-weight:900}.cmp #mic.rec{background:#ff3b6b;animation:pl 1s infinite}
@keyframes pl{50%{box-shadow:0 0 0 8px #ff3b6b33}}
.eye{transform-box:fill-box;transform-origin:center;animation:bl 4.5s infinite}@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
.mo{display:none;transform-box:fill-box;transform-origin:center}.talk .mo{display:block;animation:tk .28s infinite alternate}.talk .sm{display:none}@keyframes tk{from{transform:scaleY(.5)}to{transform:scaleY(2.6)}}
.glow{animation:gw 2.5s ease-in-out infinite alternate}@keyframes gw{to{opacity:.55}}
::-webkit-scrollbar{width:0}
</style></head><body>
<div id="fx"></div>
<div class="app">
<header><div class="mini" id="mini"></div><div class="nm">CHESSA<small>● ONLINE</small></div><div class="sp"></div><button class="ib on" id="vc" title="Voice">🔊</button><button class="ib" id="clear" title="Clear">✕</button></header>
<main id="main">
 <section id="hero"><div class="stage" id="big"></div><h1 id="t1">CHESSA</h1><p class="tg" id="t2">Ask me anything about chess</p><div id="sug"></div></section>
 <div id="chat"></div>
</main>
<footer><div class="cmp"><input id="q" maxlength="700" placeholder="Ask CHESSA…" autocomplete="off"><button id="mic" title="Speak">🎤</button><button id="send">➤</button></div></footer>
</div>
<script src="js/core.js"></script>
<script src="data/kb-data.js"></script>
<script src="data/kb-extra.js"></script>
<script src="data/manifest.js"></script>
<script src="data/puzzles.js"></script>
<script src="js/kb.js"></script>
<script src="js/app.js"></script>
<script src="js/knowledge.js"></script>
<script src="js/live.js"></script>
<script src="js/hindi.js"></script>
<script src="js/learn.js"></script>
<script src="js/puzzles.js"></script>
<script src="js/engine.js"></script>
<script src="js/wiki.js"></script>
<script src="js/tutor.js"></script>
<script src="js/ui.js"></script>
</body></html>
