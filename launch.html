<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>64 — Launching 25 October 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#040918;--cy:#00d4ff;--bl:#1e6bff;--or:#ffb020;--tx:#eef4ff;--mu:#8fa3c9;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;width:100%}
html,body{height:100dvh}
body{background:var(--bg);color:var(--tx);font-family:'Manrope',system-ui,sans-serif;overflow:hidden}
#grid{position:fixed;inset:0;display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr);-webkit-mask-image:radial-gradient(ellipse at 50% 45%,#000 0,transparent 78%);mask-image:radial-gradient(ellipse at 50% 45%,#000 0,transparent 78%)}
#grid i{border:1px solid rgba(70,120,255,.07);transition:background .9s,box-shadow .9s}
#grid i:nth-child(odd){background:rgba(30,107,255,.035)}
#grid i.on{background:rgba(0,212,255,.16);box-shadow:inset 0 0 30px rgba(0,212,255,.25);transition-duration:.15s}
#grid i.wave{animation:wave 1.1s ease-out both}
@keyframes wave{0%{background:rgba(255,255,255,.75)}30%{background:rgba(0,212,255,.45)}100%{background:transparent}}
.glow{position:fixed;width:60vmax;height:60vmax;left:var(--mx,50%);top:var(--my,45%);transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(30,107,255,.22),transparent 60%);pointer-events:none;transition:left .4s,top .4s}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
main{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px;gap:clamp(8px,2vh,20px)}
.pill{display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border:1px solid rgba(0,212,255,.35);border-radius:99px;background:rgba(0,212,255,.07);font-size:clamp(13px,3vw,15px);color:var(--cy);font-weight:600}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--or);box-shadow:0 0 12px var(--or);animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.8);opacity:.4}}
#logo{all:unset;cursor:pointer;position:relative;width:clamp(90px,min(30vh,60vw),210px);aspect-ratio:1;display:grid;place-items:center;transition:transform .25s;transform:perspective(600px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
#logo::before{content:"";position:absolute;inset:-14%;border-radius:36%;background:conic-gradient(from 0deg,var(--bl),var(--cy),var(--or),var(--bl));filter:blur(28px);opacity:.55;animation:spin 6s linear infinite}
#logo::after{content:"";position:absolute;inset:-5%;border-radius:30%;border:2px solid var(--cy);opacity:0;animation:ring 2.6s ease-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ring{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.5);opacity:0}}
#logo img{position:relative;width:100%;height:100%;object-fit:contain;border-radius:26%;animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-7px)}}
#logo:hover{scale:1.06}#logo:active{scale:.93}
#logo:focus-visible{outline:3px solid var(--cy);outline-offset:10px;border-radius:30%}
.tap{margin:0;font-size:clamp(14px,3.2vw,16px);color:var(--mu)}
h1{font-family:'Sora',sans-serif;font-weight:800;font-size:clamp(24px,min(7.6vw,8.6vh),76px);line-height:1.05;letter-spacing:-.03em;margin:0;max-width:16ch;background:linear-gradient(120deg,#fff 20%,var(--cy) 60%,var(--bl));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0;max-width:44ch;font-size:clamp(13px,min(3.4vw,2.6vh),19px);line-height:1.5;color:var(--mu)}
.count{display:flex;gap:clamp(6px,1.8vw,16px);align-items:stretch}
.u{position:relative;min-width:clamp(66px,18vw,120px);padding:clamp(6px,1.6vh,18px) 6px;border-radius:18px;background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.02));border:1px solid rgba(120,170,255,.22);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 14px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12);overflow:hidden}
.u::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(4,9,24,.5)}
.u b{display:block;font-family:'Sora',sans-serif;font-weight:800;font-size:clamp(24px,min(8vw,7.5vh),58px);font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 0 24px rgba(0,212,255,.5)}
.u b.t{animation:pop .45s ease-out}
@keyframes pop{0%{transform:translateY(-35%);opacity:0}100%{transform:none;opacity:1}}
.u span{font-size:clamp(12px,2.6vw,14px);color:var(--cy);font-weight:600}
.date{margin:0;font-size:clamp(14px,3.2vw,17px);color:var(--tx)}
.date b{color:var(--or)}
#mute{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:10;background:rgba(255,255,255,.06);color:var(--tx);border:1px solid rgba(120,170,255,.3);border-radius:99px;padding:8px 14px;font:600 13px 'Manrope',sans-serif;cursor:pointer;backdrop-filter:blur(8px)}
#live{position:fixed;inset:0;z-index:8;display:none;align-items:center;justify-content:center;overflow:hidden;color:#0a2540;background:radial-gradient(ellipse at 50% 35%,#fff 0,#eaf3ff 45%,#c9ddff 100%)}
#live.on{display:flex;animation:rev 1s ease-out}
@keyframes rev{from{opacity:0;filter:brightness(2.2)}}
.rays{position:absolute;left:50%;top:38%;width:220vmax;height:220vmax;transform:translate(-50%,-50%);background:repeating-conic-gradient(rgba(30,107,255,.12) 0 7deg,transparent 7deg 18deg);-webkit-mask-image:radial-gradient(circle,#000 0,transparent 42%);mask-image:radial-gradient(circle,#000 0,transparent 42%);animation:sp2 60s linear infinite}
@keyframes sp2{to{transform:translate(-50%,-50%) rotate(360deg)}}
.floor{position:absolute;left:-25%;right:-25%;bottom:-8%;height:55%;background:conic-gradient(#1e6bff 25%,transparent 0 50%,#1e6bff 0 75%,transparent 0) 0 0/90px 90px;opacity:.14;transform:perspective(500px) rotateX(62deg);transform-origin:bottom;-webkit-mask-image:linear-gradient(to top,#000,transparent 85%);mask-image:linear-gradient(to top,#000,transparent 85%);animation:fl2 8s linear infinite}
@keyframes fl2{to{background-position:0 90px}}
.pcs span{position:absolute;bottom:-70px;color:rgba(30,107,255,.2);animation:up linear infinite}
@keyframes up{to{transform:translateY(-125vh) rotate(28deg)}}
.card{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2vh,18px);text-align:center;padding:16px;width:100%}
.badge{display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border-radius:99px;background:#0a2540;color:#fff;font:600 14px 'Sora',sans-serif;box-shadow:0 10px 26px rgba(10,37,64,.3);animation:rise .7s ease-out .1s both}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:#ffb020;box-shadow:0 0 10px #ffb020}
.lw{position:relative;width:min(90vw,780px,calc(34dvh*3.125));animation:lg 1.3s cubic-bezier(.2,1.1,.3,1) .25s both}
@keyframes lg{from{opacity:0;transform:scale(.5) translateY(50px);filter:blur(16px)}}
.lw img{display:block;width:100%;height:auto;filter:drop-shadow(0 18px 28px rgba(30,107,255,.38))}
.lw::after{content:"";position:absolute;inset:0;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.95) 50%,transparent 60%) 150% 0/250% 100% no-repeat;animation:sh2 3s ease-in-out 1.5s infinite}
@keyframes sh2{to{background-position:-50% 0}}
#live h2{font-family:'Sora',sans-serif;font-weight:800;font-size:clamp(26px,min(7vw,8vh),64px);letter-spacing:-.03em;line-height:1.05;margin:0;background:linear-gradient(120deg,#0a2540,#1e6bff 70%,#00a8e8);-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise .8s ease-out 1s both}
#live p{margin:0;font-size:clamp(14px,min(3.6vw,3vh),22px);color:#34557f;animation:rise .8s ease-out 1.2s both}
#live a{margin-top:6px;padding:clamp(11px,2vh,16px) 38px;border-radius:99px;background:linear-gradient(120deg,#0a2540,#1e6bff);color:#fff;font-family:'Sora',sans-serif;font-weight:600;text-decoration:none;box-shadow:0 14px 34px rgba(30,107,255,.45);transition:transform .2s;animation:rise .8s ease-out 1.4s both}
#live a:hover{transform:translateY(-3px) scale(1.04)}
#live a:focus-visible{outline:3px solid #ffb020;outline-offset:4px}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
body.launched main,body.launched #grid,body.launched .glow{opacity:0;transition:opacity .4s}
@media (prefers-reduced-motion:reduce){.rays,.floor,.pcs span,.lw::after{animation:none}.lw,.badge,#live h2,#live p,#live a{animation:none}}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:7}
.flash.go{animation:ff .8s ease-out}
@keyframes ff{0%{opacity:.9}100%{opacity:0}}
.shake{animation:sh .5s}
@keyframes sh{20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-4px,-3px)}80%{transform:translate(3px,4px)}}
@media (prefers-reduced-motion:reduce){#logo::before,#logo::after,#logo img,.pill::before,.shake,.u b.t{animation:none}}
</style>
</head>

<script>
(function(){
  var TARGET = Date.parse('2026-10-25T10:00:00+05:30');
  var $ = function(i){return document.getElementById(i)};
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* Board of 64 squares */
  var grid = $('grid'), sq = [];
  for(var i=0;i<64;i++){ var e = document.createElement('i'); grid.appendChild(e); sq.push(e); }
  setInterval(function(){
    var e = sq[Math.floor(Math.random()*64)]; e.classList.add('on');
    setTimeout(function(){ e.classList.remove('on'); }, 500);
  }, 260);
  addEventListener('pointermove', function(ev){
    var g = $('glow'); g.style.setProperty('--mx', ev.clientX+'px'); g.style.setProperty('--my', ev.clientY+'px');
    if(reduce) return;
    var lg = $('logo'), r = lg.getBoundingClientRect();
    var dx = (ev.clientX-(r.left+r.width/2))/innerWidth, dy = (ev.clientY-(r.top+r.height/2))/innerHeight;
    lg.style.setProperty('--ry', (dx*28)+'deg'); lg.style.setProperty('--rx', (-dy*28)+'deg');
  });

  /* Countdown */
  var last = {};
  function set(id, v){ var el = $(id), t = (v<10?'0':'')+v; if(last[id] !== t){ el.textContent = t; last[id] = t; el.classList.remove('t'); void el.offsetWidth; el.classList.add('t'); } }
  function tick(){
    var s = Math.floor(Math.max(0, TARGET-Date.now())/1000);
    set('d', Math.floor(s/86400)); set('h', Math.floor(s%86400/3600)); set('m', Math.floor(s%3600/60)); set('s', s%60);
    if(s === 0){ $('pill').textContent = 'We are open'; }
  }
  tick(); setInterval(tick, 1000);

  /* Synth sound */
  var ctx, master, muted = false, nb;
  function audio(){
    if(!ctx){
      var AC = window.AudioContext || window.webkitAudioContext; if(!AC) return null;
      ctx = new AC(); master = ctx.createGain(); master.gain.value = .9; master.connect(ctx.destination);
      nb = ctx.createBuffer(1, ctx.sampleRate*2, ctx.sampleRate);
      var d = nb.getChannelData(0); for(var i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    }
    if(ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function noise(t, dur, f0, q, vol, f1){
    var s = ctx.createBufferSource(); s.buffer = nb;
    var f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.setValueAtTime(f0, t); if(f1) f.frequency.exponentialRampToValueAtTime(f1, t+dur); f.Q.value = q;
    var g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+Math.min(.005, dur/2)); g.gain.exponentialRampToValueAtTime(.001, t+dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random()); s.stop(t+dur+.05);
  }
  function tone(t, fr, dur, vol, type){
    var o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
    o.type = type || 'sawtooth'; o.frequency.value = fr; f.type = 'lowpass'; f.frequency.setValueAtTime(900, t); f.frequency.linearRampToValueAtTime(3400, t+.08);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+.03); g.gain.setValueAtTime(vol, t+dur-.12); g.gain.linearRampToValueAtTime(0, t+dur);
    o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.05);
  }
  function clack(t){
    noise(t, .06, 1100, 6, .9); noise(t, .12, 380, 3, .8);
    var o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine';
    o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(90, t+.1);
    g.gain.setValueAtTime(.7, t); g.gain.exponentialRampToValueAtTime(.001, t+.14); o.connect(g); g.connect(master); o.start(t); o.stop(t+.16);
  }
  function riser(t){
    noise(t, .9, 300, 1.5, .5, 6000);
    var o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(880, t+.9);
    g.gain.setValueAtTime(.001, t); g.gain.linearRampToValueAtTime(.12, t+.85); g.gain.linearRampToValueAtTime(0, t+.95);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+1);
  }
  function fanfare(t){
    [[392,0,.22],[392,.24,.22],[392,.48,.22],[523,.72,.7],[440,1.46,.25],[494,1.74,.25],[659,2.02,1.4]].forEach(function(n){
      tone(t+n[1], n[0], n[2], .16); tone(t+n[1], n[0]*2, n[2], .07, 'square'); tone(t+n[1], n[0]/2, n[2], .12, 'triangle');
    });
    noise(t+2.02, 1.5, 5000, .7, .14);
  }
  function applause(t, secs){
    noise(t, secs, 2600, .5, .09);
    var n = Math.floor(secs*55);
    for(var i=0;i<n;i++){
      var p = i/n, den = Math.sin(Math.PI*Math.pow(p,.6));
      if(Math.random() > .25+.75*den) continue;
      noise(t+p*secs+Math.random()*.03, .05+Math.random()*.05, 1400+Math.random()*2400, 1.2+Math.random()*2, .25+Math.random()*.4*den);
    }
  }
  function sparkle(t){ for(var i=0;i<7;i++) tone(t+i*.05, 1200+i*260, .25, .05, 'sine'); }
  $('mute').addEventListener('click', function(){
    muted = !muted; this.textContent = muted ? 'Sound off' : 'Sound on'; this.setAttribute('aria-pressed', muted);
    if(master) master.gain.value = muted ? 0 : .9;
  });

  /* Canvas particles */
  var cv = $('fx'), c = cv.getContext('2d'), W, H, parts = [], rings = [], run = false;
  function size(){ var r = devicePixelRatio||1; W = innerWidth; H = innerHeight; cv.width = W*r; cv.height = H*r; c.setTransform(r,0,0,r,0,0); }
  size(); addEventListener('resize', size);
  var GL = ['\u265E','\u265C','\u265D','\u265B','\u265A','\u265F'], COL = ['#ffffff','#00d4ff','#1e6bff','#ffb020','#7fe9ff'];
  function burst(x, y, n, sp){
    for(var i=0;i<n;i++){ var a = Math.random()*6.283, v = (.3+Math.random())*sp, pc = Math.random() < .4;
      parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-sp*.5,r:Math.random()*6.3,vr:(Math.random()-.5)*.3,s:pc?18+Math.random()*24:5+Math.random()*8,g:pc?GL[i%6]:null,c:COL[i%5],life:1}); }
  }
  function rain(n){ for(var i=0;i<n;i++) parts.push({x:Math.random()*W,y:-30-Math.random()*H*.4,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:Math.random()*6.3,vr:(Math.random()-.5)*.2,s:Math.random()<.4?20+Math.random()*18:6+Math.random()*6,g:Math.random()<.4?GL[i%6]:null,c:COL[i%5],life:1,rn:1}); }
  function frame(){
    c.clearRect(0,0,W,H);
    rings.forEach(function(r){ r.r += r.v; r.a -= .017; c.strokeStyle = 'rgba(0,212,255,'+Math.max(r.a,0)+')'; c.lineWidth = 4; c.beginPath(); c.arc(r.x,r.y,r.r,0,6.3); c.stroke(); });
    rings = rings.filter(function(r){return r.a>0});
    parts.forEach(function(p){
      p.vy += .12; p.vx *= .995; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= p.rn ? .0016 : .006;
      c.save(); c.globalAlpha = Math.max(Math.min(p.life*1.6,1),0); c.translate(p.x,p.y); c.rotate(p.r); c.fillStyle = p.c;
      if(p.g){ c.font = p.s+'px serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(p.g,0,0); } else c.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);
      c.restore();
    });
    parts = parts.filter(function(p){return p.life>0 && p.y<H+60});
    if(parts.length || rings.length) requestAnimationFrame(frame); else run = false;
  }
  function go(){ if(!run){ run = true; requestAnimationFrame(frame); } }

  /* Launch overlay setup */
  $('lv').style.setProperty('--logo','url('+$('lg2').src+')');
  var pc = $('pcs'), GL2 = ['\u265E','\u265C','\u265D','\u265B','\u265A','\u265F'];
  for(var k=0;k<14;k++){ var sp = document.createElement('span'); sp.textContent = GL2[k%6]; sp.style.left = (k*7.5+Math.random()*4)+'%'; sp.style.fontSize = (30+Math.random()*50)+'px'; sp.style.animationDuration = (9+Math.random()*8)+'s'; sp.style.animationDelay = (-Math.random()*12)+'s'; pc.appendChild(sp); }

  /* Launch */
  var launched = false, logo = $('logo');
  logo.addEventListener('click', function(){
    var r = logo.getBoundingClientRect(), x = r.left+r.width/2, y = r.top+r.height/2;
    if(launched){ var a0 = audio(); if(a0 && !muted) clack(a0.currentTime); burst(x,y,40,9); go(); return; }
    launched = true;
    var a = audio(), t = a ? a.currentTime : 0;
    if(a){ clack(t); riser(t+.15); fanfare(t+1.05); sparkle(t+.3); applause(t+1.8, 9); }
    $('pill').textContent = 'Launching now';
    document.body.classList.add('shake'); $('flash').classList.add('go');
    var cx = 3.5, cy = 3.5;
    sq.forEach(function(e,i){ var d = Math.hypot(i%8-cx, Math.floor(i/8)-cy); e.style.animationDelay = (d*.09)+'s'; e.classList.add('wave'); });
    for(var i=0;i<4;i++) rings.push({x:x,y:y,r:20+i*10,v:6+i*2.5,a:1});
    burst(x,y,110,13); go();
    if(!reduce){
      [500,1100,1800,2600].forEach(function(ms){ setTimeout(function(){ burst(Math.random()*W, H*(.15+Math.random()*.35), 70, 11); go(); }, ms); });
      rain(70); go();
    }
    setTimeout(function(){ document.body.classList.add('launched'); COL = ['#1e6bff','#00a8e8','#ffb020','#0a2540','#5aa9ff']; $('live').classList.add('on'); $('enter').focus(); burst(W/2,H*.4,90,12); go(); }, 1700);
  });
  $('enter').addEventListener('click', function(){ $('live').classList.remove('on'); document.body.classList.remove('launched'); burst(W/2,H/2,80,12); go(); });
})();
</script>
</body>
