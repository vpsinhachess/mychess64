<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#171717">
<title>Square Sense — Build the Chess Board</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#eef1f5;--surface:#fff;--surface2:#f6f7f9;--border:#dfe3e8;
  --text:#17191c;--muted:#6f7782;--accent:#b58863;--accent2:#f0d9b5;
  --board-light:#f0d9b5;--board-dark:#b58863;
  --shadow:0 10px 30px rgba(20,30,40,.08)
}
body.dark{
  --bg:#0f1114;--surface:#181b20;--surface2:#20242a;--border:#30353d;
  --text:#f2f4f7;--muted:#9aa3ad;--accent:#d3a276;--accent2:#f0d9b5;
  --shadow:0 12px 34px rgba(0,0,0,.28)
}
html,body{margin:0;min-height:100%;font-family:Inter,Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
body{display:flex;justify-content:center}
button{font:inherit}
.app{width:100%;max-width:1500px;min-height:100vh;padding:18px;display:flex;flex-direction:column;gap:16px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.brand{font-weight:900;letter-spacing:.5px;font-size:20px}.brand span{font-weight:600;color:var(--muted);font-size:12px;margin-left:8px}
.top-actions{display:flex;gap:8px}.btn{border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:9px;padding:9px 13px;cursor:pointer;font-weight:800}.btn:hover{filter:brightness(.98)}.btn.icon{width:42px;padding:9px 0;text-align:center}.btn.primary{background:var(--accent2);color:#171717;border-color:var(--accent2)}
.main{display:flex;gap:16px;align-items:stretch;flex:1;min-height:0}
.board-area{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.board-wrap{position:relative;width:min(78vh,calc(100vw - 430px),820px);min-width:320px;aspect-ratio:1}
.board{position:absolute;inset:0;overflow:hidden;border-radius:6px;box-shadow:0 12px 30px rgba(0,0,0,.20);user-select:none}
.sq{position:absolute;width:12.5%;height:12.5%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sq.light{background:var(--board-light)}.sq.dark{background:var(--board-dark)}
.sq.placeable{outline:3px solid rgba(255,255,255,.35);outline-offset:-3px}
.coord{position:absolute;font-size:clamp(10px,1.4vw,16px);font-weight:900;pointer-events:none;line-height:1}.file{right:5px;bottom:4px}.rank{left:5px;top:4px}.light .coord{color:#b58863}.dark .coord{color:#f0d9b5}
.board-piece{position:absolute;width:12.5%;height:12.5%;z-index:8;display:flex;align-items:center;justify-content:center;pointer-events:none;user-select:none}.board-piece img{width:88%;height:88%;object-fit:contain;display:block}
.feedback{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.18);pointer-events:none}
.feedback[hidden]{display:none}.feedback-symbol{font-size:clamp(54px,9vw,92px);font-weight:1000;line-height:1;color:#fff;text-shadow:0 3px 12px rgba(0,0,0,.55)}.feedback-text{margin-top:8px;font-size:clamp(30px,5vw,56px);font-weight:1000;text-transform:uppercase;color:#fff;text-shadow:0 3px 12px rgba(0,0,0,.55)}
.panel{width:350px;flex:0 0 350px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.panel-head{display:flex;align-items:center;justify-content:space-between}.panel h2{font-size:20px;margin:0}.panel-tag{font-size:10px;font-weight:900;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.keys{display:flex;flex-direction:column;gap:8px}.piece-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.piece-key{min-height:52px;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:9px;cursor:pointer;font-weight:900;display:flex;align-items:center;justify-content:center;gap:9px;padding:6px 10px}.piece-key:hover{filter:brightness(.98)}.piece-key.selected{background:var(--accent2);color:#171717;border-color:var(--accent2);box-shadow:0 0 0 2px rgba(181,136,99,.18)}.piece-key:disabled{opacity:.45;cursor:default}.piece-symbol{width:42px;height:42px;display:flex;align-items:center;justify-content:center;flex:0 0 34px}.piece-symbol img{width:42px;height:42px;object-fit:contain;display:block}.piece-name{font-size:11px;line-height:1.15;text-align:left}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.stat{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:9px 5px;text-align:center}.stat .n{font-size:20px;font-weight:950}.stat .l{font-size:9px;color:var(--muted);text-transform:uppercase;margin-top:3px;letter-spacing:.6px}
.reset-score{width:100%;margin-top:0}.status{min-height:20px;text-align:center;font-size:12px;font-weight:800;color:var(--muted)}
.success{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(10,12,15,.54);overflow:hidden;border-radius:6px}.success[hidden]{display:none}.success-card{position:relative;z-index:3;width:min(88%,430px);padding:28px 22px;border-radius:18px;background:var(--surface);border:1px solid var(--border);box-shadow:0 18px 50px rgba(0,0,0,.3);text-align:center}.success-title{font-size:clamp(25px,4vw,38px);font-weight:1000;line-height:1.1}.success-sub{margin-top:9px;color:var(--muted);font-size:14px;font-weight:800}.build-again{margin-top:18px;width:100%;min-height:46px}.stars{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}.star{position:absolute;top:-30px;font-size:clamp(18px,3vw,32px);animation:starFall 2.6s linear forwards;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}@keyframes starFall{0%{transform:translateY(-30px) rotate(0deg) scale(.7);opacity:0}10%{opacity:1}100%{transform:translateY(110vh) rotate(360deg) scale(1.15);opacity:0}}
@media(max-width:900px){.app{padding:8px;gap:10px}.topbar{padding:9px}.brand{font-size:17px}.brand span{display:none}.main{flex-direction:column}.board-area{padding:7px}.board-wrap{width:min(94vw,calc(100vh - 190px),720px);min-width:0}.panel{width:100%;flex:auto}}
@media(max-width:520px){.board-wrap{width:96vw}.panel{padding:12px}.piece-key{min-height:46px;padding:5px 8px}.piece-symbol{width:31px;height:31px;flex-basis:31px}.piece-symbol img{width:31px;height:31px}.piece-name{font-size:10px}.stats{gap:5px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">SQUARE SENSE</div>
    <div class="top-actions">
      <button class="btn icon" id="themeBtn" type="button" aria-label="Switch theme">☾</button>
      <button class="btn" id="flipBtn" type="button">Flip Board</button>
    </div>
  </header>

  <main class="main">
    <section class="board-area">
      <div class="board-wrap">
        <div class="board" id="board" aria-label="Blank chess board"></div>
        <div class="feedback" id="feedback" hidden aria-live="assertive">
          <div class="feedback-symbol">✕</div>
          <div class="feedback-text">Incorrect</div>
        </div>
        <div class="success" id="success" hidden aria-live="assertive">
          <div class="stars" id="stars"></div>
          <div class="success-card">
            <div class="success-title">🎉 Congratulations!</div>
            <div class="success-sub">You built the perfect chess board.</div>
            <button class="btn primary build-again" id="buildAgainBtn" type="button">Build Again</button>
          </div>
        </div>
      </div>
    </section>

    <aside class="panel">
      <div class="keys">
        <div class="piece-grid" id="pieceKeys"></div>
      </div>

      <div class="stats">
        <div class="stat"><div class="n" id="placed">0/32</div><div class="l">Placed</div></div>
        <div class="stat"><div class="n" id="correct">0</div><div class="l">Correct</div></div>
        <div class="stat"><div class="n" id="incorrect">0</div><div class="l">Incorrect</div></div>
        <div class="stat"><div class="n" id="progress">0%</div><div class="l">Progress</div></div>
      </div>

      <button class="btn reset-score" id="resetBtn" type="button">Reset Board</button>
      <div class="status" id="status">Select a piece, then place it on the board</div>
    </aside>
  </main>
</div>

<script>
(function(){
  'use strict';
  const pieceBase='https://cdn.jsdelivr.net/gh/lichess-org/lila@master/public/piece/cburnett/';
  const files=['a','b','c','d','e','f','g','h'];
  const ranks=['1','2','3','4','5','6','7','8'];
  const pieces=[
    {id:'wK',name:'White King',color:'w',type:'K'},
    {id:'wQ',name:'White Queen',color:'w',type:'Q'},
    {id:'wR',name:'White Rook',color:'w',type:'R'},
    {id:'wB',name:'White Bishop',color:'w',type:'B'},
    {id:'wN',name:'White Knight',color:'w',type:'N'},
    {id:'wP',name:'White Pawn',color:'w',type:'P'},
    {id:'bK',name:'Black King',color:'b',type:'K'},
    {id:'bQ',name:'Black Queen',color:'b',type:'Q'},
    {id:'bR',name:'Black Rook',color:'b',type:'R'},
    {id:'bB',name:'Black Bishop',color:'b',type:'B'},
    {id:'bN',name:'Black Knight',color:'b',type:'N'},
    {id:'bP',name:'Black Pawn',color:'b',type:'P'}
  ];

  const target={
    a1:'wR1',b1:'wN1',c1:'wB1',d1:'wQ',e1:'wK',f1:'wB2',g1:'wN2',h1:'wR2',
    a2:'wP1',b2:'wP2',c2:'wP3',d2:'wP4',e2:'wP5',f2:'wP6',g2:'wP7',h2:'wP8',
    a7:'bP1',b7:'bP2',c7:'bP3',d7:'bP4',e7:'bP5',f7:'bP6',g7:'bP7',h7:'bP8',
    a8:'bR1',b8:'bN1',c8:'bB1',d8:'bQ',e8:'bK',f8:'bB2',g8:'bN2',h8:'bR2'
  };
  const pieceTargets={
    wK:['e1'],wQ:['d1'],wR:['a1','h1'],wB:['c1','f1'],wN:['b1','g1'],wP:['a2','b2','c2','d2','e2','f2','g2','h2'],
    bK:['e8'],bQ:['d8'],bR:['a8','h8'],bB:['c8','f8'],bN:['b8','g8'],bP:['a7','b7','c7','d7','e7','f7','g7','h7']
  };

  const state={
    flipped:false,
    selected:null,
    placed:{},
    attempts:0,
    correct:0,
    incorrect:0,
    checking:false,
    feedbackTimer:null,
    success:false
  };
  const $=id=>document.getElementById(id);

  function boardPosition(square){
    const f=files.indexOf(square[0]);
    const r=ranks.indexOf(square[1]);
    return {f:state.flipped?7-f:f,r:state.flipped?r:7-r};
  }

  function renderBoard(){
    const board=$('board');
    board.innerHTML='';
    for(let r=0;r<8;r++){
      for(let f=0;f<8;f++){
        const name=files[f]+ranks[r];
        const pos=boardPosition(name);
        const sq=document.createElement('div');
        sq.className='sq '+(((f+r)%2===0)?'dark':'light');
        sq.style.left=(pos.f*12.5)+'%';
        sq.style.top=(pos.r*12.5)+'%';
        sq.dataset.square=name;
        if(state.selected && !state.placed[name]) sq.classList.add('placeable');
        if(pos.r===7){const x=document.createElement('span');x.className='coord file';x.textContent=name[0];sq.appendChild(x)}
        if(pos.f===0){const x=document.createElement('span');x.className='coord rank';x.textContent=name[1];sq.appendChild(x)}
        sq.addEventListener('click',()=>placeOnSquare(name));
        board.appendChild(sq);
      }
    }
    renderPlacedPieces();
  }

  function renderPlacedPieces(){
    document.querySelectorAll('.board-piece').forEach(x=>x.remove());
    Object.keys(state.placed).forEach(square=>{
      const piece=pieces.find(p=>p.id===state.placed[square].pieceId);
      if(!piece)return;
      const pos=boardPosition(square);
      const el=document.createElement('div');
      el.className='board-piece';
      el.style.left=(pos.f*12.5)+'%';
      el.style.top=(pos.r*12.5)+'%';
      const img=document.createElement('img');
      img.src=pieceBase+piece.id+'.svg';
      img.alt=piece.name+' on '+square;
      el.appendChild(img);
      $('board').appendChild(el);
    });
  }

  function buildPieceKeys(){
    const wrap=$('pieceKeys');
    wrap.innerHTML='';
    pieces.forEach(piece=>{
      const b=document.createElement('button');
      b.type='button';
      b.className='piece-key';
      b.dataset.piece=piece.id;
      b.innerHTML='<span class="piece-symbol"><img src="'+pieceBase+piece.id+'.svg" alt="'+piece.name+'"></span>';
      b.addEventListener('click',()=>selectPiece(piece.id));
      wrap.appendChild(b);
    });
  }

  function remainingTargets(pieceId){
    return pieceTargets[pieceId].filter(square=>!state.placed[square]);
  }

  function updatePieceButtons(){
    document.querySelectorAll('.piece-key').forEach(b=>{
      const id=b.dataset.piece;
      const done=remainingTargets(id).length===0;
      b.disabled=done || state.success;
      b.classList.toggle('selected',state.selected===id);
    });
  }

  function updateStats(){
    const placed=Object.keys(state.placed).length;
    $('placed').textContent=placed+'/32';
    $('correct').textContent=state.correct;
    $('incorrect').textContent=state.incorrect;
    $('progress').textContent=Math.round(placed/32*100)+'%';
  }

  function selectPiece(pieceId){
    if(state.success || state.checking)return;
    if(remainingTargets(pieceId).length===0)return;
    state.selected=state.selected===pieceId?null:pieceId;
    updatePieceButtons();
    $('status').textContent=state.selected?'Now place the selected piece on the board':'Select a piece, then place it on the board';
    renderBoard();
  }

  function placeOnSquare(square){
    if(state.success || state.checking || !state.selected)return;
    if(state.placed[square]){
      handleIncorrect();
      return;
    }
    state.attempts++;
    const targetId=target[square];
    const selected=state.selected;
    const correct=pieceTargets[selected].includes(square) && targetId && targetId.charAt(0)===(selected.charAt(0));
    if(correct){
      state.placed[square]={pieceId:selected};
      state.correct++;
      state.selected=null;
      updateStats();
      updatePieceButtons();
      renderBoard();
      if(Object.keys(state.placed).length===32){
        finishSuccess();
      }else{
        $('status').textContent='Correct. Select the next piece';
      }
    }else{
      state.incorrect++;
      updateStats();
      handleIncorrect();
    }
  }

  function handleIncorrect(){
    state.checking=true;
    updatePieceButtons();
    const fb=$('feedback');
    fb.hidden=false;
    clearTimeout(state.feedbackTimer);
    state.feedbackTimer=setTimeout(()=>{
      fb.hidden=true;
      state.feedbackTimer=null;
      state.checking=false;
      updatePieceButtons();
      $('status').textContent=state.selected?'Try another square':'Select a piece, then place it on the board';
    },1000);
  }

  function finishSuccess(){
    state.success=true;
    state.selected=null;
    updatePieceButtons();
    renderBoard();
    createStars();
    $('success').hidden=false;
    $('status').textContent='Board setup completed successfully';
  }

  function createStars(){
    const wrap=$('stars');
    wrap.innerHTML='';
    for(let i=0;i<28;i++){
      const s=document.createElement('span');
      s.className='star';
      s.textContent='★';
      s.style.left=(Math.random()*100)+'%';
      s.style.animationDelay=(Math.random()*1.4)+'s';
      s.style.animationDuration=(2.1+Math.random()*1.3)+'s';
      wrap.appendChild(s);
    }
  }

  function resetBoard(){
    clearTimeout(state.feedbackTimer);
    state.selected=null;
    state.placed={};
    state.attempts=0;
    state.correct=0;
    state.incorrect=0;
    state.checking=false;
    state.success=false;
    $('feedback').hidden=true;
    $('success').hidden=true;
    $('stars').innerHTML='';
    updateStats();
    updatePieceButtons();
    renderBoard();
    $('status').textContent='Select a piece, then place it on the board';
  }

  $('resetBtn').addEventListener('click',resetBoard);
  $('buildAgainBtn').addEventListener('click',resetBoard);
  $('flipBtn').addEventListener('click',()=>{
    state.flipped=!state.flipped;
    renderBoard();
  });
  $('themeBtn').addEventListener('click',()=>{
    document.body.classList.toggle('dark');
    const dark=document.body.classList.contains('dark');
    $('themeBtn').textContent=dark?'☀':'☾';
    $('themeBtn').setAttribute('aria-label',dark?'Switch to light mode':'Switch to dark mode');
  });

  buildPieceKeys();
  updateStats();
  updatePieceButtons();
  renderBoard();
})();
</script>
</body>
</html>
