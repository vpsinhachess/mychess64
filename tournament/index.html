function stats(){const S={},ar=T.fmt=='arena';Object.keys(players).forEach(id=>S[id]={id,pts:0,col:[],opp:[],bye:false,bh:0,W:0,D:0,L:0,st:0,last:null});
 games.slice().sort((a,b)=>(a.ct||0)-(b.ct||0)||(a.id<b.id?-1:1)).forEach(g=>{const w=S[g.w],b=S[g.b];
  if(g.bye){if(w){w.W++;w.bye=true;w.pts++}return}
  if(w){w.col.push('w');w.last=g.b}if(b){b.col.push('b');b.last=g.w}if(w&&b){w.opp.push(g.b);b.opp.push(g.w)}
  if(!g.res)return;
  const sc=(s,r)=>{if(!s)return;if(r=='W'){s.W++;s.pts+=ar?(s.st>=2?4:2):1;s.st++}else if(r=='D'){s.D++;s.pts+=ar?(s.st>=2?2:1):.5;s.st=0}else{s.L++;s.st=0}};
  if(g.res=='d'){sc(w,'D');sc(b,'D')}else{sc(S[g[g.res]],'W');sc(S[g[g.res=='w'?'b':'w']],'L')}});
 Object.values(S).forEach(s=>s.bh=s.opp.reduce((a,o)=>a+(S[o]?S[o].pts:0),0));return S}
const rankOf=S=>Object.values(S).sort((a,b)=>b.pts-a.pts||(T.fmt=='arena'?b.W-a.W:b.bh-a.bh)||players[a.id].at-players[b.id].at);

 else{const ids=Object.keys(S).sort((a,b)=>S[b].pts-S[a].pts||players[a].at-players[b].at),x=swiss(ids,S);pr=x.pairs;bye=x.bye}

  '<div class="c-tt">'+CATS[cf.cat][2].map(x=>{const[m,i]=x.split('+').map(Number);return '<button class="c-t'+on(cf.tc==x)+'" onclick="setCf(\'tc\',\''+x+'\')"><b>'+tcl(m,i)+'</b><span>'+(m<1?Math.round(m*60)+' sec':m+' min')+(i?' +'+i+'s':'')+'</span></button>'}).join('')+'</div>';
 const prog=cf.fmt=='swiss'?sub('Number of rounds')+'<div class="c-row">'+stp('rounds','rounds')+['3','5','7','9'].map(x=>chp('rounds',x,x)).join('')+'</div>':cf.fmt=='rr'?'<div class="mut">Everyone plays everyone once — the number of rounds is set automatically.</div>':sub('Duration')+'<div class="c-row">'+stp('dur','min')+['10','20','30','60'].map(x=>chp('dur',x,x+' min')).join('')+'</div>';
 const brk=cf.fmt!='arena'?sub('Break between rounds')+'<div class="c-row">'+stp('brk','sec')+[['0','None'],['15','15 s'],['30','30 s'],['60','1 min'],['120','2 min']].map(x=>chp('brk',x[0],x[1])).join('')+'</div><div class="mut" style="margin-top:8px">A countdown is shown, then games start automatically.</div>':'';
 return '<div class="hero"><h1>Create your tournament</h1><p>Set it up in a minute, share the ID, and let the pairings run themselves.</p></div><div class="c-rw"><div>'+
 sec(1,'Basics','Name your event and add the organiser','<input class="in" id="tn" placeholder="Tournament name" maxlength="40" oninput="sn(this.value)"><input class="in" style="margin-top:10px" id="to" placeholder="Organiser name" maxlength="40" value="'+esc(ls.get('org')||'')+'">')+
 sec(2,'Format','How players are matched','<div class="c-g">'+fc('fmt','swiss','⚖️','Swiss','Paired by score every round')+fc('fmt','rr','🔄','Round Robin','Everyone plays everyone')+fc('fmt','arena','⚡','Arena','Play as many games as you can in a set time')+'</div>')+
 sec(3,'Time control','Clock for every game','<div class="c-tabs">'+cats+'</div>'+tiles)+
 sec(4,cf.fmt=='arena'?'Duration':'Rounds & breaks',cf.fmt=='arena'?'How long the arena runs':'How many rounds and the pause between them',prog+brk)+
 sec(5,'Start time','When the tournament begins','<div class="c-g">'+fc('when','now','▶️','Manual','You press Start when ready')+fc('when','sched','📅','Scheduled','Starts by itself at a set time')+'</div>'+(cf.when=='sched'?'<input class="in" data-s="1" style="margin-top:12px" type="datetime-local" id="ta" value="'+cf.at+'" onchange="cf.at=this.value;render()">'+(cf.at?'<div class="mut" style="margin-top:8px">'+fd(Date.parse(cf.at))+'</div>':''):''))+
 sec(6,'Rules & options','Optional extras','<div class="c-sub" style="margin-top:0">Maximum players <span style="text-transform:none;letter-spacing:0">(0 = no limit)</span></div><div class="c-row">'+stp('max','players')+[['0','No limit'],['8','8'],['16','16'],['32','32']].map(x=>chp('max',x[0],x[1])).join('')+'</div>'+
  '<div class="c-sw"><div><b>Draw offers</b><div class="mut">Let players offer and accept draws</div></div><button class="swt'+on(cf.draws=='1')+'" onclick="setCf(\'draws\',\''+(cf.draws=='1'?'0':'1')+'\')" aria-label="Toggle draw offers"></button></div>'+
  '<div class="c-sub">Conditions & notes</div><textarea class="in" id="td" maxlength="500" placeholder="Rules, prizes, special conditions… (optional)"></textarea>')+
 '</div><aside class="c-sum">'+sumHtml()+'</aside></div>'}
function podium(rank){const M=['🥇','🥈','🥉'],ord=[1,0,2].filter(i=>rank[i]);
 return '<div class="cd"><div class="pdm">'+ord.map(i=>{const s=rank[i];return '<div class="stp s'+(i+1)+'"><div class="md">'+M[i]+'</div><b>'+esc(nm(s.id))+'</b><div><b>'+s.pts+' pts</b></div><small>'+s.W+'W '+s.D+'D '+s.L+'L'+(T.fmt=='arena'?'':' · BH '+s.bh)+'</small><div class="bar">'+(i+1)+'</div></div>'}).join('')+'</div></div>'}
function tview(){const S=stats(),ids=Object.keys(players),inP=!!players[me],st=T.status,ar=T.fmt=='arena',dot=i=>'<span class="dot'+(onl(i)?' on':'')+'"></span>';
 const full=T.max&&ids.length>=T.max,can=!inP&&!full&&(st=='reg'||(ar&&st=='running'&&Date.now()<T.endAt)),sg=T.startAt&&st=='reg';
 const bt=s=>!s?'None':s<60||s%60?s+' s':s/60+' min',r=(k,v)=>v?'<div class="li"><span class="mut">'+k+'</span><span style="text-align:right">'+v+'</span></div>':'';
 const desc=T.desc?'<div class="cd"><div class="lb" style="margin-top:0">Conditions</div><div style="white-space:pre-wrap">'+esc(T.desc)+'</div></div>':'';
 const info='<div class="cd">'+r('Organiser',esc(T.org||''))+r('Format',FM[T.fmt])+r('Time control',tcl(T.m,T.i))+(ar?r('Duration',T.dur+' min'):r('Rounds',T.rounds))+(ar?'':r('Break between rounds',bt(T.brk||0)))+r('Players',ids.length+(T.max?' / '+T.max:''))+r('Draw offers',T.draws===0?'Not allowed':'Allowed')+(T.startAt?r('Scheduled start',fd(T.startAt)):'')+'</div>'+desc;
 let h='<div class="cd"><h1>'+esc(T.name)+'</h1>'+(T.org?'<div class="mut" style="margin-bottom:8px">Organised by <b>'+esc(T.org)+'</b></div>':'')+'<span class="tg">'+FM[T.fmt]+'</span><span class="tg">'+tcl(T.m,T.i)+'</span>'+(st=='reg'?'<span class="tg">'+(sg?'Scheduled':'Registration')+'</span>':st=='done'?'<span class="tg">Finished</span>':ar?'<span class="tg live" id="ar"></span>':'<span class="tg live">Round '+T.round+' / '+T.rounds+'</span>')+
 '<div class="idr"><span><span class="mut">ID </span><span class="id">'+tid+'</span></span><span class="chips"><button class="btn sm" onclick="copyId()">Copy</button><button class="btn sm" onclick="share()">Share</button></span></div>'+(sg?'<div class="mut" style="margin-top:8px">'+fd(T.startAt)+' · <b id="cd"></b></div>':'')+'</div>';
 if(can)h+='<div class="cd stack"><input class="in" id="pn" placeholder="Your name" maxlength="20" onkeydown="if(event.key==\'Enter\')join()"><button class="btn p lg" onclick="join()">Join tournament</button></div>';
 else if(!inP&&full)h+='<div class="cd mut">This tournament is full. You can watch the games.</div>';
 else if(!inP)h+='<div class="cd mut">This tournament has started. You can watch the games.</div>';
 if(st=='reg'){h+=desc+'<div class="cd"><div class="lb" style="margin-top:0">Players · '+ids.length+(T.max?' / '+T.max:'')+'</div>'+(ids.map(i=>'<div class="li"><span>'+dot(i)+esc(nm(i))+'</span>'+(i==me?'<span class="mut">you</span>':'')+'</div>').join('')||'<span class="mut">Waiting for players…</span>')+'</div>';
  if(canStart())h+='<button class="btn ok lg" onclick="launch()" '+(ids.length<2||starting?'disabled':'')+'>'+(starting?'Starting…':'Start tournament')+'</button>'+(ids.length<2?'<div class="mut" style="text-align:center;margin-top:8px">At least 2 players needed</div>':T.fmt=='swiss'&&T.rounds>Math.max(1,ids.length-1)?'<div class="mut" style="text-align:center;margin-top:8px">With '+ids.length+' players some pairings will repeat.</div>':'')}
 else{const mine=games.filter(g=>g.w==me||g.b==me),cur=ar?mine.find(g=>!g.res):mine.find(g=>g.r==T.round),rank=rankOf(S);
  if(st=='done'&&rank.length)h+=podium(rank);
  if(inP&&st=='running'){if(cur&&!cur.bye){const my=(cur.turn=='w'?cur.w:cur.b)==me&&!cur.res;h+='<div class="cd yg'+(my?' turn':'')+'"><div><b>'+(ar?'':'Round '+cur.r+' · ')+'vs '+esc(nm(cur.w==me?cur.b:cur.w))+'</b><div class="mut">'+(cur.res?'Finished '+rs(cur):my?'Your move':'Waiting for opponent')+'</div></div><button class="btn p" onclick="open_(\''+cur.id+'\')">'+(cur.res?'View':'Play')+'</button></div>'}
   else h+='<div class="cd mut">'+(cur?'You have a bye this round (1 point).':ar?'Waiting for an opponent…':'Resting this round.')+'</div>'}
  h+='<div class="seg"><button class="'+(tab=='st'?'on':'')+'" onclick="tab=\'st\';render()">Standings</button><button class="'+(tab=='gm'?'on':'')+'" onclick="tab=\'gm\';render()">'+(ar?'Games':'Pairings')+'</button><button class="'+(tab=='in'?'on':'')+'" onclick="tab=\'in\';render()">Info</button></div>';
  if(tab=='st')h+='<div class="cd"><table><tr><th>#</th><th>Player</th><th class="n">Pts</th><th class="n">W-D-L</th>'+(ar?'':'<th class="n">BH</th>')+'</tr>'+rank.map((s,k)=>'<tr class="'+(s.id==me?'me':'')+'"><td>'+(st=='done'&&k<3?['🥇','🥈','🥉'][k]:k+1)+'</td><td>'+dot(s.id)+esc(nm(s.id))+'</td><td class="n"><b>'+s.pts+'</b></td><td class="n">'+s.W+'-'+s.D+'-'+s.L+'</td>'+(ar?'':'<td class="n">'+s.bh+'</td>')+'</tr>').join('')+'</table></div>';
  else if(tab=='gm'){const R=vr||T.round,gl=ar?games.slice().sort((a,b)=>b.ct-a.ct).slice(0,20):games.filter(g=>g.r==R).sort((a,b)=>a.id<b.id?-1:1);
   h+=(ar?'':'<div class="chips" style="margin-bottom:10px">'+Array.from({length:T.round},(_,i)=>'<button class="chip'+(R==i+1?' on':'')+'" onclick="vr='+(i+1)+';render()">Round '+(i+1)+'</button>').join('')+'</div>')+'<div class="cd">'+(gl.map(g=>'<div class="gr" onclick="open_(\''+g.id+'\')"><span class="bn">'+(ar?'':+g.id.split('_')[1])+'</span><span>'+esc(nm(g.w))+'</span><b>'+rs(g)+'</b><span class="r">'+(g.bye?'<i class="mut">bye</i>':esc(nm(g.b)))+'</span></div>').join('')||'<span class="mut">No games yet</span>')+'</div>'}
  else h+=info;
  if(games.some(g=>g.mv&&g.mv.length))h+='<div class="chips"><button class="btn sm" onclick="expAll()">⬇ All games · PGN</button><button class="btn sm" onclick="expReport()">⬇ Standings · PDF</button></div>'}
 return h}
function gameView(g){const mc=col(g),flip=fl!=null?fl:g.b==me,n=(g.mu||[]).length,S=rv!=null?replay(g,rv):g,live=rv==null,over=!!g.res,tm=!over&&mc==g.turn;
 const b=S.bd,last=S.last||[-1,-1],dst=live&&sel!=null&&!over?legal(g.bd,sel,g.cr,g.ep):[],ck=inCheck(b,S.turn=='w')?b.indexOf(S.turn=='w'?'K':'k'):-1,M=mat(b);
 let sq='';for(let r=0;r<8;r++)for(let c=0;c<8;c++){const i=flip?63-(r*8+c):r*8+c,p=b[i],R=i>>3,C=i&7;
  sq+='<div class="sq '+((R+C)%2?'d':'l')+(i==sel&&live?' sl':last.includes(i)?' lm':'')+(dst.includes(i)?' dt'+(p!='.'?' cp':''):'')+(i==ck?' ck':'')+'" onclick="sqClick('+i+')">'+(c==7?'<i class="rk">'+(8-R)+'</i>':'')+(r==7?'<i class="fl">'+FL[C]+'</i>':'')+(p=='.'?'':pimg(p))+'</div>'}
 const pm=promo?'<div class="pm">'+['Q','R','B','N'].map(x=>'<button onclick="doPromo(\''+x+'\')">'+pimg(isW(g.bd[promo.f])?x:x.toLowerCase())+'</button>').join('')+'</div>':'';
 const top=flip?'w':'b',bot=flip?'b':'w',strip=(c,pos)=>{const adv=(c=='w'?1:-1)*M.diff,cp=M.lost(c=='w'?'b':'w').map(x=>GL[x.t.toUpperCase()].repeat(x.n)).join('');
  return '<div class="pl '+pos+(!over&&g.turn==c?' turn':'')+'" id="pl_'+c+'"><span class="cl '+c+'"></span><div class="pi"><div class="nm">'+esc(nm(g[c]))+(g[c]==me?' <em>you</em>':'')+'</div><div class="cap">'+cp+(adv>0?' +'+adv:'')+'</div></div><span class="clk" id="ck_'+c+'">'+clk(rem(g,c))+'</span></div>'};
 let ml='';for(let i=0;i<g.mv.length;i+=2)ml+='<i>'+(i/2+1)+'</i>'+[i,i+1].map(j=>'<a class="'+((rv==null?n:rv)==j+1?'cur':'')+'" onclick="goPly('+(j+1)+')">'+(g.mv[j]||'')+'</a>').join('');
 const rt=g.bye?'Bye':g.res=='d'?'Draw':nm(g[g.res])+' wins',wy=g.why?' · '+cap1(g.why):'';if(over)ml+='<div class="end">'+(g.res=='d'?'½-½':rs(g))+' '+esc(rt)+wy+'</div>';
 const lf=games.filter(x=>x.r==T.round&&!x.res).length,wt=over&&T.status=='running'?(T.fmt=='arena'?'<div class="stt">Finding your next opponent…</div>':(g.r==T.round&&lf?'<div class="stt">Waiting for '+lf+' other game'+(lf>1?'s':'')+'…</div>':'')):'';let ctl='',stt='';if(!live)stt='<div class="stt">Move '+rv+' of '+n+'</div>';else if(!over&&mc)stt=tm?'<div class="stt you">Your move</div>':'<div class="stt">Opponent’s move</div>';
 ctl=stt+'<div class="nv"><button class="btn sm" onclick="nv(-9999)">«</button><button class="btn sm" onclick="nv(-1)">‹</button><button class="btn sm" onclick="nv(1)">›</button><button class="btn sm" onclick="nv(9999)">»</button><button class="btn sm" onclick="flipB()">⇅</button></div>';
 if(over)ctl+='<div class="res"><b>'+(g.res=='d'?'½-½':rs(g))+'</b><span>'+esc(rt)+wy+'</span></div>'+wt+'<button class="btn p" onclick="goBack()">Back to tournament</button>';
 else if(mc){ctl+=g.do&&g.do!=mc?'<div class="offer"><b>Opponent offers a draw</b><div class="ac2"><button class="btn ok" onclick="upd({res:\'d\',why:\'agreement\',do:\'\'})">Accept</button><button class="btn" onclick="upd({do:\'\'})">Decline</button></div></div>':
  '<div class="ac2"'+(T.draws===0?' style="grid-template-columns:1fr"':'')+'>'+(T.draws===0?'':'<button class="btn" '+(g.do==mc?'disabled':'')+' onclick="upd({do:\''+mc+'\'})">'+(g.do==mc?'Draw offered':'½ Offer draw')+'</button>')+'<button class="btn r" onclick="resign()">'+(rsg?'Confirm resign':'⚑ Resign')+'</button></div>'}
 return '<div class="gm">'+strip(top,'pt')+'<div class="bd" id="bd">'+sq+pm+'</div>'+strip(bot,'pb')+
 '<div class="mvp"><div class="tl"><span>'+tcl(T.m,T.i)+' · '+FM[T.fmt]+'</span><span><button class="btn sm g" onclick="expPgn(\''+g.id+'\')" '+(g.mv.length?'':'disabled')+'>PGN</button><button class="btn sm g" onclick="expPdf(\''+g.id+'\')" '+(g.mv.length?'':'disabled')+'>PDF</button></span></div><div class="ml" id="ml">'+(ml||'<div class="end">No moves yet</div>')+'</div></div><div class="ctl">'+ctl+'</div></div>'}
function sheet(){const s=$('sheet');if(!menu){s.style.display='none';return}
 const o=(k,a)=>'<div class="chips">'+a.map(([v,l])=>'<button class="chip'+(cfg[k]==v?' on':'')+'" onclick="setC(\''+k+'\',\''+v+'\')">'+l+'</button>').join('')+'</div>';
 s.innerHTML='<div class="sh" onclick="event.stopPropagation()"><div class="row"><h2 style="margin:0">Settings</h2><button class="btn sm" onclick="menu=false;render()">Close</button></div><div class="lb">Board</div>'+o('board',[['brown','Brown'],['blue','Blue'],['green','Green'],['grey','Grey']])+'<div class="lb">Pieces</div>'+o('pieces',[['cburnett','Classic'],['merida','Merida'],['alpha','Alpha'],['unicode','Symbols']])+'<div class="lb">Sound</div>'+o('sound',[[1,'On'],[0,'Off']])+
 (usr&&!usr.isAnonymous?'<div class="lb">Account</div><div class="mut">'+esc(usr.displayName||usr.email||'Signed in')+'</div>':'<div class="lb">Account</div><button class="btn" onclick="gsign()">Sign in with Google</button><div class="mut" style="margin-top:6px">Resume your games on any device.</div>')+
 (tid?'<div class="lb">Tournament</div><button class="btn r" onclick="leave()">'+(T&&T.status=='reg'&&players[me]?'Leave tournament':'Log off')+'</button>':'')+'</div>';s.style.display='flex'}
