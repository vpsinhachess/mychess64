 if(st=='reg'){h+='<h2>Players ('+ids.length+')</h2><div class="card">'+(ids.map(i=>'<div class="row"><span>'+dot(i)+esc(nm(i))+'</span>'+(i==me?'<span class="muted">you</span>':'')+'</div>').join('')||'<span class="muted">Share the ID above so others can join.</span>')+'</div>';
  h+=canStart()?'<button class="p" onclick="startT()" '+(ids.length<2?'disabled':'')+'>Start tournament</button>':'<p class="muted">Waiting for the host to start.</p>'}
 else{const mine=games.filter(g=>g.w==me||g.b==me),cur=ar?mine.find(g=>!g.res):mine.find(g=>g.r==T.round);
  if(inP&&st=='running'){h+='<div class="card">'+(cur?(cur.bye?'<b>Round '+cur.r+': you have a bye (1 point)</b>':'<b>'+(ar?'':'Round '+cur.r+' · ')+'vs '+esc(nm(cur.w==me?cur.b:cur.w))+'</b> <span class="muted">('+(cur.w==me?'White':'Black')+')</span><br><span class="muted">'+(cur.res?'Finished '+rs(cur):(cur.turn=='w'?cur.w:cur.b)==me?'Your move':'Waiting for opponent')+'</span><br><br><button class="p" onclick="open_(\''+cur.id+'\')">'+(cur.res?'View':'Resume game')+'</button>'):'<b>'+(ar?'Waiting for an opponent…':'Resting this round')+'</b>')+'</div>'}
  const rank=rankOf(S);if(st=='done'&&rank.length)h+=podium(rank);
  if(ar){h+='<h2>Games</h2><div class="card"><table>'+games.slice().sort((a,b)=>b.ct-a.ct).slice(0,12).map(g=>'<tr class="go" onclick="open_(\''+g.id+'\')"><td>'+esc(nm(g.w))+'</td><td>'+esc(nm(g.b))+'</td><td>'+rs(g)+'</td></tr>').join('')+'</table></div>'}
  else{const R=vr||T.round;h+='<div class="tabs">'+Array.from({length:T.round},(_,i)=>'<button class="'+(R==i+1?'on':'')+'" onclick="vr='+(i+1)+';render()">Round '+(i+1)+'</button>').join('')+'</div>';
   h+='<h2>Pairings — round '+R+'</h2><div class="card"><table><tr><th>Bd</th><th>White</th><th>Black</th><th>Res</th></tr>'+games.filter(g=>g.r==R).sort((a,b)=>a.id<b.id?-1:1).map(g=>'<tr class="go" onclick="open_(\''+g.id+'\')"><td>'+(+g.id.split('_')[1])+'</td><td>'+esc(nm(g.w))+'</td><td>'+(g.bye?'<i class="muted">bye</i>':esc(nm(g.b)))+'</td><td>'+rs(g)+'</td></tr>').join('')+'</table></div>'}
  h+='<h2>'+(st=='done'?'Final standings':'Standings')+'</h2><div class="card"><table><tr><th>#</th><th>Player</th><th>Pts</th><th>W-D-L</th><th>'+(ar?'':'BH')+'</th></tr>'+rank.map((s,k)=>'<tr><td>'+(st=='done'&&k<3?['🥇','🥈','🥉'][k]:k+1)+'</td><td>'+dot(s.id)+esc(nm(s.id))+(s.id==me?' <span class="muted">(you)</span>':'')+'</td><td><b>'+s.pts+'</b></td><td>'+s.W+'-'+s.D+'-'+s.L+'</td><td>'+(ar?'':s.bh)+'</td></tr>').join('')+'</table></div>';
  h+='<h2>Export</h2><div class="acts"><button onclick="expAll()">All games (PGN)</button><button onclick="expReport()">Standings + results (PDF)</button></div>'}
 return h+'<div class="acts"><button onclick="leave()">'+(st=='reg'&&inP?'Leave tournament':'Log off')+'</button><button onclick="snd=!snd;render()">'+(snd?'🔊':'🔇')+'</button></div><p class="muted">Auto log-off after 5 min idle (15 min during a live game). Games resume from the cloud copy.</p>'}
function gameView(g){const mc=col(g),flip=fl!=null?fl:g.b==me,n=(g.mu||[]).length,S=rv!=null?replay(g,rv):g,live=rv==null,w=g.turn=='w',tm=live&&mc==g.turn&&!g.res;
 const b=S.bd,last=S.last||[-1,-1],lm=live&&sel!=null?legal(g.bd,sel,g.cr,g.ep):[],ck=inCheck(b,S.turn=='w')?b.indexOf(S.turn=='w'?'K':'k'):-1;
 let sq='';for(let r=0;r<8;r++)for(let c=0;c<8;c++){const i=flip?63-(r*8+c):r*8+c,p=b[i],R=i>>3,C=i&7;
  sq+='<div class="sq '+((R+C)%2?'d':'l')+(i==sel?' s':last.includes(i)?' lm':'')+(lm.includes(i)?' m'+(p!='.'?' c':''):'')+(i==ck?' k':'')+'" onclick="sqClick('+i+')">'+(c==0?'<i class="rk">'+(flip?R+1:8-R)+'</i>':'')+(r==7?'<i class="fl">'+FL[C]+'</i>':'')+(p=='.'?'':'<span class="'+(isW(p)?'pw':'pb')+'">'+GL[p.toUpperCase()]+'\uFE0E</span>')+'</div>'}
 const wy=g.why?' by '+g.why:'',res=g.bye?'Bye':g.res?(g.res=='d'?'½-½ Draw'+wy:rs(g)+' · '+esc(nm(g[g.res]))+' wins'+wy):'';
 const bar=c=>'<div class="bar"><div style="min-width:0"><b>'+esc(nm(g[c]))+'</b> <span class="muted">'+(c=='w'?'White':'Black')+'</span></div><span class="ck" id="ck_'+c+'">'+fmt(rem(g,c))+'</span></div>';
 let mv='';for(let i=0;i<g.mv.length;i+=2)mv+='<b>'+(i/2+1)+'.</b>'+[i,i+1].map(j=>'<span class="'+((rv==null?n:rv)==j+1?'cur':'')+'" onclick="rv='+(j+1>=n?'null':j+1)+';sel=null;render()">'+(g.mv[j]||'')+'</span>').join('');
 let act='';if(mc&&!g.res){act=g.do&&g.do!=mc?'<div class="card"><b>Opponent offers a draw</b><br><br><button class="p" onclick="upd({res:\'d\',why:\'agreement\',do:\'\'})">Accept draw</button> <button onclick="upd({do:\'\'})">Decline</button></div>':
  '<div class="acts"><button '+(g.do==mc?'disabled':'')+' onclick="upd({do:\''+mc+'\'})">'+(g.do==mc?'Draw offered…':'½ Offer draw')+'</button><button class="r" onclick="if(confirm(\'Resign this game?\'))upd({res:\''+(mc=='w'?'b':'w')+'\',why:\'resignation\'})">Resign</button></div>'}
 const pk=promo?'<div class="card pk"><b>Promote to:</b> '+['Q','R','B','N'].map(x=>'<button onclick="doPromo(\''+x+'\')">'+GL[x]+'\uFE0E</button>').join(' ')+'</div>':'';
 const top=flip?'w':'b',bot=flip?'b':'w';
 return '<div class="gw"><div><div class="bw">'+bar(top)+'<div id="bd">'+sq+'</div>'+bar(bot)+'<div class="nav"><button onclick="nv(-9999)">⏮</button><button onclick="nv(-1)">◀</button><button onclick="nv(1)">▶</button><button onclick="nv(9999)">⏭</button><button onclick="fl='+(!flip)+';render()">⇅</button></div></div></div>'+
 '<div><div class="card banner">'+(!live?'Move '+rv+' of '+n:res||(tm?'Your move':esc(nm(w?g.w:g.b))+' to move')+(S.turn&&ck>=0&&!g.res?' — check!':''))+'</div>'+pk+act+
 '<h2>Moves · '+T.m+'+'+T.i+'</h2><div class="card mv">'+(mv||'<span class="muted">No moves yet</span>')+'</div>'+
 '<div class="acts"><button onclick="expPgn(\''+g.id+'\')" '+(g.mv.length?'':'disabled')+'>⬇ PGN</button><button onclick="expPdf(\''+g.id+'\')" '+(g.mv.length?'':'disabled')+'>⬇ PDF</button><button onclick="view=null;sel=null;promo=null;rv=null;render()">← Back</button></div></div></div>'}
addEventListener('error',e=>{err='Script error: '+e.message;toast(err)});addEventListener('unhandledrejection',e=>{const r=e.reason;toast('Error: '+((r&&(r.code||r.message))||r))});
