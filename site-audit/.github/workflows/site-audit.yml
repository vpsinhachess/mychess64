name: Site Audit

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Website URL to audit"
        default: "https://www.mychess64.com"
      max_pages:
        description: "Maximum pages to crawl"
        default: "300"
      publish:
        description: "Publish report to /audit/ on your site (public!)"
        type: boolean
        default: true
  schedule:
    - cron: "0 6 * * 1"   # every Monday 06:00 UTC (delete to disable)

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Run audit
        run: python site_audit.py "${{ inputs.url || 'https://www.mychess64.com' }}" "${{ inputs.max_pages || '300' }}"
      - name: Keep report files
        uses: actions/upload-artifact@v4
        with:
          name: site-audit-report
          path: |
            audit_report.html
            sitemap.xml
            broken_links.csv
            issues.csv
      - name: Publish report to /audit/
        if: ${{ github.event_name == 'schedule' || inputs.publish }}
        run: |
          mkdir -p audit
          sed 's/<meta charset=utf-8>/<meta charset=utf-8><meta name="robots" content="noindex">/' audit_report.html > audit/report.html
          cp sitemap.xml audit/sitemap.xml
          cp broken_links.csv audit/broken_links.csv
          cp issues.csv audit/issues.csv
          git config user.name "site-audit-bot"
          git config user.email "site-audit-bot@users.noreply.github.com"
          git add audit/report.html audit/sitemap.xml audit/broken_links.csv audit/issues.csv
          git commit -m "Update site audit report" || echo "No changes"
          git push
